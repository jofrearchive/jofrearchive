<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Jofre Archive VR — Studies</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">
</head>
<body style="background: #0b0b0b; margin: 0; overflow: hidden;">

  <a-scene 
    renderer="antialias: true; colorManagement: true;"
    cursor="fuse: false; rayOrigin: mouse;"
    background="color: #0b0b0b"
    fog="type: exponential; color: #0b0b0b; density: 0.05">

    <a-assets>
      <img id="gridPattern" src="https://inside.jofrearchive.com/assets/images/logo.png" crossorigin="anonymous">
      <a-mixin id="panelStyle" material="color: #0f0f0f; opacity: 0.8; transparent: true; side: double; strokeColor: #e8e2d6; strokeWidth: 2"></a-mixin>
      <a-mixin id="textStyle" text="font: https://cdn.aframe.io/fonts/SourceCodePro.fnt; color: #e8e2d6; align: center;"></a-mixin>
    </a-assets>

    <a-light type="ambient" color="#444"></a-light>
    <a-light type="point" position="0 5 0" intensity="0.8"></a-light>
    
    <a-grid position="0 0 0" rotation="-90 0 0" width="100" height="100" static-body material="color: #e8e2d6; opacity: 0.05"></a-grid>

    <a-entity id="rig" position="0 1.6 4">
      <a-camera look-controls wasd-controls="acceleration: 20">
        <a-cursor
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1"
          material="color: #e8e2d6; shader: flat"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03">
        </a-cursor>
      </a-camera>
    </a-entity>

    <a-entity id="carousel-container" position="0 1.5 -1">
      </a-entity>

    <a-entity id="detail-panel" position="2.5 1.5 -0.5" rotation="0 -30 0">
      <a-plane width="2" height="2.5" mixin="panelStyle"></a-plane>
      <a-text id="v-title" value="SELECCIONE PROYECTO" position="0 1 0.05" width="1.8" mixin="textStyle"></a-text>
      <a-text id="v-desc" value="Use el carrousel central para navegar por el archivo." position="0 0.2 0.05" width="1.5" mixin="textStyle" align="left" anchor="center"></a-text>
    </a-entity>

    <a-entity id="menu-panel" position="-2.5 1.5 -0.5" rotation="0 30 0">
      <a-plane width="1.5" height="2.5" mixin="panelStyle"></a-plane>
      <a-text value="ESTUDIOS / ARCHIVO" position="0 1 0.05" width="1.5" mixin="textStyle" color="#888"></a-text>
      
      <a-entity id="btn-prev" position="0 -0.5 0.1" class="clickable">
        <a-plane width="0.8" height="0.2" color="#1a1a1a"></a-plane>
        <a-text value="ANTERIOR" align="center" width="2" mixin="textStyle"></a-text>
      </a-entity>
      
      <a-entity id="btn-next" position="0 -0.8 0.1" class="clickable">
        <a-plane width="0.8" height="0.2" color="#1a1a1a"></a-plane>
        <a-text value="SIGUIENTE" align="center" width="2" mixin="textStyle"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const DATA = [
      { id:"S-001", title:"Mycelium Sculpture Series I", year:2024, category:"BioSystems", abstract:"Sculptural growth system using mycelium as structural computation." },
      { id:"S-002", title:"Transparent Solar Leaf Panels", year:2024, category:"BioSystems", abstract:"Screen-printed translucent solar layers inspired by leaf venation." },
      { id:"S-003", title:"Interspecies Archaeology", year:2025, category:"BioSystems", abstract:"An archive for non-human agency: relics grown and eroded." },
      { id:"S-004", title:"Carnival Society", year:2023, category:"Dystopic Pop", abstract:"Modern society as carnival: lights, attractions, control." },
      { id:"S-005", title:"Frequency Plate", year:2022, category:"Cymatics", abstract:"Physical plates generating stable patterns under specific tones." }
    ];

    let currentIndex = 0;
    const carousel = document.querySelector('#carousel-container');

    function createCard(project, index) {
      const card = document.createElement('a-entity');
      card.setAttribute('id', `card-${index}`);
      
      // La geometría de la "tarjeta"
      const mesh = document.createElement('a-box');
      mesh.setAttribute('width', '1.2');
      mesh.setAttribute('height', '1.8');
      mesh.setAttribute('depth', '0.05');
      mesh.setAttribute('material', `color: #111; opacity: 0.95; metalness: 0.5; roughness: 0.2;`);
      
      // Borde estético
      const border = document.createElement('a-plane');
      border.setAttribute('width', '1.25');
      border.setAttribute('height', '1.85');
      border.setAttribute('position', '0 0 -0.03');
      border.setAttribute('material', 'color: #e8e2d6; opacity: 0.2');

      // Título en la tarjeta
      const title = document.createElement('a-text');
      title.setAttribute('value', project.title);
      title.setAttribute('position', '0 0.5 0.06');
      title.setAttribute('align', 'center');
      title.setAttribute('width', '1.1');
      title.setAttribute('mixin', 'textStyle');

      // ID de proyecto
      const idTag = document.createElement('a-text');
      idTag.setAttribute('value', project.id);
      idTag.setAttribute('position', '0 0.8 0.06');
      idTag.setAttribute('align', 'center');
      idTag.setAttribute('width', '2');
      idTag.setAttribute('color', '#888');

      card.appendChild(mesh);
      card.appendChild(border);
      card.appendChild(title);
      card.appendChild(idTag);

      return card;
    }

    function updateCarousel() {
      DATA.forEach((proj, i) => {
        let el = document.querySelector(`#card-${i}`);
        if(!el) {
          el = createCard(proj, i);
          carousel.appendChild(el);
        }

        const offset = i - currentIndex;
        const absOffset = Math.abs(offset);
        
        // Posicionamiento en el espacio 3D (Z-Stacking)
        const zPos = -absOffset * 0.5;
        const yPos = -absOffset * 0.1;
        const opacity = 1 - (absOffset * 0.3);

        el.setAttribute('animation', {
          property: 'position',
          to: `0 ${yPos} ${zPos}`,
          dur: 600,
          easing: 'easeOutQuad'
        });

        el.setAttribute('animation__opacity', {
          property: 'components.material.material.opacity',
          to: opacity,
          dur: 600
        });

        // Solo la tarjeta frontal es interactiva
        el.setAttribute('visible', absOffset < 3);
      });

      // Actualizar Panel de Detalles
      const p = DATA[currentIndex];
      document.querySelector('#v-title').setAttribute('value', p.title);
      document.querySelector('#v-desc').setAttribute('value', `${p.category} (${p.year})\n\n${p.abstract}`);
    }

    // Controles
    document.querySelector('#btn-next').addEventListener('click', () => {
      if(currentIndex < DATA.length - 1) { currentIndex++; updateCarousel(); }
    });

    document.querySelector('#btn-prev').addEventListener('click', () => {
      if(currentIndex > 0) { currentIndex--; updateCarousel(); }
    });

    // Inicialización
    updateCarousel();

  </script>
</body>
</html>
