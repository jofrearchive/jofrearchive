<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Display with Archive Cartela</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--ink:#e8e2d6;--panel:rgba(15,15,15,.74);--border:rgba(255,255,255,.16);--mono:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'EB Garamond',serif}
canvas{display:block}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1000px 700px at 50% 34%,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 55%),radial-gradient(900px 600px at 50% 82%,rgba(232,226,214,.03) 0%,rgba(0,0,0,0) 60%),linear-gradient(180deg,rgba(255,255,255,.03) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.45) 100%),#0b0b0b}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 44%,transparent 38%,rgba(0,0,0,.92) 100%)}
.glass{position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 20%),linear-gradient(245deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 24%),radial-gradient(800px 520px at 60% 24%,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 55%);opacity:.28;mix-blend-mode:screen}
.frame{position:fixed;inset:clamp(8px,2vw,20px);pointer-events:none;border-radius:14px;opacity:.68;box-shadow:inset 0 0 0 1px rgba(232,226,214,.10),inset 0 0 0 2px rgba(0,0,0,.55),inset 0 20px 40px rgba(0,0,0,.35),inset 0 -30px 60px rgba(0,0,0,.45)}
.cartela{position:fixed;left:clamp(14px,4vw,40px);top:clamp(14px,4vh,38px);width:min(360px,calc(100vw - 28px));z-index:5;background:var(--panel);border:1px solid var(--border);padding:18px 18px 16px;backdrop-filter:blur(10px)}
.cartela h1{margin:0 0 8px 0;font-size:clamp(16px,2.2vw,24px);line-height:1.02;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.meta{font-family:var(--mono);font-size:10px;line-height:1.55;letter-spacing:.12em;text-transform:uppercase;opacity:.66;margin-bottom:12px}
.desc{font-size:14px;line-height:1.58;opacity:.9}
.nav{position:fixed;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;pointer-events:none;z-index:6}
.btn{pointer-events:auto;width:38px;height:78px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,10,.35);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-family:var(--mono);font-size:20px;backdrop-filter:blur(10px)}
.slider-ref{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:9px;padding:7px 10px;border:1px solid rgba(255,255,255,.14);background:rgba(10,10,10,.28);backdrop-filter:blur(10px);border-radius:0}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(232,226,214,.22);border:1px solid rgba(232,226,214,.16);cursor:pointer;padding:0}
.dot.active{background:rgba(232,226,214,.88);border-color:rgba(232,226,214,.32)}
@media (max-width:820px){
  .cartela{left:10px;right:10px;top:auto;bottom:94px;width:auto;padding:14px 14px 13px}
  .cartela h1{font-size:16px}
  .desc{font-size:13px;line-height:1.5}
  .btn{width:32px;height:64px;font-size:18px}
  .slider-ref{bottom:max(12px,env(safe-area-inset-bottom));gap:8px;padding:6px 9px}
  .dot{width:7px;height:7px}
}
</style>
</head>
<body>
<div class="glass"></div>
<div class="frame"></div>

<div class="cartela">
  <h1 id="title">Specimen I</h1>
  <div class="meta" id="meta">year: 2026<br>materials: bronze alloy<br>class: sculptural study</div>
  <div class="desc" id="desc">Experimental torus-knot structure presented as an archival specimen in a museum-like display.</div>
</div>

<div class="nav">
  <div class="btn" id="prev">‹</div>
  <div class="btn" id="next">›</div>
</div>

<div class="slider-ref" id="dots"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const items=[
{title:"Specimen I",meta:"year: 2026<br>materials: bronze alloy<br>class: sculptural study",desc:"Experimental torus-knot structure presented as an archival specimen in a museum-like display.",make:()=>new THREE.Mesh(new THREE.TorusKnotGeometry(1,.3,120,16),new THREE.MeshStandardMaterial({color:0xc6a15b,metalness:.8,roughness:.3}))},
{title:"Specimen II",meta:"year: 2025<br>materials: stone composite<br>class: polyhedral form",desc:"Icosahedral study form held in suspension above the pedestal.",make:()=>new THREE.Mesh(new THREE.IcosahedronGeometry(1.3),new THREE.MeshStandardMaterial({color:0x7a7a7a,roughness:.9}))},
{title:"Specimen III",meta:"year: 2026<br>materials: gilded metal<br>class: ring structure",desc:"Circular torus-based object with a polished metallic surface.",make:()=>new THREE.Mesh(new THREE.TorusGeometry(1.3,.25,20,80),new THREE.MeshStandardMaterial({color:0xc6a15b,metalness:.7,roughness:.35}))},
{title:"Specimen IV",meta:"year: 2024<br>materials: dark resin<br>class: conical study",desc:"Geometric cone object presented as a reduced monolithic artefact.",make:()=>new THREE.Mesh(new THREE.ConeGeometry(1.2,2.5,32),new THREE.MeshStandardMaterial({color:0x222222,roughness:.78}))},
{title:"Specimen V",meta:"year: 2026<br>materials: mineral cast<br>class: dodecahedral study",desc:"Faceted mineral-like volume shown as a catalogue specimen.",make:()=>new THREE.Mesh(new THREE.DodecahedronGeometry(1.28),new THREE.MeshStandardMaterial({color:0xa9a9a9,roughness:.88}))}
];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0b0b);

const camera=new THREE.PerspectiveCamera(40,window.innerWidth/window.innerHeight,0.1,100);
function setCamera(){
  if(window.innerWidth<820){
    camera.position.set(0,12.2,15.2);
    camera.lookAt(0,9.9,0);
  }else{
    camera.position.set(0,8.8,14.2);
    camera.lookAt(0,7.1,0);
  }
}
setCamera();

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position="fixed";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="1";

scene.add(new THREE.AmbientLight(0xffffff,.34));

const spot=new THREE.SpotLight(0xffe0b0,2.2);
spot.position.set(0,20,6);
spot.angle=Math.PI/6;
spot.penumbra=0.5;
spot.castShadow=true;
scene.add(spot);

const fill=new THREE.PointLight(0xd3b287,.6,30);
fill.position.set(-6,8,8);
scene.add(fill);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x020202}));
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const pedestalMat=new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.92,metalness:.05});
const trimMat=new THREE.MeshStandardMaterial({color:0x161616,roughness:.75,metalness:.08});

const pedestal=new THREE.Group();
scene.add(pedestal);

const base=new THREE.Mesh(new THREE.BoxGeometry(6.1,5,6.1),pedestalMat);
base.castShadow=true;
base.receiveShadow=true;
pedestal.add(base);

const slab=new THREE.Mesh(new THREE.BoxGeometry(6.7,.28,6.7),trimMat);
slab.castShadow=true;
pedestal.add(slab);

const glow=new THREE.Mesh(new THREE.CircleGeometry(1.8,40),new THREE.MeshBasicMaterial({color:0xb8894a,transparent:true,opacity:.08}));
glow.rotation.x=-Math.PI/2;
scene.add(glow);

function setPedestalLayout(){
  const nav=document.querySelector('.nav');
  if(window.innerWidth<820){
    base.position.y=5.1;
    slab.position.y=7.82;
    glow.position.y=7.94;
    nav.style.alignItems='flex-start';
    nav.style.paddingTop=(window.innerHeight*0.43)+'px';
  }else{
    base.position.y=2.2;
    slab.position.y=4.9;
    glow.position.y=5.02;
    nav.style.alignItems='center';
    nav.style.paddingTop='0';
  }
}
setPedestalLayout();

const objects=items.map(item=>{
  const o=item.make();
  o.visible=false;
  o.castShadow=true;
  scene.add(o);
  return o;
});

function setObjectLayout(){
  const y=window.innerWidth<820?10.7:7.25;
  objects.forEach(o=>{o.position.y=y;});
}
setObjectLayout();

const titleEl=document.getElementById('title');
const metaEl=document.getElementById('meta');
const descEl=document.getElementById('desc');
const dotsEl=document.getElementById('dots');
let index=0;

function buildDots(){
  dotsEl.innerHTML="";
  items.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot'+(i===0?' active':'');
    d.addEventListener('click',()=>show(i));
    dotsEl.appendChild(d);
  });
}
buildDots();

function updateCartela(){
  titleEl.textContent=items[index].title;
  metaEl.innerHTML=items[index].meta;
  descEl.textContent=items[index].desc;
  Array.from(dotsEl.children).forEach((d,i)=>d.classList.toggle('active',i===index));
}
function show(i){
  objects[index].visible=false;
  index=(i+objects.length)%objects.length;
  objects[index].visible=true;
  updateCartela();
}
show(0);

document.getElementById('next').onclick=()=>show(index+1);
document.getElementById('prev').onclick=()=>show(index-1);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const obj=objects[index];
  obj.rotation.y+=0.01;
  const baseY=window.innerWidth<820?10.7:7.25;
  obj.position.y=baseY+Math.sin(t*1.4)*0.12;
  glow.material.opacity=.07+Math.sin(t*1.4)*.01;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  setCamera();
  setPedestalLayout();
  setObjectLayout();
  camera.updateProjectionMatrix();
});

let touchStartX=0;
window.addEventListener('touchstart',e=>touchStartX=e.changedTouches[0].clientX,{passive:true});
window.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>40) dx<0?show(index+1):show(index-1);
},{passive:true});

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(index+1);
  if(e.key==='ArrowLeft') show(index-1);
});
</script>
</body>
</html>
