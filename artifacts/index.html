<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Display Rooms Preview</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--ink:#e8e2d6;--panel:rgba(15,15,15,.72);--border:rgba(255,255,255,.14);
  --mono:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'EB Garamond',serif}
canvas{display:block}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(920px 560px at 50% 36%,rgba(255,255,255,.028) 0%,rgba(255,255,255,0) 58%),
  radial-gradient(1000px 720px at 50% 82%,rgba(232,226,214,.02) 0%,rgba(0,0,0,0) 60%),
  linear-gradient(180deg,rgba(255,255,255,.02) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,.52) 100%),
  #070707}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 34%,rgba(0,0,0,.94) 100%)}
.glass{position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 20%),linear-gradient(245deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,0) 24%),radial-gradient(800px 520px at 60% 24%,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 55%);opacity:.24;mix-blend-mode:screen}
.frame{position:fixed;inset:clamp(8px,2vw,20px);pointer-events:none;border-radius:14px;opacity:.6;box-shadow:inset 0 0 0 1px rgba(232,226,214,.09),inset 0 0 0 2px rgba(0,0,0,.58),inset 0 20px 40px rgba(0,0,0,.35),inset 0 -30px 60px rgba(0,0,0,.48)}

.cartela{position:fixed;z-index:8;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px);transition:opacity .28s ease, transform .28s ease}
.cartela h1{margin:0 0 8px 0;line-height:1.02;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.meta{font-family:var(--mono);font-size:10px;line-height:1.55;letter-spacing:.12em;text-transform:uppercase;opacity:.66;margin-bottom:12px}
.desc{line-height:1.58;opacity:.9}
body.desktop .cartela{left:clamp(14px,4vw,40px);top:clamp(14px,4vh,38px);width:min(360px,calc(100vw - 28px));padding:18px 18px 16px}
body.desktop .cartela h1{font-size:clamp(16px,2.2vw,24px)}
body.desktop .cartela .desc{font-size:14px}
body.mobile .cartela{left:10px;right:10px;bottom:max(48px,calc(env(safe-area-inset-bottom) + 44px));padding:14px 14px 13px}
body.mobile .cartela h1{font-size:16px}
body.mobile .cartela .desc{font-size:13px;line-height:1.5}

.nav{position:fixed;inset:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 10px;pointer-events:none;z-index:9}
.btn{pointer-events:auto;border:1px solid rgba(255,255,255,.14);background:rgba(10,10,10,.26);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-family:var(--mono);backdrop-filter:blur(10px)}
body.desktop .btn{width:38px;height:78px;font-size:20px}
body.mobile .btn{width:32px;height:64px;font-size:18px}

.slider-ref{position:fixed;left:50%;transform:translateX(-50%);z-index:9;display:flex;padding:7px 10px;border:1px solid rgba(255,255,255,.12);background:rgba(10,10,10,.24);backdrop-filter:blur(10px);border-radius:0}
body.desktop .slider-ref{bottom:max(14px,env(safe-area-inset-bottom));gap:9px}
body.mobile .slider-ref{bottom:max(10px,env(safe-area-inset-bottom));gap:8px;padding:6px 9px}
.dot{border-radius:50%;background:rgba(232,226,214,.18);border:1px solid rgba(232,226,214,.14);cursor:pointer;padding:0}
body.desktop .dot{width:8px;height:8px}
body.mobile .dot{width:7px;height:7px}
.dot.active{background:rgba(232,226,214,.88);border-color:rgba(232,226,214,.32)}

.room-toggle{position:fixed;top:clamp(10px,2vw,22px);right:clamp(10px,2vw,22px);z-index:10;border:1px solid rgba(255,255,255,.14);background:rgba(10,10,10,.28);backdrop-filter:blur(10px);display:flex;flex-direction:column;min-width:110px}
.room-item{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:10px 12px;color:var(--ink);background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;cursor:pointer;opacity:.56}
.room-item:last-child{border-bottom:0}
.room-item.active{opacity:1;background:rgba(255,255,255,.03)}
.room-item.exit{opacity:.46}
.room-item:hover{opacity:1}
body.mobile .room-toggle{min-width:102px;top:10px;right:10px}
body.mobile .room-item{font-size:9px;padding:9px 11px}
</style>
</head>
<body>
<div class="glass"></div>
<div class="frame"></div>

<div class="cartela">
  <h1 id="title">Specimen I</h1>
  <div class="meta" id="meta">year: 2026<br>materials: bronze alloy<br>class: sculptural study</div>
  <div class="desc" id="desc">Experimental torus-knot structure presented as an archival specimen.</div>
</div>

<div class="room-toggle">
  <button class="room-item active" id="room1Btn">SALA I</button>
  <button class="room-item" id="room2Btn">SALA II</button>
  <button class="room-item exit" id="exitBtn">EXIT</button>
</div>

<div class="nav">
  <div class="btn" id="prev">‹</div>
  <div class="btn" id="next">›</div>
</div>

<div class="slider-ref" id="dots"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function isPortrait(){ return window.innerHeight > window.innerWidth * 1.1 }
function applyBodyClass(){
  document.body.classList.toggle('mobile', isPortrait());
  document.body.classList.toggle('desktop', !isPortrait());
}
applyBodyClass();
let currentRoom=1;

const room1Items=[
  {title:"Specimen I",meta:"year: 2026<br>materials: bronze alloy<br>class: sculptural study",desc:"Experimental torus-knot structure presented as an archival specimen.",make:()=>new THREE.Mesh(new THREE.TorusKnotGeometry(1,.3,120,16),new THREE.MeshStandardMaterial({color:0xc6a15b,metalness:.8,roughness:.3}))},
  {title:"Specimen II",meta:"year: 2025<br>materials: stone composite<br>class: polyhedral form",desc:"Icosahedral study form held in suspension above the pedestal.",make:()=>new THREE.Mesh(new THREE.IcosahedronGeometry(1.3),new THREE.MeshStandardMaterial({color:0x7a7a7a,roughness:.9}))},
  {title:"Specimen III",meta:"year: 2026<br>materials: gilded metal<br>class: ring structure",desc:"Circular torus-based object with a polished metallic surface.",make:()=>new THREE.Mesh(new THREE.TorusGeometry(1.3,.25,20,80),new THREE.MeshStandardMaterial({color:0xc6a15b,metalness:.7,roughness:.35}))},
  {title:"Specimen IV",meta:"year: 2024<br>materials: dark resin<br>class: conical study",desc:"Geometric cone object presented as a reduced monolithic artefact.",make:()=>new THREE.Mesh(new THREE.ConeGeometry(1.2,2.5,32),new THREE.MeshStandardMaterial({color:0x222222,roughness:.78}))},
  {title:"Specimen V",meta:"year: 2026<br>materials: mineral cast<br>class: dodecahedral study",desc:"Faceted mineral-like volume shown as a catalogue specimen.",make:()=>new THREE.Mesh(new THREE.DodecahedronGeometry(1.28),new THREE.MeshStandardMaterial({color:0xa9a9a9,roughness:.88}))}
];

const room2Items=[
  {title:"Wall Study I",meta:"year: 2026<br>medium: archival pigment on panel<br>class: wall study",desc:"Single framed work presented against a dark museum wall under a concentrated overhead beam.",art:"linen"},
  {title:"Wall Study II",meta:"year: 2026<br>medium: silver gelatin print<br>class: wall study",desc:"Monochrome study with a darker tonal range and soft internal grain.",art:"cross"},
  {title:"Wall Study III",meta:"year: 2025<br>medium: layered print on board<br>class: wall study",desc:"Architectural composition reduced to pale planes and restrained linework.",art:"frame"},
  {title:"Wall Study IV",meta:"year: 2026<br>medium: carbon transfer on panel<br>class: wall study",desc:"Dense central image held inside a minimal frame and narrow halo of light.",art:"void"}
];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070707);
const camera=new THREE.PerspectiveCamera(40,window.innerWidth/window.innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position='fixed';
renderer.domElement.style.inset='0';
renderer.domElement.style.zIndex='1';

function setCamera(){
  if(isPortrait()){
    camera.position.set(0,14.5,16.2);
    // mismo lookAt Y en ambas salas, solo cambia Z
    camera.lookAt(0, 11.4, currentRoom===2 ? -3.5 : 0);
  }else{
    camera.position.set(0,8.0,14.8);
    camera.lookAt(0, 6.2, currentRoom===2 ? -3.5 : 0);
  }
  camera.updateProjectionMatrix();
}
setCamera();

scene.add(new THREE.AmbientLight(0xffffff,.16));
const fill=new THREE.PointLight(0xc3a57d,.18,40); fill.position.set(-6,8,8); scene.add(fill);

const room1Group=new THREE.Group();
const room2Group=new THREE.Group();
scene.add(room1Group); scene.add(room2Group);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x020202,roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

const pedestalMat=new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.92,metalness:.05});
const trimMat=new THREE.MeshStandardMaterial({color:0x161616,roughness:.75,metalness:.08});
const PEDESTAL_HEIGHT=5.4; const SLAB_H=0.28;
const pedestal=new THREE.Group(); room1Group.add(pedestal);
const base=new THREE.Mesh(new THREE.BoxGeometry(6.1,PEDESTAL_HEIGHT,6.1),pedestalMat); base.castShadow=true; base.receiveShadow=true; pedestal.add(base);
const slab=new THREE.Mesh(new THREE.BoxGeometry(6.7,SLAB_H,6.7),trimMat); slab.castShadow=true; slab.receiveShadow=true; pedestal.add(slab);
function setPedestalLayout(){
  const by = isPortrait() ? 7.5 : 2.5;
  base.position.y = by;
  slab.position.y = by + PEDESTAL_HEIGHT/2 + SLAB_H/2;
}
setPedestalLayout();
const objects=room1Items.map(item=>{ const o=item.make(); o.visible=false; o.castShadow=true; room1Group.add(o); return o; });
function getObjectBaseY(){ return slab.position.y + SLAB_H/2 + 2.2; }
function setObjectLayout(){ const y=getObjectBaseY(); objects.forEach(o=>o.position.y=y); }
setObjectLayout();

// Room II: dark museum wall
const museumWallMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.98,metalness:.02});
const museumWall=new THREE.Mesh(new THREE.PlaneGeometry(22,13),museumWallMat);
museumWall.position.set(0,6.4,-4.8);
room2Group.add(museumWall);

const sideLeft=new THREE.Mesh(new THREE.PlaneGeometry(4,13),new THREE.MeshStandardMaterial({color:0x060606,roughness:1}));
sideLeft.position.set(-11.5,6.4,-2.5); sideLeft.rotation.y=Math.PI/2.9; room2Group.add(sideLeft);
const sideRight=sideLeft.clone(); sideRight.position.x=11.5; sideRight.rotation.y=-Math.PI/2.9; room2Group.add(sideRight);

const ceilingShadow=new THREE.Mesh(new THREE.PlaneGeometry(22,8),new THREE.MeshStandardMaterial({color:0x050505,roughness:1,transparent:true,opacity:.96}));
ceilingShadow.position.set(0,12.8,-1.8); ceilingShadow.rotation.x=Math.PI/2; room2Group.add(ceilingShadow);

const frameOuter=new THREE.Mesh(new THREE.BoxGeometry(4.68,5.88,.18),new THREE.MeshStandardMaterial({color:0x9b7a2f,roughness:.34,metalness:.72}));
frameOuter.position.set(0,6.6,-4.22); frameOuter.castShadow=true; frameOuter.receiveShadow=true; room2Group.add(frameOuter);
const frameInnerShadow=new THREE.Mesh(new THREE.BoxGeometry(4.25,5.45,.08),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:1}));
frameInnerShadow.position.set(0,6.6,-4.12); room2Group.add(frameInnerShadow);
const frameInnerGold=new THREE.Mesh(new THREE.BoxGeometry(4.18,5.38,.04),new THREE.MeshStandardMaterial({color:0xc4a35a,roughness:.38,metalness:.62}));
frameInnerGold.position.set(0,6.6,-4.07); room2Group.add(frameInnerGold);

const artCanvas=document.createElement('canvas'); artCanvas.width=800; artCanvas.height=1100;
const artCtx=artCanvas.getContext('2d');
const artTexture=new THREE.CanvasTexture(artCanvas);
artTexture.minFilter=THREE.LinearFilter; artTexture.magFilter=THREE.LinearFilter;
const artPlane=new THREE.Mesh(new THREE.PlaneGeometry(4.02,5.22),new THREE.MeshStandardMaterial({map:artTexture,roughness:.94,metalness:.0}));
artPlane.position.set(0,6.6,-4.02); room2Group.add(artPlane);

const wallHaloCanvas=document.createElement('canvas'); wallHaloCanvas.width=900; wallHaloCanvas.height=900;
const wallHaloCtx=wallHaloCanvas.getContext('2d');
const wallHaloTexture=new THREE.CanvasTexture(wallHaloCanvas);
const wallHalo=new THREE.Mesh(new THREE.PlaneGeometry(10.8,8.8),new THREE.MeshBasicMaterial({map:wallHaloTexture,transparent:true,opacity:.54,depthWrite:false}));
wallHalo.position.set(0,7.1,-4.64); room2Group.add(wallHalo);

function paintWallHalo(){
  const g=wallHaloCtx.createRadialGradient(450,170,40,450,270,360);
  g.addColorStop(0,'rgba(214,197,169,.22)');
  g.addColorStop(.22,'rgba(184,162,131,.12)');
  g.addColorStop(.55,'rgba(120,104,83,.04)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  wallHaloCtx.clearRect(0,0,900,900);
  wallHaloCtx.fillStyle=g;
  wallHaloCtx.fillRect(0,0,900,900);
  wallHaloTexture.needsUpdate=true;
}
paintWallHalo();

let room2DisplayY = 0;
function getDisplayCenterY(){
  return getObjectBaseY();
}

function setRoom2Layout(){
  const anchorY = getObjectBaseY();
  room2DisplayY = anchorY;
  if(isPortrait()){
    museumWall.position.set(0,anchorY-0.4,-5.6);
    museumWall.scale.set(1,1.08,1);
    sideLeft.position.set(-11.5,anchorY-0.4,-3.2);
    sideRight.position.set(11.5,anchorY-0.4,-3.2);
    ceilingShadow.position.set(0,anchorY+5.9,-2.4);
    frameOuter.position.set(0,anchorY,-4.95);
    frameInnerShadow.position.set(0,anchorY,-4.85);
    frameInnerGold.position.set(0,anchorY,-4.80);
    artPlane.position.set(0,anchorY,-4.74);
    wallHalo.position.set(0,anchorY+0.55,-5.42);
    wallHalo.scale.set(1.02,1.1,1);
    room2Spot.position.set(0,anchorY+5.9,-1.9);
    room2Spot.target.position.set(0,anchorY,-4.85);
    room2CeilingGlow.position.set(0,anchorY+4.8,-2.2);
  }else{
    museumWall.position.set(0,anchorY-0.2,-4.8);
    museumWall.scale.set(1,1,1);
    sideLeft.position.set(-11.5,anchorY-0.2,-2.5);
    sideRight.position.set(11.5,anchorY-0.2,-2.5);
    ceilingShadow.position.set(0,anchorY+6.2,-1.8);
    frameOuter.position.set(0,anchorY,-4.22);
    frameInnerShadow.position.set(0,anchorY,-4.12);
    frameInnerGold.position.set(0,anchorY,-4.07);
    artPlane.position.set(0,anchorY,-4.02);
    wallHalo.position.set(0,anchorY+0.5,-4.64);
    wallHalo.scale.set(1,1,1);
    room2Spot.position.set(0,anchorY+5.6,-1.2);
    room2Spot.target.position.set(0,anchorY,-4.1);
    room2CeilingGlow.position.set(0,anchorY+4.9,-1.5);
  }
  room2Spot.target.updateMatrixWorld();
}

function drawArtwork(kind){
  const w=artCanvas.width, h=artCanvas.height;
  artCtx.clearRect(0,0,w,h);
  const bg=artCtx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0,'#d9d1c4');
  bg.addColorStop(.5,'#cfc5b6');
  bg.addColorStop(1,'#b8ad9b');
  artCtx.fillStyle=bg; artCtx.fillRect(0,0,w,h);

  artCtx.globalAlpha=.08;
  for(let i=0;i<1600;i++){
    const x=Math.random()*w, y=Math.random()*h, a=Math.random()*1.6;
    artCtx.fillStyle=`rgba(20,20,20,${0.02+Math.random()*0.04})`;
    artCtx.fillRect(x,y,a,a);
  }
  artCtx.globalAlpha=1;

  artCtx.strokeStyle='rgba(34,34,34,.18)';
  artCtx.lineWidth=2;
  artCtx.strokeRect(44,44,w-88,h-88);

  if(kind==='linen'){
    artCtx.strokeStyle='rgba(20,20,20,.16)';
    artCtx.lineWidth=1;
    for(let y=120;y<h-120;y+=22){ artCtx.beginPath(); artCtx.moveTo(110,y); artCtx.lineTo(w-110,y+Math.sin(y*.03)*8); artCtx.stroke(); }
    artCtx.fillStyle='rgba(20,20,20,.08)';
    artCtx.fillRect(170,180,w-340,h-360);
  }else if(kind==='cross'){
    artCtx.fillStyle='rgba(25,25,25,.09)';
    artCtx.fillRect(180,140,w-360,h-280);
    artCtx.strokeStyle='rgba(12,12,12,.34)'; artCtx.lineWidth=10;
    artCtx.beginPath(); artCtx.moveTo(w/2,210); artCtx.lineTo(w/2,h-210); artCtx.stroke();
    artCtx.lineWidth=8;
    artCtx.beginPath(); artCtx.moveTo(220,h/2); artCtx.lineTo(w-220,h/2); artCtx.stroke();
  }else if(kind==='frame'){
    artCtx.strokeStyle='rgba(12,12,12,.24)'; artCtx.lineWidth=5;
    artCtx.strokeRect(170,170,w-340,h-340);
    artCtx.fillStyle='rgba(255,255,255,.10)'; artCtx.fillRect(250,250,w-500,h-500);
    artCtx.strokeStyle='rgba(12,12,12,.18)'; artCtx.lineWidth=2;
    artCtx.beginPath(); artCtx.moveTo(250,250); artCtx.lineTo(w-250,h-250); artCtx.moveTo(w-250,250); artCtx.lineTo(250,h-250); artCtx.stroke();
  }else if(kind==='void'){
    const rg=artCtx.createRadialGradient(w/2,h/2,40,w/2,h/2,250);
    rg.addColorStop(0,'rgba(8,8,8,.58)'); rg.addColorStop(.4,'rgba(16,16,16,.32)'); rg.addColorStop(1,'rgba(16,16,16,0)');
    artCtx.fillStyle=rg; artCtx.fillRect(0,0,w,h);
    artCtx.fillStyle='rgba(12,12,12,.12)'; artCtx.fillRect(190,160,w-380,h-320);
  }

  const vignette=artCtx.createRadialGradient(w/2,h/2,300,w/2,h/2,560);
  vignette.addColorStop(0,'rgba(255,255,255,0)'); vignette.addColorStop(1,'rgba(0,0,0,.13)');
  artCtx.fillStyle=vignette; artCtx.fillRect(0,0,w,h);
  artTexture.needsUpdate=true;
}

const room1Spot=new THREE.SpotLight(0xffe0b0,2.75);
room1Spot.position.set(0,22,4); room1Spot.angle=Math.PI/7; room1Spot.penumbra=0.6; room1Spot.castShadow=true;
room1Spot.shadow.mapSize.width=2048; room1Spot.shadow.mapSize.height=2048; room1Spot.shadow.camera.near=1; room1Spot.shadow.camera.far=40;
scene.add(room1Spot); scene.add(room1Spot.target);

const room2Spot=new THREE.SpotLight(0xf5dfbf,2.4);
room2Spot.position.set(0,12.2,-1.2); room2Spot.angle=Math.PI/8.8; room2Spot.penumbra=.92; room2Spot.decay=1.6; room2Spot.distance=24; room2Spot.castShadow=true;
room2Spot.shadow.mapSize.width=2048; room2Spot.shadow.mapSize.height=2048; room2Spot.shadow.camera.near=.5; room2Spot.shadow.camera.far=32;
scene.add(room2Spot); scene.add(room2Spot.target); room2Spot.target.position.set(0,6.65,-4.1);
const room2CeilingGlow=new THREE.PointLight(0xd5bf95,.24,12); scene.add(room2CeilingGlow);
setRoom2Layout();

let room1Index=0;
let room2Index=0;
const titleEl=document.getElementById('title');
const metaEl=document.getElementById('meta');
const descEl=document.getElementById('desc');
const dotsEl=document.getElementById('dots');
const room1Btn=document.getElementById('room1Btn');
const room2Btn=document.getElementById('room2Btn');

function buildDots(){
  dotsEl.innerHTML='';
  const data = currentRoom===1 ? room1Items : room2Items;
  const active = currentRoom===1 ? room1Index : room2Index;
  data.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot'+(i===active?' active':'');
    d.addEventListener('click',()=>showItem(i));
    dotsEl.appendChild(d);
  });
}

function updateCartela(){
  const item = currentRoom===1 ? room1Items[room1Index] : room2Items[room2Index];
  titleEl.textContent=item.title;
  metaEl.innerHTML=item.meta;
  descEl.textContent=item.desc;
  Array.from(dotsEl.children).forEach((d,i)=>{
    const active = currentRoom===1 ? room1Index : room2Index;
    d.classList.toggle('active',i===active);
  });
}

function updateRoomButtons(){
  room1Btn.classList.toggle('active',currentRoom===1);
  room2Btn.classList.toggle('active',currentRoom===2);
}

function updateArrows(){
  // Ambas salas comparten el mismo centro Y — proyección siempre idéntica
  const p = new THREE.Vector3(0, getObjectBaseY(), 0);
  p.project(camera);
  const sy = (1 - p.y) / 2 * window.innerHeight;
  const bh = isPortrait() ? 64 : 78;
  document.getElementById('prev').style.transform = `translateY(${sy - bh/2}px)`;
  document.getElementById('next').style.transform = `translateY(${sy - bh/2}px)`;
}

function showRoom1(i){
  objects[room1Index].visible=false;
  room1Index=(i+objects.length)%objects.length;
  objects[room1Index].visible=true;
}
function showRoom2(i){
  room2Index=(i+room2Items.length)%room2Items.length;
  drawArtwork(room2Items[room2Index].art);
}

function showItem(i){
  if(currentRoom===1) showRoom1(i); else showRoom2(i);
  updateCartela();
}

function setRoom(id){
  currentRoom=id;
  room1Group.visible=id===1;
  room2Group.visible=id===2;
  room1Spot.visible=id===1;
  room2Spot.visible=id===2;
  room2CeilingGlow.visible=id===2;
  setCamera();        // primero actualizar cámara
  setRoom2Layout();   // luego reposicionar sala II
  buildDots();
  updateCartela();
  updateRoomButtons();
  updateArrows();     // proyectar con la cámara ya correcta
}

showRoom1(0);
showRoom2(0);
setRoom(1);

room1Btn.onclick=()=>setRoom(1);
room2Btn.onclick=()=>setRoom(2);
document.getElementById('exitBtn').onclick=()=>window.location.href='/';
document.getElementById('next').onclick=()=>showItem((currentRoom===1?room1Index:room2Index)+1);
document.getElementById('prev').onclick=()=>showItem((currentRoom===1?room1Index:room2Index)-1);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(currentRoom===1){
    const obj=objects[room1Index];
    obj.rotation.y+=0.01;
    obj.position.y=getObjectBaseY()+Math.sin(t*1.4)*0.14;
    room1Spot.target.position.set(0,slab.position.y,0);
    room1Spot.target.updateMatrixWorld();
  }else{
    artPlane.position.z=(isPortrait()?-4.74:-4.02) + Math.sin(t*.7)*0.004;
    frameOuter.position.z=(isPortrait()?-4.95:-4.22) + Math.sin(t*.7)*0.002;
    frameInnerGold.position.z=(isPortrait()?-4.80:-4.07) + Math.sin(t*.7)*0.0015;
    room2Spot.intensity=2.3 + Math.sin(t*.6)*0.04;
  }
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  applyBodyClass();
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  setPedestalLayout();
  setRoom2Layout();
  setCamera();
  setObjectLayout();
  updateArrows();
});

let tx=0;
window.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
window.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40) dx<0?showItem((currentRoom===1?room1Index:room2Index)+1):showItem((currentRoom===1?room1Index:room2Index)-1);
},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') showItem((currentRoom===1?room1Index:room2Index)+1);
  if(e.key==='ArrowLeft') showItem((currentRoom===1?room1Index:room2Index)-1);
});
</script>
</body>
</html>
