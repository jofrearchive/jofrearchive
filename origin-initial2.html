<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — Cloister Point Cloud (INIT ASKS PERMISSION + VR TOGGLE)</title>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-deep:#0b0b0b;
      --ivory:#e8e2d6;
      --led-green:#4ade80;
    }
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg-deep);}
    #renderCanvas{width:100%;height:100%;touch-action:none;filter:contrast(110%) brightness(90%);}

    /* ===== GATE (INITIALIZE SYSTEM) ===== */
    #gate{
      position:fixed; inset:0;
      background: radial-gradient(circle at center, rgba(11,11,11,0.82) 0%, var(--bg-deep) 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; color:var(--ivory); text-align:center;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
               max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    body.bab3d-on #gate{ display:none; }

    h1{
      font-family:'EB Garamond', serif;
      font-weight:normal;
      letter-spacing:.2em;
      opacity:.9;
      margin:0 0 40px 0;
      text-transform:uppercase;
    }
    #startVR{
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(232,226,214,.2);
      color: var(--ivory);
      font-family:'Source Code Pro', monospace;
      text-transform: uppercase;
      letter-spacing: .18em;
      padding: 12px 30px;
      cursor:pointer;
      display:flex; align-items:center; gap: 15px;
      transition: all .3s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #startVR:hover{ border-color: rgba(232,226,214,.5); background: rgba(0,0,0,.8); }
    #led{ width:8px;height:8px;background:#222;border-radius:50%; box-shadow:0 0 0px var(--led-green); transition:.3s; }
    #startVR:hover #led{ background:var(--led-green); box-shadow:0 0 8px var(--led-green); }

    /* ===== LOADER ===== */
    #loader{
      position:fixed; inset:0;
      background: var(--bg-deep);
      z-index:9999;
      display:none;
      align-items:center;
      justify-content:center;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
               max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    #loader[aria-hidden="false"]{ display:flex; }
    .loaderBox{
      width:min(760px, 92vw);
      border:1px solid rgba(255,255,255,.16);
      background: rgba(10,10,10,.60);
      padding: clamp(18px, 4vw, 34px);
    }
    .loaderTitle{
      font-family:'EB Garamond', serif;
      font-size: clamp(16px, 2.6vw, 22px);
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity:.92;
      margin-bottom: 12px;
      color: var(--ivory);
    }
    .typeLine{
      font-family: 'Source Code Pro', monospace;
      font-size: clamp(12px, 2vw, 14px);
      letter-spacing: .08em;
      opacity:.78;
      line-height:1.65;
      white-space: pre-wrap;
      min-height: 5.2em;
      color: var(--ivory);
    }
    .barWrap{
      margin-top: 18px;
      height: 10px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.03);
    }
    .bar{
      height:100%;
      width:0%;
      background: rgba(232,226,214,.58);
      transition: width .08s linear;
    }
    .percentRow{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 12px;
      letter-spacing: .14em;
      opacity:.65;
      text-transform: uppercase;
      color: var(--ivory);
    }
    .fadeOut{
      opacity:0;
      pointer-events:none;
      transition: opacity 1.1s ease;
    }

    /* ===== PANEL ===== */
    #panel{
      position:fixed;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: min(360px, 92vw);
      background: rgba(10,10,10,.65);
      border:1px solid rgba(255,255,255,.18);
      padding: 32px;
      backdrop-filter: blur(8px);
      z-index:8;
      opacity:0;
      transition: opacity 1.0s ease;
      display:none;
      pointer-events:auto;
    }
    body.bab3d-on #panel{ display:block; }
    #panel.show{ opacity:1; }

    #panel #title{
      font-family:'EB Garamond', serif;
      font-size: 28px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ivory);
      margin: 0 0 10px 0;
    }
    #panel #submeta{
      font-family:'Source Code Pro', monospace;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity:.65;
      line-height: 1.6;
      margin-bottom: 12px;
      color: var(--ivory);
    }
    #panel .tabs{
      display:flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #panel .tabLink{
      flex: 1 1 0;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.16);
      color: var(--ivory);
      font-family: 'Source Code Pro', monospace;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 10px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
    }
    #panel .tabLink:hover, #panel .tabLink.active{
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.36);
      opacity: 1;
    }

    /* ===== VR PILL BUTTON (MOBILE) ===== */
    #motionBtn{
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 12;
      display: none; /* shown only on mobile */
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.45);
      color: rgba(232,226,214,.55); /* OFF = grey */
      font-family:'Source Code Pro', monospace;
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: border-color .25s ease, color .25s ease, background .25s ease, opacity .25s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #motionBtn:hover{
      border-color: rgba(255,255,255,.30);
      background: rgba(0,0,0,.60);
    }
    #motionBtn[aria-disabled="true"]{
      opacity:.45;
      cursor: default;
    }
    #motionDot{
      width:8px; height:8px; border-radius:50%;
      background:#222;
      box-shadow:none;
      transition:all .25s ease;
    }
    #motionBtn.active{
      color: rgba(232,226,214,.85);
      border-color: rgba(255,255,255,.30);
    }
    #motionBtn.active #motionDot{
      background: rgba(74,222,128,.95);
      box-shadow: 0 0 12px rgba(74,222,128,.85);
    }

    /* hint */
    #hint{
      position:fixed;
      left:50%;
      bottom: calc(max(16px, env(safe-area-inset-bottom)) + 58px);
      transform:translateX(-50%);
      z-index:20;
      display:none;
      max-width:min(560px, 92vw);
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.45);
      color: rgba(232,226,214,.75);
      font-family:'Source Code Pro', monospace;
      font-size: 11px;
      letter-spacing:.10em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }
    #hint.show{ display:block; }

    @media (max-width: 520px){
      #panel{ padding: 14px 14px 8px; }
    }
  </style>
</head>
<body>

  <div id="gate" aria-hidden="false">
    <h1>EXPERIMENTAL ARCHIVE</h1>
    <button id="startVR" type="button">
      <div id="led" aria-hidden="true"></div>
      <span>Initialize System</span>
    </button>
  </div>

  <div id="loader" aria-hidden="true">
    <div class="loaderBox">
      <div class="loaderTitle">INITIALIZING SYSTEM</div>
      <div id="typeLine" class="typeLine">Boot sequence…</div>
      <div class="barWrap"><div id="bar" class="bar"></div></div>
      <div class="percentRow">
        <div id="pct">0%</div>
        <div id="status">loading geometry</div>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <button id="motionBtn" type="button" aria-label="Toggle VR" aria-disabled="true">
    <span id="motionDot" aria-hidden="true"></span>
    <span class="vrLabel">VR OFF</span>
  </button>

  <div id="panel" aria-hidden="false">
    <div id="title">JOFRE OLIVERAS</div>
    <div id="submeta"></div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="hint" role="status" aria-live="polite"></div>

<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "ARTIST · EXPLORER · LANDSCAPER",
    "BASED BETWEEN DISCIPLINES",
    "EXPERIMENTAL ARCHIVE"
  ],
  tabs: [
    { key: "STUDIES", ctaHref: "https://inside.jofrearchive.com/studies/" },
    { key: "GENEALOGY", ctaHref: "https://inside.jofrearchive.com/genealogy/" },
    { key: "ARTIFACTS", ctaHref: "https://jofrearchive.com/artifacts" }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");

  titleEl.textContent = PANEL_CONTENT.title;
  submetaEl.innerHTML = PANEL_CONTENT.submeta.map(s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))).join("<br>");

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key;
    b.addEventListener("click", ()=>{ if (t.ctaHref) window.location.href = t.ctaHref; });
    tabsEl.appendChild(b);
  });

  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();
</script>

<script>
(function(){
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });

  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  let scene = null;
  let camera = null;

  let loopStarted = false;
  let initialized = false;

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
  }

  const motionBtn = document.getElementById("motionBtn");
  if (isMobile() && motionBtn){
    motionBtn.style.display = "flex";
  }

  function showHint(msg){
    const el = document.getElementById("hint");
    if (!el) return;
    el.textContent = msg || "";
    el.classList.add("show");
    clearTimeout(showHint._t);
    showHint._t = setTimeout(()=> el.classList.remove("show"), 5200);
  }

  async function requestGyroPermission(){
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return false;
    if (typeof DOE.requestPermission === "function"){
      try{
        const res = await DOE.requestPermission();
        return res === "granted";
      }catch(e){
        return false;
      }
    }
    return true;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));

      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";

      loader.classList.add("fadeOut");
      setTimeout(()=> loader.setAttribute("aria-hidden","true"), 1100);
    }

    async function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
      if (typeLine) typeLine.textContent = String(msg || "Initialization failed");
    }

    return { done, fail };
  }

  function enableGyroRelative(cam){
    if (!cam.rotationQuaternion){
      cam.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(cam.rotation.x, cam.rotation.y, cam.rotation.z);
    }

    let enabled = true;
    let initialCamQuat = cam.rotationQuaternion.clone();

    const sensorZeroInv = new BABYLON.Quaternion();
    const currentQ = new BABYLON.Quaternion();
    const smoothQ = new BABYLON.Quaternion();
    let first = true;

    let activationPose = "upright";
    const SMOOTH = 0.12;

    const qDeviceToWorld = (() => {
      const s = Math.sqrt(0.5);
      return new BABYLON.Quaternion(-s, 0, 0, s);
    })();

    const handle = (event) => {
      if (!enabled) return;

      const alpha = (event.alpha === null) ? 0 : BABYLON.Tools.ToRadians(event.alpha);
      const beta  = (event.beta  === null) ? 0 : BABYLON.Tools.ToRadians(event.beta);
      const gamma = (event.gamma === null) ? 0 : BABYLON.Tools.ToRadians(event.gamma);

      if (first){
        const bDeg = (event.beta  ?? 0);
        const gDeg = (event.gamma ?? 0);
        const isFlatLike = Math.abs(gDeg) < 35;
        const isFlatUp   = isFlatLike && (Math.abs(bDeg) < 35);
        const isFlatDown = isFlatLike && (Math.abs(Math.abs(bDeg) - 180) < 35);
        if (isFlatUp) activationPose = "flatUp";
        else if (isFlatDown) activationPose = "flatDown";
        else activationPose = "upright";
      }

      const orientDeg = (screen.orientation && typeof screen.orientation.angle === "number")
        ? screen.orientation.angle
        : (typeof window.orientation === "number" ? window.orientation : 0);
      const orient = BABYLON.Tools.ToRadians(orientDeg);
      const isPortrait = (Math.abs(orientDeg) % 180) === 0;

      let yaw = alpha, pitch = beta, roll = gamma;

      if (isPortrait){
        yaw = -yaw; pitch = -pitch; roll = -roll;
      }

      if (activationPose === "flatUp" || activationPose === "flatDown"){
        const tmp = yaw; yaw = roll; roll = tmp;
        roll = -roll;
      }

      const qYaw   = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, yaw);
      const qPitch = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, pitch);
      const qRoll  = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, roll);

      qYaw.multiplyToRef(qPitch, currentQ);
      currentQ.multiplyInPlace(qRoll);

      currentQ.multiplyInPlace(qDeviceToWorld);

      const qScreen = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, -orient);
      currentQ.multiplyInPlace(qScreen);

      if (activationPose === "flatDown"){
        const qFlip = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, Math.PI);
        currentQ.multiplyInPlace(qFlip);
      }

      if (first){
        smoothQ.copyFrom(currentQ);
      }else{
        BABYLON.Quaternion.SlerpToRef(smoothQ, currentQ, SMOOTH, smoothQ);
      }

      if (first){
        sensorZeroInv.copyFrom(smoothQ);
        sensorZeroInv.invertInPlace();
        initialCamQuat = cam.rotationQuaternion.clone();
        first = false;
      }

      const deviceRelative = smoothQ.multiply(sensorZeroInv);
      initialCamQuat.multiplyToRef(deviceRelative, cam.rotationQuaternion);
    };

    window.addEventListener("deviceorientation", handle, true);

    return () => {
      enabled = false;
      window.removeEventListener("deviceorientation", handle, true);
    };
  }

  let gyroPerm = false;
  let gyroOn = false;
  let gyroDispose = null;

  function setMotionBtnEnabled(on){
    if (!motionBtn) return;
    motionBtn.setAttribute("aria-disabled", on ? "false" : "true");
  }
  function setMotionBtnState(active){
    if (!motionBtn) return;
    motionBtn.classList.toggle("active", !!active);
    motionBtn.querySelector(".vrLabel").textContent = active ? "VR ON" : "VR OFF";
  }

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0,1,0), scene);
    hemi.intensity = 0.35;

    const key = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4,-1,-0.6), scene);
    key.position = new BABYLON.Vector3(3,6,4);
    key.intensity = 1.1;

    camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, -6, -40), scene);
    camera.attachControl(canvas, true);
    camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
    camera.fov = 0.85;
    camera.setTarget(new BABYLON.Vector3(0, 15, 0));
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);

    res.meshes.forEach(mesh => {
      if (mesh && mesh.getTotalVertices && mesh.getTotalVertices() > 0) {
        mesh.isVisible = true;
        const mat = new BABYLON.PBRMaterial("solidMat_"+mesh.name, scene);
        mat.albedoColor = new BABYLON.Color3(0.02,0.02,0.02);
        mat.metallic = 0.4;
        mat.roughness = 0.35;
        mesh.material = mat;
      }
    });

    const modelRoot = new BABYLON.TransformNode("modelRoot", scene);
    res.meshes.forEach(m => { if (m && !m.parent && m !== modelRoot) m.parent = modelRoot; });

    const ROT_SPEED = 0.06;
    let lastT = performance.now();
    scene.onBeforeRenderObservable.add(() => {
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      modelRoot.rotation.y += ROT_SPEED * dt;
    });

    return scene;
  }

  async function initSystem(){
    const L = startLoader(2600);
    document.body.classList.add("bab3d-on");

    try{
      // Ask gyro permission during INIT gesture (fix for iOS)
      if (isMobile()){
        if (location.protocol !== "https:" && location.hostname !== "localhost"){
          showHint("GYRO REQUIRES HTTPS");
        } else {
          gyroPerm = await requestGyroPermission();
          if (!gyroPerm) showHint("GYRO PERMISSION NOT GRANTED");
        }
      }

      if (!initialized){
        initialized = true;
        await createScene();
      }

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => { if (scene) scene.render(); });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      if (isMobile() && motionBtn){
        setMotionBtnEnabled(true);
      }

      await L.done();
    }catch(err){
      console.error(err);
      await L.fail(err && err.message ? err.message : "Initialization error");
    }
  }

  document.getElementById("startVR").addEventListener("click", initSystem);

  if (motionBtn){
    setMotionBtnState(false);

    motionBtn.addEventListener("click", async () => {
      if (motionBtn.getAttribute("aria-disabled") === "true") return;
      if (!camera) return;

      if (!gyroOn){
        if (!gyroPerm){
          if (location.protocol !== "https:" && location.hostname !== "localhost"){
            showHint("GYRO REQUIRES HTTPS");
            return;
          }
          gyroPerm = await requestGyroPermission();
          if (!gyroPerm){
            showHint("GYRO PERMISSION DENIED");
            return;
          }
        }

        gyroDispose = enableGyroRelative(camera);
        gyroOn = true;
        setMotionBtnState(true);
      } else {
        if (gyroDispose) gyroDispose();
        gyroDispose = null;
        gyroOn = false;
        setMotionBtnState(false);
      }
    });
  }

  window.addEventListener("resize", () => engine.resize());
})();
</script>

</body>
</html>
