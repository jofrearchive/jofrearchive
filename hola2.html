<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — VR FIX</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: #0b0b0b; color: white; font-family: sans-serif; }
    canvas { width:100%; height:100%; touch-action:none; }
    
    /* Botón flotante de VR */
    #vrToggle {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 15px 30px; background: rgba(0,0,0,0.8); border: 1px solid #4ade80;
      color: #4ade80; border-radius: 5px; cursor: pointer; z-index: 100;
      font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
    }
    #vrToggle.active { background: #4ade80; color: black; }

    /* Pantalla de permiso para iOS */
    #iosOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 200; text-align: center; padding: 20px;
    }
  </style>
</head>
<body>

  <button id="vrToggle">Activar VR / Sensores</button>

  <div id="iosOverlay">
    <h2>Acceso a Sensores</h2>
    <p>Haz clic abajo para permitir que el giroscopio controle la cámara.</p>
    <button id="allowBtn" style="padding:15px 30px; margin-top:20px;">Permitir</button>
  </div>

  <canvas id="renderCanvas"></canvas>

<script>
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene, camera;
  let motionEnabled = false;

  const createScene = async function() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.04, 0.04, 0.04, 1);

    // Cámara con Cuaterniones (CRÍTICO para VR)
    camera = new BABYLON.FreeCamera("camera", new BABYLON.Vector3(0, 5, -20), scene);
    camera.rotationQuaternion = new BABYLON.Quaternion(); 
    camera.attachControl(canvas, true);

    // Iluminación ajustada (como pediste)
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.2;
    const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
    dir.intensity = 1.2;
    dir.diffuse = new BABYLON.Color3(1, 0.9, 0.7);

    // Carga del modelo
    await BABYLON.SceneLoader.ImportMeshAsync("", "https://inside.jofrearchive.com/assets/3D/", "c.glb", scene);
    
    return scene;
  };

  // --- LÓGICA DE SENSORES (EL ARREGLO) ---
  const vrBtn = document.getElementById("vrToggle");
  const overlay = document.getElementById("iosOverlay");
  const allowBtn = document.getElementById("allowBtn");

  async function toggleVR() {
    // 1. Pedir permiso si es iOS
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      overlay.style.display = "flex";
      return; // El flujo sigue en allowBtn.onclick
    }
    startMotion();
  }

  allowBtn.onclick = async () => {
    const res = await DeviceOrientationEvent.requestPermission();
    if (res === 'granted') {
      overlay.style.display = "none";
      startMotion();
    }
  };

  function startMotion() {
    if (motionEnabled) {
      window.removeEventListener("deviceorientation", handleOrientation);
      motionEnabled = false;
      vrBtn.classList.remove("active");
      vrBtn.innerText = "VR OFF";
    } else {
      window.addEventListener("deviceorientation", handleOrientation, true);
      motionEnabled = true;
      vrBtn.classList.add("active");
      vrBtn.innerText = "VR ON";
    }
  }

  // Convertir datos del sensor a rotación de Babylon
  function handleOrientation(event) {
    if (!event.alpha) return;

    // Matemáticas de conversión directo de sensor a Cuaternión
    const alpha = BABYLON.Tools.ToRadians(event.alpha); // Z
    const beta = BABYLON.Tools.ToRadians(event.beta);   // X
    const gamma = BABYLON.Tools.ToRadians(event.gamma); // Y

    const q0 = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, alpha);
    const q1 = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, beta);
    const q2 = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, -gamma);

    // Combinar rotaciones
    camera.rotationQuaternion = q0.multiply(q1).multiply(q2);
  }

  vrBtn.onclick = toggleVR;

  createScene().then(scene => {
    engine.runRenderLoop(() => scene.render());
  });

  window.addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
