<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — Cloister Point Cloud</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0b0b;
      --ivory: #e8e2d6;
      --led-green: #4ade80;
    }
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--bg-deep); }
    #renderCanvas { width:100%; height:100%; touch-action:none; filter: contrast(110%) brightness(90%); }

    /* Gate */
    #gate {
      position:absolute; inset:0;
      background: radial-gradient(circle at center, rgba(11,11,11,0.8) 0%, var(--bg-deep) 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; color:var(--ivory); text-align:center;
    }
    .bab3d-on #gate{ display:none; }

    h1 {
      font-family:'EB Garamond', serif;
      font-weight: normal;
      letter-spacing: .2em;
      opacity:.9;
      margin: 0 0 40px 0;
    }

    #startVR {
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(232,226,214,.2);
      color: var(--ivory);
      font-family:'Source Code Pro', monospace;
      text-transform: uppercase;
      letter-spacing: .18em;
      padding: 12px 30px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap: 15px;
      transition: all .3s ease;
    }
    #startVR:hover { border-color: rgba(232,226,214,.5); background: rgba(0,0,0,.8); }
    #led { width:8px; height:8px; background:#222; border-radius:50%; box-shadow: 0 0 0px var(--led-green); transition:.3s; }
    #startVR:hover #led { background: var(--led-green); box-shadow: 0 0 8px var(--led-green); }

    
/* ===== PANEL ===== */
#panel{
  position:fixed;
  left:50%;
  top:50%;
  transform: translate(-50%, -50%);
  width: min(360px, 92vw);
  background: rgba(10,10,10,.65);
  border:1px solid rgba(255,255,255,.18);
  padding: 32px !important; /* Padding restaurado a 32px */
  backdrop-filter: blur(8px);
  z-index:8;
  opacity:0;
  transition: opacity 1.0s ease;
  display:none;
}
#panel.show{ opacity:1; }

#panel #title{
  font-family:'EB Garamond', serif;
  font-size: 28px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ivory);
  margin: 0 0 10px 0;
}
#panel #submeta{
  font-family:'Source Code Pro', monospace;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity:.65;
  line-height: 1.6;
  margin-bottom: 12px;
  color: var(--ivory);
}
#panel .tabs{
  display:flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 8px;
  justify-content: space-between;
  margin-bottom: 6px;
}
#panel .tabLink{
  flex: 1 1 0;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.16);
  color: var(--ivory);
  font-family: 'Source Code Pro', monospace;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 10px 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  white-space: nowrap;
}
#panel .tabLink:hover, #panel .tabLink.active{
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.36);
  opacity: 1;
}

#dynamicDescription{ display:none; }

/* gate vs system */
body.bab3d-ready #panel{ display:none; }
body.bab3d-on #gate{ display:none; }
body.bab3d-on #panel{ display:block; }

/* ===== LOADER ===== */
#loader {
  position:fixed; inset:0;
  background: var(--bg-deep);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
           max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
}
#loader[aria-hidden="true"]{ display:none; }
.loaderBox {
  width:min(760px, 92vw);
  border:1px solid rgba(255,255,255,.16);
  background: rgba(10,10,10,.60);
  padding: clamp(18px, 4vw, 34px);
}
.loaderTitle {
  font-family:'EB Garamond', serif;
  font-size: clamp(16px, 2.6vw, 22px);
  letter-spacing: .24em;
  text-transform: uppercase;
  opacity:.92;
  margin-bottom: 12px;
  color: var(--ivory);
}
.typeLine {
  font-family: 'Source Code Pro', monospace;
  font-size: clamp(12px, 2vw, 14px);
  letter-spacing: .08em;
  opacity:.78;
  line-height:1.65;
  white-space: pre-wrap;
  min-height: 5.2em;
  color: var(--ivory);
}
.barWrap {
  margin-top: 18px;
  height: 10px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.03);
}
.bar {
  height:100%;
  width:0%;
  background: rgba(232,226,214,.58);
  transition: width .08s linear;
}
.percentRow {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top: 12px;
  font-family: 'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: .14em;
  opacity:.65;
  text-transform: uppercase;
  color: var(--ivory);
}
.fadeOut {
  opacity:0;
  pointer-events:none;
  transition: opacity 1.1s ease;
}

@media (max-width: 520px){
  #panel{
    padding: 14px 14px 8px !important;
  }
}


/* VR toggle pill */
#motionBtn{
  position: fixed;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 12;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(0,0,0,.55);
  color: var(--ivory);
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor: pointer;
  backdrop-filter: blur(10px);
  border-radius: 999px;
}
#motionBtn:hover{ border-color: rgba(255,255,255,.30); background: rgba(0,0,0,.70); }

#motionDot{
  width:8px; height:8px; border-radius:50%;
  background:#222;
  box-shadow:none;
  transition: all .25s ease;
}
#motionBtn.active #motionDot{
  background: rgba(74,222,128,.95);
  box-shadow: 0 0 12px rgba(74,222,128,.55);
}

/* Motion permission gate (museum box) */
.motionGate{
  position:fixed; inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index: 60;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(2px);
}
.gateBox{
  width: min(420px, calc(100% - 32px));
  border: 1px solid rgba(232,226,214,0.16);
  background: rgba(15,15,15,0.78);
  backdrop-filter: blur(6px);
  padding: 24px;
}
.gateTitle{
  margin:0;
  font-family: 'EB Garamond', serif;
  font-weight:600;
  font-size: 18px;
  color: #e8e2d6;
}
.gateBody{
  margin: 8px 0 0 0;
  color: rgba(232,226,214,0.75);
  font-size: 14px;
  line-height: 1.45;
}
.gateBtn{
  margin-top: 16px;
  width:100%;
  padding: 10px 12px;
  border: 1px solid rgba(232,226,214,0.16);
  background: rgba(0,0,0,0.18);
  color: rgba(232,226,214,0.75);
  font-family: 'Source Code Pro', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  cursor:pointer;
}
.gateBtn:hover{
  color: #e8e2d6;
  border-color: rgba(232,226,214,0.24);
}

</style>
</head>
<body class="bab3d-ready">

<script>
(function(){
  try{
    if (localStorage.getItem("JA_INIT_DONE_v1")==="1") {
      document.body.classList.remove("bab3d-ready");
      document.body.classList.add("bab3d-on");
    }
  }catch(e){}
})();
</script>

  <div id="gate">
    <h1>EXPERIMENTAL ARCHIVE</h1>
    <button id="startVR">
      <div id="led"></div>
      <span>Initialize System</span>
    </button>
  </div>

  <div id="loader" aria-hidden="true">
    <div class="loaderBox">
      <div class="loaderTitle">INITIALIZING SYSTEM</div>
      <div id="typeLine" class="typeLine">Boot sequence…</div>
      <div class="barWrap"><div id="bar" class="bar"></div></div>
      <div class="percentRow">
        <div id="pct">0%</div>
        <div id="status">loading geometry</div>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <button id="motionBtn" type="button" aria-label="Toggle VR">
  <span id="motionDot" aria-hidden="true"></span>
  <span class="vrLabel">VR OFF</span>
</button>

  <!-- Motion permission gate -->
  <div class="motionGate" id="motionGate" aria-hidden="true">
    <div class="gateBox">
      <p class="gateTitle">Enable Orientation</p>
      <p class="gateBody">
        iOS requires a user gesture to allow gyroscope control.
        Tap to enable device orientation for the immersive screen.
      </p>
      <button class="gateBtn" id="enableMotionBtn" type="button">Touch</button>
    </div>
  </div>

  <div id="panel" aria-hidden="false">
    <div id="title">JOFRE OLIVERAS</div>
    <div id="submeta"></div>
    <div class="tabs" id="tabs"></div>
    <div id="dynamicDescription"></div>
  </div>

<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "ARTIST · EXPLORER · LANDSCAPER",
    "BASED BETWEEN DISCIPLINES",
    "EXPERIMENTAL ARCHIVE"
  ],
  tabs: [
    { key: "STUDIES", ctaHref: "https://inside.jofrearchive.com/studies/" },
    { key: "GENEALOGY", ctaHref: "https://inside.jofrearchive.com/genealogy/" },
    { key: "ARTIFACTS", ctaHref: "https://jofrearchive.com/artifacts" }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  titleEl.textContent = PANEL_CONTENT.title;
  submetaEl.innerHTML = PANEL_CONTENT.submeta.map(escapeHtml).join("<br>");

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key;
    b.addEventListener("click", ()=>{
      if (t.ctaHref) window.location.href = t.ctaHref;
    });
    tabsEl.appendChild(b);
  });

  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();
</script>

<script>
(function(){

  // iOS motion permission gate (overlay)
const motionGate = document.getElementById('motionGate');
const enableMotionBtn = document.getElementById('enableMotionBtn');
  // Optional hook executed inside the iOS user-gesture that grants permission
  window.__JA_onMotionGranted = null;

function requestMotionPermissionIfNeeded(){
  const DOE = window.DeviceOrientationEvent;
  const DME = window.DeviceMotionEvent;

  const needsAsk = (E) => (typeof E !== "undefined" && typeof E.requestPermission === "function");

  if (needsAsk(DOE) || needsAsk(DME)){
    if (motionGate){
      motionGate.style.display = 'flex';
      motionGate.setAttribute('aria-hidden','false');
    }

    return new Promise((resolve) => {
      const clickTarget = enableMotionBtn || motionGate;
      if (!clickTarget){
        window.__JA_onMotionGranted = null;
                 __DBG.perm = "error"; __DBG.note = "permission request failed"; dbgRender(); resolve(false);
        return;
      }

      clickTarget.onclick = async () => {
        try{
          const r1 = needsAsk(DOE) ? await DOE.requestPermission() : "granted";
          const r2 = needsAsk(DME) ? await DME.requestPermission() : "granted";
          if (motionGate){
            motionGate.style.display = 'none';
            motionGate.setAttribute('aria-hidden','true');
          }
          const granted = (r1 === "granted" && r2 === "granted");
// Execute optional hook while still inside the user gesture
try{ if (granted && typeof window.__JA_onMotionGranted === "function") window.__JA_onMotionGranted(); }catch(e){}
// clear hook
window.__JA_onMotionGranted = null;
 __DBG.perm = granted ? "granted" : "denied"; dbgRender(); resolve(granted);
        }catch(err){
          if (motionGate){
            motionGate.style.display = 'none';
            motionGate.setAttribute('aria-hidden','true');
          }
           __DBG.perm = "error"; __DBG.note = "permission request failed"; dbgRender(); resolve(false);
        }
      };
    });
  }

  return Promise.resolve(true);
}

async function requestGyroPermission(){
  return await requestMotionPermissionIfNeeded();
}

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);

// --- DEBUG HUD (mobile) ---
const debugHud = document.getElementById("debugHud");
const __DBG = {
  mobile: false,
  https: (location.protocol === "https:" || location.hostname === "localhost"),
  inIframe: (window.top !== window),
  perm: "unknown",
  events: 0,
  last: {a:null,b:null,g:null,abs:null},
  note: ""
};

function dbgRender(){
  if (!debugHud) return;
  if (!__DBG.mobile) return;
  debugHud.style.display = "block";
  debugHud.textContent =
    "JA VR DEBUG\n" +
    "mobile: " + __DBG.mobile + "\n" +
    "https: " + __DBG.https + "\n" +
    "inIframe: " + __DBG.inIframe + "\n" +
    "permission: " + __DBG.perm + "\n" +
    "deviceorientation events: " + __DBG.events + "\n" +
    "alpha: " + (__DBG.last.a ?? "-") + "  beta: " + (__DBG.last.b ?? "-") + "  gamma: " + (__DBG.last.g ?? "-") + "\n" +
    (__DBG.note ? ("note: " + __DBG.note + "\n") : "");
}

// raw deviceorientation listener to verify sensor data actually arrives
window.addEventListener("deviceorientation", (e)=>{
  __DBG.events++;
  __DBG.last.a = (e.alpha!=null ? e.alpha.toFixed(1) : null);
  __DBG.last.b = (e.beta!=null ? e.beta.toFixed(1) : null);
  __DBG.last.g = (e.gamma!=null ? e.gamma.toFixed(1) : null);
  __DBG.last.abs = e.absolute;
}, true);
  }

  __DBG.mobile = isMobile();
  dbgRender();

  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;

  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.35;

    const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), scene);
    keyLight.position = new BABYLON.Vector3(3, 6, 4);
    keyLight.intensity = 1.1;

    // CÁMARA: Posición física baja (Y=-10) para ver el claustro desde abajo hacia arriba
    const camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, -10, 0), scene);
    camera.attachControl(canvas, true);
    

    // Keep framing consistent across aspect ratios
    camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
    camera.fov = 0.85;
    // Objetivo de mirada: Vertical hacia el centro superior (Y=50)
    camera.setTarget(new BABYLON.Vector3(0, 50, 0));
    
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
// VR toggle (gyro) — starts in the SAME view, then adds motion without jumping
const motionBtn = document.getElementById("motionBtn");
if (isMobile() && motionBtn){
  motionBtn.style.display = "flex";

  let motionEnabled = false;
  let orientationInput = null;
  let baseQuat = null;
  let correctionQuat = null;

  scene.onBeforeRenderObservable.add(() => {
    if (!motionEnabled) return;
    if (!camera.rotationQuaternion) return;

    // Compute correction once after first sensor update
    if (!correctionQuat && baseQuat){
      const invSensor = camera.rotationQuaternion.clone();
      invSensor.invert();
      correctionQuat = baseQuat.multiply(invSensor); // base * inverse(sensor)
    }

    if (correctionQuat){
      camera.rotationQuaternion = correctionQuat.multiply(camera.rotationQuaternion);
      camera.rotation.set(0,0,0);
    }
  });

  motionBtn.addEventListener("click", async () => {
    if (!motionEnabled){
  // Prepare activation to run INSIDE the permission gesture (iOS requirement in some cases)
  window.__JA_onMotionGranted = () => {
    // Capture current view as baseline (prevents jump)
  };

  const ok = await requestGyroPermission();
  if (!ok){ __DBG.note="permission not granted"; dbgRender(); return; } __DBG.note="gyro input added (waiting for events)"; dbgRender();
      motionEnabled = true;
      motionBtn.classList.add("active");
      const label = motionBtn.querySelector(".vrLabel");
      if (label) label.textContent = "VR ON";
    } else {
      // Turn off motion: remove input and keep current view
      if (orientationInput){
        camera.inputs.remove(orientationInput);
        orientationInput = null;
      }
      correctionQuat = null;
      motionEnabled = false;
      motionBtn.classList.remove("active");
      const label = motionBtn.querySelector(".vrLabel");
      if (label) label.textContent = "VR OFF"; __DBG.note="gyro input removed"; dbgRender();
    }
  });
}
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);
    res.meshes.forEach(mesh => {
      if (mesh && mesh.getTotalVertices() > 0) {
        mesh.isVisible = true;
        const solidMat = new BABYLON.PBRMaterial("solidMat_"+mesh.name, scene);
        solidMat.albedoColor = new BABYLON.Color3(0.02, 0.02, 0.02);
        solidMat.metallic = 0.4;
        solidMat.roughness = 0.35;
        mesh.material = solidMat;
      }
    });

    try{ await scene.createDefaultXRExperienceAsync({ disableTeleportation: true }); }catch(e){}

    return scene;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));

      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";

      loader.classList.add("fadeOut");
      setTimeout(()=>{
        loader.setAttribute("aria-hidden","true");
      }, 1100);
    }

    function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
    }

    return {done, fail};
  }

  let loopStarted = false;
  let initializedOnce = false;

  async function initSystem(opts){
    const { withLoader } = opts || {};
    const L = withLoader ? startLoader(2600) : null;

    document.body.classList.remove("bab3d-ready");
    document.body.classList.add("bab3d-on");

    try{
      if (!initializedOnce){
        initializedOnce = true;
        await createScene();
      }

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => { if (scene) scene.render(); });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      if (L) await L.done();
    }catch(err){
      console.error(err);
    }
  }

  document.getElementById("startVR").addEventListener("click", async () => {
    await requestGyroPermission();
    await initSystem({ withLoader: true });
  });

  if (localStorage.getItem("JA_INIT_DONE_v1") === "1") {
    requestAnimationFrame(() => { initSystem({ withLoader: false }); });
  }

  window.addEventListener("resize", () => engine.resize());
})();
</script>
