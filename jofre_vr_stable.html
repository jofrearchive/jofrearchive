<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JOFRE ARCHIVE — Cloister VR Stable</title>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --ivory:#e8e2d6;
      --line:rgba(255,255,255,.16);
      --panel:rgba(10,10,10,.62);
      --green:#4ade80;
    }
    html,body{margin:0;height:100%;width:100%;background:var(--bg);overflow:hidden}
    #renderCanvas{width:100%;height:100%;touch-action:none;display:block;filter:contrast(110%) brightness(90%);}

    /* Gate */
    #gate{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at center, rgba(11,11,11,.75) 0%, var(--bg) 65%);
      z-index:20;
      color:var(--ivory);
      text-align:center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .gateBox{
      width:min(740px, 92vw);
      background:var(--panel);
      border:1px solid var(--line);
      backdrop-filter: blur(10px);
      padding: clamp(18px, 4vw, 32px);
    }
    .gateTitle{
      font-family:'EB Garamond', serif;
      letter-spacing:.24em;
      text-transform:uppercase;
      font-weight:normal;
      opacity:.92;
      margin:0 0 12px 0;
      font-size: clamp(18px, 2.6vw, 26px);
    }
    .gateBody{
      font-family:'Source Code Pro', monospace;
      letter-spacing:.08em;
      opacity:.75;
      line-height:1.6;
      margin:0 0 18px 0;
      font-size: clamp(12px, 2vw, 14px);
    }
    #startBtn{
      display:inline-flex; align-items:center; gap:12px;
      padding: 12px 18px;
      border:1px solid rgba(232,226,214,.22);
      background:rgba(0,0,0,.38);
      color:var(--ivory);
      cursor:pointer;
      font-family:'Source Code Pro', monospace;
      letter-spacing:.16em;
      text-transform:uppercase;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      user-select:none;
    }
    #startBtn:hover{border-color:rgba(232,226,214,.5); background:rgba(0,0,0,.55); transform: translateY(-1px);}
    #led{width:8px;height:8px;border-radius:50%;background:#222;box-shadow:none;transition:.25s}
    #startBtn:hover #led{background:var(--green); box-shadow:0 0 10px rgba(74,222,128,.85);}

    /* Status strip */
    #statusStrip{
      position:fixed;
      left:50%;
      top: max(12px, env(safe-area-inset-top));
      transform: translateX(-50%);
      z-index:15;
      display:none;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.38);
      color:rgba(232,226,214,.72);
      font-family:'Source Code Pro', monospace;
      font-size: 12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    #statusStrip.show{display:flex;}
    #statusDot{width:8px;height:8px;border-radius:50%;background:rgba(232,226,214,.25);}

    /* VR Toggle */
    #vrBtn{
      position:fixed;
      left:50%;
      bottom:max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index:16;
      display:none;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.45);
      color:rgba(232,226,214,.55);
      font-family:'Source Code Pro', monospace;
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      cursor:pointer;
      backdrop-filter: blur(10px);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #vrDot{width:8px;height:8px;border-radius:50%;background:#222;box-shadow:none;transition:.25s}
    #vrBtn.active{color:rgba(232,226,214,.85); border-color:rgba(255,255,255,.28); background:rgba(0,0,0,.58);}
    #vrBtn.active #vrDot{background:rgba(74,222,128,.95); box-shadow: 0 0 12px rgba(74,222,128,.85);}

    /* Error */
    #errorBox{
      position:fixed; left:50%; top:50%;
      transform: translate(-50%, -50%);
      z-index:30;
      display:none;
      width:min(760px, 92vw);
      border:1px solid rgba(255,120,120,.35);
      background: rgba(20,0,0,.45);
      color: var(--ivory);
      padding: clamp(14px, 3vw, 20px);
      backdrop-filter: blur(10px);
      font-family:'Source Code Pro', monospace;
      letter-spacing:.06em;
      line-height:1.5;
      font-size: 12px;
      white-space: pre-wrap;
    }
    #errorBox.show{display:block;}
  </style>
</head>

<body>
  <canvas id="renderCanvas"></canvas>

  <div id="gate">
    <div class="gateBox">
      <div class="gateTitle">EXPERIMENTAL ARCHIVE</div>
      <div class="gateBody">
        Inicializa el sistema. En móvil podrás activar VR (giroscopio) con un botón inferior.
      </div>
      <button id="startBtn" type="button">
        <span id="led" aria-hidden="true"></span>
        <span>Initialize System</span>
      </button>
    </div>
  </div>

  <div id="statusStrip" aria-live="polite">
    <span id="statusDot" aria-hidden="true"></span>
    <span id="statusText">loading…</span>
  </div>

  <button id="vrBtn" type="button" aria-label="Toggle VR">
    <span id="vrDot" aria-hidden="true"></span>
    <span id="vrLabel">VR OFF</span>
  </button>

  <div id="errorBox"></div>

<script>
(() => {
  const canvas = document.getElementById("renderCanvas");
  const gate = document.getElementById("gate");
  const startBtn = document.getElementById("startBtn");
  const statusStrip = document.getElementById("statusStrip");
  const statusText = document.getElementById("statusText");
  const vrBtn = document.getElementById("vrBtn");
  const vrLabel = document.getElementById("vrLabel");
  const errorBox = document.getElementById("errorBox");

  const MODEL_URL = "https://inside.jofrearchive.com/assets/3D/c.glb"; // mismo que tu archivo
  const ROT_SPEED = 0.06; // rad/s

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
  }

  function showStatus(msg){
    statusText.textContent = msg;
    statusStrip.classList.add("show");
  }
  function hideStatus(){
    statusStrip.classList.remove("show");
  }
  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }

  async function requestGyroPermission(){
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return false;
    if (typeof DOE.requestPermission === "function") {
      try {
        const res = await DOE.requestPermission();
        return res === "granted";
      } catch (e) {
        return false;
      }
    }
    return true;
  }

  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  let scene = null;
  let camera = null;
  let gyroRig = null;
  let modelRoot = null;

  // VR state (DELTA system like your working index.html)
  let vrEnabled = false;
  let rigBaseQuat = null;
  let sensorQ0Inv = null;
  let onDeviceOrientation = null;

  // If you want a fixed 180° correction, keep it here:
  const zFix = BABYLON.Quaternion.FromEulerAngles(0, 0, Math.PI);

  function detachInputs(){
    if (camera) camera.detachControl(canvas);
  }
  function attachInputs(){
    if (camera) camera.attachControl(canvas, true);
  }

  function buildFallbackGeometry(s){
    // Simple point cloud-ish fallback so it never stays "empty" if GLB fails
    const points = [];
    const colors = [];
    const count = 12000;
    for (let i=0;i<count;i++){
      const r = 22 * Math.cbrt(Math.random());
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2*Math.random()-1);
      const x = r*Math.sin(ph)*Math.cos(th);
      const y = r*Math.cos(ph) + 10;
      const z = r*Math.sin(ph)*Math.sin(th);
      points.push(new BABYLON.Vector3(x,y,z));
      colors.push(new BABYLON.Color4(0.92,0.89,0.84,0.12));
    }
    const pcs = new BABYLON.PointsCloudSystem("pcs", 1, s);
    pcs.addPoints(points.length, (p,i)=>{ p.position = points[i]; p.color = colors[i]; });
    pcs.buildMeshAsync().then(m=>{
      m.alwaysSelectAsActiveMesh = true;
    });
    return pcs;
  }

  async function createScene(){
    const s = new BABYLON.Scene(engine);
    s.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    // Lights (simple and stable)
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), s);
    hemi.intensity = 0.22;

    const key = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), s);
    key.position = new BABYLON.Vector3(3, 6, 4);
    key.intensity = 1.1;

    // Camera + rig
    camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0, -6, -40), s);
    camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
    camera.fov = 0.85;
    camera.minZ = 0.01;
    camera.maxZ = 8000;

    gyroRig = new BABYLON.TransformNode("gyroRig", s);
    gyroRig.rotationQuaternion = BABYLON.Quaternion.Identity();
    camera.parent = gyroRig;

    // Disable keyboard input
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
    attachInputs();

    // Load model
    showStatus("loading geometry");
    modelRoot = new BABYLON.TransformNode("modelRoot", s);

    let imported = null;
    try{
      imported = await BABYLON.SceneLoader.ImportMeshAsync("", "", MODEL_URL, s);
    }catch(e){
      // GLB failed — provide fallback geometry
      buildFallbackGeometry(s);
      showError(
        "No se pudo cargar el GLB remoto.\n" +
        "Esto suele ser CORS/403/redirect.\n\n" +
        "La escena sigue viva con un fallback.\n\n" +
        "Detalle:\n" + (e && e.message ? e.message : String(e))
      );
    }

    if (imported && imported.meshes){
      // Parent top-level meshes to modelRoot
      imported.meshes.forEach(m=>{
        if (!m) return;
        if (m === modelRoot) return;
        if (!m.parent) m.parent = modelRoot;
      });

      // Materialize meshes so they aren't black (simple PBR)
      imported.meshes.forEach(mesh => {
        if (!mesh || !mesh.getTotalVertices || mesh.getTotalVertices() <= 0) return;
        const mat = new BABYLON.PBRMaterial("mat_"+mesh.name, s);
        mat.albedoColor = new BABYLON.Color3(0.02,0.02,0.02);
        mat.metallic = 0.35;
        mat.roughness = 0.42;
        mesh.material = mat;
      });

      // Place camera after we know bounds (stable base pose BEFORE any VR calibration)
      showStatus("framing camera");
      try{
        // Compute bounds (world)
        let min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
        let max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);

        imported.meshes.forEach(m=>{
          if (!m || !m.getBoundingInfo) return;
          const bi = m.getBoundingInfo();
          if (!bi || !bi.boundingBox) return;
          const bmin = bi.boundingBox.minimumWorld;
          const bmax = bi.boundingBox.maximumWorld;
          min.x = Math.min(min.x, bmin.x); min.y = Math.min(min.y, bmin.y); min.z = Math.min(min.z, bmin.z);
          max.x = Math.max(max.x, bmax.x); max.y = Math.max(max.y, bmax.y); max.z = Math.max(max.z, bmax.z);
        });

        const size = max.subtract(min);

        // Use bbox center on XZ; lift target upward
        const cx = (min.x + max.x) * 0.5;
        const cz = (min.z + max.z) * 0.5;
        const floorY = min.y;

        const eyeY = floorY + Math.max(size.y * 0.10, 1.6);
        camera.position.set(cx, eyeY, cz);

        const targetY = (min.y + max.y) * 0.5 + size.y * 0.42;
        camera.setTarget(new BABYLON.Vector3(cx, targetY, cz + 0.0));

        // Adjust near/far
        const radius = Math.max(size.x, size.z) * 0.5;
        camera.minZ = Math.max(0.01, radius / 1500);
        camera.maxZ = Math.max(1000, radius * 60);

      }catch(e){
        // keep default pose if bounds fail
      }
    }

    // Turntable rotation (stable)
    let lastT = performance.now();
    s.onBeforeRenderObservable.add(() => {
      if (!modelRoot) return;
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      modelRoot.rotation.y += ROT_SPEED * dt;
    });

    // Mobile VR toggle visible after init
    if (isMobile()){
      vrBtn.style.display = "flex";
    }

    hideStatus();
    return s;
  }

  function enableVR(){
    // base orientation = current rig (do NOT reset identity)
    if (!gyroRig.rotationQuaternion) gyroRig.rotationQuaternion = BABYLON.Quaternion.Identity();
    rigBaseQuat = gyroRig.rotationQuaternion.clone();
    sensorQ0Inv = null;

    // stop touch/mouse inputs writing rotations
    detachInputs();

    // clean previous
    if (onDeviceOrientation){
      window.removeEventListener("deviceorientation", onDeviceOrientation);
      onDeviceOrientation = null;
    }

    onDeviceOrientation = (e) => {
      if (!vrEnabled) return;

      // NOTE: we intentionally kill roll (gamma) to avoid "barca"
      const alpha = BABYLON.Tools.ToRadians(e.alpha || 0);
      const beta  = BABYLON.Tools.ToRadians(e.beta  || 0);

      const q = new BABYLON.Quaternion();
      BABYLON.Quaternion.RotationYawPitchRollToRef(
        -alpha,
        beta,
        0,
        q
      );
      q.normalize();

      if (!sensorQ0Inv){
        sensorQ0Inv = q.clone();
        sensorQ0Inv.conjugate(); // inv(q0)
        return;
      }

      // delta = inv(q0) * q
      const delta = sensorQ0Inv.multiply(q);
      delta.normalize();

      // final = base * (zFix * delta)  (keeps desktop alignment)
      const final = rigBaseQuat.multiply(zFix.multiply(delta));
      final.normalize();
      gyroRig.rotationQuaternion = final;
    };

    window.addEventListener("deviceorientation", onDeviceOrientation, { passive:true });

    vrEnabled = true;
    vrBtn.classList.add("active");
    vrLabel.textContent = "VR ON";
  }

  function disableVR(){
    vrEnabled = false;

    if (onDeviceOrientation){
      window.removeEventListener("deviceorientation", onDeviceOrientation);
      onDeviceOrientation = null;
    }

    // return to base orientation exactly
    if (rigBaseQuat){
      gyroRig.rotationQuaternion = rigBaseQuat.clone();
    }

    rigBaseQuat = null;
    sensorQ0Inv = null;

    // restore inputs
    attachInputs();

    vrBtn.classList.remove("active");
    vrLabel.textContent = "VR OFF";
  }

  async function toggleVR(){
    if (!scene || !camera || !gyroRig) return;

    if (!vrEnabled){
      const ok = await requestGyroPermission();
      if (!ok) return;
      enableVR();
    }else{
      disableVR();
    }
  }

  let started = false;

  async function start(){
    if (started) return;
    started = true;

    showStatus("initializing");
    try{
      scene = await createScene();
      engine.runRenderLoop(() => { if (scene) scene.render(); });
      gate.style.display = "none";
      hideStatus();
    }catch(e){
      showError("Init error:\n" + (e && e.message ? e.message : String(e)));
    }
  }

  startBtn.addEventListener("click", start);
  vrBtn.addEventListener("click", toggleVR);

  window.addEventListener("resize", () => engine.resize());
})();
</script>
</body>
</html>
