<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studies Drawer — VR (A-Frame)</title>

  <!-- A-Frame + Troika text -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#0b0b0b; }
    .hint {
      position:fixed; left:12px; bottom:12px;
      font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: rgba(232,226,214,0.75);
      background: rgba(15,15,15,0.55);
      border: 1px solid rgba(232,226,214,0.16);
      padding: 10px 12px;
      border-radius: 10px;
      z-index: 10;
      user-select:none;
    }
  </style>
</head>
<body>
  <div class="hint">
    Scroll / rueda: navegar · Click: seleccionar · VR: stick arriba/abajo
  </div>

  <a-scene
    background="color: #0b0b0b"
    renderer="colorManagement: true; physicallyCorrectLights: false;"
    xr-mode-ui="enabled: true"
    webxr="optionalFeatures: local-floor, bounded-floor;"
  >
    <a-assets>
      <!-- Fuentes (woff; troika-text NO usa woff2) -->
      <a-asset-item id="font-serif" src="https://raw.githubusercontent.com/chrstphrknwtn/eb-garamond/master/eb-garamond-regular.woff"></a-asset-item>
      <a-asset-item id="font-mono"  src="https://raw.githubusercontent.com/nteract/assets/master/fonts/source-code-pro/WOFF/OTF/SourceCodePro-Regular.otf.woff"></a-asset-item>
    </a-assets>

    <!-- Luz mínima (interfaz “fría”, sin espectáculo) -->
    <a-entity light="type: ambient; intensity: 0.85"></a-entity>

    <!-- Rig / cámara (vista ligeramente “desde arriba”, como tu drawer) -->
    <a-entity id="rig" position="0 1.55 0" rotation="-18 0 0">
      <a-camera
        id="cam"
        position="0 0 0"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false"
        near="0.01"
        far="80"
      ></a-camera>

      <!-- Ray para desktop + VR -->
      <a-entity
        raycaster="objects: .cardHit"
        cursor="rayOrigin: mouse; fuse: false"
      ></a-entity>

      <a-entity
        laser-controls="hand: right"
        raycaster="objects: .cardHit"
      ></a-entity>
    </a-entity>

    <!-- Contenedor de tarjetas (tu “rig” CSS convertido a VR) -->
    <a-entity id="drawerRoot" drawer-ui></a-entity>

    <script>
      // === Diseño (extraído del original) ===
      const THEME = {
        bg: "#0b0b0b",
        ink: "#e8e2d6",
        ink2: "rgba(232,226,214,0.75)",
        ink3: "rgba(232,226,214,0.6)",
        panel: "rgba(15,15,15,0.78)",
        border: "rgba(232,226,214,0.16)",
        gridline: "rgba(232,226,214,0.04)"
      };

      // === Demo projects (mismos 7 del archivo) ===
      const ALL = [
        { id:"S-001", title:"Mycelium Sculpture Series I", category:"BioSystems", year:2024 },
        { id:"S-002", title:"Transparent Solar Leaf Panels", category:"BioSystems", year:2024 },
        { id:"S-003", title:"Interspecies Archaeology / Living Relics", category:"BioSystems", year:2024 },
        { id:"S-004", title:"Autonomous Lamp / Bioenergy Relay", category:"BioSystems", year:2024 },
        { id:"S-005", title:"Carnival of Souls / Social Critique", category:"Culture", year:2024 },
        { id:"S-006", title:"Made in Earth Seal / Authenticity Mark", category:"Design", year:2024 },
        { id:"S-007", title:"Landscape Archive / Field Fragments", category:"Landscape", year:2024 }
      ];

      // ============ A-Frame component ============
      AFRAME.registerComponent("drawer-ui", {
        init() {
          this.dataList = ALL.slice();
          this.activeIndex = 0;

          // Mantén la lógica original de visibilidad (windowSize = 2 => 5 visibles)
          this.windowSize = 2;

          // Conversión de px a metros.
          // Fórmula se mantiene: z = -abs * 320  (solo escalada)
          this.PX_TO_M = 0.001; // 1px = 1mm en mundo VR

          // Geometría de card (sensación “panel archivístico”)
          this.cardW = 1.05;
          this.cardH = 0.52;

          this.pool = [];
          this.buildPool(5);

          this.attachInputs();
          this.render();
        },

        buildPool(n) {
          for (let i = 0; i < n; i++) {
            const card = document.createElement("a-entity");
            card.setAttribute("visible", "false");

            // Background panel
            const bg = document.createElement("a-plane");
            bg.setAttribute("width", this.cardW);
            bg.setAttribute("height", this.cardH);
            bg.setAttribute("material", `shader: flat; color: ${THEME.panel}; transparent: true; opacity: 1; side: double;`);
            bg.setAttribute("position", "0 0 0");
            card.appendChild(bg);

            // Border (4 líneas finas)
            const border = document.createElement("a-entity");
            const w = this.cardW, h = this.cardH;
            const z = 0.001;
            const col = THEME.border;

            const mkLine = (x1,y1,x2,y2) => {
              const ln = document.createElement("a-entity");
              ln.setAttribute("line", `start: ${x1} ${y1} ${z}; end: ${x2} ${y2} ${z}; color: ${col}; opacity: 1;`);
              return ln;
            };
            border.appendChild(mkLine(-w/2, -h/2,  w/2, -h/2));
            border.appendChild(mkLine(-w/2,  h/2,  w/2,  h/2));
            border.appendChild(mkLine(-w/2, -h/2, -w/2,  h/2));
            border.appendChild(mkLine( w/2, -h/2,  w/2,  h/2));
            card.appendChild(border);

            // Hit area
            const hit = document.createElement("a-plane");
            hit.classList.add("cardHit");
            hit.setAttribute("width", this.cardW);
            hit.setAttribute("height", this.cardH);
            hit.setAttribute("material", "shader: flat; color: #000; transparent: true; opacity: 0.0001; side: double;");
            hit.setAttribute("position", `0 0 ${0.002}`);
            card.appendChild(hit);

            // Title (serif)
            const title = document.createElement("a-troika-text");
            title.setAttribute("font", "#font-serif");
            title.setAttribute("color", THEME.ink);
            title.setAttribute("font-size", "0.065");
            title.setAttribute("max-width", (this.cardW - 0.14).toFixed(2));
            title.setAttribute("anchor", "left");
            title.setAttribute("baseline", "top");
            title.setAttribute("position", `${(-this.cardW/2 + 0.07).toFixed(3)} ${(this.cardH/2 - 0.08).toFixed(3)} 0.003`);
            title.setAttribute("value", "");
            card.appendChild(title);

            // Meta (mono)
            const meta = document.createElement("a-troika-text");
            meta.setAttribute("font", "#font-mono");
            meta.setAttribute("color", THEME.ink2);
            meta.setAttribute("font-size", "0.032");
            meta.setAttribute("max-width", (this.cardW - 0.14).toFixed(2));
            meta.setAttribute("anchor", "left");
            meta.setAttribute("baseline", "top");
            meta.setAttribute("position", `${(-this.cardW/2 + 0.07).toFixed(3)} ${(this.cardH/2 - 0.18).toFixed(3)} 0.003`);
            meta.setAttribute("value", "");
            card.appendChild(meta);

            // Footer hint (mono, tenue)
            const hint = document.createElement("a-troika-text");
            hint.setAttribute("font", "#font-mono");
            hint.setAttribute("color", THEME.ink3);
            hint.setAttribute("font-size", "0.028");
            hint.setAttribute("anchor", "left");
            hint.setAttribute("baseline", "bottom");
            hint.setAttribute("position", `${(-this.cardW/2 + 0.07).toFixed(3)} ${(-this.cardH/2 + 0.06).toFixed(3)} 0.003`);
            hint.setAttribute("value", "OPEN / SELECT");
            card.appendChild(hint);

            // Guardar refs
            card.__refs = { title, meta, hit, bg };
            this.el.appendChild(card);
            this.pool.push(card);
          }
        },

        attachInputs() {
          // Wheel (desktop)
          window.addEventListener("wheel", (e) => {
            if (Math.abs(e.deltaY) < 2) return;
            this.step(e.deltaY > 0 ? 1 : -1);
          }, { passive: true });

          // Click selection
          this.el.addEventListener("click", (ev) => {
            const card = ev.target && ev.target.closest && ev.target.closest("a-entity");
            if (!card || !card.__index && card.__index !== 0) return;
            this.activeIndex = card.__index;
            this.render(true);
          });

          // VR thumbstick (right hand)
          const rig = document.querySelector("#rig");
          rig.addEventListener("thumbstickmoved", (e) => {
            const y = e.detail && e.detail.y;
            if (y == null) return;
            if (y > 0.75) this.step(-1);
            if (y < -0.75) this.step(1);
          });

          // Teclas (fallback)
          window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown" || e.key === "PageDown") this.step(1);
            if (e.key === "ArrowUp"   || e.key === "PageUp")   this.step(-1);
          });
        },

        step(dir) {
          const n = this.dataList.length;
          this.activeIndex = (this.activeIndex + dir + n) % n;
          this.render();
        },

        render(force=false) {
          const list = this.dataList;
          const n = list.length;
          if (!n) return;

          const start = Math.max(0, this.activeIndex - this.windowSize);
          const end   = Math.min(n - 1, this.activeIndex + this.windowSize);

          // Oculta todo
          for (const c of this.pool) c.setAttribute("visible", "false");

          // Rellena visibles (máx 5)
          let poolI = 0;
          for (let i = start; i <= end; i++) {
            const item = list[i];
            const card = this.pool[poolI++];
            if (!card) break;

            const offset = i - this.activeIndex;
            const abs = Math.abs(offset);

            // === LÓGICA ORIGINAL (misma matemática) ===
            const x_px = 0;
            const y_px = abs * 26;
            const z_px = -abs * 320;     // << mantener estrictamente
            const s    = 1 - abs * 0.025;

            // Convertir a metros sin cambiar la fórmula
            const x = x_px * this.PX_TO_M;
            const y = y_px * this.PX_TO_M;
            const z = z_px * this.PX_TO_M;

            // Posición base: frente a cámara, centrado
            const baseY = 1.05;      // altura del “drawer”
            const baseZ = -1.15;     // distancia base

            card.setAttribute("visible", "true");
            card.__index = i;

            // Layout “drawer”
            card.object3D.position.set(x, baseY + y, baseZ + z);
            card.object3D.rotation.set(0, 0, 0);
            card.object3D.scale.set(s, s, s);

            // “Profundidad” visual: brillo/opacity como el original
            const bright = abs ? (0.92 - abs * 0.04) : 1.0;
            const op = abs > 9 ? 0 : (1 - abs * 0.055);
            card.__refs.bg.setAttribute("material",
              `shader: flat; color: ${THEME.panel}; transparent: true; opacity: ${Math.max(0, Math.min(1, op)).toFixed(3)}; side: double;`
            );
            card.object3D.traverse((o) => {
              if (o.material && o.material.color) {
                // no tocamos colores (jerarquía fija), sólo atenuación global
                o.material.opacity = o.material.opacity; // keep
              }
            });

            // Contenido
            card.__refs.title.setAttribute("value", item.title);
            card.__refs.meta.setAttribute("value", `${item.id}  ·  ${item.category}  ·  ${item.year}`);

            // Z-order: el activo delante
            card.object3D.renderOrder = 100 - abs;
          }
        }
      });
    </script>
  </a-scene>
</body>
</html>
