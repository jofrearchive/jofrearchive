<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Studies — Project Wall</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&amp;family=Source+Code+Pro:wght@300;500&amp;display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --muted:rgba(232,226,214,.72);
  --line:rgba(232,226,214,.16);
  --line2:rgba(232,226,214,.12);
  --mono:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif:"EB Garamond", serif;
  --shadow:0 40px 90px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden; /* fixed columns */
}

/* Vitrine background */
#vitrine-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.42)),
    #0b0b0b;
}
#vitrine-bg::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.010) 0px, rgba(255,255,255,.010) 1px, transparent 2px, transparent 5px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.007) 0px, rgba(255,255,255,.007) 1px, transparent 2px, transparent 9px);
  opacity:.18; mix-blend-mode:overlay;
}
#glass{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(900px 650px at 60% 25%, rgba(255,255,255,.06), transparent 55%);
  opacity:.22; mix-blend-mode:screen;
}
body::after{
  content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.88) 100%);
  opacity:.55;
}

/* Header */
.siteHeader{
  position:fixed; top:0; left:0; right:0;
  height: calc(96px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  z-index: 1000;
  pointer-events:none;
}
.siteHeader a{pointer-events:auto; text-decoration:none}
.siteHeader img{height:56px; width:auto; display:block; opacity:.92}
.siteHeader img:hover{opacity:1}

/* Fixed viewport layout */
.page{
  position:relative;
  z-index:10;
  height:100vh;
  padding: calc(110px + env(safe-area-inset-top)) clamp(10px, 2.2vw, 22px) clamp(10px, 2.2vw, 22px);
}
.wrap{
  width:min(1320px, 100%);
  height: calc(100vh - (110px + env(safe-area-inset-top)) - clamp(10px, 2.2vw, 22px));
  margin:0 auto;
  display:grid;
  grid-template-columns: 260px 1fr 420px;
  gap:14px;
  align-items:stretch;
}

/* Panels */
.panel{
  border:1px solid var(--line2);
  background: linear-gradient(180deg, rgba(10,10,10,.86), rgba(0,0,0,.46));
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel::before{
  content:"";
  position:absolute; inset:10px;
  pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) left top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 1px 22px no-repeat;
  opacity:.85;
  z-index:0;
}
.panelHeader{
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.92);
  position:relative;
  z-index:2;
}
.kicker{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  opacity:.68;
  margin-bottom:6px;
}
.titleRow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.h1{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:16px;
}
.pill{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.14);
  background: rgba(255,255,255,.03);
  opacity:.9;
}
.panelBody{
  padding:14px 16px 16px;
  position:relative;
  z-index:2;
  min-height:0;
  flex:1;
}
.hr{height:1px;background:rgba(232,226,214,.12);margin:12px 0}

/* Controls */
.input{
  width:100%;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  color:var(--ink);
  padding:10px 10px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.10em;
  font-size:11px;
  outline:none;
}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ink);
  background: rgba(255,255,255,.03);
  border:1px solid rgba(232,226,214,.22);
  padding:10px 12px;
  cursor:pointer;
  opacity:.92;
  transition:all .2s ease;
}
.btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.btn.active{
  background: rgba(255,255,255,.08);
  border-color: rgba(232,226,214,.40);
}
.smallHint{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.62;
}

/* Internal scrolls */
.scrollY{overflow:auto; scrollbar-width:none;}
.scrollY::-webkit-scrollbar{width:0;height:0}

/* Wall column */
.wall{
  border:1px solid rgba(232,226,214,.12);
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    radial-gradient(900px 650px at 50% 30%, rgba(232,226,214,.075), transparent 58%),
    rgba(0,0,0,.18);
  position:relative;
  box-shadow: var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.wallTop{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.72);
  position:relative;
  z-index:2;
}
.wallTitle{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:14px;
}
.counter{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  opacity:.72;
}
.wallScroll{
  flex:1;
  min-height:0;
  overflow:auto; /* only scrolling area for projects */
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.wallScroll::-webkit-scrollbar{width:0;height:0}
.wallGrid{
  padding:14px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:12px;
}

/* Cards */
.card{
  border:1px solid rgba(232,226,214,.14);
  background: rgba(0,0,0,.22);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transform: translateZ(0);
}
.card::before{
  content:"";
  position:absolute; inset:-2px;
  pointer-events:none;
  background: radial-gradient(520px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
  opacity:0;
  transition: opacity .18s ease;
}
.card:hover{ border-color: rgba(232,226,214,.26); background: rgba(255,255,255,.03); }
.card:hover::before{ opacity:.85; }
.thumb{
  aspect-ratio: 4 / 3;
  width:100%;
  background: rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(232,226,214,.10);
}
.thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  filter: saturate(.95) contrast(1.05);
  opacity:.92;
}
.thumb .scan{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(232,226,214,.22) 50%, transparent 100%);
  opacity:.10;
  transform: translateY(-60%);
  animation: scan 5.2s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{0%{transform:translateY(-70%)}100%{transform:translateY(80%)}}
.cardBody{padding:12px 12px 11px; position:relative; z-index:2}
.metaLine{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.78;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardTitle{
  margin:8px 0 8px;
  font-size:16px;
  line-height:1.25;
  opacity:.96;
}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.13);
  background: rgba(255,255,255,.03);
  opacity:.9;
}

/* Viewer */
.viewerMedia{
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(0,0,0,.22);
  aspect-ratio: 4 / 3;
  position:relative;
  overflow:hidden;
}
.viewerMedia img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.95) contrast(1.05);}
.viewerMedia .grid{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.06) 0px, rgba(232,226,214,.06) 1px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 18px);
  opacity:.20; mix-blend-mode:overlay;
}
.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 16px;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.viewerContent::-webkit-scrollbar{width:0;height:0;}
.kv{
  display:flex; justify-content:space-between; gap:10px;
  padding:6px 0;
  border-top:1px dashed rgba(232,226,214,.12);
}
.kv:first-of-type{border-top:0;padding-top:0;}
.k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.10em;font-size:10px;opacity:.65;}
.v{font-family:var(--mono);letter-spacing:.08em;font-size:10px;opacity:.92;text-align:right;}
.excerpt{
  margin:12px 0 0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  letter-spacing:.05em;
  white-space:pre-wrap;
  opacity:.92;
  text-shadow: 0 0 10px rgba(232,226,214,.08), 0 0 2px rgba(232,226,214,.08);
}
.viewerFooter{
  border-top:1px solid rgba(232,226,214,.12);
  padding:12px 16px;
  background: rgba(10,10,10,.92);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  position:relative;
  z-index:2;
}
.link{
  color:var(--ink);
  text-decoration:none;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  padding:10px 12px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  opacity:.92;
}
.link:hover{opacity:1;background:rgba(255,255,255,.05);}

/* Responsive */
@media (max-width: 1100px){ .wrap{grid-template-columns: 260px 1fr} .viewerCol{display:none} }
@media (max-width: 860px){ .wrap{grid-template-columns:1fr} .wallGrid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 520px){ .siteHeader{height:calc(84px + env(safe-area-inset-top))} .siteHeader img{height:44px} .wallGrid{grid-template-columns:1fr} }


/* ===========================
   MOBILE VR (PARABOLIC / INSIDE)
   - Only activates on coarse pointer (phones/tablets)
   - Desktop remains untouched
=========================== */
@media (pointer:coarse){
  body.vr-mobile{
    overflow:hidden !important;
    height:100vh;
    width:100vw;
  }
  body.vr-mobile .wrap{
    /* cancel the desktop grid layout */
    position:fixed;
    inset:0;
    padding:0;
    margin:0;
    display:block !important;
    width:100vw;
    height:100vh;
    perspective: 1400px;
    transform-style: preserve-3d;
    background: var(--bg);
  }
  body.vr-mobile .wrap > aside.panel,
  body.vr-mobile .wrap > section.wall{
    position:absolute !important;
    top:50%;
    left:50%;
    transform-style: preserve-3d;
    will-change: transform;
    /* keep your panel styling; only constrain size */
    height: min(82vh, 780px);
    max-height: 82vh;
    overflow:hidden; /* internal scroll lives in the sheet */
  }

  /* widths tuned to preserve your original proportions on small screens */
  body.vr-mobile .wrap > aside.panel{ width: min(78vw, 420px); }
  body.vr-mobile .wrap > section.wall{ width: min(86vw, 560px); }

  /* ensure internal scrolling still works */
  body.vr-mobile .wrap > section.wall .sheet{ max-height: 100%; height: 100%; overflow:auto; -webkit-overflow-scrolling: touch; }
  body.vr-mobile .wrap > aside.panel .sheet{ max-height: 100%; height: 100%; overflow:auto; -webkit-overflow-scrolling: touch; }

  body.vr-mobile .wrap.vr-rig{
    transform-style: preserve-3d;
  }

  /* Motion permission pill (iOS) */
  body.vr-mobile #vrMotionPill{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:14px;
    z-index:9999;
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(15,15,15,.75);
    backdrop-filter: blur(10px);
    font-family: var(--mono);
    font-size:12px;
    color: var(--ink);
    user-select:none;
  }
  body.vr-mobile #vrMotionPill button{
    all:unset;
    cursor:pointer;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.18);
  }
  body.vr-mobile #vrMotionPill .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(232,226,214,.35);
  }
  body.vr-mobile #vrMotionPill[data-on="1"] .dot{
    background:rgba(120,255,180,.9);
  }
}
</style>
</head>
<body>
<header aria-label="Primary" class="siteHeader" role="banner">
<a aria-label="Home" href="https://jofrearchive.com/" rel="noopener" target="_self">
<img alt="Jofre Archive" src="https://inside.jofrearchive.com/assets/images/logo.png"/>
</a>
</header>
<div aria-hidden="true" id="vitrine-bg"></div>
<div aria-hidden="true" id="glass"></div>
<div class="page">
<div class="wrap">
<!-- LEFT: categories + filters -->
<aside aria-label="Categories" class="panel">
<div class="panelHeader">
<div class="kicker">studies / navigation</div>
<div class="titleRow">
<h2 class="h1">CATEGORIES</h2>
<div class="pill" id="pillCount">— items</div>
</div>
</div>
<div class="panelBody scrollY">
<input autocomplete="off" class="input" id="q" placeholder="Search (title, tag, year) …" type="search"/>
<div class="hr"></div>
<div class="row" id="catRow"></div>
</div>
</aside>
<!-- CENTER: wall (scroll inside) -->
<section aria-label="Project wall" class="wall">
<div class="wallTop">
<h3 class="wallTitle">PROJECT WALL</h3>
<div class="row">
<button class="btn" id="btnSort">Sort: newest</button>
<button class="btn" id="btnReset">Reset</button>
</div>
<div class="counter"><span id="shown">0</span> / <span id="total">0</span></div>
</div>
<div class="wallScroll">
<div class="wallGrid" id="grid"></div>
</div>
</section>
<!-- RIGHT: viewer -->
<aside aria-label="Viewer" class="panel viewerCol">
<div class="panelHeader">
<div class="kicker">retrieval / viewer</div>
<div class="titleRow">
<h2 class="h1" id="vTitle">SELECT A PROJECT</h2>
<div class="pill" id="vCat">—</div>
</div>
</div>
<div class="viewerMedia">
<img alt="" id="vImg" src="" style="display:none"/>
<div aria-hidden="true" class="grid"></div>
</div>
<div class="viewerContent">
<div id="vMeta"></div>
<div class="hr"></div>
<div class="excerpt" id="vText">Use the wall to open an entry.</div>
</div>
<div class="viewerFooter">
<a class="link" href="#" id="vLink" style="display:none" target="_self">Open</a>
<button class="btn" disabled="" id="vCopy">Copy</button>
</div>
</aside>
</div>
</div>
<script>

const PROJECTS = [
  {

    images:[],

    link:"#"
  },
  {
    id:"LAN-0001",
    title:"Leaf-pattern cartography studies",
    year:2025,
    place:"Mediterranean basin",
    category:"Landscape",
    tags:["plants","pattern","territory"],
    thumb:'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22800%22%20height%3D%22600%22%3E%0A%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%230a0a0a%22/%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23e8e2d6%22%20stroke-opacity%3D%22.22%22%3E%0A%3Cpath%20d%3D%22M80%20140%20H720%22/%3E%3Cpath%20d%3D%22M80%20200%20H620%22/%3E%3Cpath%20d%3D%22M80%20260%20H700%22/%3E%3Cpath%20d%3D%22M80%20320%20H560%22/%3E%3Cpath%20d%3D%22M80%20380%20H680%22/%3E%0A%3C/g%3E%0A%3Ctext%20x%3D%2280%22%20y%3D%22520%22%20fill%3D%22%23e8e2d6%22%20fill-opacity%3D%22.78%22%20font-family%3D%22monospace%22%20font-size%3D%2220%22%3ELANDSCAPE%20/%20LEAF%20CARTOGRAPHY%3C/text%3E%0A%3C/svg%3E',
    images:[],
    excerpt:"Landscape read as sediment: layers of presence across territories.\nLeaves as diagram: veins, flows, and memory lines.",
    link:"#"
  },
  {
    id:"DPA-0001",
    title:"Carnival of progress (dystopic pop)",
    year:2024,
    place:"—",

    images:[],

    link:"#"

let state = { category:"All", q:"", newestFirst:true, openId:null };

const catRow = document.getElementById("catRow");
const qEl = document.getElementById("q");
const grid = document.getElementById("grid");
const shownEl = document.getElementById("shown");
const totalEl = document.getElementById("total");
const pillCount = document.getElementById("pillCount");
const btnSort = document.getElementById("btnSort");
const btnReset = document.getElementById("btnReset");

const vTitle = document.getElementById("vTitle");
const vCat = document.getElementById("vCat");
const vImg = document.getElementById("vImg");
const vMeta = document.getElementById("vMeta");
const vText = document.getElementById("vText");
const vLink = document.getElementById("vLink");
const vCopy = document.getElementById("vCopy");

function norm(s){ return String(s||"").toLowerCase().trim(); }
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function filtered(){
  let items = [...PROJECTS];
  if(state.category !== "All") items = items.filter(p => p.category === state.category);
  if(state.q){
    const q = norm(state.q);
    items = items.filter(p => norm([p.id,p.title,p.year,p.place,p.category,(p.tags||[]).join(" "),p.excerpt].join(" ")).includes(q));
  }
  items.sort((a,b)=> state.newestFirst ? (b.year - a.year) : (a.year - b.year));
  return items;
}

function renderCategories(){
  catRow.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type="button";
    b.className = "btn" + (c === state.category ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{ state.category = c; state.openId=null; renderAll(false); });
    catRow.appendChild(b);
  });
}

function kvRow(k,v){ return `<div class="kv"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`; }

function setViewerEmpty(){
  vTitle.textContent = "SELECT A PROJECT";
  vCat.textContent = "—";
  vText.textContent = "Use the wall to open an entry.";
  vMeta.innerHTML = "";
  vImg.style.display = "none";
  vImg.src = "";
  vLink.style.display = "none";
  vCopy.disabled = true;
}

function fillViewer(p){
  vTitle.textContent = p.title.toUpperCase();
  vCat.textContent = (p.category || "—").toUpperCase();
  vMeta.innerHTML =
    kvRow("ID", p.id) +
    kvRow("CATEGORY", p.category) +
    kvRow("YEAR", String(p.year)) +
    kvRow("PLACE", p.place || "—") +
    kvRow("TAGS", (p.tags||[]).join(", ") || "—");
  vText.textContent = p.excerpt || "—";
  const imgSrc = (p.images && p.images.length) ? p.images[0] : p.thumb;
  if(imgSrc){
    vImg.style.display = "block";
    vImg.src = imgSrc;
    vImg.alt = p.title;
  } else {
    vImg.style.display = "none";
    vImg.src = "";
  }
  if(p.link && p.link !== "#"){ vLink.style.display = "inline-block"; vLink.href = p.link; }
  else { vLink.style.display = "none"; }
  vCopy.disabled = false;
}

function openProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  state.openId = id;
  fillViewer(p);
}

function renderWall(keepSelection){
  const items = filtered();
  totalEl.textContent = PROJECTS.length;
  shownEl.textContent = items.length;
  pillCount.textContent = PROJECTS.length + " items";

  grid.innerHTML = "";
  items.forEach(p=>{
    const el = document.createElement("div");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.innerHTML = `
      <div class="thumb">
        <img src="${escapeHtml(p.thumb)}" alt="${escapeHtml(p.title)}" loading="lazy"/>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div class="cardBody">
        <div class="metaLine"><span>${escapeHtml(p.category)}</span><span>${escapeHtml(p.year)}</span></div>
        <div class="cardTitle">${escapeHtml(p.title)}</div>
        <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `;
    el.addEventListener("click", ()=> openProject(p.id));
    el.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openProject(p.id); }
    });
    grid.appendChild(el);
  });

  if(items.length === 0){
    const empty = document.createElement("div");
    empty.className = "smallHint";
    empty.style.padding = "14px";
    empty.textContent = "No matches.";
    grid.appendChild(empty);
    state.openId = null;
    setViewerEmpty();
    return;
  }

  if(keepSelection && state.openId && items.find(x=>x.id===state.openId)) return;
  openProject(items[0].id);
}

qEl.addEventListener("input",(e)=>{
  state.q = e.target.value;
  state.openId = null;
  renderAll(false);
});
btnSort.addEventListener("click", ()=>{
  state.newestFirst = !state.newestFirst;
  btnSort.textContent = "Sort: " + (state.newestFirst ? "newest" : "oldest");
  state.openId = null;
  renderAll(false);
});
btnReset.addEventListener("click", ()=>{
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  qEl.value = "";
  btnSort.textContent = "Sort: newest";
  renderAll(false);
  setViewerEmpty();
});

async function copyPayload(){
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return false;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{ await navigator.clipboard.writeText(payload); return true; }
  catch(_){ return false; }
}
vCopy.addEventListener("click", async ()=>{
  const ok = await copyPayload();
  vCopy.textContent = ok ? "Copied" : "Blocked";
  setTimeout(()=> vCopy.textContent = "Copy", 900);
});

function renderAll(keepSelection){ renderCategories(); renderWall(keepSelection); }
setViewerEmpty();
renderAll(false);
</script>
<div id="vrMotionPill" style="display:none;"></div>
<script>
(function(){
  const isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if(!isCoarse) return;

  document.body.classList.add("vr-mobile");

  const wrap = document.querySelector(".wrap");
  if(!wrap) return;

  // Create a rig wrapper so we can rotate the whole set like a camera.
  // We do NOT change the order of columns: categories (left) / wall (center) / viewer (right).
  const rig = document.createElement("div");
  rig.className = "vr-rig";
  rig.style.position = "absolute";
  rig.style.inset = "0";
  rig.style.transformStyle = "preserve-3d";
  rig.style.willChange = "transform";

  // Move existing children into the rig (preserves their content and event handlers).
  const kids = Array.from(wrap.children);
  kids.forEach(el => rig.appendChild(el));
  wrap.appendChild(rig);

  const left  = rig.querySelector("aside.panel:not(.viewerCol)");
  const mid   = rig.querySelector("section.wall");
  const right = rig.querySelector("aside.viewerCol");

  if(!left || !mid || !right) return;

  // Geometry: screens on an inner arc (parabolic wrap).
  // Place each screen on a circle of radius R and keep it facing the observer (center).
  function computeR(){
    const w = Math.min(window.innerWidth, 1000);
    // Keep proportional: small screens -> smaller radius, large -> larger.
    return Math.max(340, Math.min(560, w * 0.55));
  }

  let R = computeR();
  // Angles define the wrap amount (more negative/positive -> more enveloping).
  // Keep subtle so it doesn't clip.
  const A = { left: -55, mid: 0, right: 55 };

  function placePanels(){
    R = computeR();

    // Helper: rotate around Y, move along -Z (into the scene), then rotate back so it faces center.
    const t = (angleDeg, z) => `translate(-50%, -50%) rotateY(${angleDeg}deg) translateZ(${z}px) rotateY(${-angleDeg}deg)`;
    // IMPORTANT: use NEGATIVE Z so the arc wraps AROUND the observer (you are "inside" looking out).
    const z = -R;

    left.style.transform  = t(A.left,  z);
    mid.style.transform   = t(A.mid,   z);
    right.style.transform = t(A.right, z);

    // Prevent clipping: push slightly down on very short screens
    const h = window.innerHeight;
    const y = (h < 700) ? 52 : 50;
    [left, mid, right].forEach(el => { el.style.top = y + "%"; });
  }

  placePanels();
  window.addEventListener("resize", placePanels, {passive:true});
  window.addEventListener("orientationchange", () => setTimeout(placePanels, 250), {passive:true});

  // Motion controls (gyro) + drag fallback
  const pill = document.getElementById("vrMotionPill");
  if(pill){
    pill.innerHTML = '<span class="dot"></span><span>MOTION</span><button type="button" id="vrEnableBtn">Enable</button>';
  }

  let motionOn = false;

  // targets (degrees)
  let tYaw = 0, tPitch = 0;
  let yaw = 0, pitch = 0;
  let dragYaw = 0, dragTYaw = 0;

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  // Subtle desktop-like limits, but a bit more room on phone
  const MAX_YAW = 32;   // left-right
  const MAX_PITCH = 12; // up-down

  // Use beta/gamma (relative) so it works without compass permissions
  function onOrient(e){
    // beta: front-back, gamma: left-right (portrait)
    const beta = (typeof e.beta === "number") ? e.beta : 0;
    const gamma = (typeof e.gamma === "number") ? e.gamma : 0;

    // Map to camera rotation. Keep subtle and clamp.
    tYaw = clamp(gamma * 0.9, -MAX_YAW, MAX_YAW);
    tPitch = clamp((beta - 20) * 0.35, -MAX_PITCH, MAX_PITCH); // shift so "neutral" feels natural
  }

  function setPill(on){
    if(!pill) return;
    pill.style.display = "flex";
    pill.setAttribute("data-on", on ? "1" : "0");
    const btn = pill.querySelector("#vrEnableBtn");
    if(btn) btn.textContent = on ? "On" : "Enable";
  }

  async function enableMotion(){
    try{
      if(typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"){
        const res = await DeviceOrientationEvent.requestPermission();
        if(res !== "granted") throw new Error("permission not granted");
      }
      window.addEventListener("deviceorientation", onOrient, true);
      motionOn = true;
      setPill(true);
    }catch(err){
      motionOn = false;
      setPill(false);
      // keep pill visible so user can retry
    }
  }

  // Show pill only when needed (iOS) or as an affordance
  if(isCoarse){
    setPill(false);
    const btn = pill && pill.querySelector("#vrEnableBtn");
    if(btn) btn.addEventListener("click", enableMotion);
    // Auto-enable on Android (no permission prompt), but keep it safe:
    // Try once; if it yields nulls, user can drag.
    enableMotion();
  }

  // Drag fallback (works always)
  let dragging = false;
  let startX = 0;

  function shouldIgnoreDrag(target){
    // Don't hijack scrolling inside sheets/wall or controls.
    return !!target.closest(".sheet, input, textarea, button, a, select, .wall");
  }

  window.addEventListener("touchstart", (e)=>{
    if(shouldIgnoreDrag(e.target)) return;
    dragging = true;
    startX = e.touches[0].clientX;
  }, {passive:true});

  window.addEventListener("touchmove", (e)=>{
    if(!dragging) return;
    const dx = e.touches[0].clientX - startX;
    dragTYaw = clamp(dx * 0.08, -MAX_YAW, MAX_YAW);
  }, {passive:true});

  window.addEventListener("touchend", ()=>{
    dragging = false;
    dragTYaw = 0;
  }, {passive:true});

  // Render loop with smoothing
  function tick(){
    // Smooth drag
    dragYaw += (dragTYaw - dragYaw) * 0.12;

    // Smooth motion
    yaw += (tYaw - yaw) * 0.10;
    pitch += (tPitch - pitch) * 0.10;

    const finalYaw = clamp(yaw + dragYaw, -MAX_YAW, MAX_YAW);
    const finalPitch = clamp(pitch, -MAX_PITCH, MAX_PITCH);

    rig.style.transform = `rotateX(${finalPitch}deg) rotateY(${finalYaw}deg)`;
    requestAnimationFrame(tick);
  }
  tick();

})();
</script>
