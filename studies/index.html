
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Studies – Mobile VR LED</title>

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--ink);
}

/* Desktop placeholder */
#desktopLayout{
  padding:40px;
}
@media (pointer:coarse){
  #desktopLayout{ display:none !important; }
}

/* Canvas */
#vrCanvas{
  display:none;
  width:100vw;
  height:100vh;
  touch-action:none;
}
@media (pointer:coarse){
  #vrCanvas{ display:block; }
}

/* === LED BUTTON STYLE === */

#vrButton{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  border-radius:40px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(15,15,15,.75);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.18em;
  cursor:pointer;
  transition:.2s;
  user-select:none;
}

@media (pointer:coarse){
  #vrButton{ display:flex; }
}

#vrButton:hover{
  background:rgba(25,25,25,.9);
}

#vrButton:active{
  transform:translateX(-50%) scale(.96);
}

#vrLed{
  width:9px;
  height:9px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
  box-shadow:0 0 0 0 rgba(120,255,180,0);
  transition:.25s;
}

#vrLed.active{
  background:#78ffb4;
  box-shadow:0 0 10px rgba(120,255,180,.8);
}

#vrState{
  font-family: var(--mono);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

</style>
</head>

<body>

<div id="desktopLayout">
  <h1>Desktop Layout</h1>
  <p>Visible only on desktop.</p>
</div>

<canvas id="vrCanvas"></canvas>

<div id="vrButton" aria-label="VR motion toggle">
  <div id="vrLed" aria-hidden="true"></div>
  <div id="vrLabel">VR</div>
  <div id="vrState" style="opacity:.65;">OFF</div>
</div>

<script>
(function(){

  if(!window.matchMedia("(pointer:coarse)").matches) return;

  const canvas = document.getElementById("vrCanvas");
  const led = document.getElementById("vrLed");
  const button = document.getElementById("vrButton");

  const stateText = document.getElementById("vrState");
  let gyroOn = false;
  function setState(on){
    gyroOn = on;
    if(on){
      led.classList.add("active");
      if(stateText) stateText.textContent = "ON";
    }else{
      led.classList.remove("active");
      if(stateText) stateText.textContent = "OFF";
    }
  }

  setState(false);

  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src=src;
      s.onload=res;
      s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  async function init(){

    await loadScript("https://cdn.jsdelivr.net/npm/babylonjs@7.15.0/babylon.js");

    const engine = new BABYLON.Engine(canvas,true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(.02,.02,.02,1);

    const cam = new BABYLON.UniversalCamera("cam",
      new BABYLON.Vector3(0,1.6,0),scene);

    cam.setTarget(new BABYLON.Vector3(0,1.6,5));
    cam.attachControl(canvas,true);
    cam.speed=0;

    new BABYLON.HemisphericLight("h",
      new BABYLON.Vector3(0,1,0),scene);

    const panel = BABYLON.MeshBuilder.CreatePlane("p",
      {width:2,height:2.4},scene);

    panel.position.z = 4;
    panel.position.y = 1.6;

    const mat = new BABYLON.StandardMaterial("m",scene);
    mat.diffuseColor = new BABYLON.Color3(.1,.1,.1);
    mat.emissiveColor = new BABYLON.Color3(.05,.05,.05);
    panel.material = mat;

    engine.runRenderLoop(()=>scene.render());
    window.addEventListener("resize",()=>engine.resize());

    async function toggleGyro(){
      // Turn OFF
      if(gyroOn){
        try{
          if(cam.inputs && cam.inputs.attached && cam.inputs.attached.deviceOrientation){
            cam.inputs.remove(cam.inputs.attached.deviceOrientation);
          }
        }catch(e){}
        setState(false);
        return;
      }

      // Turn ON (ask permission on iOS)
      try{
        if(typeof DeviceOrientationEvent!=="undefined"
        && typeof DeviceOrientationEvent.requestPermission==="function"){
          const r=await DeviceOrientationEvent.requestPermission();
          if(r!=="granted") return;
        }
        cam.inputs.addDeviceOrientation();
        setState(true);
      }catch(e){}
    }

    button.addEventListener("click",toggleGyro);

  }

  init();

})();
</script>

</body>
</html>
