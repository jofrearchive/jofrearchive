<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>VR Panels</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

<style>
html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    background:#0b0b0b;
}
canvas {
    width:100%;
    height:100%;
    touch-action:none;
}
</style>
</head>

<body>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.05,0.05,0.05,1);

const camera = new BABYLON.ArcRotateCamera("cam",
    Math.PI/2,
    Math.PI/2,
    6,
    BABYLON.Vector3.Zero(),
    scene
);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit = 4;
camera.upperRadiusLimit = 8;

new BABYLON.HemisphericLight("light",
    new BABYLON.Vector3(0,1,0),
    scene
);

/* ---------------- MOCK DATA ---------------- */

const projects = [
{title:"BioSolar Leaf", date:"2025", category:"BioSystems", text:"Biomimetic solar structures."},
{title:"Mycelium Sculpture", date:"2024", category:"BioSystems", text:"Organic growing architecture."},
{title:"Dystopic Carnival", date:"2023", category:"Dystopic", text:"Critique of modern spectacle."},
{title:"Cymatic Field", date:"2022", category:"Cymatics", text:"Sound forming matter."}
];

let activeCategory = "All";
let activeProject = projects[0];

/* ---------------- PANEL FACTORY ---------------- */

function makeGuiPanel(name, positionAngle) {

    const plane = BABYLON.MeshBuilder.CreatePlane(name,{
        width:2.3,
        height:3
    },scene);

    plane.position = new BABYLON.Vector3(
        Math.sin(positionAngle)*4,
        0,
        Math.cos(positionAngle)*4
    );

    plane.lookAt(BABYLON.Vector3.Zero());
    plane.scaling.x = -1; // FIX mirror

    const adt = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(plane,2048,2048);

    const root = new BABYLON.GUI.Rectangle();
    root.thickness = 1;
    root.background = "rgba(15,15,15,0.78)";
    root.color = "rgba(255,255,255,0.16)";
    adt.addControl(root);

    /* -------- LEFT PANEL -------- */

    if(name==="left"){

        const stack = new BABYLON.GUI.StackPanel();
        stack.paddingTop="40px";
        root.addControl(stack);

        ["All","BioSystems","Dystopic","Cymatics"].forEach(cat=>{
            const btn = BABYLON.GUI.Button.CreateSimpleButton(cat,cat);
            btn.height="120px";
            btn.cornerRadius=60;
            btn.color="white";
            btn.fontFamily="monospace";
            btn.background = activeCategory===cat ? "#ffffff33" : "#00000000";
            btn.onPointerClickObservable.add(()=>{
                activeCategory = cat;
                refreshPanels();
            });
            stack.addControl(btn);
        });
    }

    /* -------- CENTER PANEL -------- */

    if(name==="center"){

        const scroll = new BABYLON.GUI.ScrollViewer();
        scroll.thickness=0;
        root.addControl(scroll);

        const stack = new BABYLON.GUI.StackPanel();
        scroll.addControl(stack);

        getFiltered().forEach(proj=>{
            const card = new BABYLON.GUI.Rectangle();
            card.height="260px";
            card.thickness=1;
            card.color="rgba(255,255,255,0.16)";
            card.background = proj===activeProject ? "#ffffff22":"#00000000";
            card.paddingTop="20px";
            card.paddingBottom="20px";

            const title = new BABYLON.GUI.TextBlock();
            title.text=proj.title;
            title.color="white";
            title.fontSize=60;
            title.fontFamily="serif";
            card.addControl(title);

            card.onPointerClickObservable.add(()=>{
                activeProject = proj;
                refreshPanels();
            });

            stack.addControl(card);
        });
    }

    /* -------- RIGHT PANEL -------- */

    if(name==="right"){

        const stack = new BABYLON.GUI.StackPanel();
        stack.paddingTop="80px";
        stack.paddingLeft="80px";
        stack.paddingRight="80px";
        root.addControl(stack);

        const title = new BABYLON.GUI.TextBlock();
        title.text=activeProject.title;
        title.fontSize=90;
        title.fontFamily="serif";
        title.color="white";
        title.textWrapping=true;
        stack.addControl(title);

        const date = new BABYLON.GUI.TextBlock();
        date.text=activeProject.date;
        date.fontSize=50;
        date.fontFamily="monospace";
        date.color="#aaaaaa";
        stack.addControl(date);

        const text = new BABYLON.GUI.TextBlock();
        text.text=activeProject.text;
        text.fontSize=55;
        text.fontFamily="monospace";
        text.color="white";
        text.textWrapping=true;
        stack.addControl(text);
    }

    return plane;
}

/* ---------------- HELPERS ---------------- */

function getFiltered(){
    if(activeCategory==="All") return projects;
    return projects.filter(p=>p.category===activeCategory);
}

let panels=[];

function refreshPanels(){
    panels.forEach(p=>p.dispose());
    panels=[];
    panels.push(makeGuiPanel("left",-0.8));
    panels.push(makeGuiPanel("center",0));
    panels.push(makeGuiPanel("right",0.8));
}

refreshPanels();

/* ---------------- RENDER ---------------- */

engine.runRenderLoop(()=>{
    scene.render();
});

window.addEventListener("resize",()=>{
    engine.resize();
});
</script>

</body>
</html>
