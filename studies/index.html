
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Studies – Desktop + Mobile VR</title>

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,sans-serif;
}

/* ========== DESKTOP LAYOUT (YOUR ORIGINAL STRUCTURE GOES HERE) ========== */

#desktopLayout{
  padding:40px;
}

#desktopLayout h1{
  font-weight:300;
  letter-spacing:.08em;
}

/* Hide desktop layout on touch devices */
@media (pointer:coarse){
  #desktopLayout{
    display:none !important;
  }
}

/* ========== MOBILE VR CANVAS ========== */

#vrCanvas{
  display:none;
  width:100vw;
  height:100vh;
  touch-action:none;
}

@media (pointer:coarse){
  #vrCanvas{
    display:block;
  }
}

/* HUD LED */
#vrHud{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  font-family:var(--mono);
  letter-spacing:.14em;
  font-size:12px;
  display:none;
  align-items:center;
  gap:10px;
  opacity:.85;
  cursor:pointer;
}

@media (pointer:coarse){
  #vrHud{
    display:flex;
  }
}

#vrLed{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.3);
  transition:.2s;
}

#vrLed.active{
  background:#78ffb4;
}
</style>
</head>

<body>

<!-- ================= DESKTOP ORIGINAL PAGE ================= -->
<div id="desktopLayout">

  <!-- PUT YOUR ORIGINAL HTML LAYOUT HERE -->
  <h1>Studies</h1>
  <p>This is the normal desktop layout.</p>

</div>

<!-- ================= MOBILE VR ================= -->
<canvas id="vrCanvas"></canvas>

<div id="vrHud">
  <div>VR</div>
  <div id="vrLed"></div>
</div>

<script>
(function(){

  // Only activate VR on touch devices
  if(!window.matchMedia("(pointer:coarse)").matches) return;

  const canvas = document.getElementById("vrCanvas");
  const led = document.getElementById("vrLed");

  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src=src;
      s.onload=res;
      s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  async function init(){

    await loadScript("https://cdn.jsdelivr.net/npm/babylonjs@7.15.0/babylon.js");

    const engine = new BABYLON.Engine(canvas,true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0,0,0,1);

    const cam = new BABYLON.UniversalCamera("cam",
      new BABYLON.Vector3(0,1.6,0),scene);

    cam.setTarget(new BABYLON.Vector3(0,1.6,5));
    cam.attachControl(canvas,true);
    cam.speed=0;

    new BABYLON.HemisphericLight("h",
      new BABYLON.Vector3(0,1,0),scene);

    function panel(w,h){
      const m=BABYLON.MeshBuilder.CreatePlane("p",{width:w,height:h},scene);
      const mat=new BABYLON.StandardMaterial("m",scene);
      mat.diffuseColor=new BABYLON.Color3(.06,.06,.06);
      mat.emissiveColor=new BABYLON.Color3(.02,.02,.02);
      mat.alpha=.95;
      m.material=mat;
      return m;
    }

    const left=panel(1.6,2.2);
    const mid=panel(2.1,2.2);
    const right=panel(1.6,2.2);

    const R=4.5;
    const spread=.55;

    function place(mesh,a){
      mesh.position.x=Math.sin(a)*R;
      mesh.position.z=Math.cos(a)*R;
      mesh.position.y=1.6;
    }

    place(left,-spread);
    place(mid,0);
    place(right,spread);
    mid.position.z+=.4;

    scene.onBeforeRenderObservable.add(()=>{
      [left,mid,right].forEach(p=>{
        const dx=cam.position.x-p.position.x;
        const dz=cam.position.z-p.position.z;
        p.rotation.y=Math.atan2(dx,dz);
      });
    });

    engine.runRenderLoop(()=>scene.render());
    window.addEventListener("resize",()=>engine.resize());

    async function enableGyro(){
      try{
        if(typeof DeviceOrientationEvent!=="undefined"
        && typeof DeviceOrientationEvent.requestPermission==="function"){
          const r=await DeviceOrientationEvent.requestPermission();
          if(r!=="granted") return;
        }
        cam.inputs.addDeviceOrientation();
        led.classList.add("active");
      }catch(e){}
    }

    document.getElementById("vrHud")
      .addEventListener("click",enableGyro);

  }

  init();

})();
</script>

</body>
</html>
