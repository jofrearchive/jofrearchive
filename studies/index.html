<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studies — Project Wall</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --muted:rgba(232,226,214,.72);
  --line:rgba(232,226,214,.16);
  --line2:rgba(232,226,214,.12);
  --mono:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif:"EB Garamond", serif;
  --shadow:0 40px 90px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden;
}

#vitrine-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.42)),
    #0b0b0b;
}
#vitrine-bg::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.010) 0px, rgba(255,255,255,.010) 1px, transparent 2px, transparent 5px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.007) 0px, rgba(255,255,255,.007) 1px, transparent 2px, transparent 9px);
  opacity:.18; mix-blend-mode:overlay;
}
#glass{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(900px 650px at 60% 25%, rgba(255,255,255,.06), transparent 55%);
  opacity:.22; mix-blend-mode:screen;
}
body::after{
  content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.88) 100%);
  opacity:.55;
}

.siteHeader{
  position:fixed; top:0; left:0; right:0;
  height: calc(96px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  z-index: 1000;
  pointer-events:none;
}
.siteHeader a{pointer-events:auto; text-decoration:none}
.siteHeader img{height:56px; width:auto; display:block; opacity:.92}

.page{
  position:relative;
  z-index:10;
  height:100vh;
  padding: calc(110px + env(safe-area-inset-top)) clamp(10px, 2.2vw, 22px) clamp(10px, 2.2vw, 22px);
}
.wrap{
  width:min(1320px, 100%);
  height: calc(100vh - (110px + env(safe-area-inset-top)) - clamp(10px, 2.2vw, 22px));
  margin:0 auto;
  display:grid;
  grid-template-columns: 260px 1fr 420px;
  gap:14px;
  align-items:stretch;
}

.panel{
  border:1px solid var(--line2);
  background: linear-gradient(180deg, rgba(10,10,10,.86), rgba(0,0,0,.46));
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel::before{
  content:"";
  position:absolute; inset:10px;
  pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) left top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 1px 22px no-repeat;
  opacity:.85;
  z-index:0;
}
.panelHeader{
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.92);
  position:relative;
  z-index:2;
}
.kicker{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  opacity:.68;
  margin-bottom:6px;
}
.titleRow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.h1{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:16px;
}
.pill{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.14);
  background: rgba(255,255,255,.03);
  opacity:.9;
}
.panelBody{
  padding:14px 16px 16px;
  position:relative;
  z-index:2;
  min-height:0;
  flex:1;
}
.hr{height:1px;background:rgba(232,226,214,.12);margin:12px 0}

.input{
  width:100%;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  color:var(--ink);
  padding:10px 10px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.10em;
  font-size:11px;
  outline:none;
}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ink);
  background: rgba(255,255,255,.03);
  border:1px solid rgba(232,226,214,.22);
  padding:10px 12px;
  cursor:pointer;
  opacity:.92;
  transition:all .2s ease;
}
.btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.btn.active{
  background: rgba(255,255,255,.08);
  border-color: rgba(232,226,214,.40);
}
.smallHint{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.62;
}

.scrollY{overflow:auto; scrollbar-width:none;}
.scrollY::-webkit-scrollbar{width:0;height:0}

.wall{
  border:1px solid rgba(232,226,214,.12);
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    radial-gradient(900px 650px at 50% 30%, rgba(232,226,214,.075), transparent 58%),
    rgba(0,0,0,.18);
  position:relative;
  box-shadow: var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.wallTop{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.72);
  position:relative;
  z-index:2;
}
.wallTitle{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:14px;
}
.counter{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  opacity:.72;
}
.wallScroll{
  flex:1;
  min-height:0;
  overflow:auto;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.wallScroll::-webkit-scrollbar{width:0;height:0}
.wallGrid{
  padding:14px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:12px;
}

.card{
  border:1px solid rgba(232,226,214,.14);
  background: rgba(0,0,0,.22);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transform: translateZ(0);
}
.card::before{
  content:"";
  position:absolute; inset:-2px;
  pointer-events:none;
  background: radial-gradient(520px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
  opacity:0;
  transition: opacity .18s ease;
}
.card:hover{ border-color: rgba(232,226,214,.26); background: rgba(255,255,255,.03); }
.card:hover::before{ opacity:.85; }
.thumb{
  aspect-ratio: 4 / 3;
  width:100%;
  background: rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(232,226,214,.10);
}
.thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  filter: saturate(.95) contrast(1.05);
  opacity:.92;
}
.thumb .scan{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(232,226,214,.22) 50%, transparent 100%);
  opacity:.10;
  transform: translateY(-60%);
  animation: scan 5.2s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{0%{transform:translateY(-70%)}100%{transform:translateY(80%)}}
.cardBody{padding:12px 12px 11px; position:relative; z-index:2}
.metaLine{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.78;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardTitle{
  margin:8px 0 8px;
  font-size:16px;
  line-height:1.25;
  opacity:.96;
}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.13);
  background: rgba(255,255,255,.03);
  opacity:.9;
}

.viewerMedia{
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(0,0,0,.22);
  aspect-ratio: 4 / 3;
  position:relative;
  overflow:hidden;
}
.viewerMedia img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.95) contrast(1.05);}
.viewerMedia .grid{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.06) 0px, rgba(232,226,214,.06) 1px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 18px);
  opacity:.20; mix-blend-mode:overlay;
}
.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 16px;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.viewerContent::-webkit-scrollbar{width:0;height:0;}
.kv{
  display:flex; justify-content:space-between; gap:10px;
  padding:6px 0;
  border-top:1px dashed rgba(232,226,214,.12);
}
.kv:first-of-type{border-top:0;padding-top:0;}
.k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.10em;font-size:10px;opacity:.65;}
.v{font-family:var(--mono);letter-spacing:.08em;font-size:10px;opacity:.92;text-align:right;}
.excerpt{
  margin:12px 0 0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  letter-spacing:.05em;
  white-space:pre-wrap;
  opacity:.92;
  text-shadow: 0 0 10px rgba(232,226,214,.08), 0 0 2px rgba(232,226,214,.08);
}
.viewerFooter{
  border-top:1px solid rgba(232,226,214,.12);
  padding:12px 16px;
  background: rgba(10,10,10,.92);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  position:relative;
  z-index:2;
}
.link{
  color:var(--ink);
  text-decoration:none;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  padding:10px 12px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  opacity:.92;
}
.link:hover{opacity:1;background:rgba(255,255,255,.05);}

@media (max-width: 1100px){ .wrap{grid-template-columns: 260px 1fr} .viewerCol{display:none} }
@media (max-width: 860px){ .wrap{grid-template-columns:1fr} .wallGrid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 520px){ .siteHeader{height:calc(84px + env(safe-area-inset-top))} .siteHeader img{height:44px} .wallGrid{grid-template-columns:1fr} }

/* ===========================
   VR MODE STYLES
   =========================== */
body.vrmode{
  overflow:hidden !important;
  background:#000;
}

body.vrmode .siteHeader,
body.vrmode .page,
body.vrmode #vitrine-bg,
body.vrmode #glass,
body.vrmode body::after{
  display:none !important;
}

#vrContainer{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  background:#000;
  touch-action:none;
}
body.vrmode #vrContainer{
  display:block;
}

#vrScene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

#vrDomLayer{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
  perspective:1200px;
  overflow:hidden;
}

.vr-panel{
  position:absolute;
  pointer-events:auto;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  background: linear-gradient(180deg, rgba(10,10,10,.98), rgba(5,5,5,.99));
  border:1px solid rgba(232,226,214,.3);
  box-shadow: 0 30px 100px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);
  border-radius:4px;
  overflow:hidden;
  will-change:transform;
  /* Prevent text selection during drag */
  user-select:none;
  -webkit-user-select:none;
}

.vr-panel-inner{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* Panel dimensions */
#vrPanelLeft{ width:300px; height:520px; }
#vrPanelCenter{ width:360px; height:580px; }
#vrPanelRight{ width:320px; height:520px; }

#vrUI{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10000;
  pointer-events:none;
}
#vrUI > * { pointer-events:auto; }

#vrTopBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
  background:linear-gradient(180deg, rgba(0,0,0,.9), transparent);
}

#vrStatus{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:.15em;
  color:#e8e2d6;
}
#vrStatusDot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,50,50,.8);
  box-shadow:0 0 10px rgba(255,50,50,.5);
  transition:all .3s;
}
#vrStatus.active #vrStatusDot{
  background:rgba(50,255,120,1);
  box-shadow:0 0 15px rgba(50,255,120,.6);
}

#vrControls{
  display:flex;
  gap:10px;
}
.vr-btn{
  padding:10px 16px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:#e8e2d6;
  font-family:var(--mono);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.1em;
  border-radius:6px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}
.vr-btn:active{
  background:rgba(255,255,255,.15);
  transform:scale(0.95);
}

#vrHint{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  padding:14px 24px;
  background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.15);
  border-radius:30px;
  color:#e8e2d6;
  font-family:var(--mono);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:.1em;
  text-align:center;
  backdrop-filter:blur(10px);
  z-index:10000;
  transition:opacity .5s;
  pointer-events:none;
}

#reticle{
  position:fixed;
  top:50%;
  left:50%;
  width:30px;
  height:30px;
  border:2px solid rgba(232,226,214,.5);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:9998;
  pointer-events:none;
  transition:all .2s;
}
#reticle::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:4px;
  height:4px;
  background:rgba(232,226,214,.9);
  border-radius:50%;
  transform:translate(-50%,-50%);
}
#reticle.active{
  border-color:rgba(120,255,180,.9);
  transform:translate(-50%,-50%) scale(1.3);
  border-width:3px;
}

#vrLoading{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10001;
  color:#e8e2d6;
  font-family:var(--mono);
  text-transform:uppercase;
  font-size:12px;
  letter-spacing:.2em;
  gap:20px;
}
#vrLoading::after{
  content:'';
  width:40px;
  height:40px;
  border:3px solid rgba(232,226,214,.1);
  border-top-color:#e8e2d6;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Debug button for desktop testing */
#vrDebugBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:100000;
  padding:12px 20px;
  background:rgba(120,50,255,.3);
  border:1px solid rgba(120,50,255,.5);
  color:#fff;
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
  border-radius:8px;
}
@media (pointer: coarse){
  #vrDebugBtn{display:none;}
}
</style>
</head>

<body>
<!-- DESKTOP UI -->
<header class="siteHeader">
  <a href="https://jofrearchive.com/">
    <img src="https://inside.jofrearchive.com/assets/images/logo.png" alt="Jofre Archive">
  </a>
</header>

<div id="vitrine-bg"></div>
<div id="glass"></div>

<div class="page">
  <div class="wrap">
    <aside class="panel" id="desktopLeft">
      <div class="panelHeader">
        <div class="kicker">studies / navigation</div>
        <div class="titleRow">
          <h2 class="h1">CATEGORIES</h2>
          <div class="pill" id="pillCount">— items</div>
        </div>
      </div>
      <div class="panelBody scrollY">
        <input class="input" id="q" type="search" placeholder="Search (title, tag, year) …" autocomplete="off">
        <div class="hr"></div>
        <div class="row" id="catRow"></div>
      </div>
    </aside>

    <section class="wall" id="desktopCenter">
      <div class="wallTop">
        <h3 class="wallTitle">PROJECT WALL</h3>
        <div class="row">
          <button class="btn" id="btnSort">Sort: newest</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>
        <div class="counter"><span id="shown">0</span> / <span id="total">0</span></div>
      </div>
      <div class="wallScroll">
        <div class="wallGrid" id="grid"></div>
      </div>
    </section>

    <aside class="panel viewerCol" id="desktopRight">
      <div class="panelHeader">
        <div class="kicker">retrieval / viewer</div>
        <div class="titleRow">
          <h2 class="h1" id="vTitle">SELECT A PROJECT</h2>
          <div class="pill" id="vCat">—</div>
        </div>
      </div>
      <div class="viewerMedia">
        <img id="vImg" alt="" src="" style="display:none">
        <div class="grid"></div>
      </div>
      <div class="viewerContent">
        <div id="vMeta"></div>
        <div class="hr"></div>
        <div class="excerpt" id="vText">Use the wall to open an entry.</div>
      </div>
      <div class="viewerFooter">
        <a class="link" id="vLink" href="#" style="display:none">Open</a>
        <button class="btn" id="vCopy" disabled>Copy</button>
      </div>
    </aside>
  </div>
</div>

<!-- VR CONTAINER -->
<div id="vrContainer">
  <div id="vrLoading">Initializing VR Environment</div>
  
  <!-- A-Frame Scene (invisible, used only for gyro camera) -->
  <a-scene id="vrScene" embedded vr-mode-ui="enabled:false" renderer="antialias:true; alpha:true; colorManagement:true">
    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="vrCamera" look-controls="enabled:true; touchEnabled:true; magicWindowTrackingEnabled:true; reverseMouseDrag:false" wasd-controls="enabled:false" fov="70"></a-camera>
    </a-entity>
  </a-scene>

  <!-- DOM Panels Layer - REAL PANELS FROM DESKTOP -->
  <div id="vrDomLayer">
    <div class="vr-panel" id="vrPanelLeft">
      <div class="vr-panel-inner" id="vrLeftContent"></div>
    </div>
    <div class="vr-panel" id="vrPanelCenter">
      <div class="vr-panel-inner" id="vrCenterContent"></div>
    </div>
    <div class="vr-panel" id="vrPanelRight">
      <div class="vr-panel-inner" id="vrRightContent"></div>
    </div>
  </div>

  <!-- VR UI -->
  <div id="vrUI">
    <div id="vrTopBar">
      <div id="vrStatus">
        <div id="vrStatusDot"></div>
        <span>VR Mode</span>
      </div>
      <div id="vrControls">
        <button class="vr-btn" id="vrRecenter">Recenter</button>
        <button class="vr-btn" id="vrExit">Exit</button>
      </div>
    </div>
  </div>

  <div id="vrHint">Move your phone to look around • Tap panels to interact</div>
  <div id="reticle"></div>
</div>

<button id="vrDebugBtn" onclick="forceVR()">Force VR Mode</button>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script>
// ===========================

// STATE & DESKTOP APP

let state = { category:"All", q:"", newestFirst:true, openId:null };

function norm(s){ return String(s||"").toLowerCase().trim(); }
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function filtered(){
  let items = [...PROJECTS];
  if(state.category !== "All") items = items.filter(p => p.category === state.category);
  if(state.q){
    const q = norm(state.q);
    items = items.filter(p => norm([p.id,p.title,p.year,p.place,p.category,(p.tags||[]).join(" "),p.excerpt].join(" ")).includes(q));
  }
  items.sort((a,b)=> state.newestFirst ? (b.year - a.year) : (a.year - b.year));
  return items;
}

function renderCategories(){
  const catRow = document.getElementById("catRow");
  catRow.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type="button";
    b.className = "btn" + (c === state.category ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{ 
      state.category = c; 
      state.openId=null; 
      renderAll(false);
      if(isVRMode) updateVRPanels();
    });
    catRow.appendChild(b);
  });
}

function kvRow(k,v){ return `<div class="kv"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`; }

function setViewerEmpty(){
  document.getElementById("vTitle").textContent = "SELECT A PROJECT";
  document.getElementById("vCat").textContent = "—";
  document.getElementById("vText").textContent = "Use the wall to open an entry.";
  document.getElementById("vMeta").innerHTML = "";
  document.getElementById("vImg").style.display = "none";
  document.getElementById("vLink").style.display = "none";
  document.getElementById("vCopy").disabled = true;
}

function fillViewer(p){
  document.getElementById("vTitle").textContent = p.title.toUpperCase();
  document.getElementById("vCat").textContent = (p.category || "—").toUpperCase();
  document.getElementById("vMeta").innerHTML =
    kvRow("ID", p.id) +
    kvRow("CATEGORY", p.category) +
    kvRow("YEAR", String(p.year)) +
    kvRow("PLACE", p.place || "—") +
    kvRow("TAGS", (p.tags||[]).join(", ") || "—");
  document.getElementById("vText").textContent = p.excerpt || "—";
  const imgSrc = (p.images && p.images.length) ? p.images[0] : p.thumb;
  const vImg = document.getElementById("vImg");
  if(imgSrc){
    vImg.style.display = "block";
    vImg.src = imgSrc;
    vImg.alt = p.title;
  } else {
    vImg.style.display = "none";
  }
  const vLink = document.getElementById("vLink");
  if(p.link && p.link !== "#"){ vLink.style.display = "inline-block"; vLink.href = p.link; }
  else { vLink.style.display = "none"; }
  document.getElementById("vCopy").disabled = false;
}

function openProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  state.openId = id;
  fillViewer(p);
  if(isVRMode) updateVRPanels();
}

function renderWall(keepSelection){
  const items = filtered();
  document.getElementById("total").textContent = PROJECTS.length;
  document.getElementById("shown").textContent = items.length;
  document.getElementById("pillCount").textContent = PROJECTS.length + " items";

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  items.forEach(p=>{
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="thumb">
        <img src="${escapeHtml(p.thumb)}" alt="${escapeHtml(p.title)}" loading="lazy"/>
        <div class="scan"></div>
      </div>
      <div class="cardBody">
        <div class="metaLine"><span>${escapeHtml(p.category)}</span><span>${escapeHtml(p.year)}</span></div>
        <div class="cardTitle">${escapeHtml(p.title)}</div>
        <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `;
    el.addEventListener("click", ()=> openProject(p.id));
    grid.appendChild(el);
  });

  if(items.length === 0){
    grid.innerHTML = '<div class="smallHint" style="padding:14px">No matches.</div>';
    state.openId = null;
    setViewerEmpty();
    return;
  }

  if(keepSelection && state.openId && items.find(x=>x.id===state.openId)) return;
  openProject(items[0].id);
}

function renderAll(keepSelection){ 
  renderCategories(); 
  renderWall(keepSelection);
  if(isVRMode) updateVRPanels();
}

// Desktop events
document.getElementById("q").addEventListener("input",(e)=>{
  state.q = e.target.value;
  state.openId = null;
  renderAll(false);
});

document.getElementById("btnSort").addEventListener("click", ()=>{
  state.newestFirst = !state.newestFirst;
  document.getElementById("btnSort").textContent = "Sort: " + (state.newestFirst ? "newest" : "oldest");
  state.openId = null;
  renderAll(false);
});

document.getElementById("btnReset").addEventListener("click", ()=>{
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  document.getElementById("q").value = "";
  document.getElementById("btnSort").textContent = "Sort: newest";
  renderAll(false);
  setViewerEmpty();
});

document.getElementById("vCopy").addEventListener("click", async ()=>{
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{ 
    await navigator.clipboard.writeText(payload); 
    document.getElementById("vCopy").textContent = "Copied";
    setTimeout(()=> document.getElementById("vCopy").textContent = "Copy", 900);
  } catch(e){}
});

// Init desktop
setViewerEmpty();
renderAll(false);

};

function isMobile(){
  return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || 
         Math.min(window.innerWidth, window.innerHeight) <= 900;
}

function initVR(){
  if(!isMobile() && !window.forceVRMode){
    console.log("Not mobile, VR disabled");
    return;
  }
  
  console.log("Initializing VR...");
  
  // Wait for A-Frame
  const checkInterval = setInterval(()=>{
    if(window.AFRAME && window.THREE && document.querySelector('a-scene').hasLoaded){
      clearInterval(checkInterval);
      startVR();
    }
  }, 100);
  
  // Timeout after 5 seconds
  setTimeout(()=>{
    clearInterval(checkInterval);
    if(!isVRMode) console.error("A-Frame failed to load in time");
  }, 5000);
}

function startVR(){
  try {
    vrCamera = document.getElementById('vrCamera');
    vrPanels = {
      left: document.getElementById('vrPanelLeft'),
      center: document.getElementById('vrPanelCenter'),
      right: document.getElementById('vrPanelRight')
    };
    
    // Build VR panels with real content
    buildVRPanels();
    
    // Activate VR mode
    document.body.classList.add('vrmode');
    isVRMode = true;
    document.getElementById('vrStatus').classList.add('active');
    
    // Request orientation permission for iOS
    if(typeof DeviceOrientationEvent !== 'undefined' && 
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().catch(e => console.log("Orientation permission:", e));
    }
    
    // Start render loop
    updateVRFrame();
    
    // Hide loading
    setTimeout(()=>{
      document.getElementById('vrLoading').style.display = 'none';
    }, 500);
    
    console.log("VR Mode active");
    
  } catch(e) {
    console.error("VR init failed:", e);
  }
}

        </div>` : ''}
        
        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px dashed rgba(232,226,214,.12);">
            <div style="font-family:var(--mono); text-transform:uppercase; letter-spacing:.10em; font-size:10px; opacity:.65;">ID</div>
            <div style="font-family:var(--mono); letter-spacing:.08em; font-size:10px; opacity:.92; text-align:right;">${escapeHtml(p.id)}</div>
          </div>
          <div style="display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px dashed rgba(232,226,214,.12);">
            <div style="font-family:var(--mono); text-transform:uppercase; letter-spacing:.10em; font-size:10px; opacity:.65;">CATEGORY</div>
            <div style="font-family:var(--mono); letter-spacing:.08em; font-size:10px; opacity:.92; text-align:right;">${escapeHtml(p.category)}</div>
          </div>
          <div style="display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px dashed rgba(232,226,214,.12);">

        <div style="border-top:1px solid rgba(232,226,214,.12); padding:16px; background:rgba(10,10,10,.92); margin:20px -16px -16px; display:flex; justify-content:space-between; gap:10px;">

  document.getElementById('vrRightContent').innerHTML = rightHTML;
}

// VR Actions
window.selectVRCategory = function(cat){
  state.category = cat;
  state.openId = null;
  renderAll(false);
};

window.openVRProject = function(id){
  openProject(id);
};

window.toggleVRSort = function(){
  state.newestFirst = !state.newestFirst;
  renderAll(false);
};

window.resetVR = function(){
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  renderAll(false);
};

window.copyVRInfo = async function(){
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{
    await navigator.clipboard.writeText(payload);
    const btn = document.querySelector('#vrRightContent button');
    if(btn){
      btn.textContent = "Copied!";
      setTimeout(()=> btn.textContent = "Copy", 1000);
    }
  }catch(e){}
};

function updateVRFrame(){
  if(!isVRMode || !vrCamera) return;
  
  const camObj = vrCamera.object3D;
  if(!camObj) {
    animationFrameId = requestAnimationFrame(updateVRFrame);
    return;
  }
  
  camObj.updateMatrixWorld();
  const rotation = new THREE.Euler().setFromQuaternion(camObj.quaternion, 'YXZ');
  const camYaw = rotation.y;
  const camPitch = rotation.x;
  
  updatePanel('left', camYaw, camPitch);
  updatePanel('center', camYaw, camPitch);
  updatePanel('right', camYaw, camPitch);
  
  animationFrameId = requestAnimationFrame(updateVRFrame);
}

function updatePanel(id, camYaw, camPitch){
  const panel = vrPanels[id];
  const cfg = VR_CONFIG[id];
  if(!panel || !cfg) return;
  
  const totalYaw = camYaw + (cfg.yaw * Math.PI / 180);
  const totalPitch = camPitch + (cfg.pitch * Math.PI / 180);
  
  const x = Math.sin(totalYaw) * Math.cos(totalPitch) * cfg.distance;
  const y = Math.sin(totalPitch) * cfg.distance;
  const z = -Math.cos(totalYaw) * Math.cos(totalPitch) * cfg.distance;
  
  const fov = 70 * (Math.PI / 180);
  const scale = (window.innerHeight / 2) / Math.tan(fov / 2);
  
  const screenX = (x / -z) * scale + window.innerWidth / 2;
  const screenY = (y / -z) * scale + window.innerHeight / 2;
  
  const distance = Math.sqrt(x*x + y*y + z*z);
  const scaleFactor = (cfg.width / distance) * scale / cfg.width;
  const finalScale = Math.max(0.4, Math.min(1.5, scaleFactor));
  
  panel.style.transform = `translate3d(${screenX - cfg.width/2}px, ${screenY - cfg.height/2}px, 0) scale(${finalScale})`;
  
  if(z > -0.5){
    panel.style.opacity = Math.max(0, Math.min(1, (-z + 0.5) * 2));
    panel.style.pointerEvents = z < 0 ? 'auto' : 'none';
  } else {
    panel.style.opacity = 1;
    panel.style.pointerEvents = 'auto';
  }
}

// VR Controls
document.getElementById('vrExit').addEventListener('click', ()=>{
  isVRMode = false;
  if(animationFrameId) cancelAnimationFrame(animationFrameId);
  document.body.classList.remove('vrmode');
  document.getElementById('vrStatus').classList.remove('active');
  document.getElementById('vrLoading').style.display = 'flex';
});

document.getElementById('vrRecenter').addEventListener('click', ()=>{
  if(vrCamera && vrCamera.components['look-controls']){
    vrCamera.components['look-controls'].pitchObject.rotation.x = 0;
    vrCamera.components['look-controls'].yawObject.rotation.y = 0;
  }
});

// Debug function for desktop testing
window.forceVR = function(){
  window.forceVRMode = true;
  initVR();
};

// Initialize
if(isMobile()){
  window.addEventListener('load', ()=>{
    setTimeout(initVR, 300);
  });
}

console.log("Page loaded, mobile:", isMobile());
</script>
