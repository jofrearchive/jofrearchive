<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studies — Project Wall</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --muted:rgba(232,226,214,.72);
  --line:rgba(232,226,214,.16);
  --line2:rgba(232,226,214,.12);
  --mono:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif:"EB Garamond", serif;
  --shadow:0 40px 90px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden; /* fixed columns */
}

/* Vitrine background */
#vitrine-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.42)),
    #0b0b0b;
}
#vitrine-bg::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.010) 0px, rgba(255,255,255,.010) 1px, transparent 2px, transparent 5px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.007) 0px, rgba(255,255,255,.007) 1px, transparent 2px, transparent 9px);
  opacity:.18; mix-blend-mode:overlay;
}
#glass{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(900px 650px at 60% 25%, rgba(255,255,255,.06), transparent 55%);
  opacity:.22; mix-blend-mode:screen;
}
body::after{
  content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.88) 100%);
  opacity:.55;
}

/* Header */
.siteHeader{
  position:fixed; top:0; left:0; right:0;
  height: calc(96px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  z-index: 1000;
  pointer-events:none;
}
.siteHeader a{pointer-events:auto; text-decoration:none}
.siteHeader img{height:56px; width:auto; display:block; opacity:.92}
.siteHeader img:hover{opacity:1}

/* Fixed viewport layout */
.page{
  position:relative;
  z-index:10;
  height:100vh;
  padding: calc(110px + env(safe-area-inset-top)) clamp(10px, 2.2vw, 22px) clamp(10px, 2.2vw, 22px);
}
.wrap{
  width:min(1320px, 100%);
  height: calc(100vh - (110px + env(safe-area-inset-top)) - clamp(10px, 2.2vw, 22px));
  margin:0 auto;
  display:grid;
  grid-template-columns: 260px 1fr 420px;
  gap:14px;
  align-items:stretch;
}

/* Panels */
.panel{
  border:1px solid var(--line2);
  background: linear-gradient(180deg, rgba(10,10,10,.86), rgba(0,0,0,.46));
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel::before{
  content:"";
  position:absolute; inset:10px;
  pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) left top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 1px 22px no-repeat;
  opacity:.85;
  z-index:0;
}
.panelHeader{
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.92);
  position:relative;
  z-index:2;
}
.kicker{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  opacity:.68;
  margin-bottom:6px;
}
.titleRow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.h1{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:16px;
}
.pill{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.14);
  background: rgba(255,255,255,.03);
  opacity:.9;
}
.panelBody{
  padding:14px 16px 16px;
  position:relative;
  z-index:2;
  min-height:0;
  flex:1;
}
.hr{height:1px;background:rgba(232,226,214,.12);margin:12px 0}

/* Controls */
.input{
  width:100%;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  color:var(--ink);
  padding:10px 10px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.10em;
  font-size:11px;
  outline:none;
}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ink);
  background: rgba(255,255,255,.03);
  border:1px solid rgba(232,226,214,.22);
  padding:10px 12px;
  cursor:pointer;
  opacity:.92;
  transition:all .2s ease;
}
.btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.btn.active{
  background: rgba(255,255,255,.08);
  border-color: rgba(232,226,214,.40);
}
.smallHint{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.62;
}

/* Internal scrolls */
.scrollY{overflow:auto; scrollbar-width:none;}
.scrollY::-webkit-scrollbar{width:0;height:0}

/* Wall column */
.wall{
  border:1px solid rgba(232,226,214,.12);
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    radial-gradient(900px 650px at 50% 30%, rgba(232,226,214,.075), transparent 58%),
    rgba(0,0,0,.18);
  position:relative;
  box-shadow: var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.wallTop{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.72);
  position:relative;
  z-index:2;
}
.wallTitle{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:14px;
}
.counter{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  opacity:.72;
}
.wallScroll{
  flex:1;
  min-height:0;
  overflow:auto; /* only scrolling area for projects */
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.wallScroll::-webkit-scrollbar{width:0;height:0}
.wallGrid{
  padding:14px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:12px;
}

/* Cards */
.card{
  border:1px solid rgba(232,226,214,.14);
  background: rgba(0,0,0,.22);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transform: translateZ(0);
}
.card::before{
  content:"";
  position:absolute; inset:-2px;
  pointer-events:none;
  background: radial-gradient(520px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
  opacity:0;
  transition: opacity .18s ease;
}
.card:hover{ border-color: rgba(232,226,214,.26); background: rgba(255,255,255,.03); }
.card:hover::before{ opacity:.85; }
.thumb{
  aspect-ratio: 4 / 3;
  width:100%;
  background: rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(232,226,214,.10);
}
.thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  filter: saturate(.95) contrast(1.05);
  opacity:.92;
}
.thumb .scan{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(232,226,214,.22) 50%, transparent 100%);
  opacity:.10;
  transform: translateY(-60%);
  animation: scan 5.2s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{0%{transform:translateY(-70%)}100%{transform:translateY(80%)}}
.cardBody{padding:12px 12px 11px; position:relative; z-index:2}
.metaLine{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.78;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardTitle{
  margin:8px 0 8px;
  font-size:16px;
  line-height:1.25;
  opacity:.96;
}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.13);
  background: rgba(255,255,255,.03);
  opacity:.9;
}

/* Viewer */
.viewerMedia{
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(0,0,0,.22);
  aspect-ratio: 4 / 3;
  position:relative;
  overflow:hidden;
}
.viewerMedia img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.95) contrast(1.05);}
.viewerMedia .grid{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.06) 0px, rgba(232,226,214,.06) 1px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 18px);
  opacity:.20; mix-blend-mode:overlay;
}
.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 16px;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.viewerContent::-webkit-scrollbar{width:0;height:0;}
.kv{
  display:flex; justify-content:space-between; gap:10px;
  padding:6px 0;
  border-top:1px dashed rgba(232,226,214,.12);
}
.kv:first-of-type{border-top:0;padding-top:0;}
.k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.10em;font-size:10px;opacity:.65;}
.v{font-family:var(--mono);letter-spacing:.08em;font-size:10px;opacity:.92;text-align:right;}
.excerpt{
  margin:12px 0 0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  letter-spacing:.05em;
  white-space:pre-wrap;
  opacity:.92;
  text-shadow: 0 0 10px rgba(232,226,214,.08), 0 0 2px rgba(232,226,214,.08);
}
.viewerFooter{
  border-top:1px solid rgba(232,226,214,.12);
  padding:12px 16px;
  background: rgba(10,10,10,.92);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  position:relative;
  z-index:2;
}
.link{
  color:var(--ink);
  text-decoration:none;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  padding:10px 12px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  opacity:.92;
}
.link:hover{opacity:1;background:rgba(255,255,255,.05);}

/* Responsive */
@media (max-width: 1100px){ .wrap{grid-template-columns: 260px 1fr} .viewerCol{display:none} }
@media (max-width: 860px){ .wrap{grid-template-columns:1fr} .wallGrid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 520px){ .siteHeader{height:calc(84px + env(safe-area-inset-top))} .siteHeader img{height:44px} .wallGrid{grid-template-columns:1fr} }

/* ===========================
   MOBILE 3D NATIVE UI (Babylon.js GUI)
=========================== */
#babylonRoot{ display:none; }
body.bab3d-ready #babylonRoot{ display:block; position:fixed; inset:0; z-index:6000; background:#0b0b0b; }

body.bab3d-ready{
  overflow:hidden !important;
  height:100vh;
  width:100vw;
  background:#0b0b0b;
}
body.bab3d-ready .siteHeader,
body.bab3d-ready .page,
body.bab3d-ready #vitrine-bg,
body.bab3d-ready #glass{ display:none !important; }

body.bab3d-on{
  overflow:hidden !important;
  height:100vh;
  width:100vw;
  background:#0b0b0b;
}
body.bab3d-on .siteHeader,
body.bab3d-on .page,
body.bab3d-on #vitrine-bg,
body.bab3d-on #glass{ display:none !important; }
body.bab3d-on::after{ display:none !important; }

#babHud{
  position:fixed;
  top:12px; left:12px; right:12px;
  z-index:7000;
  display:flex; gap:10px;
  align-items:center; justify-content:space-between;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:rgba(10,10,10,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--ink);
  font-family: var(--mono);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-size:11px;
  user-select:none;
}
#babHud .left{display:flex; gap:10px; align-items:center;}
#babHud .dot{width:8px;height:8px;border-radius:50%;background:rgba(232,226,214,.35);}
#babHud[data-on="1"] .dot{background:rgba(120,255,180,.9);}
#babHud input{
  width:min(42vw, 240px);
  max-width:240px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.03);
  color:var(--ink);
  border-radius:12px;
  padding:8px 10px;
  font-family: var(--mono);
  letter-spacing:.10em;
  text-transform:uppercase;
  font-size:11px;
  outline:none;
  opacity:.92;
}
#babHud input::placeholder{ color: rgba(232,226,214,.55); }
#babHud button{
  all:unset;
  cursor:pointer;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.03);
  opacity:.92;
}
#babHud button:active{transform: translateY(1px);}

#babHint{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:7000;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.55);
  color:rgba(232,226,214,.82);
  font-family: var(--mono);
  letter-spacing:.10em;
  text-transform:uppercase;
  font-size:10px;
  max-width:92vw;
  text-align:center;
  user-select:none;
}
#babylonCanvas{
  width:100%;
  height:100%;
  touch-action:none;
  display:block;
}

#babHud, #babHint{ display:none; }
body.bab3d-on #babHud, body.bab3d-on #babHint{ display:flex; }
body.bab3d-on #babHint{ display:block; }


</style>
</head>

<body>
<header class="siteHeader" role="banner" aria-label="Primary">
  <a href="https://jofrearchive.com/" target="_self" rel="noopener" aria-label="Home">
    <img src="https://inside.jofrearchive.com/assets/images/logo.png" alt="Jofre Archive">
  </a>
</header>

<div id="vitrine-bg" aria-hidden="true"></div>
<div id="glass" aria-hidden="true"></div>

<div class="page">
  <div class="wrap">

    <!-- LEFT: categories + filters -->
    <aside class="panel" aria-label="Categories">
      <div class="panelHeader">
        <div class="kicker">studies / navigation</div>
        <div class="titleRow">
          <h2 class="h1">CATEGORIES</h2>
          <div class="pill" id="pillCount">— items</div>
        </div>
      </div>
      <div class="panelBody scrollY">
        <input class="input" id="q" type="search" placeholder="Search (title, tag, year) …" autocomplete="off">
        <div class="hr"></div>
        <div class="row" id="catRow"></div>
</div>
    </aside>

    <!-- CENTER: wall (scroll inside) -->
    <section class="wall" aria-label="Project wall">
      <div class="wallTop">
        <h3 class="wallTitle">PROJECT WALL</h3>
        
        <div class="row">
          <button class="btn" id="btnSort">Sort: newest</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>

        <div class="counter"><span id="shown">0</span> / <span id="total">0</span></div>
      </div>
      <div class="wallScroll">
        <div class="wallGrid" id="grid"></div>
      </div>
    </section>

    <!-- RIGHT: viewer -->
    <aside class="panel viewerCol" aria-label="Viewer">
      <div class="panelHeader">
        <div class="kicker">retrieval / viewer</div>
        <div class="titleRow">
          <h2 class="h1" id="vTitle">SELECT A PROJECT</h2>
          <div class="pill" id="vCat">—</div>
        </div>
      </div>

      <div class="viewerMedia">
        <img id="vImg" alt="" src="" style="display:none">
        <div class="grid" aria-hidden="true"></div>
      </div>

      <div class="viewerContent">
        <div id="vMeta"></div>
        <div class="hr"></div>
        <div class="excerpt" id="vText">Use the wall to open an entry.</div>
      </div>

      <div class="viewerFooter">
        <a class="link" id="vLink" href="#" target="_self" style="display:none">Open</a>
        <button class="btn" id="vCopy" disabled>Copy</button>
      </div>
    </aside>

  </div>
</div>

<script>

const PROJECTS = [
  {
    id:"BIO-0001",
    title:"Cellulose solar panel (screen-print tests)",

    images:[],
    excerpt:"Translucent cellulose substrate + conductive layers (N/P).\nFlexible, transparent panel logic.",
    link:"#"
  },
  {
    id:"LAN-0001",
    title:"Leaf-pattern cartography studies",
    year:2025,
    place:"Mediterranean basin",
    category:"Landscape",
    tags:["plants","pattern","territory"],
    thumb:'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22800%22%20height%3D%22600%22%3E%0A%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%230a0a0a%22/%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23e8e2d6%22%20stroke-opacity%3D%22.22%22%3E%0A%3Cpath%20d%3D%22M80%20140%20H720%22/%3E%3Cpath%20d%3D%22M80%20200%20H620%22/%3E%3Cpath%20d%3D%22M80%20260%20H700%22/%3E%3Cpath%20d%3D%22M80%20320%20H560%22/%3E%3Cpath%20d%3D%22M80%20380%20H680%22/%3E%0A%3C/g%3E%0A%3Ctext%20x%3D%2280%22%20y%3D%22520%22%20fill%3D%22%23e8e2d6%22%20fill-opacity%3D%22.78%22%20font-family%3D%22monospace%22%20font-size%3D%2220%22%3ELANDSCAPE%20/%20LEAF%20CARTOGRAPHY%3C/text%3E%0A%3C/svg%3E',
    images:[],
    excerpt:"Landscape read as sediment: layers of presence across territories.\nLeaves as diagram: veins, flows, and memory lines.",
    link:"#"
  },
  {
    id:"DPA-0001",
    title:"Carnival of progress (dystopic pop)",
    year:2024,
    place:"—",

let state = { category:"All", q:"", newestFirst:true, openId:null };

const catRow = document.getElementById("catRow");
const qEl = document.getElementById("q");
const grid = document.getElementById("grid");
const shownEl = document.getElementById("shown");
const totalEl = document.getElementById("total");
const pillCount = document.getElementById("pillCount");
const btnSort = document.getElementById("btnSort");
const btnReset = document.getElementById("btnReset");

const vTitle = document.getElementById("vTitle");
const vCat = document.getElementById("vCat");
const vImg = document.getElementById("vImg");
const vMeta = document.getElementById("vMeta");
const vText = document.getElementById("vText");
const vLink = document.getElementById("vLink");
const vCopy = document.getElementById("vCopy");

function norm(s){ return String(s||"").toLowerCase().trim(); }
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function filtered(){
  let items = [...PROJECTS];
  if(state.category !== "All") items = items.filter(p => p.category === state.category);
  if(state.q){
    const q = norm(state.q);
    items = items.filter(p => norm([p.id,p.title,p.year,p.place,p.category,(p.tags||[]).join(" "),p.excerpt].join(" ")).includes(q));
  }
  items.sort((a,b)=> state.newestFirst ? (b.year - a.year) : (a.year - b.year));
  return items;
}

function renderCategories(){
  catRow.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type="button";
    b.className = "btn" + (c === state.category ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{ state.category = c; state.openId=null; renderAll(false); });
    catRow.appendChild(b);
  });
}

function kvRow(k,v){ return `<div class="kv"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`; }

function setViewerEmpty(){
  vTitle.textContent = "SELECT A PROJECT";
  vCat.textContent = "—";
  vText.textContent = "Use the wall to open an entry.";
  vMeta.innerHTML = "";
  vImg.style.display = "none";
  vImg.src = "";
  vLink.style.display = "none";
  vCopy.disabled = true;
}

function fillViewer(p){
  vTitle.textContent = p.title.toUpperCase();
  vCat.textContent = (p.category || "—").toUpperCase();
  vMeta.innerHTML =
    kvRow("ID", p.id) +
    kvRow("CATEGORY", p.category) +
    kvRow("YEAR", String(p.year)) +
    kvRow("PLACE", p.place || "—") +
    kvRow("TAGS", (p.tags||[]).join(", ") || "—");
  vText.textContent = p.excerpt || "—";
  const imgSrc = (p.images && p.images.length) ? p.images[0] : p.thumb;
  if(imgSrc){
    vImg.style.display = "block";
    vImg.src = imgSrc;
    vImg.alt = p.title;
  } else {
    vImg.style.display = "none";
    vImg.src = "";
  }
  if(p.link && p.link !== "#"){ vLink.style.display = "inline-block"; vLink.href = p.link; }
  else { vLink.style.display = "none"; }
  vCopy.disabled = false;
}

function openProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  state.openId = id;
  fillViewer(p);
}

function renderWall(keepSelection){
  const items = filtered();
  totalEl.textContent = PROJECTS.length;
  shownEl.textContent = items.length;
  pillCount.textContent = PROJECTS.length + " items";

  grid.innerHTML = "";
  items.forEach(p=>{
    const el = document.createElement("div");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.innerHTML = `
      <div class="thumb">
        <img src="${escapeHtml(p.thumb)}" alt="${escapeHtml(p.title)}" loading="lazy"/>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div class="cardBody">
        <div class="metaLine"><span>${escapeHtml(p.category)}</span><span>${escapeHtml(p.year)}</span></div>
        <div class="cardTitle">${escapeHtml(p.title)}</div>
        <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `;
    el.addEventListener("click", ()=> openProject(p.id));
    el.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openProject(p.id); }
    });
    grid.appendChild(el);
  });

  if(items.length === 0){
    const empty = document.createElement("div");
    empty.className = "smallHint";
    empty.style.padding = "14px";
    empty.textContent = "No matches.";
    grid.appendChild(empty);
    state.openId = null;
    setViewerEmpty();
    return;
  }

  if(keepSelection && state.openId && items.find(x=>x.id===state.openId)) return;
  openProject(items[0].id);
}

qEl.addEventListener("input",(e)=>{
  state.q = e.target.value;
  state.openId = null;
  renderAll(false);
});
btnSort.addEventListener("click", ()=>{
  state.newestFirst = !state.newestFirst;
  btnSort.textContent = "Sort: " + (state.newestFirst ? "newest" : "oldest");
  state.openId = null;
  renderAll(false);
});
btnReset.addEventListener("click", ()=>{
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  qEl.value = "";
  btnSort.textContent = "Sort: newest";
  renderAll(false);
  setViewerEmpty();
});

async function copyPayload(){
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return false;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{ await navigator.clipboard.writeText(payload); return true; }
  catch(_){ return false; }
}
vCopy.addEventListener("click", async ()=>{
  const ok = await copyPayload();
  vCopy.textContent = ok ? "Copied" : "Blocked";
  setTimeout(()=> vCopy.textContent = "Copy", 900);
});

function renderAll(keepSelection){ renderCategories(); renderWall(keepSelection); }
setViewerEmpty();
renderAll(false);
</script>

<!-- Babylon.js -->
<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.15.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-gui@7.15.0/babylon.gui.min.js"></script>

<script>
(function(){
  // Mobile-only activation
  const ua = navigator.userAgent || "";
  const isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const noHover = window.matchMedia && window.matchMedia("(hover: none)").matches;
  const smallW = window.matchMedia && window.matchMedia("(max-width: 900px)").matches;
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  // Only enable on real touch devices or truly small no-hover screens
  const isMobile = isCoarse || uaMobile || (noHover && smallW);
  if(!isMobile) return;

  const root = document.getElementById("babylonRoot");
  const canvas = document.getElementById("babylonCanvas");
  const hud = document.getElementById("babHud");
  const hint = document.getElementById("babHint");
  const btnEnable = document.getElementById("babEnable");
  const btnExit = document.getElementById("babExit");
  const startOverlay = document.getElementById("babStart");
  const startBtn = document.getElementById("babStartBtn");

  // Activate
  // Activation happens after user taps Enable VR
// Sample data (replace with your real project data later)
  const CATEGORIES = ["BioSystems","Landscape","Dystopic Pop Art","Cymatics","Public Art","Murals"];
  const PROJECTS = [
    {title:"Interspecies Archaeology", cat:"BioSystems", date:"2026-01-12", desc:"Mycelium-based sculptural research."},
    {title:"Microscopic Pyramids", cat:"BioSystems", date:"2025-11-04", desc:"Nano-structured light experiments."},
    {title:"Leaf Solar Printing", cat:"BioSystems", date:"2025-09-28", desc:"Screen-printed translucent panels inspired by leaves."},
    {title:"Carnival of Progress", cat:"Dystopic Pop Art", date:"2025-10-02", desc:"Society as colorful spectacle with no depth."},
    {title:"Cymatic Field Notes", cat:"Cymatics", date:"2025-10-18", desc:"Patterns, resonance, and symbolic waveforms."},
    {title:"Community Node", cat:"Public Art", date:"2025-12-08", desc:"Community documentation & media."}
  ];

  let state = {
    cat: "All",
    q: "",
    selected: null
  };

  let _inited = false;

  function init3D(){
    if(_inited) return;
    _inited = true;

    document.body.classList.add("bab3d-on");
    root.setAttribute("aria-hidden","false");
    if(startOverlay) startOverlay.style.display = "none";

      // Babylon engine/scene
      const engine = new BABYLON.Engine(canvas, true, {preserveDrawingBuffer:true, stencil:true});
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0,0,0,1);

      // Lights
      const hemi = new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0,1,0), scene);
      hemi.intensity = 0.85;

      // Camera: use DeviceOrientationCamera when available (magic-window VR feel)
      const cam = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 1.6, 0), scene);
      cam.attachControl(canvas, true);
      cam.setTarget(new BABYLON.Vector3(0, 1.6, 10));
      cam.minZ = 0.05;
      cam.speed = 0;
      cam.angularSensibility = 2000;

      // Clamp pitch a bit for comfort
      const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

      // Simple dome (dish feel)
      const dome = BABYLON.MeshBuilder.CreateSphere("dome", {diameter: 30, segments: 48, slice: 0.5}, scene);
      dome.position = new BABYLON.Vector3(0, 0, 6);
      dome.rotation = new BABYLON.Vector3(0, Math.PI, 0);
      const domeMat = new BABYLON.StandardMaterial("domeMat", scene);
      domeMat.backFaceCulling = false;
      domeMat.diffuseColor = new BABYLON.Color3(0.03,0.03,0.03);
      domeMat.specularColor = new BABYLON.Color3(0,0,0);
      dome.material = domeMat;

      // Panel meshes positioned on a concave arc (parabolic/antenna feel)
      function makePanel(name, w, h){
        const m = BABYLON.MeshBuilder.CreatePlane(name, {width:w, height:h}, scene);
        m.billboardMode = BABYLON.Mesh.BILLBOARDMODE_NONE; // we'll face camera manually (yaw)
        const mat = new BABYLON.StandardMaterial(name+"Mat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.06,0.06,0.06);
        mat.specularColor = new BABYLON.Color3(0,0,0);
        mat.emissiveColor = new BABYLON.Color3(0.02,0.02,0.02);
        mat.alpha = 0.92;
        m.material = mat;
        return m;
      }

      const panelL = makePanel("panelL", 1.55, 2.1);
      const panelM = makePanel("panelM", 1.95, 2.1);
      const panelR = makePanel("panelR", 1.55, 2.1);

      function placePanels(){
        const w = Math.min(window.innerWidth, window.innerHeight);
        const R = (w < 420) ? 3.8 : (w < 520 ? 4.2 : 4.6);
        const spread = (w < 420) ? 0.62 : 0.56; // radians (~35° / 32°)

        function setArc(mesh, a){
          const x = Math.sin(a) * R;
          const z = Math.cos(a) * R;
          mesh.position.set(x, 1.6, z);
        }
        setArc(panelL, -spread);
        setArc(panelM, 0);
        setArc(panelR, spread);
        // Pull the arc closer to the camera
        panelL.position.z += 1.2;
        panelM.position.z += 1.55;
        panelR.position.z += 1.2;
      }
      placePanels();

      // Make panels face camera (yaw-only) every frame
      scene.onBeforeRenderObservable.add(()=>{
        const cpos = cam.position;
        [panelL, panelM, panelR].forEach(p=>{
          const dx = cpos.x - p.position.x;
          const dz = cpos.z - p.position.z;
          const yaw = Math.atan2(dx, dz);
          p.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(0, yaw, 0);
        });
        // Comfort clamp pitch
        cam.rotation.x = clamp(cam.rotation.x, -0.35, 0.35);
      });

      // GUI on meshes
      function panelTexture(mesh){
        const adt = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(mesh, 1024, 1400, false);
        return adt;
      }

      function makeGlassContainer(adt, title){
        const root = new BABYLON.GUI.Rectangle();
        root.width = 0.94;
        root.height = 0.94;
        root.thickness = 1;
        root.color = "rgba(255,255,255,0.16)";
        root.cornerRadius = 18;
        root.background = "rgba(15,15,15,0.82)";
        adt.addControl(root);

        const header = new BABYLON.GUI.TextBlock();
        header.text = title;
        header.height = "46px";
        header.top = "-44%";
        header.color = "#e8e2d6";
        header.fontFamily = "Source Code Pro, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
        header.fontSize = 30;
        header.letterSpacing = "4px";
        header.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
        root.addControl(header);

        return root;
      }

      // LEFT: Categories
      const adtL = panelTexture(panelL);
      const rootL = makeGlassContainer(adtL, "CATEGORIES");

      const catStack = new BABYLON.GUI.StackPanel();
      catStack.width = 0.88;
      catStack.top = "40px";
      catStack.isVertical = true;
      catStack.spacing = 10;
      rootL.addControl(catStack);

      function catButton(label){
        const b = BABYLON.GUI.Button.CreateSimpleButton("cat_"+label, label.toUpperCase());
        b.height = "44px";
        b.thickness = 1;
        b.color = "rgba(255,255,255,0.16)";
        b.cornerRadius = 14;
        b.background = "rgba(255,255,255,0.03)";
        b.fontFamily = "monospace";
        b.fontSize = 20;
        b.textBlock.color = "#e8e2d6";
        b.onPointerUpObservable.add(()=>{
          state.cat = label;
          state.selected = null;
          refreshProjects();
          refreshViewer();
          highlightCats();
        });
        return b;
      }

      const catButtons = [];
      catButtons.push(catButton("All"));
      CATEGORIES.forEach(c=>catButtons.push(catButton(c)));
      catButtons.forEach(b=>catStack.addControl(b));

      function highlightCats(){
        catButtons.forEach(b=>{
          const active = (b.name === "cat_"+state.cat);
          b.background = active ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.03)";
          b.thickness = active ? 1.5 : 1;
        });
      }
      highlightCats();

      // MIDDLE: Project Wall (scroll)
      const adtM = panelTexture(panelM);
      const rootM = makeGlassContainer(adtM, "PROJECT WALL");

      const scroll = new BABYLON.GUI.ScrollViewer();
      scroll.width = 0.90;
      scroll.height = 0.80;
      scroll.top = "60px";
      scroll.thickness = 0;
      scroll.barSize = 10;
      scroll.color = "rgba(255,255,255,0.16)";
      scroll.background = "rgba(0,0,0,0)";
      rootM.addControl(scroll);

      const projStack = new BABYLON.GUI.StackPanel();
      projStack.width = 1.0;
      projStack.isVertical = true;
      projStack.spacing = 12;
      scroll.addControl(projStack);

      function projectCard(p){
        const r = new BABYLON.GUI.Rectangle();
        r.width = 1.0;
        r.height = "120px";
        r.thickness = 1;
        r.color = "rgba(255,255,255,0.14)";
        r.cornerRadius = 16;
        r.background = "rgba(255,255,255,0.02)";

        const title = new BABYLON.GUI.TextBlock();
        title.text = p.title;
        title.color = "#e8e2d6";
        title.fontFamily = "EB Garamond, serif";
        title.fontSize = 38;
        title.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        title.left = "20px";
        title.top = "-18px";
        r.addControl(title);

        const meta = new BABYLON.GUI.TextBlock();
        meta.text = (p.cat + "  •  " + p.date).toUpperCase();
        meta.color = "rgba(232,226,214,0.72)";
        meta.fontFamily = "Source Code Pro, ui-monospace, monospace";
        meta.fontSize = 19;
        meta.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        meta.left = "20px";
        meta.top = "22px";
        r.addControl(meta);

        r.onPointerUpObservable.add(()=>{
          state.selected = p;
          refreshViewer();
        });

        return r;
      }

      function filteredProjects(){
        const q = ""; // search disabled
        return PROJECTS.filter(p=>{
          const catOk = (state.cat === "All") || (p.cat === state.cat);
          const qOk = !q || (p.title.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q));
          return catOk && qOk;
        }).sort((a,b)=> (a.date < b.date ? 1 : -1));
      }

      function refreshProjects(){
        projStack.clearControls();
        const list = filteredProjects();
        if(list.length === 0){
          const t = new BABYLON.GUI.TextBlock();
          t.text = "NO RESULTS";
          t.color = "rgba(232,226,214,0.72)";
          t.fontFamily = "monospace";
          t.fontSize = 22;
          t.height = "60px";
          projStack.addControl(t);
          return;
        }
        list.forEach(p=>projStack.addControl(projectCard(p)));
      }
      refreshProjects();

      // RIGHT: Viewer
      const adtR = panelTexture(panelR);
      const rootR = makeGlassContainer(adtR, "VIEWER");

      const viewTitle = new BABYLON.GUI.TextBlock();
      viewTitle.text = "Select a project";
      viewTitle.color = "#e8e2d6";
      viewTitle.fontFamily = "EB Garamond, serif";
      viewTitle.fontSize = 38;
      viewTitle.top = "40px";
      viewTitle.textWrapping = true;
      viewTitle.height = "120px";
      rootR.addControl(viewTitle);

      const viewMeta = new BABYLON.GUI.TextBlock();
      viewMeta.text = "";
      viewMeta.color = "rgba(232,226,214,0.72)";
      viewMeta.fontFamily = "Source Code Pro, ui-monospace, monospace";
      viewMeta.fontSize = 18;
      viewMeta.top = "130px";
      viewMeta.height = "40px";
      rootR.addControl(viewMeta);

      const viewDesc = new BABYLON.GUI.TextBlock();
      viewDesc.text = "Tap a card in Project Wall.";
      viewDesc.color = "rgba(232,226,214,0.82)";
      viewDesc.fontFamily = "EB Garamond, serif";
      viewDesc.fontSize = 28;
      viewDesc.textWrapping = true;
      viewDesc.top = "190px";
      viewDesc.height = "520px";
      rootR.addControl(viewDesc);

      function refreshViewer(){
        if(!state.selected){
          viewTitle.text = "Select a project";
          viewMeta.text = (state.cat === "All" ? "" : state.cat.toUpperCase());
          viewDesc.text = "Tap a card in Project Wall.";
          return;
        }
        viewTitle.text = state.selected.title;
        viewMeta.text = (state.selected.cat + "  •  " + state.selected.date).toUpperCase();
        viewDesc.text = state.selected.desc || "";
      }
      refreshViewer();

  
      // Motion permission (iOS)
      async function enableMotion(){
        try{
          if(typeof DeviceOrientationEvent !== "undefined" &&
             typeof DeviceOrientationEvent.requestPermission === "function"){
            const res = await DeviceOrientationEvent.requestPermission();
            if(res !== "granted") throw new Error("permission");
          }
          // Babylon: add device orientation input for camera
          if(!cam.inputs.attached.deviceOrientation){
            cam.inputs.addDeviceOrientation();
          }
          hud.setAttribute("data-on","1");
          btnEnable.textContent = "On";
          if(hint) setTimeout(()=>{ hint.style.opacity = "0"; }, 1800);
        }catch(e){
          hud.setAttribute("data-on","0");
          btnEnable.textContent = "Enable motion";
          if(hint) hint.textContent = "iPhone: tap Enable motion • Otherwise drag to look";
        }
      }
      btnEnable.addEventListener("click", enableMotion);

      // Fallback look: two-finger drag (never steals single-finger UI interaction)
  let dragging=false, x0=0,y0=0, yaw0=0,pitch0=0;
  const MAX_YAW = 0.75, MAX_PITCH = 0.35;

  canvas.addEventListener("touchstart", (e)=>{
    if(e.touches && e.touches.length === 2){
      dragging = true;
      const t = e.touches[0];
      x0 = t.clientX; y0 = t.clientY;
      yaw0 = cam.rotation.y; pitch0 = cam.rotation.x;
      e.preventDefault();
    }
  }, {passive:false});

  canvas.addEventListener("touchmove", (e)=>{
    if(!dragging) return;
    if(!(e.touches && e.touches.length === 2)) { dragging=false; return; }
    const t = e.touches[0];
    const dx = t.clientX - x0;
    const dy = t.clientY - y0;
    const k = 0.003;
    cam.rotation.y = clamp(yaw0 + dx*k, -MAX_YAW, MAX_YAW);
    cam.rotation.x = clamp(pitch0 + dy*k, -MAX_PITCH, MAX_PITCH);
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener("touchend", ()=>{ dragging=false; }, {passive:true});
  canvas.addEventListener("touchcancel", ()=>{ dragging=false; }, {passive:true});

      // Exit -> return to desktop layout
      btnExit.addEventListener("click", ()=>{
        document.body.classList.remove("bab3d-on");
        root.setAttribute("aria-hidden","true");
        engine.stopRenderLoop();
        try{ engine.dispose(); }catch(_){}
      });

      window.addEventListener("resize", ()=>{
        engine.resize();
        placePanels();
      }, {passive:true});
      window.addEventListener("orientationchange", ()=>setTimeout(()=>{engine.resize(); placePanels();}, 250), {passive:true});

      engine.runRenderLoop(()=> scene.render());
  }

  if(startBtn){
    startBtn.addEventListener("click", ()=>{
      init3D();
    });
  }

})();
</script>
