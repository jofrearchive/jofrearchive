<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studies — Project Wall (VR Mobile)</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --muted:rgba(232,226,214,.72);
  --line:rgba(232,226,214,.16);
  --line2:rgba(232,226,214,.12);
  --mono:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif:"EB Garamond", serif;
  --shadow:0 40px 90px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden;
}

/* Vitrine background */
#vitrine-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.42)),
    #0b0b0b;
}
#glass{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(900px 650px at 60% 25%, rgba(255,255,255,.06), transparent 55%);
  opacity:.22; mix-blend-mode:screen;
}

/* Header */
.siteHeader{
  position:fixed; top:0; left:0; right:0;
  height: calc(96px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  z-index: 1000;
  pointer-events:none;
}
.siteHeader a{pointer-events:auto; text-decoration:none}
.siteHeader img{height:56px; width:auto; display:block; opacity:.92}

/* Desktop Layout */
.page{
  position:relative;
  z-index:10;
  height:100vh;
  padding: calc(110px + env(safe-area-inset-top)) clamp(10px, 2.2vw, 22px) clamp(10px, 2.2vw, 22px);
}
.wrap{
  width:min(1320px, 100%);
  height: calc(100vh - (110px + env(safe-area-inset-top)) - clamp(10px, 2.2vw, 22px));
  margin:0 auto;
  display:grid;
  grid-template-columns: 260px 1fr 420px;
  gap:14px;
  align-items:stretch;
}

/* Panels */
.panel{
  border:1px solid var(--line2);
  background: linear-gradient(180deg, rgba(10,10,10,.86), rgba(0,0,0,.46));
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel::before{
  content:"";
  position:absolute; inset:10px;
  pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) left top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 1px 22px no-repeat;
  opacity:.85;
  z-index:0;
}
.panelHeader{
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.92);
  position:relative;
  z-index:2;
}
.kicker{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  opacity:.68;
  margin-bottom:6px;
}
.titleRow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.h1{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:16px;
}
.pill{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.14);
  background: rgba(255,255,255,.03);
  opacity:.9;
}
.panelBody{
  padding:14px 16px 16px;
  position:relative;
  z-index:2;
  min-height:0;
  flex:1;
}
.hr{height:1px;background:rgba(232,226,214,.12);margin:12px 0}

/* Controls */
.input{
  width:100%;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  color:var(--ink);
  padding:10px 10px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.10em;
  font-size:11px;
  outline:none;
}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ink);
  background: rgba(255,255,255,.03);
  border:1px solid rgba(232,226,214,.22);
  padding:10px 12px;
  cursor:pointer;
  opacity:.92;
  transition:all .2s ease;
}
.btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.btn.active{
  background: rgba(255,255,255,.08);
  border-color: rgba(232,226,214,.40);
}
.smallHint{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.62;
}

.scrollY{overflow:auto; scrollbar-width:none;}
.scrollY::-webkit-scrollbar{width:0;height:0}

/* Wall column */
.wall{
  border:1px solid rgba(232,226,214,.12);
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    radial-gradient(900px 650px at 50% 30%, rgba(232,226,214,.075), transparent 58%),
    rgba(0,0,0,.18);
  position:relative;
  box-shadow: var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.wallTop{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.72);
  position:relative;
  z-index:2;
}
.wallTitle{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:14px;
}
.counter{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  opacity:.72;
}
.wallScroll{
  flex:1;
  min-height:0;
  overflow:auto;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.wallScroll::-webkit-scrollbar{width:0;height:0}
.wallGrid{
  padding:14px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:12px;
}

/* Cards */
.card{
  border:1px solid rgba(232,226,214,.14);
  background: rgba(0,0,0,.22);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transform: translateZ(0);
}
.card::before{
  content:"";
  position:absolute; inset:-2px;
  pointer-events:none;
  background: radial-gradient(520px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
  opacity:0;
  transition: opacity .18s ease;
}
.card:hover{ border-color: rgba(232,226,214,.26); background: rgba(255,255,255,.03); }
.card:hover::before{ opacity:.85; }
.thumb{
  aspect-ratio: 4 / 3;
  width:100%;
  background: rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(232,226,214,.10);
}
.thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  filter: saturate(.95) contrast(1.05);
  opacity:.92;
}
.thumb .scan{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(232,226,214,.22) 50%, transparent 100%);
  opacity:.10;
  transform: translateY(-60%);
  animation: scan 5.2s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{0%{transform:translateY(-70%)}100%{transform:translateY(80%)}}
.cardBody{padding:12px 12px 11px; position:relative; z-index:2}
.metaLine{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.78;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardTitle{
  margin:8px 0 8px;
  font-size:16px;
  line-height:1.25;
  opacity:.96;
}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.13);
  background: rgba(255,255,255,.03);
  opacity:.9;
}

/* Viewer */
.viewerMedia{
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(0,0,0,.22);
  aspect-ratio: 4 / 3;
  position:relative;
  overflow:hidden;
}
.viewerMedia img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.95) contrast(1.05);}
.viewerMedia .grid{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.06) 0px, rgba(232,226,214,.06) 1px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 18px);
  opacity:.20; mix-blend-mode:overlay;
}
.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 16px;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.viewerContent::-webkit-scrollbar{width:0;height:0;}
.kv{
  display:flex; justify-content:space-between; gap:10px;
  padding:6px 0;
  border-top:1px dashed rgba(232,226,214,.12);
}
.kv:first-of-type{border-top:0;padding-top:0;}
.k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.10em;font-size:10px;opacity:.65;}
.v{font-family:var(--mono);letter-spacing:.08em;font-size:10px;opacity:.92;text-align:right;}
.excerpt{
  margin:12px 0 0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  letter-spacing:.05em;
  white-space:pre-wrap;
  opacity:.92;
}
.viewerFooter{
  border-top:1px solid rgba(232,226,214,.12);
  padding:12px 16px;
  background: rgba(10,10,10,.92);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  position:relative;
  z-index:2;
}
.link{
  color:var(--ink);
  text-decoration:none;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  padding:10px 12px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  opacity:.92;
}
.link:hover{opacity:1;background:rgba(255,255,255,.05);}

/* Responsive */
@media (max-width: 1100px){ .wrap{grid-template-columns: 260px 1fr} .viewerCol{display:none} }
@media (max-width: 860px){ .wrap{grid-template-columns:1fr} .wallGrid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 520px){ .siteHeader{height:calc(84px + env(safe-area-inset-top))} .siteHeader img{height:44px} .wallGrid{grid-template-columns:1fr} }

/* ===========================
   VR MODE STYLES
   =========================== */
body.vrmode{
  overflow:hidden !important;
  background:#000;
}

/* Hide desktop UI in VR */
body.vrmode .siteHeader,
body.vrmode .page,
body.vrmode #vitrine-bg,
body.vrmode #glass{
  display:none !important;
}

/* VR Container */
#vrContainer{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  background:#000;
  overflow:hidden;
}
body.vrmode #vrContainer{
  display:block;
}

/* A-Frame Scene */
#vrScene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* CSS 3D Layer - Sits on top of WebGL but syncs with camera */
#css3dLayer{
  position:absolute;
  inset:0;
  pointer-events:none; /* Let clicks pass through to panels */
  z-index:10;
}

/* VR Panels - These are the REAL DOM panels, positioned in 3D space */
.vr-panel{
  position:absolute;
  width:320px;
  height:480px;
  background: linear-gradient(180deg, rgba(10,10,10,.95), rgba(5,5,5,.98));
  border:1px solid rgba(232,226,214,.2);
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
  pointer-events:auto; /* Re-enable clicks for panels */
  transform-style:preserve-3d;
  backface-visibility:hidden;
  overflow:hidden;
  /* Prevent text selection during drag */
  user-select:none;
  -webkit-user-select:none;
}

.vr-panel .panel-content{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px;
  /* Enable momentum scrolling on iOS */
  -webkit-overflow-scrolling:touch;
}

/* Panel specific sizes */
.vr-panel[data-panel="left"]{ width:280px; height:500px; }
.vr-panel[data-panel="center"]{ width:360px; height:520px; }
.vr-panel[data-panel="right"]{ width:300px; height:480px; }

/* VR HUD */
#vrHud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:6000;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:rgba(10,10,10,.85);
  backdrop-filter: blur(10px);
  color:#e8e2d6;
  font-family: var(--mono);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-size:11px;
  pointer-events:auto;
}
#vrHud .left{display:flex; gap:10px; align-items:center;}
#vrHud .dot{width:8px;height:8px;border-radius:50%;background:rgba(232,226,214,.35);}
#vrHud[data-on="1"] .dot{background:rgba(120,255,180,.9);}
#vrHud button{
  all:unset;
  cursor:pointer;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);
}
#vrHud button:active{transform: translateY(1px); background:rgba(255,255,255,.1);}

#vrHint{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:6000;
  padding:10px 16px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.7);
  color:rgba(232,226,214,.9);
  font-family: var(--mono);
  letter-spacing:.10em;
  text-transform:uppercase;
  font-size:10px;
  text-align:center;
  pointer-events:none;
  transition:opacity .3s;
}

/* Reticle for gaze/click */
#reticle{
  position:fixed;
  top:50%;
  left:50%;
  width:20px;
  height:20px;
  border:2px solid rgba(232,226,214,.6);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:5500;
  pointer-events:none;
  transition:all .15s;
}
#reticle.active{
  border-color:rgba(120,255,180,.9);
  background:rgba(120,255,180,.2);
  transform:translate(-50%,-50%) scale(1.2);
}

/* Loading state */
#vrLoading{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:7000;
  color:var(--ink);
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:12px;
}
</style>
</head>

<body>
<header class="siteHeader" role="banner">
  <a href="https://jofrearchive.com/" target="_self" rel="noopener">
    <img src="https://inside.jofrearchive.com/assets/images/logo.png" alt="Jofre Archive">
  </a>
</header>

<div id="vitrine-bg"></div>
<div id="glass"></div>

<div class="page">
  <div class="wrap">
    <!-- LEFT: categories -->
    <aside class="panel" id="panelLeft" aria-label="Categories">
      <div class="panelHeader">
        <div class="kicker">studies / navigation</div>
        <div class="titleRow">
          <h2 class="h1">CATEGORIES</h2>
          <div class="pill" id="pillCount">— items</div>
        </div>
      </div>
      <div class="panelBody scrollY">
        <input class="input" id="q" type="search" placeholder="Search (title, tag, year) …" autocomplete="off">
        <div class="hr"></div>
        <div class="row" id="catRow"></div>
      </div>
    </aside>

    <!-- CENTER: wall -->
    <section class="wall" id="panelCenter" aria-label="Project wall">
      <div class="wallTop">
        <h3 class="wallTitle">PROJECT WALL</h3>
        <div class="row">
          <button class="btn" id="btnSort">Sort: newest</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>
        <div class="counter"><span id="shown">0</span> / <span id="total">0</span></div>
      </div>
      <div class="wallScroll">
        <div class="wallGrid" id="grid"></div>
      </div>
    </section>

    <!-- RIGHT: viewer -->
    <aside class="panel viewerCol" id="panelRight" aria-label="Viewer">
      <div class="panelHeader">
        <div class="kicker">retrieval / viewer</div>
        <div class="titleRow">
          <h2 class="h1" id="vTitle">SELECT A PROJECT</h2>
          <div class="pill" id="vCat">—</div>
        </div>
      </div>
      <div class="viewerMedia">
        <img id="vImg" alt="" src="" style="display:none">
        <div class="grid"></div>
      </div>
      <div class="viewerContent">
        <div id="vMeta"></div>
        <div class="hr"></div>
        <div class="excerpt" id="vText">Use the wall to open an entry.</div>
      </div>
      <div class="viewerFooter">
        <a class="link" id="vLink" href="#" target="_self" style="display:none">Open</a>
        <button class="btn" id="vCopy" disabled>Copy</button>
      </div>
    </aside>
  </div>
</div>

<!-- VR CONTAINER -->
<div id="vrContainer">
  <div id="vrLoading">Initializing VR Environment…</div>
  
  <!-- A-Frame Scene (invisible, used only for gyro camera) -->
  <a-scene id="vrScene" embedded vr-mode-ui="enabled: false" renderer="antialias:true; alpha:true; colorManagement:true">
    <a-entity id="cameraRig" position="0 0 0">
      <a-camera id="vrCamera" look-controls="enabled:true; reverseMouseDrag:false; touchEnabled:true; magicWindowTrackingEnabled:true" wasd-controls="enabled:false" fov="80"></a-camera>
    </a-entity>
    <!-- Invisible sphere for reference -->
    <a-sphere radius="50" material="visible:false" segments-width="32" segments-height="16"></a-sphere>
  </a-scene>

  <!-- CSS 3D Layer -->
  <div id="css3dLayer">
    <div class="vr-panel" data-panel="left" id="vrPanelLeft">
      <div class="panel-content" id="vrContentLeft"></div>
    </div>
    <div class="vr-panel" data-panel="center" id="vrPanelCenter">
      <div class="panel-content" id="vrContentCenter"></div>
    </div>
    <div class="vr-panel" data-panel="right" id="vrPanelRight">
      <div class="panel-content" id="vrContentRight"></div>
    </div>
  </div>

  <!-- VR HUD -->
  <div id="vrHud" data-on="0">
    <div class="left">
      <span class="dot"></span>
      <span>VR</span>
      <span style="opacity:.65">Gyro Active</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="vrRecenter">Recenter</button>
      <button id="vrExit">Exit VR</button>
    </div>
  </div>

  <div id="vrHint">Move phone to look around • Tap panels to interact</div>
  <div id="reticle"></div>
</div>

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script>
// ===========================
// DATA & STATE
// ===========================
const CATEGORIES = ['All', 'BioSystems', 'Landscape', 'Dystopic Pop Art', 'Cymatics', 'Public Art', 'Murals'];

const PROJECTS = [
  {
    id:"BIO-0001",
    title:"Cellulose solar panel (screen-print tests)",
    year:2024,
    place:"India / Spain",

let state = { category:"All", q:"", newestFirst:true, openId:null };

// ===========================
// DESKTOP APP LOGIC
// ===========================
const catRow = document.getElementById("catRow");
const qEl = document.getElementById("q");
const grid = document.getElementById("grid");
const shownEl = document.getElementById("shown");
const totalEl = document.getElementById("total");
const pillCount = document.getElementById("pillCount");
const btnSort = document.getElementById("btnSort");
const btnReset = document.getElementById("btnReset");

const vTitle = document.getElementById("vTitle");
const vCat = document.getElementById("vCat");
const vImg = document.getElementById("vImg");
const vMeta = document.getElementById("vMeta");
const vText = document.getElementById("vText");
const vLink = document.getElementById("vLink");
const vCopy = document.getElementById("vCopy");

function norm(s){ return String(s||"").toLowerCase().trim(); }
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function filtered(){
  let items = [...PROJECTS];
  if(state.category !== "All") items = items.filter(p => p.category === state.category);
  if(state.q){
    const q = norm(state.q);
    items = items.filter(p => norm([p.id,p.title,p.year,p.place,p.category,(p.tags||[]).join(" "),p.excerpt].join(" ")).includes(q));
  }
  items.sort((a,b)=> state.newestFirst ? (b.year - a.year) : (a.year - b.year));
  return items;
}

function renderCategories(){
  catRow.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type="button";
    b.className = "btn" + (c === state.category ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{ state.category = c; state.openId=null; renderAll(false); });
    catRow.appendChild(b);
  });
}

function kvRow(k,v){ return `<div class="kv"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`; }

function setViewerEmpty(){
  vTitle.textContent = "SELECT A PROJECT";
  vCat.textContent = "—";
  vText.textContent = "Use the wall to open an entry.";
  vMeta.innerHTML = "";
  vImg.style.display = "none";
  vImg.src = "";
  vLink.style.display = "none";
  vCopy.disabled = true;
}

function fillViewer(p){
  vTitle.textContent = p.title.toUpperCase();
  vCat.textContent = (p.category || "—").toUpperCase();
  vMeta.innerHTML =
    kvRow("ID", p.id) +
    kvRow("CATEGORY", p.category) +
    kvRow("YEAR", String(p.year)) +
    kvRow("PLACE", p.place || "—") +
    kvRow("TAGS", (p.tags||[]).join(", ") || "—");
  vText.textContent = p.excerpt || "—";
  const imgSrc = (p.images && p.images.length) ? p.images[0] : p.thumb;
  if(imgSrc){
    vImg.style.display = "block";
    vImg.src = imgSrc;
    vImg.alt = p.title;
  } else {
    vImg.style.display = "none";
    vImg.src = "";
  }
  if(p.link && p.link !== "#"){ vLink.style.display = "inline-block"; vLink.href = p.link; }
  else { vLink.style.display = "none"; }
  vCopy.disabled = false;
}

function openProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  state.openId = id;
  fillViewer(p);
  // If in VR mode, update VR viewer too
  if(isVRMode) updateVRViewer();
}

function renderWall(keepSelection){
  const items = filtered();
  totalEl.textContent = PROJECTS.length;
  shownEl.textContent = items.length;
  pillCount.textContent = PROJECTS.length + " items";

  grid.innerHTML = "";
  items.forEach(p=>{
    const el = document.createElement("div");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.innerHTML = `
      <div class="thumb">
        <img src="${escapeHtml(p.thumb)}" alt="${escapeHtml(p.title)}" loading="lazy"/>
        <div class="scan"></div>
      </div>
      <div class="cardBody">
        <div class="metaLine"><span>${escapeHtml(p.category)}</span><span>${escapeHtml(p.year)}</span></div>
        <div class="cardTitle">${escapeHtml(p.title)}</div>
        <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `;
    el.addEventListener("click", ()=> openProject(p.id));
    el.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openProject(p.id); }
    });
    grid.appendChild(el);
  });

  if(items.length === 0){
    const empty = document.createElement("div");
    empty.className = "smallHint";
    empty.style.padding = "14px";
    empty.textContent = "No matches.";
    grid.appendChild(empty);
    state.openId = null;
    setViewerEmpty();
    return;
  }

  if(keepSelection && state.openId && items.find(x=>x.id===state.openId)) return;
  openProject(items[0].id);
}

qEl.addEventListener("input",(e)=>{
  state.q = e.target.value;
  state.openId = null;
  renderAll(false);
});
btnSort.addEventListener("click", ()=>{
  state.newestFirst = !state.newestFirst;
  btnSort.textContent = "Sort: " + (state.newestFirst ? "newest" : "oldest");
  state.openId = null;
  renderAll(false);
});
btnReset.addEventListener("click", ()=>{
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  qEl.value = "";
  btnSort.textContent = "Sort: newest";
  renderAll(false);
  setViewerEmpty();
});

async function copyPayload(){
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return false;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{ await navigator.clipboard.writeText(payload); return true; }
  catch(_){ return false; }
}
vCopy.addEventListener("click", async ()=>{
  const ok = await copyPayload();
  vCopy.textContent = ok ? "Copied" : "Blocked";
  setTimeout(()=> vCopy.textContent = "Copy", 900);
});

function renderAll(keepSelection){ renderCategories(); renderWall(keepSelection); }
setViewerEmpty();
renderAll(false);

let isVRMode = false;
let vrCamera, vrScene;
let panels = {};
let cameraQuaternion = {x:0,y:0,z:0,w:1};
let targetQuaternion = {x:0,y:0,z:0,w:1};

// Panel configuration in 3D space (relative to camera)
const PANEL_CONFIG = {
  left:   { distance: 3.5, yaw: -35, pitch: 0, width: 2.8, height: 5.0 },
  center: { distance: 3.0, yaw: 0,   pitch: 0, width: 3.6, height: 5.2 },
  right:  { distance: 3.5, yaw: 35,  pitch: 0, width: 3.0, height: 5.0 }
};

function initVR(){
  const isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const isSmall = Math.min(window.innerWidth, window.innerHeight) <= 900;
  
  if(!isCoarse && !isSmall) return; // Only mobile
  
  // Wait for A-Frame
  if(!window.AFRAME){
    setTimeout(initVR, 100);
    return;
  }
  
  vrScene = document.getElementById('vrScene');
  vrCamera = document.getElementById('vrCamera');
  
  // Clone content to VR panels
  setupVRPanels();
  
  // Start render loop
  requestAnimationFrame(updateVR);
  
  // Hide loading
  setTimeout(()=>{
    document.getElementById('vrLoading').style.display = 'none';
  }, 500);
  
  // Auto-enter VR on mobile
  enterVR();
}

function setupVRPanels(){
  // Clone desktop panels into VR containers
  const leftContent = document.getElementById('vrContentLeft');
  const centerContent = document.getElementById('vrContentCenter');
  const rightContent = document.getElementById('vrContentRight');
  
  // Left: Categories
  leftContent.innerHTML = document.getElementById('panelLeft').innerHTML;
  // Re-attach events
  const leftSearch = leftContent.querySelector('#q');
  const leftCats = leftContent.querySelectorAll('#catRow .btn');
  
  if(leftSearch){
    leftSearch.value = state.q;
    leftSearch.addEventListener('input', (e)=>{
      state.q = e.target.value;
      state.openId = null;
      renderAll(false);
      syncVRToDesktop();
    });
  }
  
  leftCats.forEach((btn, idx)=>{
    btn.addEventListener('click', ()=>{
      state.category = CATEGORIES[idx];
      state.openId = null;
      renderAll(false);
      syncVRToDesktop();
      updateVRCategories();
    });
  });
  
  // Center: Project Wall
  updateVRWall();
  
  // Right: Viewer
  updateVRViewer();
  
  // Store references
  panels = {
    left: document.getElementById('vrPanelLeft'),
    center: document.getElementById('vrPanelCenter'),
    right: document.getElementById('vrPanelRight')
  };
}

function updateVRCategories(){
  const leftContent = document.getElementById('vrContentLeft');
  const catRow = leftContent.querySelector('#catRow');

  catRow.innerHTML = '';

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (c === state.category ? ' active' : '');

    b.addEventListener('click', ()=>{
      state.category = c;

function syncVRToDesktop(){
  // Update desktop inputs to match VR state
  qEl.value = state.q;
  renderCategories();
  renderWall(true);
}

function updateVR(){
  if(!isVRMode || !vrCamera) return;
  
  // Get camera rotation from A-Frame
  const camObj = vrCamera.object3D;
  camObj.updateMatrixWorld();
  
  // Extract yaw and pitch
  const rotation = new THREE.Euler().setFromQuaternion(camObj.quaternion, 'YXZ');
  const yaw = rotation.y;
  const pitch = rotation.x;
  
  // Position panels in arc around camera
  updatePanelPosition('left', yaw, pitch);
  updatePanelPosition('center', yaw, pitch);
  updatePanelPosition('right', yaw, pitch);
  
  requestAnimationFrame(updateVR);
}

function updatePanelPosition(id, camYaw, camPitch){
  const panel = panels[id];
  const config = PANEL_CONFIG[id];
  if(!panel || !config) return;
  
  // Calculate panel position relative to camera direction
  const totalYaw = camYaw + (config.yaw * Math.PI / 180);
  const totalPitch = camPitch + (config.pitch * Math.PI / 180);
  
  // Spherical to cartesian
  const x = Math.sin(totalYaw) * Math.cos(totalPitch) * config.distance;
  const y = Math.sin(totalPitch) * config.distance + 1.6; // + eye height
  const z = -Math.cos(totalYaw) * Math.cos(totalPitch) * config.distance;
  
  // Convert 3D position to screen coordinates for CSS transform
  // Simple perspective projection
  const fov = 80 * (Math.PI / 180);
  const aspect = window.innerWidth / window.innerHeight;
  
  // Project to screen space
  const scale = (window.innerHeight / 2) / Math.tan(fov / 2);
  const screenX = (x / -z) * scale + window.innerWidth / 2;
  const screenY = (y / -z) * scale + window.innerHeight / 2;
  
  // Calculate apparent size based on distance
  const distance = Math.sqrt(x*x + y*y + z*z);
  const apparentWidth = (config.width / distance) * scale;
  const apparentHeight = (config.height / distance) * scale;
  
  // Apply CSS transform
  // We use translate3d for GPU acceleration and rotate to face camera
  const rotateY = -config.yaw; // Counter-rotate to face camera
  
  panel.style.transform = `
    translate3d(${screenX - apparentWidth/2}px, ${screenY - apparentHeight/2}px, 0)
    rotateY(${rotateY}deg)
    scale(${apparentWidth / panel.offsetWidth})
  `;
  
  // Hide if behind camera
  if(z > 0){
    panel.style.opacity = '0';
    panel.style.pointerEvents = 'none';
  } else {
    panel.style.opacity = '1';
    panel.style.pointerEvents = 'auto';
  }
}

function enterVR(){
  document.body.classList.add('vrmode');
  isVRMode = true;
  document.getElementById('vrHud').setAttribute('data-on', '1');
  
  // Request device orientation permission on iOS
  if(typeof DeviceOrientationEvent !== 'undefined' && 
     typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
  
  // Update VR content
  updateVRCategories();
  updateVRWall();
  updateVRViewer();
}

function exitVR(){
  document.body.classList.remove('vrmode');
  isVRMode = false;
  document.getElementById('vrHud').setAttribute('data-on', '0');
}

// Event Listeners
document.getElementById('vrExit').addEventListener('click', exitVR);
document.getElementById('vrRecenter').addEventListener('click', ()=>{
  if(vrCamera && vrCamera.components['look-controls']){
    vrCamera.components['look-controls'].pitchObject.rotation.x = 0;
    vrCamera.components['look-controls'].yawObject.rotation.y = 0;
  }
});

// Touch/Drag handling for scrolling panels
let touchStartY = 0;
let touchStartScroll = 0;
let currentScrollElement = null;

document.querySelectorAll('.vr-panel').forEach(panel=>{
  panel.addEventListener('touchstart', (e)=>{
    currentScrollElement = e.target.closest('.panel-content');
    if(currentScrollElement){
      touchStartY = e.touches[0].clientY;
      touchStartScroll = currentScrollElement.scrollTop;
    }
  }, {passive:true});
  
  panel.addEventListener('touchmove', (e)=>{
    if(!currentScrollElement) return;
    const deltaY = touchStartY - e.touches[0].clientY;
    currentScrollElement.scrollTop = touchStartScroll + deltaY;
  }, {passive:true});
});

// Initialize
window.addEventListener('load', initVR);
</script>
