<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Studies — Project Wall</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --muted:rgba(232,226,214,.72);
  --line:rgba(232,226,214,.16);
  --line2:rgba(232,226,214,.12);
  --mono:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --serif:"EB Garamond", serif;
  --shadow:0 40px 90px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden; /* fixed columns */
}

/* Vitrine background */
#vitrine-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.42)),
    #0b0b0b;
}
#vitrine-bg::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.010) 0px, rgba(255,255,255,.010) 1px, transparent 2px, transparent 5px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.007) 0px, rgba(255,255,255,.007) 1px, transparent 2px, transparent 9px);
  opacity:.18; mix-blend-mode:overlay;
}
#glass{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(115deg, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(900px 650px at 60% 25%, rgba(255,255,255,.06), transparent 55%);
  opacity:.22; mix-blend-mode:screen;
}
body::after{
  content:""; position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 40%, rgba(0,0,0,.88) 100%);
  opacity:.55;
}

/* Header */
.siteHeader{
  position:fixed; top:0; left:0; right:0;
  height: calc(96px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display:flex; align-items:center; justify-content:center;
  z-index: 1000;
  pointer-events:none;
}
.siteHeader a{pointer-events:auto; text-decoration:none}
.siteHeader img{height:56px; width:auto; display:block; opacity:.92}
.siteHeader img:hover{opacity:1}

/* Fixed viewport layout */
.page{
  position:relative;
  z-index:10;
  height:100vh;
  padding: calc(110px + env(safe-area-inset-top)) clamp(10px, 2.2vw, 22px) clamp(10px, 2.2vw, 22px);
}
.wrap{
  width:min(1320px, 100%);
  height: calc(100vh - (110px + env(safe-area-inset-top)) - clamp(10px, 2.2vw, 22px));
  margin:0 auto;
  display:grid;
  grid-template-columns: 260px 1fr 420px;
  gap:14px;
  align-items:stretch;
}

/* Panels */
.panel{
  border:1px solid var(--line2);
  background: linear-gradient(180deg, rgba(10,10,10,.86), rgba(0,0,0,.46));
  box-shadow: var(--shadow);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.panel::before{
  content:"";
  position:absolute; inset:10px;
  pointer-events:none;
  background:
    linear-gradient(var(--line),var(--line)) left top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right top / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) left bottom / 1px 22px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 22px 1px no-repeat,
    linear-gradient(var(--line),var(--line)) right bottom / 1px 22px no-repeat;
  opacity:.85;
  z-index:0;
}
.panelHeader{
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.92);
  position:relative;
  z-index:2;
}
.kicker{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:11px;
  opacity:.68;
  margin-bottom:6px;
}
.titleRow{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.h1{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:16px;
}
.pill{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.14);
  background: rgba(255,255,255,.03);
  opacity:.9;
}
.panelBody{
  padding:14px 16px 16px;
  position:relative;
  z-index:2;
  min-height:0;
  flex:1;
}
.hr{height:1px;background:rgba(232,226,214,.12);margin:12px 0}

/* Controls */
.input{
  width:100%;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  color:var(--ink);
  padding:10px 10px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.10em;
  font-size:11px;
  outline:none;
}
.row{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:var(--ink);
  background: rgba(255,255,255,.03);
  border:1px solid rgba(232,226,214,.22);
  padding:10px 12px;
  cursor:pointer;
  opacity:.92;
  transition:all .2s ease;
}
.btn:hover{opacity:1;background:rgba(255,255,255,.05)}
.btn.active{
  background: rgba(255,255,255,.08);
  border-color: rgba(232,226,214,.40);
}
.smallHint{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.62;
}

/* Internal scrolls */
.scrollY{overflow:auto; scrollbar-width:none;}
.scrollY::-webkit-scrollbar{width:0;height:0}

/* Wall column */
.wall{
  border:1px solid rgba(232,226,214,.12);
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 22px),
    radial-gradient(900px 650px at 50% 30%, rgba(232,226,214,.075), transparent 58%),
    rgba(0,0,0,.18);
  position:relative;
  box-shadow: var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.wallTop{
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; flex-wrap:wrap;
  padding:16px 16px 14px;
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(10,10,10,.72);
  position:relative;
  z-index:2;
}
.wallTitle{
  margin:0;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:500;
  font-size:14px;
}
.counter{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  opacity:.72;
}
.wallScroll{
  flex:1;
  min-height:0;
  overflow:auto; /* only scrolling area for projects */
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.wallScroll::-webkit-scrollbar{width:0;height:0}
.wallGrid{
  padding:14px;
  display:grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap:12px;
}

/* Cards */
.card{
  border:1px solid rgba(232,226,214,.14);
  background: rgba(0,0,0,.22);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transform: translateZ(0);
}
.card::before{
  content:"";
  position:absolute; inset:-2px;
  pointer-events:none;
  background: radial-gradient(520px 240px at 30% 0%, rgba(255,255,255,.10), transparent 60%);
  opacity:0;
  transition: opacity .18s ease;
}
.card:hover{ border-color: rgba(232,226,214,.26); background: rgba(255,255,255,.03); }
.card:hover::before{ opacity:.85; }
.thumb{
  aspect-ratio: 4 / 3;
  width:100%;
  background: rgba(255,255,255,.03);
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(232,226,214,.10);
}
.thumb img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
  filter: saturate(.95) contrast(1.05);
  opacity:.92;
}
.thumb .scan{
  position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(232,226,214,.22) 50%, transparent 100%);
  opacity:.10;
  transform: translateY(-60%);
  animation: scan 5.2s linear infinite;
  mix-blend-mode: screen;
}
@keyframes scan{0%{transform:translateY(-70%)}100%{transform:translateY(80%)}}
.cardBody{padding:12px 12px 11px; position:relative; z-index:2}
.metaLine{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.12em;
  font-size:10px;
  opacity:.78;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.cardTitle{
  margin:8px 0 8px;
  font-size:16px;
  line-height:1.25;
  opacity:.96;
}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px;
  padding:6px 8px;
  border:1px solid rgba(232,226,214,.13);
  background: rgba(255,255,255,.03);
  opacity:.9;
}

/* Viewer */
.viewerMedia{
  border-bottom:1px solid rgba(232,226,214,.12);
  background: rgba(0,0,0,.22);
  aspect-ratio: 4 / 3;
  position:relative;
  overflow:hidden;
}
.viewerMedia img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;filter:saturate(.95) contrast(1.05);}
.viewerMedia .grid{
  position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(232,226,214,.06) 0px, rgba(232,226,214,.06) 1px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(232,226,214,.05) 0px, rgba(232,226,214,.05) 1px, transparent 2px, transparent 18px);
  opacity:.20; mix-blend-mode:overlay;
}
.viewerContent{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:14px 16px 16px;
  scrollbar-width:none;
  position:relative;
  z-index:2;
}
.viewerContent::-webkit-scrollbar{width:0;height:0;}
.kv{
  display:flex; justify-content:space-between; gap:10px;
  padding:6px 0;
  border-top:1px dashed rgba(232,226,214,.12);
}
.kv:first-of-type{border-top:0;padding-top:0;}
.k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.10em;font-size:10px;opacity:.65;}
.v{font-family:var(--mono);letter-spacing:.08em;font-size:10px;opacity:.92;text-align:right;}
.excerpt{
  margin:12px 0 0;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.7;
  letter-spacing:.05em;
  white-space:pre-wrap;
  opacity:.92;
  text-shadow: 0 0 10px rgba(232,226,214,.08), 0 0 2px rgba(232,226,214,.08);
}
.viewerFooter{
  border-top:1px solid rgba(232,226,214,.12);
  padding:12px 16px;
  background: rgba(10,10,10,.92);
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  position:relative;
  z-index:2;
}
.link{
  color:var(--ink);
  text-decoration:none;
  border:1px solid rgba(232,226,214,.22);
  background: rgba(255,255,255,.03);
  padding:10px 12px;
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  opacity:.92;
}
.link:hover{opacity:1;background:rgba(255,255,255,.05);}

/* Responsive */
@media (max-width: 1100px){ .wrap{grid-template-columns: 260px 1fr} .viewerCol{display:none} }
@media (max-width: 860px){ .wrap{grid-template-columns:1fr} .wallGrid{grid-template-columns: repeat(2, minmax(0, 1fr));} }
@media (max-width: 520px){ .siteHeader{height:calc(84px + env(safe-area-inset-top))} .siteHeader img{height:44px} .wallGrid{grid-template-columns:1fr} }

/* ===========================
   MOBILE 3D DOM (Three.js CSS3DRenderer)
   - Only activates on phones (coarse pointer)
   - Keeps DOM fully interactive (real clicks/scroll/inputs)
=========================== */
#vr3dRoot{ display:none; }
body.vr3d-on{
  overflow:hidden !important;
  height:100vh;
  width:100vw;
}
body.vr3d-on #vr3dRoot{
  display:block;
  position:fixed;
  inset:0;
  z-index:5000;
  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06), transparent 58%),
    radial-gradient(900px 700px at 70% 30%, rgba(255,255,255,.04), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 55%, rgba(0,0,0,.55)),
    #0b0b0b;
}
body.vr3d-on #vr3dBgVignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 38%, rgba(0,0,0,.92) 100%);
  opacity:.75;
}
body.vr3d-on .siteHeader,
body.vr3d-on .page,
body.vr3d-on #vitrine-bg,
body.vr3d-on #glass{
  display:none !important;
}
body.vr3d-on::after{ display:none !important; }

/* Make panels readable on phone inside 3D */
body.vr3d-on .panel,
body.vr3d-on .wall{
  box-shadow: 0 40px 90px rgba(0,0,0,.72);
  transform: translateZ(0);
}

/* HUD */
#vr3dHud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:6000;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:rgba(10,10,10,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--ink);
  font-family: var(--mono);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-size:11px;
  user-select:none;
}
#vr3dHud .left{display:flex; gap:10px; align-items:center;}
#vr3dHud .dot{width:8px;height:8px;border-radius:50%;background:rgba(232,226,214,.35);}
#vr3dHud[data-on="1"] .dot{background:rgba(120,255,180,.9);}
#vr3dHud input{
  width:min(42vw, 220px);
  max-width:220px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.03);
  color:var(--ink);
  border-radius:12px;
  padding:8px 10px;
  font-family: var(--mono);
  letter-spacing:.10em;
  text-transform:uppercase;
  font-size:11px;
  outline:none;
  opacity:.92;
}
#vr3dHud input::placeholder{ color: rgba(232,226,214,.55); }
#vr3dHud button{
  all:unset;
  cursor:pointer;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.03);
  opacity:.92;
}
#vr3dHud button:active{transform: translateY(1px);}

#vr3dHint{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:6000;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.55);
  color:rgba(232,226,214,.82);
  font-family: var(--mono);
  letter-spacing:.10em;
  text-transform:uppercase;
  font-size:10px;
  max-width:92vw;
  text-align:center;
  user-select:none;
}

/* Ensure touch scrolling works inside panels */
body.vr3d-on .scrollY,
body.vr3d-on .wallScroll,
body.vr3d-on .viewerContent{
  -webkit-overflow-scrolling: touch;
}

</style>
</head>

<body>
<header class="siteHeader" role="banner" aria-label="Primary">
  <a href="https://jofrearchive.com/" target="_self" rel="noopener" aria-label="Home">
    <img src="https://inside.jofrearchive.com/assets/images/logo.png" alt="Jofre Archive">
  </a>
</header>

<div id="vitrine-bg" aria-hidden="true"></div>
<div id="glass" aria-hidden="true"></div>

<div class="page">
  <div class="wrap">

    <!-- LEFT: categories + filters -->
    <aside class="panel" aria-label="Categories">
      <div class="panelHeader">
        <div class="kicker">studies / navigation</div>
        <div class="titleRow">
          <h2 class="h1">CATEGORIES</h2>
          <div class="pill" id="pillCount">— items</div>
        </div>
      </div>
      <div class="panelBody scrollY">
        <input class="input" id="q" type="search" placeholder="Search (title, tag, year) …" autocomplete="off">
        <div class="hr"></div>
        <div class="row" id="catRow"></div>
</div>
    </aside>

    <!-- CENTER: wall (scroll inside) -->
    <section class="wall" aria-label="Project wall">
      <div class="wallTop">
        <h3 class="wallTitle">PROJECT WALL</h3>
        
        <div class="row">
          <button class="btn" id="btnSort">Sort: newest</button>
          <button class="btn" id="btnReset">Reset</button>
        </div>

        <div class="counter"><span id="shown">0</span> / <span id="total">0</span></div>
      </div>
      <div class="wallScroll">
        <div class="wallGrid" id="grid"></div>
      </div>
    </section>

    <!-- RIGHT: viewer -->
    <aside class="panel viewerCol" aria-label="Viewer">
      <div class="panelHeader">
        <div class="kicker">retrieval / viewer</div>
        <div class="titleRow">
          <h2 class="h1" id="vTitle">SELECT A PROJECT</h2>
          <div class="pill" id="vCat">—</div>
        </div>
      </div>

      <div class="viewerMedia">
        <img id="vImg" alt="" src="" style="display:none">
        <div class="grid" aria-hidden="true"></div>
      </div>

      <div class="viewerContent">
        <div id="vMeta"></div>
        <div class="hr"></div>
        <div class="excerpt" id="vText">Use the wall to open an entry.</div>
      </div>

      <div class="viewerFooter">
        <a class="link" id="vLink" href="#" target="_self" style="display:none">Open</a>
        <button class="btn" id="vCopy" disabled>Copy</button>
      </div>
    </aside>

  </div>
</div>

<script>
const CATEGORIES = ['All', 'BioSystems', 'Landscape', 'Dystopic Pop Art', 'Cymatics', 'Public Art', 'Murals'];

const PROJECTS = [
  {
    id:"BIO-0001",
    title:"Cellulose solar panel (screen-print tests)",
    year:2024,
    place:"India / Spain",
    category:"BioSystems",
    tags:["cellulose","serigraphy","solar"],
    thumb:'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22800%22%20height%3D%22600%22%3E%0A%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%230a0a0a%22/%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23e8e2d6%22%20stroke-opacity%3D%22.22%22%3E%0A%3Cpath%20d%3D%22M80%20140%20H720%22/%3E%3Cpath%20d%3D%22M80%20200%20H620%22/%3E%3Cpath%20d%3D%22M80%20260%20H700%22/%3E%3Cpath%20d%3D%22M80%20320%20H560%22/%3E%3Cpath%20d%3D%22M80%20380%20H680%22/%3E%0A%3C/g%3E%0A%3Ctext%20x%3D%2280%22%20y%3D%22520%22%20fill%3D%22%23e8e2d6%22%20fill-opacity%3D%22.78%22%20font-family%3D%22monospace%22%20font-size%3D%2220%22%3EBIOSYSTEMS%20/%20MATERIAL%20TEST%3C/text%3E%0A%3C/svg%3E',
    images:[],
    excerpt:"Translucent cellulose substrate + conductive layers (N/P).\nFlexible, transparent panel logic.",
    link:"#"
  },
  {
    id:"LAN-0001",
    title:"Leaf-pattern cartography studies",
    year:2025,
    place:"Mediterranean basin",

let state = { category:"All", q:"", newestFirst:true, openId:null };

const catRow = document.getElementById("catRow");
const qEl = document.getElementById("q");
const grid = document.getElementById("grid");
const shownEl = document.getElementById("shown");
const totalEl = document.getElementById("total");
const pillCount = document.getElementById("pillCount");
const btnSort = document.getElementById("btnSort");
const btnReset = document.getElementById("btnReset");

const vTitle = document.getElementById("vTitle");
const vCat = document.getElementById("vCat");
const vImg = document.getElementById("vImg");
const vMeta = document.getElementById("vMeta");
const vText = document.getElementById("vText");
const vLink = document.getElementById("vLink");
const vCopy = document.getElementById("vCopy");

function norm(s){ return String(s||"").toLowerCase().trim(); }
function escapeHtml(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function filtered(){
  let items = [...PROJECTS];
  if(state.category !== "All") items = items.filter(p => p.category === state.category);
  if(state.q){
    const q = norm(state.q);
    items = items.filter(p => norm([p.id,p.title,p.year,p.place,p.category,(p.tags||[]).join(" "),p.excerpt].join(" ")).includes(q));
  }
  items.sort((a,b)=> state.newestFirst ? (b.year - a.year) : (a.year - b.year));
  return items;
}

function renderCategories(){
  catRow.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.type="button";
    b.className = "btn" + (c === state.category ? " active" : "");
    b.textContent = c;
    b.addEventListener("click", ()=>{ state.category = c; state.openId=null; renderAll(false); });
    catRow.appendChild(b);
  });
}

function kvRow(k,v){ return `<div class="kv"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`; }

function setViewerEmpty(){
  vTitle.textContent = "SELECT A PROJECT";
  vCat.textContent = "—";
  vText.textContent = "Use the wall to open an entry.";
  vMeta.innerHTML = "";
  vImg.style.display = "none";
  vImg.src = "";
  vLink.style.display = "none";
  vCopy.disabled = true;
}

function fillViewer(p){
  vTitle.textContent = p.title.toUpperCase();
  vCat.textContent = (p.category || "—").toUpperCase();
  vMeta.innerHTML =
    kvRow("ID", p.id) +
    kvRow("CATEGORY", p.category) +
    kvRow("YEAR", String(p.year)) +
    kvRow("PLACE", p.place || "—") +
    kvRow("TAGS", (p.tags||[]).join(", ") || "—");
  vText.textContent = p.excerpt || "—";
  const imgSrc = (p.images && p.images.length) ? p.images[0] : p.thumb;
  if(imgSrc){
    vImg.style.display = "block";
    vImg.src = imgSrc;
    vImg.alt = p.title;
  } else {
    vImg.style.display = "none";
    vImg.src = "";
  }
  if(p.link && p.link !== "#"){ vLink.style.display = "inline-block"; vLink.href = p.link; }
  else { vLink.style.display = "none"; }
  vCopy.disabled = false;
}

function openProject(id){
  const p = PROJECTS.find(x=>x.id===id);
  if(!p) return;
  state.openId = id;
  fillViewer(p);
}

function renderWall(keepSelection){
  const items = filtered();
  totalEl.textContent = PROJECTS.length;
  shownEl.textContent = items.length;
  pillCount.textContent = PROJECTS.length + " items";

  grid.innerHTML = "";
  items.forEach(p=>{
    const el = document.createElement("div");
    el.className = "card";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.innerHTML = `
      <div class="thumb">
        <img src="${escapeHtml(p.thumb)}" alt="${escapeHtml(p.title)}" loading="lazy"/>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div class="cardBody">
        <div class="metaLine"><span>${escapeHtml(p.category)}</span><span>${escapeHtml(p.year)}</span></div>
        <div class="cardTitle">${escapeHtml(p.title)}</div>
        <div class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>
      </div>
    `;
    el.addEventListener("click", ()=> openProject(p.id));
    el.addEventListener("keydown",(e)=>{
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openProject(p.id); }
    });
    grid.appendChild(el);
  });

  if(items.length === 0){
    const empty = document.createElement("div");
    empty.className = "smallHint";
    empty.style.padding = "14px";
    empty.textContent = "No matches.";
    grid.appendChild(empty);
    state.openId = null;
    setViewerEmpty();
    return;
  }

  if(keepSelection && state.openId && items.find(x=>x.id===state.openId)) return;
  openProject(items[0].id);
}

qEl.addEventListener("input",(e)=>{
  state.q = e.target.value;
  state.openId = null;
  renderAll(false);
});
btnSort.addEventListener("click", ()=>{
  state.newestFirst = !state.newestFirst;
  btnSort.textContent = "Sort: " + (state.newestFirst ? "newest" : "oldest");
  state.openId = null;
  renderAll(false);
});
btnReset.addEventListener("click", ()=>{
  state.category = "All";
  state.q = "";
  state.newestFirst = true;
  state.openId = null;
  qEl.value = "";
  btnSort.textContent = "Sort: newest";
  renderAll(false);
  setViewerEmpty();
});

async function copyPayload(){
  const p = PROJECTS.find(x=>x.id===state.openId);
  if(!p) return false;
  const payload = `${p.title}\n${p.id} · ${p.category} · ${p.year} · ${p.place}\nTags: ${(p.tags||[]).join(", ")}\n\n${p.excerpt}`;
  try{ await navigator.clipboard.writeText(payload); return true; }
  catch(_){ return false; }
}
vCopy.addEventListener("click", async ()=>{
  const ok = await copyPayload();
  vCopy.textContent = ok ? "Copied" : "Blocked";
  setTimeout(()=> vCopy.textContent = "Copy", 900);
});

function renderAll(keepSelection){ renderCategories(); renderWall(keepSelection); }
setViewerEmpty();
renderAll(false);
</script>

<div id="vr3dRoot" aria-hidden="true">

      <button type="button" id="vr3dExit">Exit</button>
    </div>
  </div>
  <div id="vr3dHint">Move your phone • Drag to look around • Scroll inside panels</div>
  <div id="vr3dStage" style="position:absolute; inset:0;"></div>
</div>

<!-- Three.js + CSS3DRenderer + DeviceOrientationControls (bundled to avoid CDN issues) -->

<script>

(function(){
  // Preflight
  function showFatal(msg){
    var hint = document.getElementById("vr3dHint");
    var hud = document.getElementById("vr3dHud");
    if(hud) hud.setAttribute("data-on","0");
    if(hint){ hint.style.opacity="1"; hint.textContent = msg; }
    // If we cannot init, fall back to desktop UI
    document.body.classList.remove("vr3d-on");
    var root = document.getElementById("vr3dRoot");
    if(root) root.style.display = "none";
  }

  const isCoarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const isSmall = Math.min(window.innerWidth, window.innerHeight) <= 820;
  const isMobile = isCoarse || isSmall;
  if(!isMobile) return;

  if(!window.THREE){ showFatal('Three.js not loaded (offline?)'); return; }
  if(!window.THREE.CSS3DRenderer){ showFatal('CSS3DRenderer not available'); return; }

  const wrap = document.querySelector(".wrap");
  if(!wrap) return;

  // Original columns (your real UI)
  const left  = wrap.querySelector("aside.panel:not(.viewerCol)");
  const mid   = wrap.querySelector("section.wall");
  const right = wrap.querySelector("aside.viewerCol");
  if(!left || !mid || !right) return;

  const restore = [
    {el:left,  parent:left.parentNode,  next:left.nextSibling},
    {el:mid,   parent:mid.parentNode,   next:mid.nextSibling},
    {el:right, parent:right.parentNode, next:right.nextSibling}
  ];

  const root = document.getElementById("vr3dRoot");
  const stage = document.getElementById("vr3dStage");
  const hud = document.getElementById("vr3dHud");
  const hint = document.getElementById("vr3dHint");
  const btnEnable = document.getElementById("vr3dEnable");
  const btnExit = document.getElementById("vr3dExit");
  const vrSearch = document.getElementById("vr3dSearch");
  const desktopSearch = document.getElementById("q");

  // Activate VR DOM mode
  document.body.classList.add("vr3d-on");
  root.setAttribute("aria-hidden", "false");

  // CSS3D scene
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
  camera.position.set(0, 0, 0.01); // inside the "dish"

  const renderer = new THREE.CSS3DRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.style.position = "absolute";
  renderer.domElement.style.top = "0";
  renderer.domElement.style.left = "0";
  renderer.domElement.style.pointerEvents = "auto"; // DOM remains interactive
  stage.appendChild(renderer.domElement);

  // Wrap panels as CSS3DObjects (REAL DOM)
  function prepEl(el){
    el.style.margin = "0";
    el.style.position = "absolute";
    el.style.left = "0";
    el.style.top = "0";
  }
  prepEl(left); prepEl(mid); prepEl(right);

  const objL = new THREE.CSS3DObject(left);
  const objM = new THREE.CSS3DObject(mid);
  const objR = new THREE.CSS3DObject(right);

  scene.add(objL); scene.add(objM); scene.add(objR);

  // Parabolic/dish placement: concave arc around camera
  function place(){
    const w = Math.min(window.innerWidth, window.innerHeight);
    const R = (w < 420) ? 900 : (w < 520 ? 1050 : 1200); // px-ish units
    const spread = (w < 420) ? 32 : 28; // degrees

    const toRad = d => d*Math.PI/180;

    // scale for readability
    const s = (w < 420) ? 0.75 : (w < 520 ? 0.82 : 0.9);
    objL.scale.setScalar(s);
    objM.scale.setScalar(s);
    objR.scale.setScalar(s);

    function setOnArc(obj, angDeg){
      const a = toRad(angDeg);
      const x = Math.sin(a) * R;
      const z = -Math.cos(a) * R;
      obj.position.set(x, 0, z);
      obj.lookAt(camera.position); // screen-facing
    }

    setOnArc(objL, -spread);
    setOnArc(objM, 0);
    setOnArc(objR, spread);

    // Center slightly closer for readability
    objM.position.z += 120;

    objL.position.y = 0;
    objM.position.y = 0;
    objR.position.y = 0;
  }
  place();

  // Motion controls (gyro) + drag offset fallback
  let controls = null;
  let motionEnabled = false;

  // Drag offsets (applied on top of gyro)
  const drag = {active:false, x0:0, y0:0, yaw0:0, pitch0:0, yaw:0, pitch:0};
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const MAX_YAW = Math.PI/5.2;   // ~34°
  const MAX_PITCH = Math.PI/10;  // ~18°

  function applyOffsets(){
    const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), drag.yaw);
    const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), drag.pitch);
    const q = new THREE.Quaternion().multiplyQuaternions(qYaw, qPitch);
    camera.quaternion.multiply(q);
  }

  async function enableMotion(){
    try{
      if(typeof DeviceOrientationEvent !== "undefined" &&
         typeof DeviceOrientationEvent.requestPermission === "function"){
        const res = await DeviceOrientationEvent.requestPermission();
        if(res !== "granted") throw new Error("permission not granted");
      }
      controls = new THREE.DeviceOrientationControls(camera);
      motionEnabled = true;
      hud.setAttribute("data-on","1");
      btnEnable.textContent = "On";
      if(hint) setTimeout(()=>{ hint.style.opacity = "0"; }, 1800);
    }catch(e){
      motionEnabled = false;
      hud.setAttribute("data-on","0");
      btnEnable.textContent = "Enable motion";
      if(hint) hint.textContent = "On iPhone: tap Enable motion • Then move phone";
    }
  }

  btnEnable && btnEnable.addEventListener("click", enableMotion);
  enableMotion(); // auto-try (Android)

  // Drag on empty space to look around (do NOT hijack scrolling inside panels)
  function ignoreDrag(t){
    return !!(t && t.closest && t.closest(".scrollY, .wallScroll, .viewerContent, input, textarea, button, a, select"));
  }
  window.addEventListener("touchstart", (e)=>{
    const t = e.target;
    if(ignoreDrag(t)) return;
    drag.active = true;
    const p = e.touches[0];
    drag.x0 = p.clientX; drag.y0 = p.clientY;
    drag.yaw0 = drag.yaw; drag.pitch0 = drag.pitch;
  }, {passive:true});

  window.addEventListener("touchmove", (e)=>{
    if(!drag.active) return;
    const p = e.touches[0];
    const dx = (p.clientX - drag.x0);
    const dy = (p.clientY - drag.y0);
    const k = 0.0032;
    drag.yaw = clamp(drag.yaw0 + dx*k, -MAX_YAW, MAX_YAW);
    drag.pitch = clamp(drag.pitch0 + dy*k, -MAX_PITCH, MAX_PITCH);
  }, {passive:true});

  window.addEventListener("touchend", ()=>{ drag.active=false; }, {passive:true});
  window.addEventListener("touchcancel", ()=>{ drag.active=false; }, {passive:true});

  // Search HUD controls your real search input
  if(vrSearch && desktopSearch){
    vrSearch.addEventListener("input", ()=>{
      desktopSearch.value = vrSearch.value;
      desktopSearch.dispatchEvent(new Event("input", {bubbles:true}));
    });
  }

  // Exit: restore desktop layout instantly
  btnExit && btnExit.addEventListener("click", ()=>{
    document.body.classList.remove("vr3d-on");
    root.setAttribute("aria-hidden","true");
    try{ stage.removeChild(renderer.domElement); }catch(_){}
    restore.forEach(r=>{
      try{
        if(r.next) r.parent.insertBefore(r.el, r.next);
        else r.parent.appendChild(r.el);
        r.el.style.position = "";
        r.el.style.left = "";
        r.el.style.top = "";
        r.el.style.margin = "";
      }catch(_){}
    });
  });

  function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    place();
  }
  window.addEventListener("resize", ()=>setTimeout(onResize, 120), {passive:true});
  window.addEventListener("orientationchange", ()=>setTimeout(onResize, 250), {passive:true});

  // Render loop
  function tick(){
    if(controls && motionEnabled){
      controls.update();
      applyOffsets(); // drag offsets after gyro update
    } else {
      camera.rotation.set(drag.pitch, drag.yaw, 0);
    }

    // Keep panels facing camera for legibility (parabolic dish)
    objL.lookAt(camera.position);
    objM.lookAt(camera.position);
    objR.lookAt(camera.position);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
})();
</script>
