<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Jofre Archive — Studies VR (Inertial Flow)</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet"/>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
body{margin:0;background:#0b0b0b;overflow:hidden;font-family:'Source Code Pro',monospace;color:#e8e2d6}
#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10}
button{background:rgba(0,0,0,.6);border:1px solid rgba(232,226,214,.3);color:#e8e2d6;padding:8px 16px;margin:0 4px;cursor:pointer}
</style>
</head>
<body>

<div id="ui">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

<a-scene background="color:#0b0b0b" renderer="antialias:true">
  <a-light type="ambient" intensity="0.6"></a-light>
  <a-entity id="rig" position="0 1.6 -2.6" rotation="16 0 0"></a-entity>
  <a-entity position="0 1.6 0">
    <a-camera look-controls="enabled:true"></a-camera>
  </a-entity>
</a-scene>

<script>
const DATA=[
  {id:"S-001",title:"Mycelium Sculpture",year:2024},
  {id:"S-002",title:"Transparent Solar Leaf",year:2024},
  {id:"S-003",title:"Interspecies Archaeology",year:2025},
  {id:"S-004",title:"Carnival Society",year:2023},
  {id:"S-005",title:"Frequency Plate",year:2022}
];

const CFG={WIDTH:2,HEIGHT:3};
let targetIndex=0;
let currentIndex=0;
let cards=[];

const rig=document.getElementById("rig");

function buildCards(){
  DATA.forEach((p,i)=>{
    const el=document.createElement("a-plane");
    el.setAttribute("width",CFG.WIDTH);
    el.setAttribute("height",CFG.HEIGHT);
    el.setAttribute("color","#111");
    el.setAttribute("material","shader:flat");
    el.setAttribute("text",{
      value:p.id+"\n"+p.title+"\n"+p.year,
      align:"center",
      color:"#e8e2d6",
      width:4
    });
    rig.appendChild(el);
    cards.push(el);
  });
}

function update(){
  currentIndex += (targetIndex-currentIndex)*0.1;
  cards.forEach((el,i)=>{
    const offset=i-currentIndex;
    const abs=Math.abs(offset);
    const x=offset*0.4;
    const y=abs*0.05;
    const z=-abs*0.6;
    const sc=1-abs*0.03;
    const rotY=offset*-8;
    el.setAttribute("position",`${x} ${y} ${z}`);
    el.setAttribute("rotation",`0 ${rotY} 0`);
    el.setAttribute("scale",`${sc} ${sc} ${sc}`);
    el.object3D.visible=abs<4;
  });
  requestAnimationFrame(update);
}

function next(){targetIndex=(targetIndex+1)%DATA.length}
function prev(){targetIndex=(targetIndex-1+DATA.length)%DATA.length}

buildCards();
update();
</script>

</body>
</html>
