<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Jofre Archive — Network</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --ink:#e8e2d6;
  --panel: rgba(15,15,15,.78);
  --border: rgba(255,255,255,.16);
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'EB Garamond', serif;}
#graph{position:fixed;inset:0;z-index:1;}
#vitrine-bg{position:fixed;inset:-2%;z-index:0;pointer-events:none;background:
radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 100%),
radial-gradient(800px 600px at 15% 85%, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 100%);
filter:blur(40px);}

/* UI */
#ui-overlay{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));}
header,footer{display:flex;justify-content:space-between;align-items:flex-end;pointer-events:auto;}
.logo{font-size:1.4rem;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;opacity:0.9;}
.meta-status{font-family:var(--mono);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;opacity:0.5;text-align:right;}

/* Botón Gyro Estilo o-verticala */
#gyro-btn{
  pointer-events:auto;
  background:transparent;
  border:1px solid var(--border);
  color:var(--ink);
  padding:8px 16px;
  font-family:var(--mono);
  font-size:0.7rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .3s ease;
  display:flex;
  align-items:center;
  gap:10px;
}
#gyro-btn:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.4);}
#gyro-dot{width:6px;height:6px;border-radius:50%;background:#333;transition:all .3s ease;}
#gyro-btn.active #gyro-dot{background:#4ade80;box-shadow:0 0 8px #4ade80;}

/* Info Panel */
#info-panel{position:fixed;bottom:max(80px, env(safe-area-inset-bottom));left:max(20px, env(safe-area-inset-left));width:min(340px, 85vw);background:var(--panel);backdrop-filter:blur(15px);border:1px solid var(--border);padding:24px;z-index:20;opacity:0;transform:translateY(10px);transition:all 0.5s cubic-bezier(0.16,1,0.3,1);pointer-events:none;}
#info-panel.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
.panel-label{font-family:var(--mono);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.2em;opacity:0.4;margin-bottom:8px;}
.panel-title{font-size:1.6rem;margin:0 0 12px 0;letter-spacing:0.05em;}
.panel-desc{font-size:0.95rem;line-height:1.6;opacity:0.8;margin-bottom:20px;}
.panel-link{display:inline-block;font-family:var(--mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;text-decoration:none;color:var(--ink);border:1px solid var(--border);padding:8px 16px;transition:all 0.2s;}
.panel-link:hover{background:var(--ink);color:var(--bg);}
</style>
</head>
<body>

<div id="vitrine-bg"></div>
<canvas id="graph"></canvas>

<div id="ui-overlay">
  <header>
    <div class="logo">Jofre Archive</div>
    <div class="meta-status">System: Operational<br/>Node: Network_Root</div>
  </header>

  <footer>
    <button id="gyro-btn">
      <div id="gyro-dot"></div>
      <span>Sensor Off</span>
    </button>
    <div class="meta-status" style="text-align:right;">© 2024<br/>Archive Access: Granted</div>
  </footer>
</div>

<div id="info-panel">
  <div class="panel-label">Node Information</div>
  <h2 class="panel-title" id="node-name">Fragment 001</h2>
  <p class="panel-desc" id="node-desc">Investigation on landscape and social structures through physical intervention.</p>
  <a href="#" class="panel-link" id="node-link">Examine File</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/**
 * LÓGICA DE GRAPH (De tu index original)
 */
const canvas = document.getElementById('graph');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 15;

const group = new THREE.Group();
scene.add(group);

// Crear Nodos
const nodes = [];
const nodeCount = 12;
const nodeGeom = new THREE.SphereGeometry(0.12, 16, 16);

const nodeData = [
  {name: "Konvent", desc: "Residencia artística en una antigua colonia textil.", link: "https://jofrearchive.com/konvent"},
  {name: "Verticality", desc: "Estudio sobre la ocupación del espacio vertical.", link: "https://jofrearchive.com/vertical"},
  {name: "Genealogy", desc: "Mapeo de influencias y procesos históricos.", link: "https://jofrearchive.com/genealogy"},
  {name: "Artifacts", desc: "Restos físicos de intervenciones en el paisaje.", link: "https://jofrearchive.com/artifacts"}
];

for(let i=0; i<nodeCount; i++){
  const mat = new THREE.MeshBasicMaterial({color:0xe8e2d6, transparent:true, opacity:0.8});
  const mesh = new THREE.Mesh(nodeGeom, mat);
  const phi = Math.acos(-1 + (2*i)/nodeCount);
  const theta = Math.sqrt(nodeCount * Math.PI) * phi;
  mesh.position.setFromSphericalCoords(4, phi, theta);
  mesh.userData = nodeData[i % nodeData.length];
  group.add(mesh);
  nodes.push(mesh);
}

// Líneas
const lineMat = new THREE.LineBasicMaterial({color:0xe8e2d6, transparent:true, opacity:0.15});
nodes.forEach((n, i) => {
  nodes.slice(i+1).forEach(m => {
    if(n.position.distanceTo(m.position) < 5){
      const geom = new THREE.BufferGeometry().setFromPoints([n.position, m.position]);
      const line = new THREE.Line(geom, lineMat);
      group.add(line);
    }
  });
});

/**
 * ADAPTACIÓN GYRO (Lógica de o-verticala-gyro-fixed3.html)
 */
let gyroActive = false;
let firstRead = true;
let activationPose = "upright";
const sensorZeroQuat = new THREE.Quaternion();
const currentDeviceQuat = new THREE.Quaternion();
const smoothedDeviceQuat = new THREE.Quaternion();
const SMOOTHING = 0.12;

const gyroBtn = document.getElementById('gyro-btn');

async function requestPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const state = await DeviceOrientationEvent.requestPermission();
      return state === 'granted';
    } catch (e) { return false; }
  }
  return true;
}

function handleOrientation(e) {
  if (!gyroActive) return;

  const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
  const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
  const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;

  // 1. Detectar pose en la primera lectura (Igual que en fixed3)
  if (firstRead) {
    const bDeg = e.beta || 0;
    const gDeg = e.gamma || 0;
    const isFlat = Math.abs(gDeg) < 35;
    if (isFlat && Math.abs(bDeg) < 35) activationPose = "flatUp";
    else if (isFlat && Math.abs(Math.abs(bDeg) - 180) < 35) activationPose = "flatDown";
    else activationPose = "upright";
  }

  // 2. Mapeo de Ejes según Pose
  let yaw = alpha, pitch = beta, roll = gamma;
  const orient = THREE.MathUtils.degToRad(window.orientation || 0);

  // Inversión para modo vertical
  if (Math.abs(window.orientation || 0) % 180 === 0) {
    yaw = -yaw; pitch = -pitch; roll = -roll;
  }

  if (activationPose === "flatUp" || activationPose === "flatDown") {
    let tmp = yaw; yaw = roll; roll = tmp;
    if (activationPose === "flatUp") roll = -roll;
  }

  // 3. Construcción del Quaternión (Orden YXZ)
  const qA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yaw);
  const qB = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), pitch);
  const qC = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), roll);
  
  currentDeviceQuat.copy(qA).multiply(qB).multiply(qC);

  // 4. Ajustes de mundo y pantalla
  const qAdj = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
  currentDeviceQuat.multiply(qAdj);
  
  const qScreen = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), -orient);
  currentDeviceQuat.multiply(qScreen);

  if (activationPose === "flatDown") {
    currentDeviceQuat.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), Math.PI));
  }

  // 5. Suavizado y Relatividad
  if (firstRead) {
    smoothedDeviceQuat.copy(currentDeviceQuat);
    sensorZeroQuat.copy(currentDeviceQuat).invert();
    firstRead = false;
  } else {
    smoothedDeviceQuat.slerp(currentDeviceQuat, SMOOTHING);
  }

  // Aplicar a la escena
  const finalQuat = new THREE.Quaternion().copy(smoothedDeviceQuat).multiply(sensorZeroQuat);
  group.quaternion.copy(finalQuat);
}

gyroBtn.addEventListener('click', async () => {
  if (!gyroActive) {
    const granted = await requestPermission();
    if (granted) {
      gyroActive = true;
      firstRead = true;
      window.addEventListener('deviceorientation', handleOrientation, true);
      gyroBtn.classList.add('active');
      gyroBtn.querySelector('span').textContent = "Sensor On";
    }
  } else {
    gyroActive = false;
    window.removeEventListener('deviceorientation', handleOrientation, true);
    gyroBtn.classList.remove('active');
    gyroBtn.querySelector('span').textContent = "Sensor Off";
    // Reset suave opcional
    group.quaternion.set(0,0,0,1);
  }
});

/**
 * INTERACCIÓN (Raycaster)
 */
const mouse = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const infoPanel = document.getElementById('info-panel');

function onClick(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodes);

  if (intersects.length > 0) {
    const data = intersects[0].object.userData;
    document.getElementById('node-name').textContent = data.name;
    document.getElementById('node-desc').textContent = data.desc;
    document.getElementById('node-link').href = data.link;
    infoPanel.classList.add('visible');
  } else {
    infoPanel.classList.remove('visible');
  }
}
window.addEventListener('click', onClick);

/**
 * RENDER LOOP
 */
function animate() {
  requestAnimationFrame(animate);
  if (!gyroActive) {
    group.rotation.y += 0.002;
    group.rotation.x += 0.001;
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
