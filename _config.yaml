title: Jofre Archive
tagline: "Jofre Oliveras — artist & researcher · art, ecology & technology"
description: >-
  Jofre Oliveras (Girona, 1989): artist and researcher at the intersection of art, ecology and
  technology — from biomimetic solar energy to electronic sculpture, extending into public art
  and large-format projects.
author:
  name: Jofre Oliveras
url: "https://jofrearchive.com"
baseurl: ""
lang: en

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap

collections:

  studies:
    output: true
    permalink: /studies/:slug/

  gallery:
    output: true
    permalink: /gallery/:slug/

defaults:

  - scope:
      path: ""
      type: studies
    values:
      layout: study

  - scope:
      path: ""
      type: gallery
    values:
      layout: gallery

timezone: UTC

exclude:
  - node_modules
  - vendor
  - README.md
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
