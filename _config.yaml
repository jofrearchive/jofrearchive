title: Jofre Archive
tagline: "Jofre Oliveras — artist & artistic director"
description: >-
  The working archive of Jofre Oliveras (Girona, 1989), transnational artist and artistic
  director working across public-space art, ecology and technology: research studies, objects
  and site-specific interventions.
author:
  name: Jofre Oliveras
url: "https://jofrearchive.com"
baseurl: ""
lang: en

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap

collections:

  studies:
    output: true
    permalink: /studies/:slug/

  gallery:
    output: true
    permalink: /gallery/:slug/

defaults:

  - scope:
      path: ""
      type: studies
    values:
      layout: study

  - scope:
      path: ""
      type: gallery
    values:
      layout: gallery

timezone: UTC

exclude:
  - node_modules
  - vendor
  - README.md
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
