<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOFRE ARCHIVE — Cloister VR</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --ivory:#e8e2d6;
  --green:#4ade80;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
}

#renderCanvas{
  width:100%;
  height:100%;
  touch-action:none;
}

/* ===== VR BUTTON ===== */

#vrToggle{
  position:fixed;
  left:50%;
  bottom:max(24px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:50;

  display:flex;
  align-items:center;
  gap:16px;

  padding:12px 28px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(10px);

  font-family:'Source Code Pro', monospace;
  font-size:13px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ivory);

  cursor:pointer;
  transition:.3s ease;
}

.vr-led{
  width:18px;
  height:6px;
  border-radius:2px;
  background:#444;
  transition:.3s ease;
}

#vrToggle.vr-on .vr-led{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

#vrToggle.vr-on .vr-label{
  color:var(--green);
}

@media (min-width:768px){
  #vrToggle{ display:none; }
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<button id="vrToggle">
  <div class="vr-led"></div>
  <span class="vr-label">VR OFF</span>
</button>

<script>
(function(){

function isMobile(){
  const ua = navigator.userAgent || "";
  const tp = navigator.maxTouchPoints || 0;
  return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
}

async function requestGyroPermission(){
  try{
    if(typeof DeviceOrientationEvent !== "undefined" &&
       typeof DeviceOrientationEvent.requestPermission === "function"){
      const res = await DeviceOrientationEvent.requestPermission();
      return res === "granted";
    }
    return true;
  }catch(e){
    return false;
  }
}

const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);
let scene, camera;
let vrEnabled = false;
let orientationInput = null;

async function createScene(){

  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.043,0.043,0.043,1);

  const light = new BABYLON.HemisphericLight("hemi",
    new BABYLON.Vector3(0,1,0), scene);
  light.intensity = .6;

  camera = new BABYLON.FreeCamera("cam",
    new BABYLON.Vector3(0,2,-8), scene);
  camera.setTarget(new BABYLON.Vector3(0,3,0));
  camera.attachControl(canvas,true);
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

  await BABYLON.SceneLoader.ImportMeshAsync("","https://inside.jofrearchive.com/assets/3D/","c.glb",scene);

  return scene;
}

createScene().then(()=>{
  engine.runRenderLoop(()=>{ scene.render(); });
});

window.addEventListener("resize",()=>engine.resize());

const vrBtn = document.getElementById("vrToggle");

if(isMobile()){
  vrBtn.addEventListener("click", async ()=>{

    await requestGyroPermission();

    if(!camera) return;

    if(!vrEnabled){
      orientationInput = new BABYLON.FreeCameraDeviceOrientationInput();
      camera.inputs.add(orientationInput);
      camera.angularSensibility = 4000;

      vrBtn.classList.add("vr-on");
      vrBtn.querySelector(".vr-label").textContent = "VR ON";
      vrEnabled = true;

    } else {

      if(orientationInput){
        camera.inputs.remove(orientationInput);
      }

      vrBtn.classList.remove("vr-on");
      vrBtn.querySelector(".vr-label").textContent = "VR OFF";
      vrEnabled = false;
    }
  });
}

})();
</script>

</body>
</html>
