<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Jofre Archive — Studies VR</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet"/>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
:root{
  --bg:#0b0b0b;
  --ink:#e8e2d6;
  --ink2:rgba(232,226,214,0.75);
  --ink3:rgba(232,226,214,0.6);
  --border:rgba(232,226,214,0.16);
  --mono:'Source Code Pro',ui-monospace,monospace;
  --serif:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}

/* ── HUD ── */
#overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}

#top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(180deg,rgba(11,11,11,.88) 0%,transparent 100%)}
.bar-kicker{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.bar-logo{font-family:var(--serif);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}

#bot-bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:linear-gradient(0deg,rgba(11,11,11,.88) 0%,transparent 100%);pointer-events:auto}
.ctrl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--border);background:rgba(0,0,0,.45);padding:9px 16px;cursor:pointer;transition:border-color 120ms,color 120ms;-webkit-tap-highlight-color:transparent}
.ctrl:active,.ctrl:hover{border-color:rgba(232,226,214,.38);color:var(--ink)}
.ctrl:disabled{opacity:.3;cursor:not-allowed}
.ctrl-hint{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:rgba(232,226,214,.3);text-transform:uppercase}

/* ── Left categories ── */
#cat-panel{position:fixed;top:50px;left:0;width:190px;max-height:calc(100vh - 96px);overflow-y:auto;background:rgba(10,10,10,.88);border-right:1px solid var(--border);backdrop-filter:blur(10px);z-index:49;pointer-events:auto}
#cat-panel::-webkit-scrollbar{width:3px}
#cat-panel::-webkit-scrollbar-thumb{background:rgba(232,226,214,.15)}
.cat-hd{padding:10px 12px;border-bottom:1px solid rgba(232,226,214,.1);font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between}
.cat-row{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(232,226,214,.05);transition:background 100ms}
.cat-row:hover{background:rgba(232,226,214,.06)}
.cat-row.active{background:rgba(232,226,214,.09);border-right:2px solid rgba(232,226,214,.4)}
.cat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
.cat-n{font-family:var(--mono);font-size:8px;color:rgba(232,226,214,.4);border:1px solid rgba(232,226,214,.12);padding:2px 5px}

/* ── Right detail ── */
#det-panel{position:fixed;top:50px;right:0;width:270px;max-height:calc(100vh - 96px);overflow-y:auto;background:rgba(10,10,10,.88);border-left:1px solid var(--border);backdrop-filter:blur(10px);padding:14px;z-index:49;pointer-events:auto}
#det-panel::-webkit-scrollbar{width:3px}
#det-panel::-webkit-scrollbar-thumb{background:rgba(232,226,214,.15)}
.det-title{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2;color:var(--ink)}
.det-meta{margin-top:7px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(232,226,214,.5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.det-blk{margin-top:12px;border-top:1px solid rgba(232,226,214,.1);padding-top:12px}
.det-k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.det-p{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--ink2)}
.det-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.det-tag{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,226,214,.5);border:1px solid rgba(232,226,214,.12);padding:4px 6px}
.doc-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.doc-btn{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--border);background:rgba(0,0,0,.2);padding:6px 10px;cursor:pointer}
.doc-btn:disabled{opacity:.25;cursor:not-allowed}

/* ── Gyro permission (iOS) ── */
#gyro-btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:none;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);border:1px solid var(--border);background:rgba(10,10,10,.92);padding:14px 24px;cursor:pointer;z-index:200;pointer-events:auto;backdrop-filter:blur(8px)}
</style>
</head>
<body>

<!-- HUD -->
<div id="overlay">
  <div id="top-bar">
    <span class="bar-kicker">Studies</span>
    <span class="bar-logo">Jofre Archive</span>
    <span id="idx" class="bar-kicker">—</span>
  </div>
  <div id="bot-bar">
    <button class="ctrl" id="prevBtn">← Prev</button>
    <span class="ctrl-hint">Scroll · Swipe · Giroscopio</span>
    <button class="ctrl" id="nextBtn">Next →</button>
    <button class="ctrl" id="randBtn">Random</button>
  </div>
</div>

<button id="gyro-btn">Activar Giroscopio</button>

<div id="cat-panel">
  <div class="cat-hd"><span>Studies</span><span>Cat.</span></div>
  <div id="catList"></div>
</div>

<div id="det-panel">
  <div id="detail">
    <h3 class="det-title">Selecciona un proyecto</h3>
    <div class="det-meta"><span>—</span><span>carrusel</span></div>
  </div>
</div>

<!-- A-FRAME SCENE -->
<a-scene
  id="scene"
  embedded
  background="color:#0b0b0b"
  renderer="antialias:true;colorManagement:true"
  device-orientation-permission-ui="enabled:false"
  loading-screen="backgroundColor:#0b0b0b;dotsColor:#e8e2d6"
  vr-mode-ui="enabled:true"
>
  <a-assets id="aassets" timeout="15000"></a-assets>

  <!-- Lights -->
  <a-light type="ambient"     color="#e8e2d6" intensity="0.55"></a-light>
  <a-light type="directional" color="#e8e2d6" intensity="0.55" position="1 4 2"></a-light>
  <a-light type="point"       color="#c8c2b6" intensity="0.4" position="0 2 -4" distance="18" decay="2"></a-light>

  <!-- Floor -->
  <a-plane rotation="-90 0 0" width="200" height="200" material="color:#060606;opacity:1;side:double"></a-plane>
  <a-entity id="grid-root"></a-entity>

  <!-- Carousel rig: rotateX(26) = CSS rotateX(-26deg) viewing from above -->
  <a-entity id="rig-pivot" position="0 1.4 -4.5" rotation="26 0 0">
    <a-entity id="card-rig"></a-entity>
  </a-entity>

  <!-- Camera with gyroscope support -->
  <a-entity id="cam-rig" position="0 1.6 0">
    <a-camera
      id="cam"
      look-controls="enabled:true;reverseMouseDrag:false;touchEnabled:true;magicWindowTrackingEnabled:true"
      wasd-controls="enabled:false"
      fov="72"
    >
      <!-- Gaze cursor -->
      <a-entity
        cursor="fuse:true;fuseTimeout:1500"
        position="0 0 -1"
        geometry="primitive:ring;radiusInner:0.008;radiusOuter:0.014"
        material="color:#e8e2d6;shader:flat;opacity:0.55"
        animation__click="property:scale;startEvents:click;from:0.1 0.1 0.1;to:1 1 1;dur:150"
        raycaster="objects:.card-face;far:20;interval:100"
      ></a-entity>
    </a-camera>
  </a-entity>

  <!-- VR controllers -->
  <a-entity laser-controls="hand:left"  raycaster="objects:.card-face;far:20"></a-entity>
  <a-entity laser-controls="hand:right" raycaster="objects:.card-face;far:20"></a-entity>

</a-scene>

<script>
/* ═══════════════════ DATA ═══════════════════ */
const ALL=[
  {id:"S-001",title:"Mycelium Sculpture Series I",year:2024,category:"BioSystems",type:"Installation",status:"Prototype",
   abstract:"Sculptural growth system using mycelium as structural computation: humidity, time, decay as form.",
   tags:["mycelium","biotech","sculpture","living material"],
   materials:["mycelium spawn","cellulose substrate","humidity enclosure"],
   technologies:["time-based growth","controlled decay"],
   axis:["interspecies","autonomy","infrastructure"],
   docs:{pdf:false,images:true,video:true,network:true}},
  {id:"S-002",title:"Transparent Solar Leaf Panels",year:2024,category:"BioSystems",type:"Research",status:"Ongoing",
   abstract:"Screen-printed translucent solar layers inspired by leaf venation; biomimetic pattern as energy diagram.",
   tags:["solar","screen printing","biomimicry","cellulose"],
   materials:["translucent cellulose base","conductive inks","p/n layers"],
   technologies:["layered printing","thin-film experimentation"],
   axis:["energy","bio-infrastructure","material politics"],
   docs:{pdf:true,images:true,video:false,network:true}},
  {id:"S-003",title:"Interspecies Archaeology / Living Relics",year:2025,category:"BioSystems",type:"Research",status:"Draft",
   abstract:"An archive for non-human agency: relics grown, eroded and indexed as if they were evidence.",
   tags:["interspecies","archive","mycelium","nanotech"],
   materials:["biomass","substrates","lab notes"],
   technologies:["growth protocols","micro documentation"],
   axis:["agency","taxonomy","time"],
   docs:{pdf:true,images:true,video:true,network:false}},
  {id:"S-004",title:"Carnival Society / Dystopic Pop Artifact",year:2023,category:"Dystopic Pop Art",type:"Concept",status:"Draft",
   abstract:"Modern society as carnival: lights, control — depth replaced by spectacle. Interface as critique.",
   tags:["critique","spectacle","authority","interface"],
   materials:["text","graphic system","archive UI"],
   technologies:["indexing","controlled navigation"],
   axis:["authority","identity","bureaucracy"],
   docs:{pdf:true,images:false,video:false,network:false}},
  {id:"S-005",title:"Frequency Plate / Cymatics Study",year:2022,category:"Cymatics",type:"Research",status:"Built",
   abstract:"Physical plates generating stable patterns under specific tones; mapping frequency to geometry.",
   tags:["cymatics","frequency","pattern","plate"],
   materials:["plate","speaker","tone generator"],
   technologies:["signal control","documentation"],
   axis:["measurement","ritual","structure"],
   docs:{pdf:false,images:true,video:true,network:true}},
  {id:"S-006",title:"Public Installation / Palestine Structure",year:2025,category:"Public Art",type:"Installation",status:"Planned",
   abstract:"A sculptural installation addressing Palestine through infrastructural language: memory, public space.",
   tags:["public art","memory","structure","palestine"],
   materials:["site-specific","public constraints","structure"],
   technologies:["planning","permits"],
   axis:["memory","authority","public space"],
   docs:{pdf:true,images:false,video:false,network:false}},
  {id:"S-007",title:"Landscape Archive / Field Fragments",year:2021,category:"Landscape",type:"Research",status:"Archived",
   abstract:"Field notes and fragments: terrain as database; classification as a lens over land and extraction.",
   tags:["field","landscape","archive","fragments"],
   materials:["text","photos","mapping"],
   technologies:["indexing","taxonomy"],
   axis:["extraction","mapping","control"],
   docs:{pdf:true,images:true,video:false,network:false}}
];

/* ═══════════════════ CONFIG ═══════════════════
   Exact mirror of original CSS:
     card: 820×660px  → 2.3×1.85m  (factor ~0.0028)
     z = -abs * 320px → -abs * 0.90m
     y =  abs *  26px →  abs * 0.073m
     scale = 1 - abs * 0.025
═══════════════════════════════════════════════ */
const CFG={CW:2.3,CH:1.85,Z_STEP:0.9,Y_STEP:0.073,SCALE_STEP:0.025,WINDOW:2,TEX_W:1024,TEX_H:820};

/* ═══════════════════ STATE ═══════════════════ */
let activeCategory="All", activeIndex=0, sortMode="yearDesc", cardEntities=[];

/* ═══════════════════ HELPERS ═══════════════════ */
function getFiltered(){
  let l=ALL.slice();
  if(activeCategory!=="All") l=l.filter(p=>p.category===activeCategory);
  l.sort((a,b)=>sortMode==="yearAsc"?a.year-b.year:b.year-a.year);
  return l;
}
function clamp(list){
  if(!list.length){activeIndex=0;return;}
  if(activeIndex<0)activeIndex=list.length-1;
  if(activeIndex>=list.length)activeIndex=0;
}
function hues(p){const k=parseInt((p.id||"S-000").split("-")[1]||"0",10)||0;return[(k*41)%360,(k*41+80)%360];}

/* ═══════════════════ CANVAS TEXTURE ═══════════════════ */
function makeTexture(p,isBack){
  const W=CFG.TEX_W,H=CFG.TEX_H;
  const c=document.createElement("canvas");
  c.width=W;c.height=H;
  const g=c.getContext("2d");
  const [h1,h2]=hues(p);

  // Background
  g.fillStyle="rgba(10,10,10,0.97)";
  g.fillRect(0,0,W,H);

  // Outer border
  g.strokeStyle="rgba(232,226,214,0.18)";
  g.lineWidth=2;
  g.strokeRect(1,1,W-2,H-2);

  // Tab
  const tabH=32,tabX=16,tabW=Math.min(W-32,W*0.84);
  g.fillStyle="rgba(0,0,0,0.65)";
  g.fillRect(tabX,0,tabW,tabH);
  g.strokeStyle="rgba(232,226,214,0.14)";
  g.lineWidth=1;
  g.beginPath();
  g.moveTo(tabX,0);g.lineTo(tabX,tabH);g.lineTo(tabX+tabW,tabH);g.lineTo(tabX+tabW,0);
  g.stroke();
  g.fillStyle="rgba(232,226,214,0.82)";
  g.font="bold 12px 'Source Code Pro',monospace";
  g.textBaseline="middle";
  g.fillText(`${p.id}  /  ${p.title}  —  ${p.category} ${p.year}`,tabX+12,tabH/2,tabW-24);

  // Notch
  g.strokeStyle="rgba(232,226,214,0.12)";
  g.lineWidth=1;
  g.strokeRect(tabX,tabH,58,10);

  // Hero
  const heroY=tabH+10,heroH=Math.floor(H*0.38);
  const gr=g.createLinearGradient(0,heroY,0,heroY+heroH);
  gr.addColorStop(0,`hsla(${h1},30%,70%,0.22)`);
  gr.addColorStop(0.6,`hsla(${h2},28%,60%,0.10)`);
  gr.addColorStop(1,"rgba(0,0,0,0.55)");
  g.fillStyle=gr;g.fillRect(0,heroY,W,heroH);

  const rg=g.createRadialGradient(W*0.3,heroY+heroH*0.3,0,W*0.3,heroY+heroH*0.3,W*0.5);
  rg.addColorStop(0,`hsla(${h1},30%,72%,0.12)`);rg.addColorStop(1,"transparent");
  g.fillStyle=rg;g.fillRect(0,heroY,W,heroH);

  // Hero bar
  const bh=34;
  const bg2=g.createLinearGradient(0,heroY+heroH-bh,0,heroY+heroH);
  bg2.addColorStop(0,"rgba(0,0,0,0)");bg2.addColorStop(1,"rgba(0,0,0,0.75)");
  g.fillStyle=bg2;g.fillRect(0,heroY+heroH-bh,W,bh);
  const my=heroY+heroH-bh/2;
  g.font="11px 'Source Code Pro',monospace";g.textBaseline="middle";
  g.fillStyle="rgba(232,226,214,0.62)";
  g.fillText(`${p.category} — ${p.year}`,14,my);
  const t2=`${p.type} / ${p.status}`;
  g.fillStyle="rgba(232,226,214,0.45)";
  g.fillText(t2,W-g.measureText(t2).width-14,my);

  // Hero bottom line
  g.strokeStyle="rgba(232,226,214,0.12)";g.lineWidth=1;
  g.beginPath();g.moveTo(0,heroY+heroH);g.lineTo(W,heroY+heroH);g.stroke();

  // Body
  const bodyY=heroY+heroH+16;
  g.fillStyle="#e8e2d6";
  g.font="600 22px 'EB Garamond',serif";
  g.textBaseline="top";
  g.fillText(p.title,16,bodyY,W-32);

  g.font="11px 'Source Code Pro',monospace";
  g.fillStyle="rgba(232,226,214,0.50)";
  const metaY=bodyY+32;
  g.fillText(`${p.category} — ${p.year}`,16,metaY);
  const mt2=`${p.type} / ${p.status}`;
  g.fillText(mt2,W-g.measureText(mt2).width-16,metaY);

  if(!isBack){
    // Abstract
    g.font="15px 'EB Garamond',serif";
    g.fillStyle="rgba(232,226,214,0.75)";
    g.textBaseline="top";
    let lx=16,ly=metaY+24,lw=W-32,lh=20,line="";
    for(const w of p.abstract.split(" ")){
      const test=line?line+" "+w:w;
      if(g.measureText(test).width>lw&&line){
        g.fillText(line,lx,ly,lw);line=w;ly+=lh;
        if(ly>H-80)break;
      }else line=test;
    }
    if(line&&ly<=H-80)g.fillText(line,lx,ly,lw);

    // Tags
    g.font="10px 'Source Code Pro',monospace";
    let tx=16;const ty=H-44;
    for(const tag of(p.tags||[]).slice(0,5)){
      const tw=g.measureText(tag).width+18;
      if(tx+tw>W-16)break;
      g.strokeStyle="rgba(232,226,214,0.14)";g.lineWidth=1;
      g.strokeRect(tx,ty,tw,22);
      g.fillStyle="rgba(232,226,214,0.52)";
      g.fillText(tag,tx+9,ty+6);
      tx+=tw+8;
    }
  }
  return c;
}

/* ═══════════════════ BUILD CARD ENTITY ═══════════════════ */
const cardRig=document.getElementById("card-rig");

function clearCards(){
  cardEntities.forEach(e=>{if(e.parentNode)e.parentNode.removeChild(e);});
  cardEntities=[];
}

function buildCard(p,offset,listIdx){
  const abs=Math.abs(offset);
  const isBack=abs>=1;
  const opacity=Math.max(0,1-abs*0.055);
  const bright=isBack?Math.max(0.52,0.92-abs*0.04):1.0;
  const sc=1-abs*CFG.SCALE_STEP;

  const canvas=makeTexture(p,isBack);
  const dataURL=canvas.toDataURL("image/png");

  const el=document.createElement("a-entity");

  // Position: exact z=-abs*Z_STEP (mirrors CSS z=-abs*320)
  el.setAttribute("position",`0 ${abs*CFG.Y_STEP} ${-abs*CFG.Z_STEP}`);
  el.setAttribute("scale",`${sc} ${sc} ${sc}`);

  // Border box (slightly behind face)
  const bx=document.createElement("a-box");
  bx.setAttribute("width",CFG.CW+0.008);
  bx.setAttribute("height",CFG.CH+0.008);
  bx.setAttribute("depth",0.004);
  bx.setAttribute("position","0 0 -0.003");
  bx.setAttribute("material",`shader:flat;color:rgba(232,226,214,${isBack?0.07:0.18})`);
  el.appendChild(bx);

  // Face plane
  const face=document.createElement("a-plane");
  face.setAttribute("class","card-face");
  face.setAttribute("width",CFG.CW);
  face.setAttribute("height",CFG.CH);
  face.setAttribute("material",
    `shader:flat;src:${dataURL};transparent:true;opacity:${opacity};`+
    `color:rgb(${Math.round(bright*232)},${Math.round(bright*226)},${Math.round(bright*214)})`
  );
  face.dataset.listIndex=String(listIdx);
  el.appendChild(face);

  // Click handler
  face.addEventListener("click",()=>{
    const li=parseInt(face.dataset.listIndex,10);
    if(!isNaN(li)){activeIndex=li;playClick();render();}
  });

  // Gaze highlight
  face.addEventListener("mouseenter",()=>{
    face.setAttribute("material",
      `shader:flat;src:${dataURL};transparent:true;opacity:${Math.min(1,opacity+0.1)};`+
      `color:rgb(255,252,240)`
    );
  });
  face.addEventListener("mouseleave",()=>{
    face.setAttribute("material",
      `shader:flat;src:${dataURL};transparent:true;opacity:${opacity};`+
      `color:rgb(${Math.round(bright*232)},${Math.round(bright*226)},${Math.round(bright*214)})`
    );
  });

  return el;
}

/* ═══════════════════ RENDER ═══════════════════ */
function render(){
  const list=getFiltered();
  clamp(list);
  clearCards();

  // Same window algorithm as original CSS version
  let start=activeIndex-CFG.WINDOW;
  let end=activeIndex+CFG.WINDOW;
  if(start<0){end+=-start;start=0;}
  if(end>list.length-1){start-=(end-(list.length-1));end=list.length-1;}
  start=Math.max(0,start);

  for(let i=start;i<=end;i++){
    const el=buildCard(list[i],i-activeIndex,i);
    cardRig.appendChild(el);
    cardEntities.push(el);
  }

  document.getElementById("idx").textContent=list.length?`${activeIndex+1} / ${list.length}`:"—";
  renderDetail(list[activeIndex]);
  renderCats();
  document.getElementById("prevBtn").disabled=list.length<2;
  document.getElementById("nextBtn").disabled=list.length<2;
}

/* ═══════════════════ DETAIL PANEL ═══════════════════ */
function renderDetail(p){
  const d=document.getElementById("detail");
  if(!p){d.innerHTML=`<h3 class="det-title">Sin resultados</h3>`;return;}
  d.innerHTML=`
    <h3 class="det-title">${p.title}</h3>
    <div class="det-meta"><span>${p.category} — ${p.year}</span><span>${p.type} / ${p.status}</span></div>
    <div class="det-blk"><div class="det-k">Description</div><p class="det-p">${p.abstract}</p></div>
    <div class="det-blk"><div class="det-k">Materials</div><p class="det-p">${(p.materials||[]).join(", ")||"—"}</p></div>
    <div class="det-blk"><div class="det-k">Technologies</div><p class="det-p">${(p.technologies||[]).join(", ")||"—"}</p></div>
    <div class="det-blk"><div class="det-k">Axis</div><p class="det-p">${(p.axis||[]).join(" · ")||"—"}</p></div>
    <div class="det-blk"><div class="det-k">Tags</div><div class="det-tags">${(p.tags||[]).map(t=>`<span class="det-tag">${t}</span>`).join("")}</div></div>
    <div class="det-blk"><div class="det-k">Docs</div><div class="doc-row">
      <button class="doc-btn" ${p.docs?.pdf?"":'disabled'}>PDF</button>
      <button class="doc-btn" ${p.docs?.images?"":'disabled'}>Images</button>
      <button class="doc-btn" ${p.docs?.video?"":'disabled'}>Video</button>
      <button class="doc-btn" ${p.docs?.network?"":'disabled'}>Network</button>
    </div></div>`;
}

/* ═══════════════════ CATEGORY PANEL ═══════════════════ */
function renderCats(){
  const cats=["All",...Array.from(new Set(ALL.map(p=>p.category))).sort()];
  const cl=document.getElementById("catList");
  cl.innerHTML="";
  cats.forEach(cat=>{
    const n=cat==="All"?ALL.length:ALL.filter(p=>p.category===cat).length;
    const div=document.createElement("div");
    div.className="cat-row"+(activeCategory===cat?" active":"");
    div.innerHTML=`<span class="cat-lbl">${cat==="All"?"All Studies":cat}</span><span class="cat-n">${n}</span>`;
    div.addEventListener("click",()=>{activeCategory=cat;activeIndex=0;render();});
    cl.appendChild(div);
  });
}

/* ═══════════════════ GRID FLOOR ═══════════════════ */
function buildGrid(){
  const root=document.getElementById("grid-root");
  const N=30,STEP=2,C="rgba(232,226,214,0.035)";
  for(let z=-N;z<=N;z+=STEP){
    const ln=document.createElement("a-entity");
    ln.setAttribute("line",`start:-${N} 0 ${z};end:${N} 0 ${z};color:${C}`);
    root.appendChild(ln);
  }
  for(let x=-N;x<=N;x+=STEP){
    const ln=document.createElement("a-entity");
    ln.setAttribute("line",`start:${x} 0 -${N};end:${x} 0 ${N};color:${C}`);
    root.appendChild(ln);
  }
}

/* ═══════════════════ CLICK SOUND ═══════════════════ */
let actx=null;
function playClick(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=new AC();}
    if(actx.state==="suspended")actx.resume();
    const t=actx.currentTime,d=0.018;
    const buf=actx.createBuffer(1,Math.max(1,Math.floor(actx.sampleRate*d)),actx.sampleRate);
    const dat=buf.getChannelData(0);
    for(let i=0;i<dat.length;i++)dat[i]=(Math.random()*2-1)*Math.exp(-i/(dat.length/3))*0.75;
    const ns=actx.createBufferSource();ns.buffer=buf;
    const bp=actx.createBiquadFilter();bp.type="bandpass";bp.frequency.setValueAtTime(1800,t);bp.Q.setValueAtTime(6,t);
    const g=actx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    ns.connect(bp);bp.connect(g);g.connect(actx.destination);ns.start(t);ns.stop(t+d);
  }catch(e){}
}

/* ═══════════════════ NAVIGATION ═══════════════════ */
function next(){const l=getFiltered();if(l.length<2)return;playClick();activeIndex++;render();}
function prev(){const l=getFiltered();if(l.length<2)return;playClick();activeIndex--;render();}

document.getElementById("prevBtn").addEventListener("click",prev);
document.getElementById("nextBtn").addEventListener("click",next);
document.getElementById("randBtn").addEventListener("click",()=>{
  const l=getFiltered();if(!l.length)return;
  playClick();activeIndex=Math.floor(Math.random()*l.length);render();
});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowUp")prev();
  if(e.key==="ArrowRight"||e.key==="ArrowDown")next();
});

document.getElementById("scene").addEventListener("wheel",e=>{
  e.preventDefault();
  if(e.deltaY>0)next();else prev();
},{passive:false});

let ty0=null;
document.getElementById("scene").addEventListener("touchstart",e=>{ty0=e.touches[0]?.clientY??null;},{passive:true});
document.getElementById("scene").addEventListener("touchend",e=>{
  if(ty0===null)return;
  const dy=(e.changedTouches[0]?.clientY??ty0)-ty0;ty0=null;
  if(Math.abs(dy)<28)return;
  if(dy<0)next();else prev();
},{passive:true});

/* ═══════════════════ GYROSCOPE ═══════════════════
   - Android: look-controls uses DeviceOrientation automatically
   - iOS 13+: requires explicit user gesture to call requestPermission()
   The button appears only on iOS when needed.
═══════════════════════════════════════════════════ */
function initGyro(){
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  if(isIOS&&typeof DeviceOrientationEvent!=="undefined"&&
     typeof DeviceOrientationEvent.requestPermission==="function"){
    const btn=document.getElementById("gyro-btn");
    btn.style.display="block";
    btn.addEventListener("click",()=>{
      DeviceOrientationEvent.requestPermission().then(state=>{
        btn.style.display="none";
        if(state==="granted"){
          // A-Frame look-controls picks it up automatically once permission is granted
          const cam=document.getElementById("cam");
          cam.setAttribute("look-controls","enabled:true;magicWindowTrackingEnabled:true;touchEnabled:true");
        }
      }).catch(e=>{console.warn("Gyro permission denied",e);btn.style.display="none";});
    },{once:true});
  }
  // Android/desktop: no action needed — A-Frame handles it
}

/* ═══════════════════ INIT ═══════════════════ */
function init(){
  buildGrid();
  render();
  initGyro();
}

const scene=document.getElementById("scene");
if(scene.hasLoaded){init();}
else{scene.addEventListener("loaded",init,{once:true});}
</script>
