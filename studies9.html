<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Jofre Archive — Studies VR</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Source+Code+Pro:wght@300;500&display=swap" rel="stylesheet"/>

<!-- A-Frame -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0b0b; font-family: 'EB Garamond', serif; overflow: hidden; }

  /* ── HUD overlay ── */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header */
  #hud-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(180deg, rgba(11,11,11,0.72) 0%, transparent 100%);
  }
  .hud-kicker {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.6);
  }
  .hud-logo {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.95);
  }
  #hud-index {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    color: rgba(232,226,214,0.55);
    text-transform: uppercase;
  }

  /* Detail panel – right side overlay */
  #detail-panel {
    position: fixed;
    top: 78px;
    right: 0;
    width: 340px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    background: rgba(10,10,10,0.82);
    border-left: 1px solid rgba(232,226,214,0.16);
    border-bottom: 1px solid rgba(232,226,214,0.10);
    backdrop-filter: blur(8px);
    padding: 18px;
    pointer-events: auto;
    z-index: 99;
  }
  #detail-panel::-webkit-scrollbar { width: 4px; }
  #detail-panel::-webkit-scrollbar-track { background: transparent; }
  #detail-panel::-webkit-scrollbar-thumb { background: rgba(232,226,214,0.18); }

  .det-title {
    font-family: 'EB Garamond', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.15;
    color: #e8e2d6;
    margin: 0;
  }
  .det-meta {
    margin-top: 8px;
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.55);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .det-block {
    margin-top: 14px;
    border-top: 1px solid rgba(232,226,214,0.12);
    padding-top: 14px;
  }
  .det-k {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.6);
    margin-bottom: 7px;
  }
  .det-p {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    line-height: 1.55;
    color: rgba(232,226,214,0.75);
  }
  .det-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 8px;
  }
  .det-tag {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.55);
    border: 1px solid rgba(232,226,214,0.14);
    background: rgba(0,0,0,0.18);
    padding: 5px 7px;
  }
  .doc-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .doc-btn {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.75);
    border: 1px solid rgba(232,226,214,0.18);
    background: rgba(0,0,0,0.22);
    padding: 7px 10px;
    cursor: pointer;
    pointer-events: auto;
  }
  .doc-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* Categories panel – left side overlay */
  #cat-panel {
    position: fixed;
    top: 78px;
    left: 0;
    width: 240px;
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    background: rgba(10,10,10,0.82);
    border-right: 1px solid rgba(232,226,214,0.16);
    border-bottom: 1px solid rgba(232,226,214,0.10);
    backdrop-filter: blur(8px);
    z-index: 99;
    pointer-events: auto;
  }
  #cat-panel::-webkit-scrollbar { width: 3px; }
  #cat-panel::-webkit-scrollbar-thumb { background: rgba(232,226,214,0.14); }
  .cat-head {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(232,226,214,0.12);
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.6);
    display: flex;
    justify-content: space-between;
  }
  .cat-item {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(232,226,214,0.06);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cat-item:hover { background: rgba(232,226,214,0.04); }
  .cat-item.active { background: rgba(232,226,214,0.07); border-right: 2px solid rgba(232,226,214,0.35); }
  .cat-label {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.75);
  }
  .cat-count {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: .14em;
    color: rgba(232,226,214,0.4);
    border: 1px solid rgba(232,226,214,0.14);
    padding: 3px 6px;
  }

  /* Bottom controls */
  #hud-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 18px 28px;
    background: linear-gradient(0deg, rgba(11,11,11,0.72) 0%, transparent 100%);
    pointer-events: auto;
  }
  .ctrl-btn {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.75);
    border: 1px solid rgba(232,226,214,0.18);
    background: rgba(0,0,0,0.35);
    padding: 10px 18px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 140ms, color 140ms;
  }
  .ctrl-btn:hover { border-color: rgba(232,226,214,0.35); color: #e8e2d6; }
  .ctrl-btn:disabled { opacity: .3; cursor: not-allowed; }
  .ctrl-hint {
    font-family: 'Source Code Pro', monospace;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(232,226,214,0.35);
    padding: 0 10px;
  }

  /* A-Frame canvas */
  a-scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  /* VR button */
  .a-enter-vr {
    bottom: 20px !important;
    right: 360px !important;
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     HUD OVERLAY
═══════════════════════════════════════════════ -->
<div id="hud">
  <div id="hud-top">
    <span class="hud-kicker">Studies</span>
    <span class="hud-logo">Jofre Archive</span>
    <span id="hud-index" class="hud-kicker">—</span>
  </div>
  <div id="hud-bottom">
    <button class="ctrl-btn" id="prevBtn">← Prev</button>
    <span class="ctrl-hint">Scroll / swipe / click cards</span>
    <button class="ctrl-btn" id="nextBtn">Next →</button>
    <button class="ctrl-btn" id="randBtn">Random</button>
  </div>
</div>

<!-- Category panel -->
<div id="cat-panel">
  <div class="cat-head">
    <span>Studies</span>
    <span>Classification</span>
  </div>
  <div id="catList"></div>
</div>

<!-- Detail panel -->
<div id="detail-panel">
  <div id="detail">
    <h3 class="det-title">No file loaded</h3>
    <div class="det-meta"><span>select</span><span>use carousel</span></div>
    <div class="det-block">
      <div class="det-k">Purpose</div>
      <p class="det-p">Selecciona un proyecto usando las tarjetas del carrusel VR o la lista de categorías.</p>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     A-FRAME SCENE
═══════════════════════════════════════════════ -->
<a-scene
  id="scene"
  background="color: #0b0b0b"
  renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true;"
  fog="type: exponential; color: #0b0b0b; density: 0.018"
  vr-mode-ui="enabled: true"
>

  <!-- Assets (canvas textures generated by JS) -->
  <a-assets id="assets"></a-assets>

  <!-- ── Ambient + directional lights ── -->
  <a-light type="ambient" color="#e8e2d6" intensity="0.30"></a-light>
  <a-light type="directional" color="#e8e2d6" intensity="0.45"
           position="0 6 -2"></a-light>
  <a-light type="point" color="rgba(232,226,214,0.18)" intensity="0.6"
           position="0 1 0" distance="18" decay="2"></a-light>

  <!-- ── Grid floor ── -->
  <a-entity id="floor-grid">
    <!-- Infinite grid plane -->
    <a-plane
      rotation="-90 0 0"
      width="200" height="200"
      material="color: #0b0b0b; opacity: 1; side: double;"
    ></a-plane>
    <!-- Wireframe grid overlay using line primitives -->
    <a-entity id="grid-lines"></a-entity>
  </a-entity>

  <!-- ── Atmospheric glow sphere ── -->
  <a-sphere radius="80"
    material="color: #0b0b0b; side: back; opacity: 1;"
  ></a-sphere>

  <!-- ── Card carousel rig ── -->
  <!--
    Original CSS rig: rotateX(-26deg), cards stacked at z = -abs*320
    In A-Frame (metres), we scale down: 1px ≈ 0.0028m (card ~2.3m wide → ~820px)
    z-step = 320px → 0.90m  |  y-step = 26px → 0.073m
    Rig tilt: rotateX(-26deg) preserved as rotation="26 0 0" (A-Frame Euler = X pitch)
  -->
  <a-entity id="rig-pivot" position="0 1.2 -5" rotation="26 0 0">
    <a-entity id="card-rig"></a-entity>
  </a-entity>

  <!-- ── Camera rig ── -->
  <a-entity id="cam-rig" position="0 1.6 0">
    <a-camera
      wasd-controls="enabled: false"
      look-controls="enabled: true; reverseMouseDrag: false; magicWindowTrackingEnabled: true"
      fov="70"
    >
      <!-- VR cursor for in-headset interaction -->
      <a-cursor
        color="#e8e2d6"
        opacity="0.6"
        fuse="true"
        fuse-timeout="1200"
        raycaster="objects: .vr-card-trigger"
      ></a-cursor>
    </a-camera>
  </a-entity>

  <!-- ── Left controller (VR) ── -->
  <a-entity laser-controls="hand: left"
            raycaster="objects: .vr-card-trigger; lineColor: rgba(232,226,214,0.5); lineOpacity: 0.5">
  </a-entity>
  <a-entity laser-controls="hand: right"
            raycaster="objects: .vr-card-trigger; lineColor: rgba(232,226,214,0.5); lineOpacity: 0.5">
  </a-entity>

</a-scene>


<!-- ═══════════════════════════════════════════════
     DATA + LOGIC
═══════════════════════════════════════════════ -->
<script>
(function(){

/* ── DATA ──────────────────────────────────────── */
const ALL = [
  { id:"S-001", title:"Mycelium Sculpture Series I", year:2024, category:"BioSystems", type:"Installation", status:"Prototype",
    abstract:"Sculptural growth system using mycelium as structural computation: humidity, time, decay as form.",
    tags:["mycelium","biotech","sculpture","living material"],
    materials:["mycelium spawn","cellulose substrate","humidity enclosure"],
    technologies:["time-based growth","controlled decay"],
    axis:["interspecies","autonomy","infrastructure"],
    docs:{ pdf:false, images:true, video:true, network:true }
  },
  { id:"S-002", title:"Transparent Solar Leaf Panels", year:2024, category:"BioSystems", type:"Research", status:"Ongoing",
    abstract:"Screen-printed translucent solar layers inspired by leaf venation; biomimetic pattern as energy diagram.",
    tags:["solar","screen printing","biomimicry","cellulose"],
    materials:["translucent cellulose base","conductive inks","p/n layers"],
    technologies:["layered printing","thin-film experimentation"],
    axis:["energy","bio-infrastructure","material politics"],
    docs:{ pdf:true, images:true, video:false, network:true }
  },
  { id:"S-003", title:"Interspecies Archaeology / Living Relics", year:2025, category:"BioSystems", type:"Research", status:"Draft",
    abstract:"An archive for non-human agency: relics grown, eroded and indexed as if they were evidence.",
    tags:["interspecies","archive","mycelium","nanotech"],
    materials:["biomass","substrates","lab notes"],
    technologies:["growth protocols","micro documentation"],
    axis:["agency","taxonomy","time"],
    docs:{ pdf:true, images:true, video:true, network:false }
  },
  { id:"S-004", title:"Carnival Society / Dystopic Pop Artifact", year:2023, category:"Dystopic Pop Art", type:"Concept", status:"Draft",
    abstract:"Modern society as carnival: lights, attractions, control — depth replaced by spectacle. Interface as critique.",
    tags:["critique","spectacle","authority","interface"],
    materials:["text","graphic system","archive UI"],
    technologies:["indexing","controlled navigation"],
    axis:["authority","identity","bureaucracy"],
    docs:{ pdf:true, images:false, video:false, network:false }
  },
  { id:"S-005", title:"Frequency Plate / Cymatics Study", year:2022, category:"Cymatics", type:"Research", status:"Built",
    abstract:"Physical plates generating stable patterns under specific tones; mapping frequency to geometry as archive units.",
    tags:["cymatics","frequency","pattern","plate"],
    materials:["plate","speaker","tone generator"],
    technologies:["signal control","documentation"],
    axis:["measurement","ritual","structure"],
    docs:{ pdf:false, images:true, video:true, network:true }
  },
  { id:"S-006", title:"Public Installation / Palestine Structure", year:2025, category:"Public Art", type:"Installation", status:"Planned",
    abstract:"A sculptural installation addressing Palestine through infrastructural language: witnessing, memory, public space.",
    tags:["public art","memory","structure","palestine"],
    materials:["site-specific","public constraints","structure"],
    technologies:["planning","permits"],
    axis:["memory","authority","public space"],
    docs:{ pdf:true, images:false, video:false, network:false }
  },
  { id:"S-007", title:"Landscape Archive / Field Fragments", year:2021, category:"Landscape", type:"Research", status:"Archived",
    abstract:"Field notes and fragments: terrain as database; classification as a lens over land and extraction.",
    tags:["field","landscape","archive","fragments"],
    materials:["text","photos","mapping"],
    technologies:["indexing","taxonomy"],
    axis:["extraction","mapping","control"],
    docs:{ pdf:true, images:true, video:false, network:false }
  }
];

/* ── STATE ──────────────────────────────────────── */
let activeCategory = "All";
let activeIndex    = 0;
let sortMode       = "yearDesc";

/* ── HELPERS ─────────────────────────────────────── */
function getFiltered(){
  let list = ALL.slice();
  if(activeCategory !== "All") list = list.filter(p => p.category === activeCategory);
  list.sort((a,b) => sortMode === "yearAsc" ? a.year - b.year : b.year - a.year);
  return list;
}

function clampIndex(list){
  if(!list.length){ activeIndex = 0; return; }
  if(activeIndex < 0) activeIndex = list.length - 1;
  if(activeIndex >= list.length) activeIndex = 0;
}

function fileGradient(p){
  const k = parseInt((p.id||"S-000").split("-")[1]||"0",10)||0;
  const a = (k*41)%360, b=(a+80)%360;
  return `hsla(${a},28%,68%,0.18)`;
}

/* ── CANVAS CARD TEXTURE ─────────────────────────────
   Renders a card face to a canvas element and returns it.
   Matches original card layout: tab + hero area + body.
   Canvas: 820×660 (same aspect as CSS card).
   We use 2x resolution for crispness in VR.
─────────────────────────────────────────────────────── */
const CANVAS_W = 820, CANVAS_H = 660, SCALE = 2;

function loadFont(name, url){
  const f = new FontFace(name, `url(${url})`);
  return f.load().then(loaded => { document.fonts.add(loaded); return loaded; });
}

function drawCard(p, isBack, canvas){
  const W = CANVAS_W * SCALE, H = CANVAS_H * SCALE;
  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const s = SCALE;

  // Background
  ctx.fillStyle = "rgba(10,10,10,0.97)";
  ctx.fillRect(0,0,W,H);

  // Border
  ctx.strokeStyle = "rgba(232,226,214,0.18)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0.75, 0.75, W-1.5, H-1.5);

  // ── Tab ──
  const tabH = 30*s, tabX = 14*s, tabW = Math.min(400*s, W - 28*s);
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(tabX, 0, tabW, tabH);
  ctx.strokeStyle = "rgba(232,226,214,0.16)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tabX, 0); ctx.lineTo(tabX, tabH);
  ctx.lineTo(tabX + tabW, tabH); ctx.lineTo(tabX + tabW, 0);
  ctx.stroke();

  ctx.fillStyle = "rgba(232,226,214,0.86)";
  ctx.font = `${10*s}px 'Source Code Pro', monospace`;
  ctx.letterSpacing = `${1.6*s}px`;
  const tabText = `${p.id}  /  ${p.title}  —  ${p.category} ${p.year}`;
  ctx.textBaseline = "middle";
  ctx.fillText(tabText, tabX + 12*s, tabH/2, tabW - 24*s);

  // ── Notch ──
  ctx.strokeStyle = "rgba(232,226,214,0.13)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(14*s, 23*s, 58*s, 10*s);
  ctx.stroke();

  // ── Hero area ──
  const heroY = 33*s, heroH = 280*s;
  // Gradient background
  const k = parseInt((p.id||"S-000").split("-")[1]||"0",10)||0;
  const hue1 = (k*41)%360, hue2 = (hue1+80)%360;
  const grad = ctx.createLinearGradient(0, heroY, 0, heroY+heroH);
  grad.addColorStop(0, `hsla(${hue1},28%,68%,0.18)`);
  grad.addColorStop(1, `rgba(0,0,0,0.50)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, heroY, W, heroH);

  // Radial overlay
  const rg = ctx.createRadialGradient(W*0.3, heroY+heroH*0.25, 0, W*0.3, heroY+heroH*0.25, W*0.45);
  rg.addColorStop(0, `hsla(${hue1},30%,72%,0.13)`);
  rg.addColorStop(1, "transparent");
  ctx.fillStyle = rg;
  ctx.fillRect(0, heroY, W, heroH);

  // Hero bottom bar
  const barH = 36*s;
  const bGrad = ctx.createLinearGradient(0, heroY+heroH-barH, 0, heroY+heroH);
  bGrad.addColorStop(0, "rgba(0,0,0,0.05)");
  bGrad.addColorStop(1, "rgba(0,0,0,0.72)");
  ctx.fillStyle = bGrad;
  ctx.fillRect(0, heroY+heroH-barH, W, barH);

  ctx.fillStyle = "rgba(232,226,214,0.62)";
  ctx.font = `${10*s}px 'Source Code Pro', monospace`;
  ctx.textBaseline = "middle";
  ctx.letterSpacing = `${1.8*s}px`;
  const bar1 = `${p.category} — ${p.year}`;
  const bar2 = `${p.type} / ${p.status}`;
  ctx.fillText(bar1, 12*s, heroY+heroH - barH/2);
  const bw2 = ctx.measureText(bar2).width;
  ctx.fillStyle = "rgba(232,226,214,0.48)";
  ctx.fillText(bar2, W - bw2 - 12*s, heroY+heroH - barH/2);

  // Hero bottom border
  ctx.strokeStyle = "rgba(232,226,214,0.12)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, heroY+heroH); ctx.lineTo(W, heroY+heroH);
  ctx.stroke();

  // ── Card body ──
  const bodyY = heroY + heroH + 12*s;

  // Title
  ctx.fillStyle = "#e8e2d6";
  ctx.font = `600 ${20*s}px 'EB Garamond', serif`;
  ctx.textBaseline = "top";
  ctx.letterSpacing = `${0.2*s}px`;
  ctx.fillText(p.title, 14*s, bodyY, W - 28*s);

  // Meta line
  ctx.font = `${10*s}px 'Source Code Pro', monospace`;
  ctx.letterSpacing = `${1.8*s}px`;
  ctx.fillStyle = "rgba(232,226,214,0.55)";
  const metaY = bodyY + 28*s;
  ctx.fillText(`${p.category} — ${p.year}`, 14*s, metaY);
  const mw2 = ctx.measureText(`${p.type} / ${p.status}`).width;
  ctx.fillText(`${p.type} / ${p.status}`, W - mw2 - 14*s, metaY);

  // Abstract (hide on isBack)
  if(!isBack){
    ctx.font = `${14*s}px 'EB Garamond', serif`;
    ctx.fillStyle = "rgba(232,226,214,0.75)";
    ctx.letterSpacing = "0px";
    ctx.textBaseline = "top";
    const descY = metaY + 22*s;
    const words = p.abstract.split(" ");
    let line = "", lineY = descY;
    const maxW = W - 28*s, lineH = 20*s;
    for(const w of words){
      const test = line ? line+" "+w : w;
      if(ctx.measureText(test).width > maxW && line){
        ctx.fillText(line, 14*s, lineY, maxW);
        line = w; lineY += lineH;
        if(lineY > H - 60*s) break;
      } else {
        line = test;
      }
    }
    if(line && lineY <= H - 60*s) ctx.fillText(line, 14*s, lineY, maxW);

    // Tags
    const tagY = H - 50*s;
    ctx.font = `${10*s}px 'Source Code Pro', monospace`;
    ctx.letterSpacing = `${1.4*s}px`;
    let tx = 14*s;
    (p.tags||[]).slice(0,5).forEach(tag => {
      const tw = ctx.measureText(tag).width + 16*s;
      if(tx + tw > W - 14*s) return;
      ctx.strokeStyle = "rgba(232,226,214,0.14)";
      ctx.lineWidth = 1;
      ctx.strokeRect(tx, tagY, tw, 22*s);
      ctx.fillStyle = "rgba(232,226,214,0.55)";
      ctx.fillText(tag, tx+8*s, tagY+6*s);
      tx += tw + 8*s;
    });
  }

  return canvas;
}

/* ── A-FRAME: CARD ENTITIES ─────────────────────────
   Scale: 1 A-Frame unit ≈ 1 metre
   CSS card was 820px × 660px. At 0.0028m/px → ~2.30m × 1.85m
   z-step: -abs*320px → -abs*0.90m
   y-step:  abs*26px  →  abs*0.073m
   scale factor: 1 - abs*0.025 (same as CSS)
─────────────────────────────────────────────────────── */
const CARD_W  = 2.30;   // metres
const CARD_H  = 1.85;
const Z_STEP  = 0.90;   // abs * 320px → abs * 0.90m
const Y_STEP  = 0.073;  // abs * 26px  → abs * 0.073m
const WINDOW  = 2;      // cards visible each side

let cardEntities = [];
const rig = document.getElementById("card-rig");

function makeCardEntity(p, offset, listIndex){
  const abs = Math.abs(offset);
  const isBack = abs >= 1;

  // Canvas texture
  const canvas = document.createElement("canvas");
  drawCard(p, isBack, canvas);

  // Create entity
  const el = document.createElement("a-entity");
  el.setAttribute("class", "vr-card-trigger");
  el.dataset.listIndex = String(listIndex);

  // Geometry + material
  const plane = document.createElement("a-plane");
  plane.setAttribute("width", CARD_W);
  plane.setAttribute("height", CARD_H);
  plane.setAttribute("material", `
    src: ${canvas.toDataURL()};
    shader: flat;
    side: front;
    transparent: true;
    opacity: ${abs > 9 ? 0 : Math.max(0, 1 - abs * 0.055)};
  `);
  plane.setAttribute("shadow", "cast: true; receive: true");

  // Border frame (thin box)
  const border = document.createElement("a-box");
  border.setAttribute("width", CARD_W + 0.004);
  border.setAttribute("height", CARD_H + 0.004);
  border.setAttribute("depth", 0.003);
  border.setAttribute("position", "0 0 -0.002");
  border.setAttribute("material", `color: rgba(232,226,214,${isBack ? 0.10 : 0.18}); opacity: 1; shader: flat;`);

  el.appendChild(border);
  el.appendChild(plane);

  // Position — strictly z = -abs * Z_STEP
  const x = 0;
  const y = abs * Y_STEP;
  const z = -abs * Z_STEP;
  const s = 1 - abs * 0.025;

  el.setAttribute("position", `${x} ${y} ${z}`);
  el.setAttribute("scale", `${s} ${s} ${s}`);

  // Brightness via material color tint
  if(abs > 0){
    const bright = Math.max(0, 0.92 - abs * 0.04);
    plane.setAttribute("material", plane.getAttribute("material") + `; color: rgba(${Math.round(bright*232)},${Math.round(bright*226)},${Math.round(bright*214)},1);`);
  }

  el.setAttribute("pointer-events", abs > 6 ? "none" : "auto");

  // Click handler (desktop + VR)
  el.addEventListener("click", () => {
    const li = parseInt(el.dataset.listIndex, 10);
    if(!isNaN(li)){ activeIndex = li; render(); playClick(); }
  });
  el.addEventListener("fusing", () => {
    el.querySelector("a-plane").setAttribute("material", "color: rgba(255,255,220,0.9)");
  });

  return el;
}

function clearCards(){
  cardEntities.forEach(e => e.parentNode && e.parentNode.removeChild(e));
  cardEntities = [];
}

/* ── CLICK SOUND ─────────────────────────────────── */
let audioCtx = null;
function playClick(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime, dur = 0.018;
    const buf = audioCtx.createBuffer(1, Math.max(1, Math.floor(audioCtx.sampleRate*dur)), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(data.length/3))*0.75;
    const ns = audioCtx.createBufferSource(); ns.buffer = buf;
    const bp = audioCtx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.setValueAtTime(1800,t0); bp.Q.setValueAtTime(6,t0);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.18,t0+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    ns.connect(bp); bp.connect(g); g.connect(audioCtx.destination); ns.start(t0); ns.stop(t0+dur);
    const osc = audioCtx.createOscillator(); osc.type="square"; osc.frequency.setValueAtTime(1200,t0);
    const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.0001,t0); g2.gain.exponentialRampToValueAtTime(0.045,t0+0.0015); g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.010);
    osc.connect(g2); g2.connect(audioCtx.destination); osc.start(t0); osc.stop(t0+0.012);
  }catch(e){}
}

/* ── RENDER ──────────────────────────────────────── */
function render(){
  const list = getFiltered();
  clampIndex(list);

  // Clear
  clearCards();

  // Compute window
  let start = activeIndex - WINDOW;
  let end   = activeIndex + WINDOW;
  if(start < 0){ end += -start; start = 0; }
  if(end > list.length-1){ start -= (end-(list.length-1)); end = list.length-1; }
  start = Math.max(0, start);

  // Build cards
  for(let i = start; i <= end; i++){
    const offset = i - activeIndex;
    const el = makeCardEntity(list[i], offset, i);
    rig.appendChild(el);
    cardEntities.push(el);
  }

  // HUD
  const p = list[activeIndex];
  document.getElementById("hud-index").textContent = p ? `${activeIndex+1} / ${list.length}` : "—";
  renderDetail(p);

  // Buttons
  document.getElementById("prevBtn").disabled = list.length < 2;
  document.getElementById("nextBtn").disabled = list.length < 2;

  // Left panel
  renderCategoryPanel();
}

/* ── DETAIL PANEL ─────────────────────────────────── */
function renderDetail(p){
  const det = document.getElementById("detail");
  if(!p){
    det.innerHTML = `<h3 class="det-title">No results</h3><div class="det-meta"><span>filters</span><span>empty</span></div>`;
    return;
  }
  det.innerHTML = `
    <h3 class="det-title">${p.title}</h3>
    <div class="det-meta">
      <span>${p.category} — ${p.year}</span>
      <span>${p.type} / ${p.status}</span>
    </div>
    <div class="det-block">
      <div class="det-k">Description</div>
      <p class="det-p">${p.abstract}</p>
    </div>
    <div class="det-block">
      <div class="det-k">Technical Structure</div>
      <p class="det-p">
        <b>Materials:</b> ${(p.materials||[]).join(", ")||"—"}<br>
        <b>Technologies:</b> ${(p.technologies||[]).join(", ")||"—"}<br>
        <b>Identifier:</b> ${p.id}
      </p>
    </div>
    <div class="det-block">
      <div class="det-k">Conceptual Axis</div>
      <p class="det-p">${(p.axis||["—"]).join(" · ")}</p>
    </div>
    <div class="det-block">
      <div class="det-k">Tags</div>
      <div class="det-tags">
        ${(p.tags||[]).map(t=>`<span class="det-tag">${t}</span>`).join("")}
      </div>
    </div>
    <div class="det-block">
      <div class="det-k">Documentation</div>
      <div class="doc-row">
        <button class="doc-btn" ${p.docs?.pdf?"":'disabled'}>PDF</button>
        <button class="doc-btn" ${p.docs?.images?"":'disabled'}>Images</button>
        <button class="doc-btn" ${p.docs?.video?"":'disabled'}>Video</button>
        <button class="doc-btn" ${p.docs?.network?"":'disabled'}>Network</button>
      </div>
    </div>
  `;
}

/* ── CATEGORY PANEL ───────────────────────────────── */
function renderCategoryPanel(){
  const cats = ["All", ...Array.from(new Set(ALL.map(p=>p.category))).sort()];
  const cl = document.getElementById("catList");
  cl.innerHTML = "";
  cats.forEach(cat => {
    const count = cat==="All" ? ALL.length : ALL.filter(p=>p.category===cat).length;
    const div = document.createElement("div");
    div.className = "cat-item" + (activeCategory===cat?" active":"");
    div.innerHTML = `<span class="cat-label">${cat==="All"?"All Studies":cat}</span><span class="cat-count">${count}</span>`;
    div.addEventListener("click", () => {
      activeCategory = cat;
      activeIndex = 0;
      render();
    });
    cl.appendChild(div);
  });
}

/* ── CONTROLS ─────────────────────────────────────── */
function next(){ const list=getFiltered(); if(list.length<2)return; playClick(); activeIndex++; render(); }
function prev(){ const list=getFiltered(); if(list.length<2)return; playClick(); activeIndex--; render(); }

document.getElementById("prevBtn").addEventListener("click", prev);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("randBtn").addEventListener("click", () => {
  const list=getFiltered(); if(!list.length)return;
  playClick(); activeIndex=Math.floor(Math.random()*list.length); render();
});

// Keyboard
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft"||e.key==="ArrowUp")   prev();
  if(e.key==="ArrowRight"||e.key==="ArrowDown") next();
});

// Mouse wheel
document.getElementById("scene").addEventListener("wheel", e => {
  e.preventDefault();
  if(e.deltaY>0) next(); else prev();
},{passive:false});

// Touch swipe
let touchY0 = null;
document.getElementById("scene").addEventListener("touchstart", e => {
  if(e.touches[0]) touchY0 = e.touches[0].clientY;
},{passive:true});
document.getElementById("scene").addEventListener("touchend", e => {
  if(touchY0===null) return;
  const dy = ((e.changedTouches[0]?.clientY)||touchY0) - touchY0;
  touchY0=null;
  if(Math.abs(dy)<26) return;
  if(dy<0) next(); else prev();
},{passive:true});

/* ── GRID FLOOR LINES ─────────────────────────────── */
function buildGrid(){
  const gEl = document.getElementById("grid-lines");
  const SIZE=40, STEP=2, COLOR="rgba(232,226,214,0.04)";
  // horizontal lines
  for(let z=-SIZE;z<=SIZE;z+=STEP){
    const ln=document.createElement("a-entity");
    ln.setAttribute("line",`start: -${SIZE} 0 ${z}; end: ${SIZE} 0 ${z}; color: ${COLOR}; opacity: 0.5`);
    gEl.appendChild(ln);
  }
  // vertical lines
  for(let x=-SIZE;x<=SIZE;x+=STEP){
    const ln=document.createElement("a-entity");
    ln.setAttribute("line",`start: ${x} 0 -${SIZE}; end: ${x} 0 ${SIZE}; color: ${COLOR}; opacity: 0.5`);
    gEl.appendChild(ln);
  }
}

/* ── INIT ─────────────────────────────────────────── */
document.querySelector("a-scene").addEventListener("loaded", () => {
  buildGrid();
  render();
});

// Fallback if scene already loaded
if(document.querySelector("a-scene").hasLoaded){
  buildGrid();
  render();
}

})();
</script>
</body>
