<script>
const PANEL_CONTENT = {

  ],
  tabs: [

    },
    {
      key: "GENEALOGY",
      body: "",
      ctaHref: "https://inside.jofrearchive.com/genealogy/"
    },
    {

      body: "",
      ctaHref: "https://jofrearchive.com/artifacts"
    }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");
  const descEl = document.getElementById("dynamicDescription");  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  titleEl.textContent = PANEL_CONTENT.title || "";
  submetaEl.innerHTML = (PANEL_CONTENT.submeta||[]).map(escapeHtml).join("<br>");

  let active = 0;

  function render(){
    const t = PANEL_CONTENT.tabs[active];
    descEl.innerHTML = "";
    [...tabsEl.querySelectorAll(".tabLink")].forEach((el,i)=>el.classList.toggle("active", i===active));
  }

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t, idx)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key || "";
    b.addEventListener("click", ()=>{
    if (t && t.ctaHref) window.location.href = t.ctaHref;
  });
    tabsEl.appendChild(b);
  });  render();

  // Show panel once system is on
  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();</script>


  
<script>
(function(){

  async function requestGyroPermission(){
    try{
              // Ask gyro permission on mobile (required on iOS)
              if (isMobile()) {
                const ok = await requestGyroPermission();
                if (!ok) {
                  console.warn("Gyroscope permission not granted.");
                }
              }
      // iOS 13+ requires explicit permission
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const res = await DeviceOrientationEvent.requestPermission();
        return res === "granted";
      }
      // Other browsers: permission not required
      return true;
    }catch(e){
      console.warn("Gyro permission denied/unavailable:", e);
      return false;
    }
  }

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
  }

  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;

  // Wave flicker state (for point cloud "breathing" / waves)
  const __pcsWaveTargets = []; // {mesh, pos, cols, dir, speed, freq, phase, jitter, lastRegen}
  function __rand(a,b){ return a + Math.random()*(b-a); }

  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    // Elegant lighting setup
    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.35;

    const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), scene);
    keyLight.position = new BABYLON.Vector3(3, 6, 4);
    keyLight.intensity = 1.1;

    const rimLight = new BABYLON.PointLight("rim", new BABYLON.Vector3(-2, 2, -3), scene);
    rimLight.intensity = 0.6;


    const camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, 1.2, -1.8), scene);
    camera.attachControl(canvas, true);
    camera.setTarget(new BABYLON.Vector3(0, 1.0, 0));
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

    
    // Mobile gyroscope (device orientation)
    if (isMobile()) {
      try {
        // Add Babylon device orientation input to the existing camera
        camera.inputs.addDeviceOrientation();
        camera.angularSensibility = 4000; // smoother
      } catch (e) {
        console.warn("Device orientation input not available:", e);
      }
    }
// Load model -> convert to point cloud (await, so init can truly finish)
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);
    const meshes = res.meshes || [];
    for (const mesh of meshes){
      if (!mesh || !mesh.getTotalVertices || mesh.getTotalVertices() <= 0) continue;

      // Structural lines: render polygon edges (fixed in world)
      mesh.isVisible = true;

      // Hide faces but keep edges visible
      
      const solidMat = new BABYLON.PBRMaterial("solidMat_"+mesh.name, scene);
      solidMat.albedoColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      solidMat.metallic = 0.4;
      solidMat.roughness = 0.35;
      solidMat.environmentIntensity = 0.8;
      mesh.material = solidMat;
    

      
    }

    // XR should NEVER block startup on non-XR contexts
    try{
      await scene.createDefaultXRExperienceAsync({ disableTeleportation: true });
    }catch(e){
      // ok
      console.warn("XR not available:", e);
    }

    return scene;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));

      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";

      loader.classList.add("fadeOut");
      setTimeout(()=>{
        loader.classList.remove("fadeOut");
        loader.setAttribute("aria-hidden","true");
        if (bar) bar.style.width = "0%";
        if (pct) pct.textContent = "0%";
        if (status) status.textContent = "loading geometry";
        if (typeLine) typeLine.textContent = "Boot sequence…";
      }, 1100);
    }

    function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
      if (typeLine) typeLine.textContent = msg || "Initialization failed.";
      if (pct) pct.textContent = "ERR";
      if (bar) bar.style.width = "0%";
    }

    return {done, fail};
  }

  let loopStarted = false;

  let initializedOnce = false;
  const FIRST_RUN_KEY = "JA_INIT_DONE_v1";

  function hasInitFlag(){
    try { return localStorage.getItem(FIRST_RUN_KEY) === "1"; } catch(e){ return false; }
  }
  function setInitFlag(){
    try { localStorage.setItem(FIRST_RUN_KEY, "1"); } catch(e){}
  }

  async function enableMotionIfNeeded(){
    const needsGesture = (typeof DeviceOrientationEvent !== "undefined" &&
                         typeof DeviceOrientationEvent.requestPermission === "function");
    if (!isMobile() || !needsGesture) return true;
    const btn = document.getElementById("motionBtn");
    if(!btn) return false;
    btn.style.display = "inline-flex";
    return new Promise((resolve) => {
      const onClick = async () => {
        const ok = await requestGyroPermission();
        btn.style.display = "none";
        resolve(ok);
      };
      btn.addEventListener("click", onClick, { once:true });
    });
  }

  async function initSystem(opts){
    const { withLoader } = opts || {};
    const L = withLoader ? startLoader(2600) : null;

    document.body.classList.remove("bab3d-ready");
    document.body.classList.add("bab3d-on");

    try{
      if (isMobile()) {
        if (withLoader) {
          await requestGyroPermission();
        } else {
          await enableMotionIfNeeded();
        }
      }

      if (!initializedOnce){
        initializedOnce = true;
        await createScene();
      }

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => {
          if (!scene) return;

          // Wave flicker update (throttled)
          if (__pcsWaveTargets.length) {
            const t = performance.now() * 0.001;
            for (const w of __pcsWaveTargets) {
              if (performance.now() - w.lastRegen > 2600 + Math.random()*2400) {
                w.dir = new BABYLON.Vector3(__rand(-1,1), __rand(-1,1), __rand(-1,1)).normalize();
                w.speed = __rand(0.45, 1.15);
                w.freq  = __rand(0.9, 2.4);
                w.phase = __rand(0, Math.PI*2);
                w.jitter = __rand(0.2, 0.9);
                w.lastRegen = performance.now();
              }

              if (!w._skip) w._skip = 0;
              w._skip = (w._skip + 1) % 2;
              if (w._skip) continue;

              const pos = w.pos;
              const cols = w.cols;
              if (!pos || !cols) continue;

              const dx = w.dir.x, dy = w.dir.y, dz = w.dir.z;
              const k = w.freq;
              const sp = w.speed;
              const ph = w.phase;

              const baseA = 0.08;
              const ampA  = 0.34;
              const jitA  = w.jitter;

              for (let i=0, vi=0; i<pos.length; i+=3, vi+=4) {
                const dot = pos[i]*dx + pos[i+1]*dy + pos[i+2]*dz;
                const wave = Math.sin(dot * k + t*sp + ph);
                const wave2 = Math.sin(dot * (k*0.63) - t*(sp*0.77) + ph*0.7);
                const a = baseA + ampA * Math.max(0, (wave*0.65 + wave2*0.35));
                const spark = (Math.sin(dot*0.21 + t*2.2 + ph) + 1) * 0.5;
                cols[vi+3] = Math.min(0.65, a + spark*0.06*jitA);
              }
              w.mesh.updateVerticesData(BABYLON.VertexBuffer.ColorKind, cols);
            }
          }

          scene.render();
        });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      if (L) await L.done();
      if (withLoader) setInitFlag();

    }catch(err){
      console.error(err);
      if (L) L.fail("Initialization failed. Check console.");
      document.body.classList.remove("bab3d-on");
      document.body.classList.add("bab3d-ready");
      initializedOnce = false;
    }
  }

document.getElementById("startVR").addEventListener("click", async () => {
    await initSystem({ withLoader: true });
  });

  // Auto-start on returning visits (no loader, no gate)
  try{
    if (hasInitFlag()) {
      requestAnimationFrame(() => { initSystem({ withLoader: false }); });
    }
  }catch(e){}

  window.addEventListener("resize", () => engine.resize());
})();
</script>
