<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>3D Test</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:monospace;color:#fff;}
canvas{border:1px solid #444;display:block;}
#log{margin-top:16px;font-size:12px;color:#aaa;max-width:600px;text-align:center;}
</style>
</head>
<body>
<canvas id="c" width="540" height="300"></canvas>
<div id="log">Loading...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const log = document.getElementById('log');
function say(msg){ log.textContent = msg; console.log(msg); }

window.addEventListener('load', () => {
  say('THREE loaded: ' + (typeof THREE !== 'undefined'));

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setSize(540, 300, false);
  renderer.setClearColor(0x222222, 1);

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(3,5,4);
  scene.add(dir);

  const camera = new THREE.PerspectiveCamera(38, 540/300, 0.1, 100);
  camera.position.set(0, 0, 4);

  // First: add a visible fallback cube so we know rendering works at all
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({color:0xff4444})
  );
  scene.add(cube);
  say('Cube added. Renderer running. Loading GLB...');

  let t = 0;
  let model = cube;
  (function loop(){
    requestAnimationFrame(loop);
    model.rotation.y += 0.01;
    renderer.render(scene, camera);
  })();

  // Try loading GLB
  function waitForLoader(attempts){
    if(typeof THREE.GLTFLoader === 'undefined'){
      if(attempts > 30){ say('GLTFLoader never loaded!'); return; }
      setTimeout(()=>waitForLoader(attempts+1), 100);
      return;
    }
    say('GLTFLoader ready. Fetching skull.glb...');
    const loader = new THREE.GLTFLoader();
    loader.load(
      'https://inside.jofrearchive.com/assets/3D/skull.glb',
      (gltf) => {
        say('GLB loaded OK! Adding to scene...');
        scene.remove(cube);
        const obj = gltf.scene;
        obj.traverse(c => {
          if(c.isMesh){
            say('Mesh found: ' + c.name + ' | vertices: ' + (c.geometry.attributes.position ? c.geometry.attributes.position.count : '?'));
            c.material = new THREE.MeshStandardMaterial({color:0xccbbaa, roughness:0.5, metalness:0.2});
          }
        });
        const box = new THREE.Box3().setFromObject(obj);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        say('GLB size: ' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2));
        obj.position.sub(center);
        obj.scale.setScalar(2.4 / size.length());
        scene.add(obj);
        model = obj;
      },
      (xhr) => {
        if(xhr.total) say('Loading: ' + Math.round(xhr.loaded/xhr.total*100) + '%');
      },
      (err) => {
        say('GLB ERROR: ' + err.message);
        console.error(err);
      }
    );
  }
  waitForLoader(0);
});
</script>
</body>
</html>
