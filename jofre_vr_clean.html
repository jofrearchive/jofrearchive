<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VR Stable Clean</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#0b0b0b;}
#renderCanvas{width:100%;height:100%;touch-action:none;display:block;}

#vrBtn{
position:fixed;
left:50%;
bottom:20px;
transform:translateX(-50%);
z-index:10;
display:flex;
align-items:center;
gap:10px;
padding:10px 14px;
border:1px solid rgba(255,255,255,.2);
background:rgba(0,0,0,.5);
color:rgba(255,255,255,.6);
font-family:monospace;
font-size:12px;
letter-spacing:.2em;
text-transform:uppercase;
cursor:pointer;
}

#vrBtn.active{
color:#fff;
border-color:rgba(255,255,255,.5);
}

#vrDot{
width:8px;height:8px;border-radius:50%;
background:#222;
}

#vrBtn.active #vrDot{
background:#4ade80;
box-shadow:0 0 10px #4ade80;
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<button id="vrBtn">
<span id="vrDot"></span>
<span id="vrLabel">VR OFF</span>
</button>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.043,0.043,0.043,1);

const light = new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0,1,0), scene);
light.intensity = 0.6;

// Camera
const camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0,5,-30), scene);
camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
camera.fov = 0.9;
camera.setTarget(BABYLON.Vector3.Zero());
camera.attachControl(canvas, true);

// Gyro rig
const gyroRig = new BABYLON.TransformNode("gyroRig", scene);
gyroRig.rotationQuaternion = BABYLON.Quaternion.Identity();
camera.parent = gyroRig;

// Simple rotating object (replace with your GLB if needed)
const sphere = BABYLON.MeshBuilder.CreateSphere("s", {diameter:10}, scene);
sphere.position.y = 5;

scene.onBeforeRenderObservable.add(()=>{
sphere.rotation.y += 0.01;
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize", ()=>engine.resize());

// VR SYSTEM (DELTA STABLE)
let vrEnabled = false;
let rigBaseQuat = null;
let sensorQ0Inv = null;

const vrBtn = document.getElementById("vrBtn");
const vrLabel = document.getElementById("vrLabel");

async function requestPermission(){
if (typeof DeviceOrientationEvent !== "undefined" &&
typeof DeviceOrientationEvent.requestPermission === "function"){
try{
const res = await DeviceOrientationEvent.requestPermission();
return res === "granted";
}catch(e){return false;}
}
return true;
}

function enableVR(){

camera.detachControl(canvas);

rigBaseQuat = gyroRig.rotationQuaternion.clone();
sensorQ0Inv = null;

window.addEventListener("deviceorientation", handler, true);

vrEnabled = true;
vrBtn.classList.add("active");
vrLabel.textContent = "VR ON";
}

function disableVR(){

window.removeEventListener("deviceorientation", handler, true);

gyroRig.rotationQuaternion = rigBaseQuat.clone();

camera.attachControl(canvas, true);

vrEnabled = false;
vrBtn.classList.remove("active");
vrLabel.textContent = "VR OFF";
}

function handler(e){
if(!vrEnabled) return;

const alpha = BABYLON.Tools.ToRadians(e.alpha || 0);
const beta  = BABYLON.Tools.ToRadians(e.beta  || 0);

const q = new BABYLON.Quaternion();
BABYLON.Quaternion.RotationYawPitchRollToRef(-alpha, beta, 0, q);
q.normalize();

if(!sensorQ0Inv){
sensorQ0Inv = q.clone();
sensorQ0Inv.conjugate();
return;
}

const delta = sensorQ0Inv.multiply(q);
delta.normalize();

const final = rigBaseQuat.multiply(delta);
final.normalize();

gyroRig.rotationQuaternion = final;
}

vrBtn.addEventListener("click", async ()=>{
if(!vrEnabled){
const ok = await requestPermission();
if(!ok) return;
enableVR();
}else{
disableVR();
}
});
</script>

</body>
</html>
