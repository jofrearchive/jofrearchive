<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — Cloister Point Cloud</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0b0b;
      --ivory: #e8e2d6;
      --led-green: #4ade80;
    }
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--bg-deep); }
    #renderCanvas { width:100%; height:100%; touch-action:none; filter: contrast(110%) brightness(90%); }

    /* Gate */
    #gate {
      position:absolute; inset:0;
      background: radial-gradient(circle at center, rgba(11,11,11,0.8) 0%, var(--bg-deep) 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; color:var(--ivory); text-align:center;
    }
    .bab3d-on #gate{ display:none; }

    h1 {
      font-family:'EB Garamond', serif;
      font-weight: normal;
      letter-spacing: .2em;
      opacity:.9;
      margin: 0 0 40px 0;
    }

    #startVR {
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(232,226,214,.2);
      color: var(--ivory);
      font-family:'Source Code Pro', monospace;
      text-transform: uppercase;
      letter-spacing: .18em;
      padding: 12px 30px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap: 15px;
      transition: all .3s ease;
    }
    #startVR:hover { border-color: rgba(232,226,214,.5); background: rgba(0,0,0,.8); }
    #led { width:8px; height:8px; background:#222; border-radius:50%; box-shadow: 0 0 0px var(--led-green); transition:.3s; }
    #startVR:hover #led { background: var(--led-green); box-shadow: 0 0 8px var(--led-green); }

    
/* ===== PANEL (from index style) ===== */
#panel{
  position:fixed;
  left:50%;
  top:50%;
  transform: translate(-50%, -50%);
  width: min(480px, 88vw);
  background: rgba(10,10,10,.65);
  border:1px solid rgba(255,255,255,.18);
  padding: clamp(18px, 3vw, 28px);
  backdrop-filter: blur(8px);
  z-index:8;
  opacity:0;
  transition: opacity 1.0s ease;
  display:none;
}
#panel.show{ opacity:1; }
#submeta{
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  opacity:.65;
  letter-spacing:.10em;
  text-transform: uppercase;
  line-height:1.6;
  margin-bottom: 14px;
}
.tabs{ display:flex; flex-direction:column; gap:10px; margin: 12px 0 10px; }
.tabLink{
  width:100%;
  text-align:left;
  background: rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.14);
  color: var(--ivory);
  padding: 10px 12px;
  cursor:pointer;
  transition: background .2s ease, border-color .2s ease;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.tabLink:hover, .tabLink.active{
  background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.26);
}
.tabLink .k{
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing:.16em;
  text-transform: uppercase;
  opacity:.9;
}
.tabLink .s{
  font-family:'Source Code Pro', monospace;
  font-size: 11px;
  opacity:.55;
  letter-spacing:.08em;
  text-transform: uppercase;
}
#dynamicDescription{
  font-family:'EB Garamond', serif;
  font-size: 16px;
  line-height:1.6;
  opacity:.9;
  min-height: 48px;
}
.tabCta{
  margin-top: 10px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding: 8px 10px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.02);
  color: var(--ivory);
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing:.14em;
  text-transform: uppercase;
  cursor:pointer;
}
.tabCta:hover{ border-color: rgba(255,255,255,.30); background: rgba(255,255,255,.04); }


#panel #title{
  font-family:'EB Garamond', serif;
  font-size: clamp(28px, 4vw, 42px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ivory);
  margin: 0 0 14px 0;
}
#panel #submeta{
  font-family:'Source Code Pro', monospace;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity:.65;
  line-height:1.7;
  margin-bottom: 18px;
  color: var(--ivory);
}
#panel .tabs{
  display:flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
#panel .tabLink{
  background: rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.16);
  color: var(--ivory);
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  padding: 12px 20px;
  cursor:pointer;
  transition: background .2s ease, border-color .2s ease, opacity .2s ease;
  opacity:.75;
}
#panel .tabLink:hover{
  opacity: 1;
  border-color: rgba(255,255,255,.28);
  background: rgba(255,255,255,.04);
}
#panel .tabLink.active{
  opacity: 1;
  border-color: rgba(255,255,255,.36);
  background: rgba(255,255,255,.06);
}
#panel #dynamicDescription{
  margin-top: 10px;
  margin-bottom: 28px;
}
#panel .descTitle{
  font-family:'EB Garamond', serif;
  font-size: clamp(18px, 2.1vw, 28px);
  line-height:1.45;
  color: var(--ivory);
  opacity:.92;
}
#panel .tabCta{
  background: transparent;
  border: none;
  color: var(--ivory);
  font-family:'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity:.55;
  cursor:pointer;
  padding: 0;
}
#panel .tabCta:hover{ opacity:.85; }


/* gate vs system */
body.bab3d-ready #panel{ display:none; }
body.bab3d-on #gate{ display:none; }
body.bab3d-on #panel{ display:block; }


    
/* ===== LOADER ===== */
#loader {
  position:fixed; inset:0;
  background: var(--bg-deep);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
           max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
}
#loader[aria-hidden="true"]{ display:none; }
.loaderBox {
  width:min(760px, 92vw);
  border:1px solid rgba(255,255,255,.16);
  background: rgba(10,10,10,.60);
  padding: clamp(18px, 4vw, 34px);
}
.loaderTitle {
  font-family:'EB Garamond', serif;
  font-size: clamp(16px, 2.6vw, 22px);
  letter-spacing: .24em;
  text-transform: uppercase;
  opacity:.92;
  margin-bottom: 12px;
  color: var(--ivory);
}
.typeLine {
  font-family: 'Source Code Pro', monospace;
  font-size: clamp(12px, 2vw, 14px);
  letter-spacing: .08em;
  opacity:.78;
  line-height:1.65;
  white-space: pre-wrap;
  min-height: 5.2em;
  color: var(--ivory);
}
.barWrap {
  margin-top: 18px;
  height: 10px;
  border:1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.03);
}
.bar {
  height:100%;
  width:0%;
  background: rgba(232,226,214,.58);
  transition: width .08s linear;
}
.percentRow {
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top: 12px;
  font-family: 'Source Code Pro', monospace;
  font-size: 12px;
  letter-spacing: .14em;
  opacity:.65;
  text-transform: uppercase;
  color: var(--ivory);
}
.fadeOut {
  opacity:0;
  pointer-events:none;
  transition: opacity 1.1s ease;
}

  </style>
</head>
<body class="bab3d-ready">
  
  <div id="gate">
    <h1>EXPERIMENTAL ARCHIVE</h1>
    <button id="startVR">
      <div id="led"></div>
      <span>Initialize System</span>
    </button>
  </div>


  
  <div id="loader" aria-hidden="true">
    <div class="loaderBox">
      <div class="loaderTitle">INITIALIZING SYSTEM</div>
      <div id="typeLine" class="typeLine">Boot sequence…</div>
      <div class="barWrap"><div id="bar" class="bar"></div></div>
      <div class="percentRow">
        <div id="pct">0%</div>
        <div id="status">loading geometry</div>
      </div>
    </div>
  </div>


  <canvas id="renderCanvas"></canvas>
  <div id="panel" aria-hidden="false">
    <div id="title">JOFRE OLIVERAS</div>
    <div id="submeta"></div>

    <div class="tabs" id="tabs"></div>

    <div id="dynamicDescription"></div>

    <button class="tabCta" id="panelCta" type="button">ACCESS →</button>
  </div>

      <div id="submeta">EXPERIMENTAL ARCHIVE</div>
      <div class="tabs" id="tabs"></div>
      <div id="dynamicDescription"></div>
      <div id="footer"></div>
    </div>
  </div>


  
<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "ARTIST · RESEARCHER · EXPLORER",
    "BASED BETWEEN DISCIPLINES"
  ],
  tabs: [
    {
      key: "STUDIES",
      body: "",
      ctaHref: "https://inside.jofrearchive.com/studies/"
    },
    {
      key: "GENEALOGY",
      body: "",
      ctaHref: "https://inside.jofrearchive.com/genealogy/"
    },
    {
      key: "ARTIFACTS",
      body: "",
      ctaHref: "https://jofrearchive.com/artifacts"
    }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");
  const descEl = document.getElementById("dynamicDescription");
  const ctaEl = document.getElementById("panelCta");

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  titleEl.textContent = PANEL_CONTENT.title || "";
  submetaEl.innerHTML = (PANEL_CONTENT.submeta||[]).map(escapeHtml).join("<br>");

  let active = 0;

  function render(){
    const t = PANEL_CONTENT.tabs[active];
    descEl.innerHTML = "";
    [...tabsEl.querySelectorAll(".tabLink")].forEach((el,i)=>el.classList.toggle("active", i===active));
  }

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t, idx)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key || "";
    b.addEventListener("click", ()=>{
    if (t && t.ctaHref) window.location.href = t.ctaHref;
  });
    tabsEl.appendChild(b);
  });

  ctaEl.addEventListener("click", ()=>{
    const t = PANEL_CONTENT.tabs[active];
    if (t && t.ctaHref) window.location.href = t.ctaHref;
  });

  render();

  // Show panel once system is on
  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();</script>


  
<script>
(function(){
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;

  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    const camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, 1.6, 0), scene);
    camera.attachControl(canvas, true);
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

    // Load model -> convert to point cloud (await, so init can truly finish)
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);
    const meshes = res.meshes || [];
    for (const mesh of meshes){
      if (!mesh || !mesh.getTotalVertices || mesh.getTotalVertices() <= 0) continue;
      mesh.isVisible = false;

      const pcs = new BABYLON.PointsCloudSystem("pcs_"+mesh.name, 1, scene);
      const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const count = mesh.getTotalVertices();

      pcs.addPoints(count, (particle, i) => {
        if (!positions) return;
        particle.position = new BABYLON.Vector3(
          positions[i*3],
          positions[i*3 + 1],
          positions[i*3 + 2]
        );
        particle.color = new BABYLON.Color4(0.91, 0.88, 0.84, 0.4);
      });

      const pcsMesh = await pcs.buildMeshAsync();
      // ensure point rendering
      const mat = new BABYLON.StandardMaterial("pcsMat_"+mesh.name, scene);
      mat.emissiveColor = new BABYLON.Color3(0.91, 0.88, 0.84);
      mat.disableLighting = true;
      mat.pointsCloud = true;
      mat.pointSize = 2.0;
      pcsMesh.material = mat;
    }

    // XR should NEVER block startup on non-XR contexts
    try{
      await scene.createDefaultXRExperienceAsync({ disableTeleportation: true });
    }catch(e){
      // ok
      console.warn("XR not available:", e);
    }

    return scene;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));

      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";

      loader.classList.add("fadeOut");
      setTimeout(()=>{
        loader.classList.remove("fadeOut");
        loader.setAttribute("aria-hidden","true");
        if (bar) bar.style.width = "0%";
        if (pct) pct.textContent = "0%";
        if (status) status.textContent = "loading geometry";
        if (typeLine) typeLine.textContent = "Boot sequence…";
      }, 1100);
    }

    function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
      if (typeLine) typeLine.textContent = msg || "Initialization failed.";
      if (pct) pct.textContent = "ERR";
      if (bar) bar.style.width = "0%";
    }

    return {done, fail};
  }

  let loopStarted = false;

  document.getElementById("startVR").addEventListener("click", async () => {
    const L = startLoader(2600);

    // Switch UI state immediately
    document.body.classList.remove("bab3d-ready");
    document.body.classList.add("bab3d-on");

    try{
      await createScene();

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => { if (scene) scene.render(); });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      await L.done();
    }catch(err){
      console.error(err);
      L.fail("Initialization failed. Check console.");
      // go back to gate if it failed
      document.body.classList.remove("bab3d-on");
      document.body.classList.add("bab3d-ready");
    }
  });

  window.addEventListener("resize", () => engine.resize());
})();
</script>
