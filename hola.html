<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — Cloister Point Cloud</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Source+Code+Pro:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0b0b;
      --ivory: #e8e2d6;
      --led-green: #4ade80;
    }
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--bg-deep); }
    #renderCanvas { width:100%; height:100%; touch-action:none; filter: contrast(110%) brightness(90%); }

    /* Gate */
    #gate {
      position:absolute; inset:0;
      background: radial-gradient(circle at center, rgba(11,11,11,0.8) 0%, var(--bg-deep) 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10; color:var(--ivory); text-align:center;
    }
    .bab3d-on #gate{ display:none; }

    h1 {
      font-family:'EB Garamond', serif;
      font-weight: normal;
      letter-spacing: .2em;
      opacity:.9;
      margin: 0 0 40px 0;
    }

    #startVR {
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(232,226,214,.2);
      color: var(--ivory);
      font-family:'Source Code Pro', monospace;
      text-transform: uppercase;
      letter-spacing: .18em;
      padding: 12px 30px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap: 15px;
      transition: all .3s ease;
    }
    #startVR:hover { border-color: rgba(232,226,214,.5); background: rgba(0,0,0,.8); }
    #led { width:8px; height:8px; background:#222; border-radius:50%; box-shadow: 0 0 0px var(--led-green); transition:.3s; }
    #startVR:hover #led { background: var(--led-green); box-shadow: 0 0 8px var(--led-green); }

    /* PANEL */
    #panel{
      position:fixed;
      left:50%;
      top:50%;
      transform: translate(-50%, -50%);
      width: min(360px, 92vw);
      background: rgba(10,10,10,.65);
      border:1px solid rgba(255,255,255,.18);
      padding: 32px !important;
      backdrop-filter: blur(8px);
      z-index:8;
      opacity:0;
      transition: opacity 1.0s ease;
      display:none;
    }
    #panel.show{ opacity:1; }
    #panel #title{ font-family:'EB Garamond', serif; font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: var(--ivory); margin: 0 0 10px 0; }
    #panel #submeta{ font-family:'Source Code Pro', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity:.65; line-height: 1.6; margin-bottom: 12px; color: var(--ivory); }
    #panel .tabs{ display:flex; gap: 8px; justify-content: space-between; margin-bottom: 6px; }
    #panel .tabLink{ flex: 1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.16); color: var(--ivory); font-family: 'Source Code Pro', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 10px 8px; cursor: pointer; transition: all 0.2s ease; }
    #panel .tabLink:hover, #panel .tabLink.active{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.36); }

    body.bab3d-on #panel{ display:block; }

    /* LOADER */
    #loader { position:fixed; inset:0; background: var(--bg-deep); z-index:9999; display:flex; align-items:center; justify-content:center; }
    #loader[aria-hidden="true"]{ display:none; }
    .loaderBox { width:min(760px, 92vw); border:1px solid rgba(255,255,255,.16); background: rgba(10,10,10,.60); padding: 34px; }
    .loaderTitle { font-family:'EB Garamond', serif; font-size: 22px; letter-spacing: .24em; text-transform: uppercase; color: var(--ivory); margin-bottom: 12px; }
    .typeLine { font-family: 'Source Code Pro', monospace; font-size: 14px; opacity:.78; color: var(--ivory); min-height: 5.2em; }
    .barWrap { margin-top: 18px; height: 10px; border:1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.03); }
    .bar { height:100%; width:0%; background: rgba(232,226,214,.58); transition: width .08s linear; }
    .percentRow { display:flex; justify-content:space-between; margin-top: 12px; font-family: 'Source Code Pro', monospace; font-size: 12px; color: var(--ivory); opacity:.65; }
    .fadeOut { opacity:0; pointer-events:none; transition: opacity 1.1s ease; }

    /* VR Button */
    #motionBtn{
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 12; display: none;
      align-items: center; gap: 10px; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.55);
      color: var(--ivory); font-family:'Source Code Pro', monospace; font-size: 12px; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(10px);
    }
    #motionBtn.active #motionDot{ background: #4ade80; box-shadow: 0 0 12px #4ade80; }
    #motionDot{ width:8px; height:8px; border-radius:50%; background: rgba(74,222,128,.85); box-shadow: 0 0 10px rgba(74,222,128,.35); transition:all .3s ease; }

    /* iOS Gate */
    .motionGate{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index: 60; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
    .gateBox{ width: min(420px, calc(100% - 32px)); border: 1px solid rgba(232,226,214,0.16); background: rgba(15,15,15,0.78); padding: 24px; color: #e8e2d6; }
    .gateBtn{ margin-top: 16px; width:100%; padding: 10px; border: 1px solid rgba(232,226,214,0.16); background: rgba(0,0,0,0.18); color: var(--ivory); font-family: 'Source Code Pro', monospace; cursor:pointer; }
  </style>
</head>
<body class="bab3d-ready">

  <div id="gate">
    <h1>EXPERIMENTAL ARCHIVE</h1>
    <button id="startVR">
      <div id="led"></div>
      <span>Initialize System</span>
    </button>
  </div>

  <div id="loader" aria-hidden="true">
    <div class="loaderBox">
      <div class="loaderTitle">INITIALIZING SYSTEM</div>
      <div id="typeLine" class="typeLine">Boot sequence…</div>
      <div class="barWrap"><div id="bar" class="bar"></div></div>
      <div class="percentRow"><div id="pct">0%</div><div id="status">loading geometry</div></div>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <button id="motionBtn" type="button">
    <span id="motionDot"></span>
    <span class="vrLabel">VR OFF</span>
  </button>

  <div class="motionGate" id="motionGate">
    <div class="gateBox">
      <p style="font-family:'EB Garamond'; font-size:18px;">Enable Orientation</p>
      <p style="font-size:14px; opacity:0.7;">iOS requires a user gesture to allow gyroscope control.</p>
      <button class="gateBtn" id="enableMotionBtn">Enable Sensors</button>
    </div>
  </div>

  <div id="panel">
    <div id="title">JOFRE OLIVERAS</div>
    <div id="submeta"></div>
    <div class="tabs" id="tabs"></div>
  </div>

<script>
// --- CONFIGURACIÓN DE PANEL ---
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: ["ARTIST · EXPLORER · LANDSCAPER", "BASED BETWEEN DISCIPLINES", "EXPERIMENTAL ARCHIVE"],
  tabs: [
    { key: "STUDIES", ctaHref: "https://inside.jofrearchive.com/studies/" },
    { key: "GENEALOGY", ctaHref: "https://inside.jofrearchive.com/genealogy/" },
    { key: "ARTIFACTS", ctaHref: "https://jofrearchive.com/artifacts" }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  document.getElementById("title").textContent = PANEL_CONTENT.title;
  document.getElementById("submeta").innerHTML = PANEL_CONTENT.submeta.join("<br>");
  const tabsEl = document.getElementById("tabs");
  PANEL_CONTENT.tabs.forEach(t => {
    const b = document.createElement("button");
    b.className = "tabLink";
    b.textContent = t.key;
    b.onclick = () => { if(t.ctaHref) window.location.href = t.ctaHref; };
    tabsEl.appendChild(b);
  });
  new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) panel.classList.add("show");
  }).observe(document.body, { attributes:true, attributeFilter:["class"] });
})();

// --- LÓGICA 3D Y VR ---
(function(){
  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene, camera;
  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  async function requestGyroPermission(){
    const DOE = window.DeviceOrientationEvent;
    if(!DOE || typeof DOE.requestPermission !== 'function') return true;
    document.getElementById('motionGate').style.display = 'flex';
    return new Promise(res => {
      document.getElementById('enableMotionBtn').onclick = async () => {
        const status = await DOE.requestPermission();
        document.getElementById('motionGate').style.display = 'none';
        res(status === 'granted');
      };
    });
  }

  function isMobile(){
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
  }

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    // --- NUEVA ILUMINACIÓN ---
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.2; // Luz ambiental tenue
    hemi.groundColor = new BABYLON.Color3(0.1, 0.1, 0.2);

    const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), scene);
    keyLight.position = new BABYLON.Vector3(10, 20, 10);
    keyLight.intensity = 1.5; // Resalta el relieve
    keyLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8); // Tono cálido

    // Cámara
    camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, -6, -40), scene);
    camera.rotationQuaternion = BABYLON.Quaternion.Identity(); 
    camera.attachControl(canvas, true);
    camera.setTarget(new BABYLON.Vector3(0, 15, 0));

    // Carga de Modelo
    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);
    const modelRoot = new BABYLON.TransformNode("root", scene);
    res.meshes.forEach(m => {
      if(m && !m.parent) m.parent = modelRoot;
      if(m.getTotalVertices() > 0){
        const mat = new BABYLON.PBRMaterial("mat", scene);
        mat.albedoColor = new BABYLON.Color3(0.02, 0.02, 0.02);
        mat.metallic = 0.4; mat.roughness = 0.35;
        m.material = mat;
      }
    });

    // Rotación suave del modelo
    scene.onBeforeRenderObservable.add(() => {
      modelRoot.rotation.y += 0.001;
    });

    // Lógica VR Corregida
    const motionBtn = document.getElementById("motionBtn");
    if(isMobile() && motionBtn){
      motionBtn.style.display = "flex";
      let motionActive = false, correctionQuat = null, _handler = null;

      motionBtn.onclick = async () => {
        if(!motionActive){
          if(await requestGyroPermission()){
            const baseQuat = camera.rotationQuaternion.clone();
            _handler = (e) => {
              const qY = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, e.alpha * Math.PI/180);
              const qX = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, e.beta * Math.PI/180);
              const qZ = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, -e.gamma * Math.PI/180);
              const sensor = qY.multiply(qX).multiply(qZ);
              if(!correctionQuat) correctionQuat = baseQuat.multiply(sensor.clone().invert());
              camera.rotationQuaternion.copyFrom(correctionQuat.multiply(sensor));
            };
            window.addEventListener("deviceorientation", _handler, true);
            motionActive = true;
            motionBtn.classList.add("active");
            motionBtn.querySelector(".vrLabel").textContent = "VR ON";
          }
        } else {
          window.removeEventListener("deviceorientation", _handler, true);
          motionActive = false; correctionQuat = null;
          motionBtn.classList.remove("active");
          motionBtn.querySelector(".vrLabel").textContent = "VR OFF";
        }
      };
    }
  }

  // --- LOADER Y BOOT ---
  async function initSystem(withLoader){
    if(withLoader) document.getElementById("loader").setAttribute("aria-hidden","false");
    document.body.classList.replace("bab3d-ready", "bab3d-on");
    await createScene();
    engine.runRenderLoop(() => scene.render());
    if(withLoader){
      document.getElementById("bar").style.width = "100%";
      setTimeout(() => document.getElementById("loader").classList.add("fadeOut"), 1000);
    }
  }

  document.getElementById("startVR").onclick = () => initSystem(true);
  window.addEventListener("resize", () => engine.resize());
})();
</script>
</body>
</html>
