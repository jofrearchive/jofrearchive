<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JOFRE ARCHIVE — DEBUG MODE</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <style>
    :root { --bg-deep: #0b0b0b; --ivory: #e8e2d6; --led-green: #4ade80; }
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--bg-deep); color: var(--ivory); font-family: monospace; }
    #renderCanvas { width:100%; height:100%; touch-action:none; }
    
    /* DEBUG PANEL */
    #debugPanel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--led-green);
      padding: 10px;
      z-index: 1000;
      max-width: 300px;
      font-size: 11px;
      line-height: 1.4;
    }
    #debugPanel div { margin-bottom: 4px; }
    .label { color: #888; }
    .value { color: var(--led-green); }
    .error { color: #ff4444; }
    
    #motionBtn {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 12;
      display: none;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(0,0,0,.7);
      color: var(--ivory);
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
    }
    #motionBtn.active { border-color: var(--led-green); color: var(--led-green); }
    
    #gate {
      position:absolute; inset:0;
      background: var(--bg-deep);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:10;
    }
    #startVR {
      background: rgba(0,0,0,.6);
      border: 1px solid rgba(232,226,214,.3);
      color: var(--ivory);
      padding: 15px 40px;
      cursor:pointer;
      font-family: monospace;
      font-size: 16px;
      margin-top: 20px;
    }
    .bab3d-on #gate { display:none; }
  </style>
</head>
<body>

  <div id="debugPanel">
    <div><span class="label">Estado:</span> <span id="dbgState" class="value">Inicializando...</span></div>
    <div><span class="label">Cámara:</span> <span id="dbgCam" class="value">-</span></div>
    <div><span class="label">Rotación Y:</span> <span id="dbgRot" class="value">-</span></div>
    <div><span class="label">Alpha:</span> <span id="dbgAlpha" class="value">-</span></div>
    <div><span class="label">Beta:</span> <span id="dbgBeta" class="value">-</span></div>
    <div><span class="label">Gamma:</span> <span id="dbgGamma" class="value">-</span></div>
    <div><span class="label">Offset:</span> <span id="dbgOffset" class="value">-</span></div>
    <div><span class="label">Initial:</span> <span id="dbgInitial" class="value">-</span></div>
    <div><span class="label">Eventos:</span> <span id="dbgEvents" class="value">0</span></div>
    <div><span class="label">Errores:</span> <span id="dbgError" class="error">-</span></div>
  </div>

  <div id="gate">
    <h1>EXPERIMENTAL ARCHIVE</h1>
    <p>Debug Mode - Solución PolygonalSun</p>
    <button id="startVR">Initialize System</button>
  </div>

  <canvas id="renderCanvas"></canvas>
  <button id="motionBtn">VR OFF</button>

<script>
// DEBUG UTILS
const dbg = {
  state: document.getElementById('dbgState'),
  cam: document.getElementById('dbgCam'),
  rot: document.getElementById('dbgRot'),
  alpha: document.getElementById('dbgAlpha'),
  beta: document.getElementById('dbgBeta'),
  gamma: document.getElementById('dbgGamma'),
  offset: document.getElementById('dbgOffset'),
  initial: document.getElementById('dbgInitial'),
  events: document.getElementById('dbgEvents'),
  error: document.getElementById('dbgError'),
  eventCount: 0
};

function updateDebug(data) {
  if (data.state) dbg.state.textContent = data.state;
  if (data.cam) dbg.cam.textContent = data.cam;
  if (data.rot !== undefined) dbg.rot.textContent = data.rot.toFixed(2);
  if (data.alpha !== undefined) dbg.alpha.textContent = data.alpha.toFixed(1);
  if (data.beta !== undefined) dbg.beta.textContent = data.beta.toFixed(1);
  if (data.gamma !== undefined) dbg.gamma.textContent = data.gamma.toFixed(1);
  if (data.offset !== undefined) dbg.offset.textContent = data.offset.toFixed(1);
  if (data.initial !== undefined) dbg.initial.textContent = data.initial.toFixed(1);
  if (data.error) dbg.error.textContent = data.error;
  if (data.event) {
    dbg.eventCount++;
    dbg.events.textContent = dbg.eventCount;
  }
}

// MAIN CODE
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
let scene, camera, cameraParent;
let isVREnabled = false;

async function createScene() {
  updateDebug({ state: "Creando escena..." });
  
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

  const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
  light.intensity = 0.5;

  // CÁMARA CON PARENT TRANSFORM (SOLUCIÓN POLYGONALSUN)
  // El truco es: el parent maneja el offset, la cámara maneja el giroscopio
  cameraParent = new BABYLON.TransformNode("cameraParent", scene);
  
  camera = new BABYLON.DeviceOrientationCamera("cam", new BABYLON.Vector3(0, 0, 0), scene);
  camera.parent = cameraParent;
  
  camera.fov = 0.8;
  camera.minZ = 0.1;
  camera.maxZ = 1000;
  
  // Posición inicial
  camera.position = new BABYLON.Vector3(0, 1.6, -5);
  camera.setTarget(new BABYLON.Vector3(0, 1.6, 0));

  updateDebug({ state: "Cámara creada", cam: "DeviceOrientationCamera" });

  // Modelo simple para referencia
  const box = BABYLON.MeshBuilder.CreateBox("box", {size: 2}, scene);
  box.position.y = 1;
  const mat = new BABYLON.StandardMaterial("mat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
  mat.wireframe = true;
  box.material = mat;

  // Grid de referencia
  const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);
  const gridMat = new BABYLON.StandardMaterial("grid", scene);
  gridMat.wireframe = true;
  gridMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
  ground.material = gridMat;

  return scene;
}

// SOLUCIÓN POLYGONALSUN: Usar el parent como offset
function applyOffsetSolution(targetRotationY) {
  updateDebug({ state: "Aplicando offset..." });
  
  // El offset se aplica rotando el PARENT, no la cámara
  // La cámara usa ángulos absolutos del dispositivo
  // El parent corrige la dirección inicial
  
  const offsetRadians = targetRotationY;
  cameraParent.rotation.y = offsetRadians;
  
  updateDebug({ 
    offset: offsetRadians * (180/Math.PI),
    state: "Offset aplicado al parent"
  });
  
  console.log("Parent rotation set to:", offsetRadians, "radians");
}

// LISTENER PARA EVENTOS RAW (debug)
window.addEventListener("deviceorientation", (e) => {
  updateDebug({
    event: true,
    alpha: e.alpha,
    beta: e.beta,
    gamma: e.gamma
  });
}, true);

// BOTÓN VR
const motionBtn = document.getElementById("motionBtn");

async function toggleVR() {
  if (!isVREnabled) {
    updateDebug({ state: "Solicitando permiso..." });
    
    // iOS permission
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') {
          updateDebug({ error: "Permiso denegado" });
          return;
        }
      } catch (e) {
        updateDebug({ error: e.message });
        return;
      }
    }

    // GUARDAR ROTACIÓN ACTUAL COMO OFFSET
    const currentRotationY = camera.rotation.y;
    updateDebug({ 
      state: "Capturando offset...",
      rot: currentRotationY 
    });
    
    // Aplicar solución PolygonalSun
    applyOffsetSolution(currentRotationY);
    
    isVREnabled = true;
    motionBtn.textContent = "VR ON";
    motionBtn.classList.add("active");
    
    // Forzar update
    camera.attachControl(canvas, true);
    
  } else {
    // Reset
    cameraParent.rotation.y = 0;
    isVREnabled = false;
    motionBtn.textContent = "VR OFF";
    motionBtn.classList.remove("active");
    updateDebug({ state: "VR desactivado" });
  }
}

motionBtn.addEventListener("click", toggleVR);

// INIT
document.getElementById("startVR").addEventListener("click", async () => {
  document.body.classList.add("bab3d-on");
  motionBtn.style.display = "block";
  
  await createScene();
  
  engine.runRenderLoop(() => {
    if (scene) {
      scene.render();
      // Update debug cada frame
      if (camera) {
        updateDebug({
          rot: camera.rotation.y,
          cam: isVREnabled ? "VR ON" : "Normal"
        });
      }
    }
  });
  
  updateDebug({ state: "Listo - Presiona VR OFF para activar" });
});

window.addEventListener("resize", () => engine.resize());
</script>

</body>
</html>
