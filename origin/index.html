<script>
/* BAB3D early mobile gate: runs before any other scripts */
(function(){
  var ua = navigator.userAgent || "";
  var tp = (navigator.maxTouchPoints || 0);

  function uaMobile(){
    return /Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(ua);
  }

  // iPadOS can masquerade as Macintosh but still has touch points.
  var iPadMasq = /Macintosh/i.test(ua) && tp > 1;

  // Avoid activating on desktop OS even if touch-capable (Surface etc.)
  var desktopOS = (/Windows NT/i.test(ua) || (/Mac OS X/i.test(ua) && !iPadMasq));

  var coarse = false, noHover = false;
  try{
    if (window.matchMedia){
      coarse = window.matchMedia("(pointer: coarse)").matches;
      noHover = window.matchMedia("(hover: none)").matches;
    }
  }catch(e){}

  // Robust mobile signal set (no screen-size logic)
  var mobileSignals = uaMobile() || iPadMasq || coarse || noHover;

  // Final decision: must have touch + mobile signals + not desktop OS
  var vwMobile = false;
  try{ vwMobile = window.matchMedia && window.matchMedia("(max-width: 900px)").matches; }catch(e){}
  // Final decision: touch + signals + not desktop OS, OR small viewport fallback (iOS "Request Desktop Website" edge cases)
  var isMobile = ((tp > 0) && mobileSignals && !desktopOS) || vwMobile;

  if(isMobile){
    document.documentElement.classList.add("bab3d-ready");
    document.addEventListener("DOMContentLoaded", function(){
      document.body.classList.add("bab3d-ready");
    });
  }
})();
</script>

  display:inline-block;

#vitrine-bg{
  position:fixed; inset:-2%;

  background:
    radial-gradient(1200px 800px at 50% 38%, rgba(255,255,255,.06) 0%, rgba(255,255,255,.00) 58%),

#vitrine-bg::after{
  content:"";
  position:absolute; inset:0;
  background:

<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "artist · researcher · explorer",
    "speculative material practices",
    "based between disciplines"
  ],
  footer: "",

    {
      key: "STUDIES",
      body: "Catalogue of artistic investigations",
      ctaLabel: "Access",
      ctaHref: "https://inside.jofrearchive.com/studies/"
    },
    {
      key: "GENEALOGY",
      body: "Mapped lineage of influence and transformation",
      ctaLabel: "Access",
      ctaHref: "https://inside.jofrearchive.com/genealogy/"
    },
    {
      key: "ARTIFACTS",
      body: "Selected works available for new custodianship",
      ctaLabel: "Access",
      ctaHref: "https://jofrearchive.com/artifacts/"
    }

};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const handleTitleEl = document.getElementById("handleTitle");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");
  const descEl = document.getElementById("dynamicDescription");
  const footerEl = document.getElementById("footer");

  titleEl.textContent = PANEL_CONTENT.title || "";
  handleTitleEl.textContent = PANEL_CONTENT.title || "";

  submetaEl.innerHTML = (PANEL_CONTENT.submeta || [])
    .map(line => escapeHtml(line))
    .join("<br>");

  footerEl.textContent = PANEL_CONTENT.footer || "";

  tabsEl.innerHTML = "";
  
  function showDescription(index) {
    const t = PANEL_CONTENT.tabs[index];
    descEl.classList.add('fade');
    
    setTimeout(() => {
      descEl.innerHTML = '';
      
      const p = document.createElement("p");
      p.textContent = t.body || "";
      descEl.appendChild(p);

      if (t.ctaHref) {
        const a = document.createElement("a");
        a.className = "tabCta";
        a.href = t.ctaHref;
        // Sin target="_blank" - se abre en la misma página

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = t.ctaLabel || "Access";

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";

        a.appendChild(label);
        a.appendChild(arrow);
        descEl.appendChild(a);
      }
      
      descEl.classList.remove('fade');
    }, 150);
  }

  PANEL_CONTENT.tabs.forEach((t, i) => {
    const link = document.createElement("a");
    link.className = "tabLink" + (i === 0 ? " active" : "");
    link.href = t.ctaHref;
    // Sin target="_blank" - mismo comportamiento que un enlace normal
    link.textContent = t.key;
    
    link.addEventListener('mouseenter', () => {
      document.querySelectorAll('.tabLink').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      showDescription(i);
      if (window.__setIndexing) window.__setIndexing(t.key);
    });
    
    tabsEl.appendChild(link);
  });

  showDescription(0);

  const handle = document.getElementById("panelHandle");
  const setExpanded = (expanded) => {
    panel.classList.toggle("collapsed", !expanded);
    handle.setAttribute("aria-expanded", expanded ? "true" : "false");
  };

  setExpanded(true);

  handle.addEventListener("click", () => {
    const isCollapsed = panel.classList.contains("collapsed");
    setExpanded(isCollapsed);
  });

  const mq = window.matchMedia("(max-width: 820px)");
  const onMq = () => {
    handleTitleEl.textContent = PANEL_CONTENT.title || "";
    if (!mq.matches) {
      panel.classList.remove("collapsed");
      handle.setAttribute("aria-expanded", "true");
    }
  };
  mq.addEventListener?.("change", onMq);
  window.addEventListener("resize", onMq);
  onMq();

  requestAnimationFrame(() => panel.classList.add("show"));
})();

(function statusStrip(){
  const lineEl = document.getElementById("statusLine");
  const barEl = document.getElementById("statusBar");
  const leftEl = document.getElementById("statusLeft");
  const rightEl = document.getElementById("statusRight");

  if (!lineEl || !barEl || !leftEl || !rightEl) return;

  const base = [
    "archive active",
    "checksum verified",
    "node map refreshed",
    "cross-reference attached",
    "index synced",
    "listening for updates",
    "cache warm",
    "integrity ok"
  ];

  let tick = 0;

  function setStatus(msg, left, right){
    if (msg) lineEl.textContent = msg;
    if (left) leftEl.textContent = left;
    if (right) rightEl.textContent = right;
  }

  function randomBase(){
    return base[Math.floor(Math.random()*base.length)];
  }

  function runCycle(label){
    const cycleId = ++tick;
    const duration = 2200 + Math.floor(Math.random()*1800);
    const start = performance.now();

    function frame(now){
      const t = Math.min(1, (now - start) / duration);
      const pct = Math.round(t * 100);
      barEl.style.width = pct + "%";
      rightEl.textContent = pct + "%";
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        setStatus((label || randomBase()) + " · refreshed", "stream", "100%");
        setTimeout(() => {
          setStatus(randomBase() + " · updating", "stream", "0%");
          barEl.style.width = "0%";
          runCycle();
        }, 260);
      }
    }
    requestAnimationFrame(frame);
  }

  window.__setIndexing = function(tabLabel){
    const t = String(tabLabel || "").trim().toLowerCase();
    setStatus("indexing " + t + " …", "stream", "0%");
    barEl.style.width = "0%";
    runCycle("indexing " + t);
  };

  setStatus("archive active · updating", "stream", "0%");
  barEl.style.width = "0%";
  runCycle();
})();

    const lines = slice.split("\n");
    const last = lines.slice(Math.max(0, lines.length - maxLines)).join("\n");

    el.innerHTML = escapeHtml(last) + '<span class="cursor"></span>';

    if (i >= stream.length){
      stream = makeStream();
      i = 0;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

function slug(s){
  return String(s || "")
    .trim()
    .toLowerCase()
    .replace(/[^\w]+/g,"-")
    .replace(/^-+|-+$/g,"");
}

function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

  <!-- Mobile-only Babylon.js native GUI VR -->
  <canvas id="babylon-canvas"></canvas>
  <div id="vr-gate" aria-hidden="true">
    <button class="gateBtn" id="enable-vr-btn" type="button">Enable VR</button>
  </div>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>

  <script>
  (function() {
    // --- Mobile detection (NOT by screen size only) ---
    function uaMobile() {
      const ua = navigator.userAgent || "";
      // Covers most phones/tablets
      if (/Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini/i.test(ua)) return true;
      return false;
    }
    const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    const noHover = window.matchMedia && window.matchMedia("(hover: none)").matches;
    const touchPoints = (navigator.maxTouchPoints || 0);

    // iPadOS can masquerade as "Macintosh" but still has touch points.
    const ua = navigator.userAgent || "";
    const iPadMasquerade = /Macintosh/i.test(ua) && touchPoints > 1;

    // We accept mobile if ANY strong mobile signal is present (not screen size).
    const isMobile = coarse || noHover || uaMobile() || iPadMasquerade || touchPoints > 1;
// Never activate on desktop.
    if (!isMobile) {
      document.body.classList.remove("bab3d-ready","bab3d-on");
      document.documentElement.classList.remove("bab3d-ready","bab3d-on");
      return;
    }

    // Initial mobile state: gate screen only.
    document.body.classList.add("bab3d-ready");

    const gate = document.getElementById("vr-gate");
    const btn = document.getElementById("enable-vr-btn");
    const canvas = document.getElementById("babylon-canvas");

    // Keep gate visible even if some desktop elements are absolute/fixed
    gate.setAttribute("aria-hidden", "false");

    // --- iOS gyro permission helper ---
    async function requestGyroPermissionIfNeeded() {
      // iOS 13+ requires a user gesture for DeviceOrientationEvent.requestPermission()
      try {
        const DOE = window.DeviceOrientationEvent;
        if (DOE && typeof DOE.requestPermission === "function") {
          const res = await DOE.requestPermission();
          return res === "granted";
        }
      } catch (e) {
        // ignore
      }
      // Other platforms: permission not needed / handled by browser settings
      return true;
    }

    let engine, scene, camera;
    let panels = []; // meshes we yaw-face to camera
    let manual = {
      active:false,
      lastMidX:0,
      lastMidY:0,
      yaw:0,
      pitch:0
    };
    const pointers = new Map();

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

    function setupTwoFingerManualRotation() {
      // Only intercept when 2 pointers are active
      function updateMidpoint() {
        if (pointers.size !== 2) return null;
        const arr = Array.from(pointers.values());
        const mx = (arr[0].x + arr[1].x) * 0.5;
        const my = (arr[0].y + arr[1].y) * 0.5;
        return {mx, my};
      }

      canvas.addEventListener("pointerdown", (e) => {
        pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        if (pointers.size === 2) {
          // enter manual rotate mode
          manual.active = true;
          const mid = updateMidpoint();
          if (mid) { manual.lastMidX = mid.mx; manual.lastMidY = mid.my; }
          // prevent default to avoid page zoom/scroll
          e.preventDefault();
        }
      }, {passive:false});

      canvas.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
        if (manual.active && pointers.size === 2) {
          const mid = updateMidpoint();
          if (mid) {
            const dx = mid.mx - manual.lastMidX;
            const dy = mid.my - manual.lastMidY;
            manual.lastMidX = mid.mx; manual.lastMidY = mid.my;

            // Sensitivity tuned for mobile
            manual.yaw   -= dx * 0.0032;
            manual.pitch -= dy * 0.0026;
            manual.pitch = clamp(manual.pitch, -0.9, 0.9);
          }
          e.preventDefault();
        }
      }, {passive:false});

      function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) {
          manual.active = false;
        }
      }
      canvas.addEventListener("pointerup", endPointer, {passive:true});
      canvas.addEventListener("pointercancel", endPointer, {passive:true});
      canvas.addEventListener("pointerout", endPointer, {passive:true});
      canvas.addEventListener("pointerleave", endPointer, {passive:true});
    }

    function buildScene() {
      engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: false,
        stencil: true,
        disableWebGL2Support: false
      });
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1); // ~#0b0b0b

      // Camera: UniversalCamera, height 1.6, looking +Z
      camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 1.6, 0), scene);
      camera.setTarget(new BABYLON.Vector3(0, 1.6, 1));
      camera.minZ = 0.05;
      camera.speed = 0.0; // no walking
      camera.angularSensibility = 8000; // not used unless pointer rotates; we do manual
      camera.attachControl(canvas, true);

      // Soft hemispheric light
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.55;
      hemi.diffuse = new BABYLON.Color3(1,1,1);
      hemi.groundColor = new BABYLON.Color3(0.18,0.18,0.18);

      // Dark dome (skybox sphere with emissive)
      const dome = BABYLON.MeshBuilder.CreateSphere("dome", {diameter: 64, sideOrientation: BABYLON.Mesh.BACKSIDE}, scene);
      const domeMat = new BABYLON.StandardMaterial("domeMat", scene);
      domeMat.emissiveColor = new BABYLON.Color3(0.03,0.03,0.03);
      domeMat.diffuseColor = new BABYLON.Color3(0,0,0);
      domeMat.specularColor = new BABYLON.Color3(0,0,0);
      dome.material = domeMat;

      // Data (sample) — you can replace with your real projects
      const PROJECTS = [
        { id:"interspecies-archaeology", title:"Interspecies Archaeology", category:"BioSystems", date:"2025-09-12", desc:"Sculptural mycelium systems as interspecies memory devices." },
        { id:"micropyramids", title:"Microscopic Pyramids", category:"Cymatics", date:"2025-06-03", desc:"Micro-geometry patterns as resonance and perception interfaces." },
        { id:"leaf-solar", title:"Leaf Solar Prototypes", category:"Landscape", date:"2024-11-28", desc:"Screen-printed translucent solar membranes inspired by leaf venation." },
        { id:"dystopic-carousel", title:"Dystopic Pop Carnival", category:"Dystopic Pop Art", date:"2024-10-02", desc:"A critique of modern spectacle: vibrant surface, hollow depth." },
        { id:"mural-ar", title:"AR Mural Projection Tests", category:"Murals", date:"2025-01-19", desc:"Large-scale mural visualization with mobile AR precomposition." },
        { id:"public-install", title:"Public Artifact — Prototype", category:"Public Art", date:"2025-03-07", desc:"A public-facing object that negotiates ownership and commons." },
      ];

      const CATEGORIES = ["All","BioSystems","Landscape","Dystopic Pop Art","Cymatics","Public Art","Murals"];

      let state = {
        category: "All",
        selectedId: PROJECTS[0].id
      };

      function getFiltered() {
        if (state.category === "All") return PROJECTS;
        return PROJECTS.filter(p => p.category === state.category);
      }

      function byId(id) {
        return PROJECTS.find(p => p.id === id) || PROJECTS[0];
      }

      // --- Helpers for glass UI ---
      function glassRect() {
        const r = new BABYLON.GUI.Rectangle();
        r.thickness = 1;
        r.cornerRadius = 22;
        r.color = "rgba(255,255,255,0.16)";
        r.background = "rgba(15,15,15,0.82)";
        r.paddingLeft = "14px";
        r.paddingRight = "14px";
        r.paddingTop = "12px";
        r.paddingBottom = "12px";
        return r;
      }

      function headerText(txt) {
        const t = new BABYLON.GUI.TextBlock();
        t.text = txt;
        t.color = "rgba(232,226,214,0.92)";
        t.fontFamily = "EB Garamond";
        t.fontSize = 20;
        t.height = "34px";
        t.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        t.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
        t.letterSpacing = 6; // spaced headers
        return t;
      }

      function metaText(txt) {
        const t = new BABYLON.GUI.TextBlock();
        t.text = txt;
        t.color = "rgba(232,226,214,0.62)";
        t.fontFamily = "Source Code Pro";
        t.fontSize = 11;
        t.height = "18px";
        t.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        t.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
        return t;
      }

      function bodyText(txt) {
        const t = new BABYLON.GUI.TextBlock();
        t.text = txt;
        t.color = "rgba(232,226,214,0.88)";
        t.fontFamily = "EB Garamond";
        t.fontSize = 15;
        t.textWrapping = true;
        t.lineSpacing = 6;
        t.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        t.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
        return t;
      }

      function categoryButton(label) {
        const b = BABYLON.GUI.Button.CreateSimpleButton("cat_" + label, label);
        b.height = "34px";
        b.thickness = 1;
        b.cornerRadius = 16;
        b.color = "rgba(255,255,255,0.16)";
        b.fontFamily = "Source Code Pro";
        b.fontSize = 11;
        b.background = "rgba(255,255,255,0.03)";
        b.paddingTop = "6px";
        b.paddingBottom = "6px";
        b.paddingLeft = "0px";
        b.paddingRight = "0px";
        b.textBlock.letterSpacing = 2;
        b.textBlock.color = "rgba(232,226,214,0.84)";
        return b;
      }

      function setButtonActive(btn, active) {
        if (active) {
          btn.background = "rgba(232,226,214,0.10)";
          btn.color = "rgba(232,226,214,0.35)";
          btn.textBlock.color = "rgba(232,226,214,0.96)";
        } else {
          btn.background = "rgba(255,255,255,0.03)";
          btn.color = "rgba(255,255,255,0.16)";
          btn.textBlock.color = "rgba(232,226,214,0.84)";
        }
      }

      // --- Panel meshes in a concave/parabolic arc in front (+Z) ---
      function makePanelMesh(name, w, h) {
        const plane = BABYLON.MeshBuilder.CreatePlane(name, {width:w, height:h}, scene);
        // very subtle material so it reads as "glass in 3D" behind GUI
        const mat = new BABYLON.StandardMaterial(name+"_mat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.06,0.06,0.06);
        mat.emissiveColor = new BABYLON.Color3(0.02,0.02,0.02);
        mat.alpha = 0.9;
        mat.specularColor = new BABYLON.Color3(0,0,0);
        plane.material = mat;
        plane.isPickable = true;
        panels.push(plane);
        return plane;
      }

      const leftPanel = makePanelMesh("p_left", 1.25, 1.55);
      const centerPanel = makePanelMesh("p_center", 1.55, 1.75);
      const rightPanel = makePanelMesh("p_right", 1.25, 1.55);

      // Parabolic placement: center slightly closer
      leftPanel.position = new BABYLON.Vector3(-1.25, 1.6, 3.05);
      centerPanel.position = new BABYLON.Vector3(0.0, 1.6, 2.70);
      rightPanel.position = new BABYLON.Vector3(1.25, 1.6, 3.05);

      // Slight inward yaw so it feels concave even before look-at
      leftPanel.rotation.y = 0.12;
      rightPanel.rotation.y = -0.12;

      // --- Left GUI: Categories ---
      const uiLeft = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(leftPanel, 1024, 1024, false);
      const leftRoot = glassRect();
      uiLeft.addControl(leftRoot);

      const leftStack = new BABYLON.GUI.StackPanel();
      leftStack.isVertical = true;
      leftStack.width = 0.98;
      leftStack.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      leftStack.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      leftRoot.addControl(leftStack);

      leftStack.addControl(headerText("CATEGORIES"));

      const catStack = new BABYLON.GUI.StackPanel();
      catStack.isVertical = true;
      catStack.spacing = 6;
      catStack.paddingTop = "6px";
      leftStack.addControl(catStack);

      const catButtons = new Map();
      CATEGORIES.forEach((c) => {
        const b = categoryButton(c);
        setButtonActive(b, c === state.category);
        b.onPointerUpObservable.add(() => {
          state.category = c;
          // update active states
          catButtons.forEach((btn, k) => setButtonActive(btn, k === state.category));
          // rebuild project list
          rebuildProjectWall();
        });
        catButtons.set(c, b);
        catStack.addControl(b);
      });

      // --- Center GUI: Project Wall (ScrollViewer with cards) ---
      const uiCenter = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(centerPanel, 1024, 1024, false);
      const centerRoot = glassRect();
      uiCenter.addControl(centerRoot);

      const centerStack = new BABYLON.GUI.StackPanel();
      centerStack.isVertical = true;
      centerStack.width = 0.98;
      centerStack.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      centerStack.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      centerRoot.addControl(centerStack);

      centerStack.addControl(headerText("PROJECT WALL"));

      const scroll = new BABYLON.GUI.ScrollViewer();
      scroll.width = 1.0;
      scroll.height = "86%";
      scroll.thickness = 0;
      scroll.barSize = 8;
      scroll.wheelPrecision = 0.02; // doesn't matter much on touch, but safe
      scroll.background = "transparent";
      scroll.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      scroll.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      scroll.paddingTop = "6px";
      centerStack.addControl(scroll);

      const wallStack = new BABYLON.GUI.StackPanel();
      wallStack.isVertical = true;
      wallStack.spacing = 8;
      wallStack.paddingBottom = "8px";
      scroll.addControl(wallStack);

      function card(p) {
        const btn = new BABYLON.GUI.Button("card_" + p.id);
        btn.height = "84px";
        btn.thickness = 1;
        btn.cornerRadius = 18;
        btn.color = "rgba(255,255,255,0.14)";
        btn.background = "rgba(255,255,255,0.02)";
        btn.paddingLeft = "10px";
        btn.paddingRight = "10px";
        btn.paddingTop = "10px";
        btn.paddingBottom = "10px";

        const grid = new BABYLON.GUI.Grid();
        grid.addRowDefinition(0.55, true);
        grid.addRowDefinition(0.45, true);
        grid.addColumnDefinition(1.0, true);

        const t = new BABYLON.GUI.TextBlock();
        t.text = p.title;
        t.fontFamily = "EB Garamond";
        t.fontSize = 18;
        t.color = "rgba(232,226,214,0.92)";
        t.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        t.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
        t.textWrapping = true;

        const m = new BABYLON.GUI.TextBlock();
        m.text = (p.category + " · " + p.date);
        m.fontFamily = "Source Code Pro";
        m.fontSize = 11;
        m.color = "rgba(232,226,214,0.62)";
        m.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        m.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;

        grid.addControl(t, 0, 0);
        grid.addControl(m, 1, 0);
        btn.addControl(grid);

        function setActive(active) {
          if (active) {
            btn.background = "rgba(232,226,214,0.08)";
            btn.color = "rgba(232,226,214,0.30)";
          } else {
            btn.background = "rgba(255,255,255,0.02)";
            btn.color = "rgba(255,255,255,0.14)";
          }
        }
        setActive(p.id === state.selectedId);

        btn.onPointerUpObservable.add(() => {
          state.selectedId = p.id;
          updateViewer();
          // refresh card highlights
          for (const child of wallStack.children) {
            if (child && child.name && child.name.startsWith("card_")) {
              const id = child.name.replace("card_","");
              const active = id === state.selectedId;
              child.background = active ? "rgba(232,226,214,0.08)" : "rgba(255,255,255,0.02)";
              child.color = active ? "rgba(232,226,214,0.30)" : "rgba(255,255,255,0.14)";
            }
          }
        });

        return btn;
      }

      function rebuildProjectWall() {
        // clear
        while (wallStack.children.length) {
          wallStack.removeControl(wallStack.children[0]);
        }
        const list = getFiltered();
        // keep selected in list; if filtered out, select first.
        if (!list.some(p => p.id === state.selectedId)) {
          state.selectedId = (list[0] || PROJECTS[0]).id;
        }
        list.forEach(p => wallStack.addControl(card(p)));
        updateViewer();
      }

      // --- Right GUI: Viewer ---
      const uiRight = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(rightPanel, 1024, 1024, false);
      const rightRoot = glassRect();
      uiRight.addControl(rightRoot);

      const rightStack = new BABYLON.GUI.StackPanel();
      rightStack.isVertical = true;
      rightStack.width = 0.98;
      rightStack.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
      rightStack.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
      rightRoot.addControl(rightStack);

      rightStack.addControl(headerText("VIEWER"));

      const viewTitle = new BABYLON.GUI.TextBlock();
      viewTitle.text = "";
      viewTitle.fontFamily = "EB Garamond";
      viewTitle.fontSize = 24;
      viewTitle.color = "rgba(232,226,214,0.96)";
      viewTitle.height = "46px";
      viewTitle.textWrapping = true;
      viewTitle.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
      viewTitle.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
      viewTitle.paddingTop = "6px";
      rightStack.addControl(viewTitle);

      const viewMeta = metaText("");
      viewMeta.height = "18px";
      rightStack.addControl(viewMeta);

      const sep = new BABYLON.GUI.Rectangle();
      sep.height = "1px";
      sep.thickness = 0;
      sep.background = "rgba(255,255,255,0.10)";
      sep.width = 1.0;
      sep.paddingTop = "10px";
      sep.paddingBottom = "10px";
      rightStack.addControl(sep);

      const viewDesc = bodyText("");
      viewDesc.height = "72%";
      rightStack.addControl(viewDesc);

      function updateViewer() {
        const p = byId(state.selectedId);
        viewTitle.text = p.title;
        viewMeta.text = (p.category + " · " + p.date);
        viewDesc.text = p.desc;
      }

      rebuildProjectWall();

      // --- Make panels face camera in yaw only (no pitch) ---
      scene.onBeforeRenderObservable.add(() => {
        const camPos = camera.position;
        for (const pm of panels) {
          const dx = camPos.x - pm.position.x;
          const dz = camPos.z - pm.position.z;
          pm.rotation.y = Math.atan2(dx, dz);
        }

        // Manual rotation (two fingers) overrides camera orientation smoothly
        if (manual.active) {
          camera.rotation.y = manual.yaw;
          camera.rotation.x = manual.pitch;
        }
      });

      return scene;
    }

    async function enableVR() {
      btn.disabled = true;

      // 1) Permission step (iPhone)
      const granted = await requestGyroPermissionIfNeeded();

      // 2) Switch body state to 3D
      document.body.classList.remove("bab3d-ready");
      document.body.classList.add("bab3d-on");
      document.documentElement.classList.remove("bab3d-ready");
      document.documentElement.classList.add("bab3d-on");

      // 3) Build Babylon scene
      buildScene();

      // 4) Device orientation input (only after permission path)
      // Babylon's UniversalCamera supports adding device orientation input.
      try {
        // Remove mouse input to avoid 1-finger camera rotation; 1-finger is for GUI.
        camera.inputs.removeByType("FreeCameraMouseInput");
      } catch(e){}

      if (granted) {
        try {
          if (camera && camera.inputs && camera.inputs.addDeviceOrientation) {
            camera.inputs.addDeviceOrientation();
          }
        } catch (e) {
          // ignore; manual rotation remains available
        }
      }

      // 5) Two-finger manual rotation fallback
      setupTwoFingerManualRotation();

      // 6) Render loop + resize
      engine.runRenderLoop(() => {
        if (scene) scene.render();
      });
      window.addEventListener("resize", () => {
        if (engine) engine.resize();
      }, {passive:true});

      // Prevent browser gesture zoom on iOS Safari while in VR (two fingers handled by us on canvas)
      document.addEventListener("gesturestart", (e) => e.preventDefault(), {passive:false});
      document.addEventListener("gesturechange", (e) => e.preventDefault(), {passive:false});
      document.addEventListener("gestureend", (e) => e.preventDefault(), {passive:false});
    }

    btn.addEventListener("click", () => {
      // must be a direct user gesture
      enableVR().catch((err) => {
        console.error(err);
        btn.disabled = false;
        // if something fails, return to gate
        document.body.classList.remove("bab3d-on");
        document.body.classList.add("bab3d-ready");
        document.documentElement.classList.remove("bab3d-on");
        document.documentElement.classList.add("bab3d-ready");
      });
    });
  })();
  </script>
