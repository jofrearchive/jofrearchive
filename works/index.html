<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOFRE OLIVERAS — Works</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Source+Code+Pro:wght@400;600&display=swap');

:root{
  --bg:#0a0a08;
  --surface:#111110;
  --border:#2a2a26;
  --accent:#c8b89a;
  --accent2:#e8d5b0;
  --text:#d4cfc8;
  --muted:#5a5550;
  --panel-bg:rgba(8,8,6,0.97);
  --serif:"EB Garamond", ui-serif, Georgia, serif;
  --mono:"Source Code Pro", ui-monospace, monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 30% 20%, rgba(200,184,154,.025), transparent 38%),
    radial-gradient(circle at 70% 70%, rgba(200,184,154,.018), transparent 44%),
    repeating-linear-gradient(0deg, rgba(200,184,154,.012) 0px, rgba(200,184,154,.012) 1px, transparent 1px, transparent 5px);
  z-index:1;
}

#c{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  cursor:grab;
  z-index:2;
}
#c:active{cursor:grabbing;}

.exit-btn{
  position:fixed;
  top:clamp(10px,2vw,22px);
  right:clamp(10px,2vw,22px);
  z-index:300;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink, var(--accent));
  text-decoration:none;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(10,10,10,.28);
  backdrop-filter:blur(10px);
  opacity:.56;
  transition:opacity .2s;
}
.exit-btn:hover{opacity:1;}

.hint{
  position:fixed;
  bottom:28px;
  right:36px;
  z-index:50;
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.18em;
  color:var(--muted);
  text-align:right;
  line-height:2;
  text-transform:uppercase;
}

/* PANEL */
.panel{
  position:fixed;
  right:36px;
  top:50%;
  transform:translateY(-50%) translateX(calc(100% + 50px));
  z-index:200;
  width:320px;
  background:var(--panel-bg);
  border:1px solid var(--border);
  transition:transform .5s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
  box-shadow:0 0 40px rgba(0,0,0,.28);
  display:flex;
  flex-direction:column;
}
.panel.open{
  transform:translateY(-50%) translateX(0);
  pointer-events:all;
}
.panel-scroll{
  overflow-y:auto;
  scrollbar-width:none;
}
.panel-scroll::-webkit-scrollbar{ display:none; }
.ph{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.ploc{
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.2em;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:4px;
}
.ptitle{
  font-family:var(--serif);
  font-size:30px;
  font-weight:600;
  letter-spacing:.06em;
  color:var(--accent2);
  line-height:.95;
  text-transform:uppercase;
}
.pcls{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:20px;
  line-height:1;
  transition:color .2s;
  flex-shrink:0;
  font-family:var(--mono);
}
.pcls:hover{color:var(--accent2);}
.pimg{
  width:100%;
  aspect-ratio:16/9;
  background:var(--surface);
  overflow:hidden;
  border-bottom:1px solid var(--border);
}
.pimg img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:saturate(.82) contrast(1.02) brightness(.92);
}
.pbody{padding:16px 18px;}
.pyr{
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.2em;
  color:var(--muted);
  margin-bottom:10px;
  text-transform:uppercase;
}
.pdesc{
  font-family:var(--serif);
  font-size:16px;
  line-height:1.5;
  color:var(--text);
  font-weight:500;
  margin-bottom:14px;
}
.pdesc p+p{ margin-top:10px; }
.ptags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:16px;
}
.tag{
  font-family:var(--mono);
  font-size:7px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  border:1px solid var(--border);
  padding:4px 7px;
}
.pbtn{
  display:inline-block;
  font-family:var(--mono);
  font-size:8px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--bg);
  background:var(--accent2);
  padding:10px 16px;
  text-decoration:none;
  transition:background .2s;
}
.pbtn:hover{background:#f0e2c0;}

/* SLIDER */
.slider{position:relative;width:100%;aspect-ratio:16/9;background:var(--surface);overflow:hidden;border-bottom:1px solid var(--border);}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(1.02) brightness(.92);opacity:0;transition:opacity .4s;}
.slider img.active{opacity:1;}
.slider-prev,.slider-next{position:absolute;top:50%;transform:translateY(-50%);background:rgba(8,8,6,.7);border:1px solid var(--border);color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:14px;padding:6px 10px;z-index:10;line-height:1;}
.slider-prev{left:8px;}
.slider-next{right:8px;}
.slider-prev:hover,.slider-next:hover{color:var(--accent2);}
.slider-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;}
.slider-dot{width:5px;height:5px;border-radius:50%;background:rgba(200,184,154,.35);cursor:pointer;transition:background .2s;}
.slider-dot.active{background:var(--accent2);}
.tt{
  position:fixed;
  z-index:300;
  pointer-events:none;
  background:rgba(8,8,6,.96);
  border:1px solid var(--border);
  padding:8px 11px;
  transform:translate(-50%,-145%);
  white-space:nowrap;
  opacity:0;
  transition:opacity .15s;
}
.tt.on{opacity:1;}
.ttc{
  font-family:var(--serif);
  font-size:18px;
  font-weight:600;
  letter-spacing:.04em;
  color:var(--accent2);
  text-transform:uppercase;
  line-height:1;
}
.ttk{
  font-family:var(--mono);
  font-size:7px;
  letter-spacing:.16em;
  color:var(--muted);
  text-transform:uppercase;
  margin-top:4px;
}

@media (max-width: 900px){
  .panel{
    right:0;
    left:0;
    top:auto;
    bottom:0;
    width:100%;
    transform:translateY(100%) !important;
    max-height:55vh;
  }
  .panel.open{
    transform:translateY(0) !important;
    pointer-events:all;
  }
  .panel-scroll{
    max-height:calc(55vh - 70px);
  }
  .hint{
    right:18px;
    bottom:18px;
  }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a href="https://jofrearchive.com" class="exit-btn">Exit ×</a>

<div class="tt" id="tt">
  <div class="ttc" id="ttc"></div>
  <div class="ttk" id="ttk"></div>
</div>

<div class="panel" id="panel">
  <div class="ph">
    <div>
      <div class="ploc" id="ploc"></div>
      <div class="ptitle" id="ptitle"></div>
    </div>
    <button class="pcls" id="pcls">×</button>
  </div>
  <div class="panel-scroll">
    <div class="pimg" id="pimg"></div>
    <div class="pbody">
      <div class="pyr" id="pyr"></div>
      <div class="pdesc" id="pdesc"></div>
    </div>
  </div>
</div>

<div class="hint">Works across geographies<br>Every point, a story</div>

<script>
const W$ = [


  {id:'jordan', city:'Amman', co:'Jordan', lat:31.95, lon:35.91, title:'The Column', yr:'2021', desc:'A mural depicting a man standing upright while holding the capital of a classical stone column above his head. The image combines references to the ancient architectural heritage of the region—evoking the Nabataean monuments of Petra—with a contemporary human figure dressed in everyday clothing and a traditional keffiyeh. Through this juxtaposition, the work reflects on the relationship between past and present, suggesting that cultural heritage is both a source of strength and a weight carried by current generations. Installed on a large building façade in the historic center of Amman, the mural transforms a familiar architectural symbol into a metaphor for collective responsibility, questioning how societies preserve, reinterpret, and physically sustain the legacy of their history within modern urban life.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2021amman.webp','http://inside.jofrearchive.com/assets/images/works/2021amman1.webp','http://inside.jofrearchive.com/assets/images/works/2021amman2.webp']},
  {id:'in-coi', city:'Coimbatore', co:'India', lat:11.02, lon:76.96, title:'Communion', yr:'2024', desc:'The mural is centered around the concept of unity despite the apparent division of the wall. For this reason, a group of women clothed in the same fabric submerged in water. This scene symbolizes a moment of purification within a shared environment.\nThe artwork emphasizes the importance of recognizing and celebrating individual differences as essential components of a rich and diverse community. This message feels particularly pertinent when minority voices face marginalization and isolation rather than support and inclusion.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2024Coimbatore1.webp','http://inside.jofrearchive.com/assets/images/works/2024Coimbatore2.webp','http://inside.jofrearchive.com/assets/images/works/2024Coimbatore3.webp']},
  {id:'in-mum', city:'Mumbai', co:'India', lat:19.08, lon:72.88, title:'Mumbai Tower', yr:'2021', desc:'High-density residential tower exploring vertical community living through shared terraces and transitional spaces.', tags:['Residential','High-rise','Community'], link:'#', imgs:[]},
  {id:'indo', city:'Jakarta', co:'Indonesia', lat:-6.21, lon:106.85, title:'Interspecies Archaeology', yr:'2026', meta:'Year: 2026 — Materials: Mycelium composite — Class: Bio-fabricated relic', desc:'Human skull cultivated in mycelium. Funerary object and organic archive. The piece is presented as an archaeological relic from a post-human future: living matter that preserves memory beyond the human species.', tags:[], link:'#', imgs:[]},
  {id:'italy', city:'Terracina', co:'Italy', lat:41.29, lon:13.25, title:'Passport', yr:'2019', desc:'A mural painted on a rooftop in the Italian coastal town of Terracina, visible only from above. The artwork reproduces the interface of a Windows operating system window — complete with title bar and minimize, maximize, and close buttons — titled "System," displaying a login screen with "User" and "Passport" fields set against the blue background and golden stars of the European Union flag. The piece uses the metaphor of digital access to question territorial access: Europe as an operating system you can only enter with the right credentials, the passport as a password, and citizenship as a user privilege — confronting with quiet irony the bureaucracy of borders and the selective nature of free movement, a right that is not universal but conditioned by the document you carry.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2019Terracina1.webp','http://inside.jofrearchive.com/assets/images/works/2019Terracina2.webp','http://inside.jofrearchive.com/assets/images/works/2019Terracina3.webp']},

  {id:'norway', city:'Stavanger', co:'Norway', lat:58.97, lon:5.73, title:'Unsigned', yr:'2019', desc:'Provocative performance piece created in collaboration with 1Up, a renowned graffiti crew collective, during the opening of an art exhibition. The action involved a graffiti writer armed with a pump full of red paint who executed a thick, continuous red line across all the gallery walls, deliberately covering parts of the exhibited paintings. The centerpiece of this act was the word "Unsigned" scrawled on the central wall in the same red paint.\n"Unsigned" serves as a radical critique of the art establishment and its conventions. By defacing the carefully curated paintings with a single, unifying stroke of red paint, the artwork challenges the traditional notions of value, authorship, and the sanctity of the gallery space. The act of writing "Unsigned" underscores the subversive intent, questioning the significance of signatures and the identity of the artist within the commercial art world.\nThe red line, bold and unyielding, becomes a symbol of resistance against the commodification of art. It disrupts the visual and conceptual harmony of the exhibition, forcing viewers to confront the tensions between street art and institutionalized art. This intervention blurs the boundaries between vandalism and artistic expression, highlighting the often contentious relationship between graffiti culture and the mainstream art market.\nBy collaborating with 1Up, a collective known for their rebellious spirit and urban interventions, the piece amplifies the message of dissent. The graffiti writer\'s act of painting over the works reclaims the space, asserting the presence and legitimacy of street art within the elite context of the gallery. This confrontation serves as a reminder that art is not confined to traditional settings and that its value is not solely determined by market forces or institutional validation.\n"Unsigned" also reflects on the concept of anonymity and collective identity in art. The absence of individual signatures on the paintings symbolizes a break from the ego-driven art world, emphasizing the power of collective action and shared authorship. This gesture resonates with the ethos of graffiti culture, where the act of creation often takes precedence over personal recognition.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2019N5.webp']},
  {id:'portugal', city:'Covilhã', co:'Portugal', lat:40.28, lon:-7.50, title:'Playful Invasion', yr:'2021', desc:'The artwork is an inflatable tank placed in various streets, symbolizing the infiltration of violence into society through education and childhood. The tank\'s playful appearance contrasts with its representation of violence, highlighting how violent behaviors are often normalized and perpetuated. The artwork challenges viewers to reconsider the impact of violence in everyday life and the need to address its root causes.\nThe concept behind the inflatable tank artwork is to provoke contemplation on how violence is ingrained in society from a young age, often through seemingly innocent activities like playing with toy weapons or engaging in competitive games. By placing the tank in public spaces, the artwork confronts viewers with the playful yet insidious nature of violence, urging them to reflect on its presence and influence in their lives. Through this provocative installation, the artist aims to spark dialogue and raise awareness about the need to address and dismantle the structures that perpetuate violence in society.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2021Covilha1.webp','http://inside.jofrearchive.com/assets/images/works/2021Covilha3.webp','http://inside.jofrearchive.com/assets/images/works/2021Covilha4.webp']},
  {id:'es-bcn', city:'Barcelona', co:'Spain', lat:41.39, lon:2.17, title:'Neon Monolith', yr:'2020', desc:'An installation that transforms a utilitarian power tower into a beacon of contemporary reflection, by meticulously wrapping the entire structure with an LED light string, the power tower is illuminated, taking on the appearance of a colossal neon light. This juxtaposition of industrial architecture and lighting technology with the natural environment creates a thought-provoking visual spectacle.\nThe power tower, typically a symbol of industrial functionality and energy transmission, is reimagined as a contemporary monolith. Monoliths have historically been erected as markers of human achievement, cultural significance, or spiritual reverence. In "Neon Monolith," the power tower is elevated to this status, challenging viewers to reconsider the importance of modern infrastructure in our lives.\n"Neon Monolith," confronts environmental and aesthetic impact of industrial infrastructure on our landscapes. Power towers, often overlooked and accepted as necessary components of modern life, are massive structures that disrupt the natural environment. This installation forces viewers to reconsider their presence and the consequences of such disregard.\nHistorically, monoliths were erected as symbols of spiritual significance and human achievement, often integrated into the landscape with deep respect and reverence. These ancient structures served as focal points for community and reflection, marking sacred spaces that connected people to their environment and heritage. In stark contrast, the contemporary monolith represented by the power tower is a testament to industrial dominance and environmental neglect.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2020NM1.webp']},
  {id:'uk', city:'Aberdeen', co:'UK', lat:57.15, lon:-2.09, title:'The Man Who Owns The Stone', yr:'2022', desc:'Today, nationalism obscures the vision. Borders are increasingly reinforced, preventing cultural exchange and abolishing the perception of everything that does not fall within the region. Isolation worsens and it is more difficult to realize the critical situation that we are facing globally, be it due to the depletion of resources, the migration crisis, or climate change.\nIt is curious that today we still try to defend the ownership of territory as it belonged to a specific identity. Identifying with nationality is defending the interests of the people who oppress us.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2022Aberdeen.webp']},
  {id:'usa', city:'Miami', co:'USA', lat:25.76, lon:-80.19, title:'American Dream', yr:'2019', desc:'The mural portrays a real homeless man from the city, painted on the wall of an abandoned asylum in Liberty City, one of Miami\'s most humble neighborhoods. Miami is widely known for its nightlife, its sun and beaches, the murals of Wynwood, and Art Basel. But the city also has another face — one revealed by the people living on its streets. Behind the spectacle, Miami holds some of the worst quality-of-life statistics in the United States.', tags:[], link:'#', imgs:['http://inside.jofrearchive.com/assets/images/works/2019miami.webp']},
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, R;
let userScale = 1.0;
let pinchDist0 = null;
let pinchScale0 = 1.0;
let cyOffset = 0;      // current animated offset
let cyOffsetTarget = 0; // target offset (always set as fixed value, never accumulated)

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2 + cyOffset;
  R = Math.min(W, H) * (W < 600 ? 0.56 : 0.46) * userScale;
}
resize();
window.addEventListener('resize', resize);

let rotY = -10;
let rotX = 15;
let vY = 0.05, vX = 0;
let dragging = false, mx0 = 0, my0 = 0, dragMoved = false;
let hovered = null, selected = null, frame = 0;

const D2R = Math.PI / 180;

function project(lat, lon){
  const phi = lat * D2R;
  const lam = lon * D2R;
  const ry = rotY * D2R;
  const rx = rotX * D2R;

  const x0 = Math.cos(phi) * Math.sin(lam);
  const y0 = Math.sin(phi);
  const z0 = Math.cos(phi) * Math.cos(lam);

  const x1 = x0 * Math.cos(ry) - z0 * Math.sin(ry);
  const z1 = x0 * Math.sin(ry) + z0 * Math.cos(ry);

  const y2 = y0 * Math.cos(rx) - z1 * Math.sin(rx);
  const z2 = y0 * Math.sin(rx) + z1 * Math.cos(rx);

  return { sx: CX + x1 * R, sy: CY - y2 * R, z: z2 };
}

let rings = null;

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')
  .then(r => r.json())
  .then(parseTopo)
  .catch(() => {});

function parseTopo(topo){
  const { scale:[sx,sy], translate:[tx,ty] } = topo.transform;

  const arcs = topo.arcs.map(arc => {
    let ax = 0, ay = 0;
    return arc.map(([dx,dy]) => {
      ax += dx;
      ay += dy;
      return [ax * sx + tx, ay * sy + ty];
    });
  });

  function arc(i){ return i < 0 ? [...arcs[~i]].reverse() : arcs[i]; }
  function ring(idxs){
    const pts = [];
    for(const i of idxs){
      const a = arc(i);
      pts.push(...a.slice(pts.length ? 1 : 0));
    }
    return pts;
  }

  const out = [];
  function walk(g){
    if(!g) return;
    if(g.type === 'Polygon') g.arcs.forEach(r => out.push(ring(r)));
    else if(g.type === 'MultiPolygon') g.arcs.forEach(p => p.forEach(r => out.push(ring(r))));
    else if(g.type === 'GeometryCollection') g.geometries.forEach(walk);
  }

  const obj = topo.objects.land || topo.objects.countries || Object.values(topo.objects)[0];
  walk(obj);
  rings = out;
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  const g = ctx.createRadialGradient(CX, CY, R * .25, CX, CY, R * 1.55);
  g.addColorStop(0, 'rgba(200,184,154,.04)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const oc = ctx.createRadialGradient(CX - R * .15, CY - R * .15, R * .03, CX, CY, R);
  oc.addColorStop(0, '#181811');
  oc.addColorStop(.65, '#0d0d0b');
  oc.addColorStop(1, '#040403');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.fillStyle = oc;
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.clip();

  ctx.lineWidth = .45;
  ctx.strokeStyle = 'rgba(200,184,154,.055)';

  for(let lat=-80; lat<=80; lat+=20){
    let open = false;
    for(let lon=-180; lon<=180; lon+=2){
      const p = project(lat, lon);
      if(p.z <= 0){
        if(open){ ctx.stroke(); open = false; }
        continue;
      }
      if(!open){
        ctx.beginPath();
        ctx.moveTo(p.sx, p.sy);
        open = true;
      } else {
        ctx.lineTo(p.sx, p.sy);
      }
    }
    if(open) ctx.stroke();
  }

  for(let lon=-180; lon<180; lon+=20){
    let open = false;
    for(let lat=-88; lat<=88; lat+=2){
      const p = project(lat, lon);
      if(p.z <= 0){
        if(open){ ctx.stroke(); open = false; }
        continue;
      }
      if(!open){
        ctx.beginPath();
        ctx.moveTo(p.sx, p.sy);
        open = true;
      } else {
        ctx.lineTo(p.sx, p.sy);
      }
    }
    if(open) ctx.stroke();
  }

  ctx.lineWidth = .8;
  ctx.strokeStyle = 'rgba(200,184,154,.13)';
  {
    let open = false;
    for(let lon=-180; lon<=180; lon+=2){
      const p = project(0, lon);
      if(p.z <= 0){
        if(open){ ctx.stroke(); open = false; }
        continue;
      }
      if(!open){
        ctx.beginPath();
        ctx.moveTo(p.sx, p.sy);
        open = true;
      } else {
        ctx.lineTo(p.sx, p.sy);
      }
    }
    if(open) ctx.stroke();
  }

  if(rings){
    ctx.strokeStyle = 'rgba(212,194,162,.32)';
    ctx.lineWidth = .55;

    for(const ring of rings){
      const pts = ring.map(([lon, lat]) => {
        const p = project(lat, lon);
        return { x:p.sx, y:p.sy, v:p.z>0 };
      });

      const n = pts.length;
      if(!n) continue;

      let i = 0;
      while(i < n){
        if(!pts[i].v){ i++; continue; }

        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        i++;

        while(i < n && pts[i].v){
          ctx.lineTo(pts[i].x, pts[i].y);
          i++;
        }
        ctx.stroke();
      }
    }
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,184,154,.09)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  const sp = ctx.createRadialGradient(CX - R * .26, CY - R * .28, 0, CX - R * .26, CY - R * .28, R * .7);
  sp.addColorStop(0, 'rgba(255,248,230,.055)');
  sp.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.fillStyle = sp;
  ctx.fill();

  for(const w of W$){
    const p = project(w.lat, w.lon);
    if(p.z <= 0) continue;

    const dep = Math.min(1, (p.z + .1) * 1.1);
    const isH = hovered === w;
    const isS = selected === w;

    if(isH || isS){
      const pulse = (Math.sin(frame * .08) + 1) / 2;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, 11 + pulse * 4, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,184,154,${.15 * pulse * dep})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(p.sx, p.sy, 9, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,184,154,${.35 * dep})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(p.sx, p.sy, isH || isS ? 5.5 : 3.8, 0, Math.PI * 2);
    ctx.fillStyle = (isH || isS)
      ? `rgba(240,226,192,${dep})`
      : `rgba(200,184,154,${.82 * dep})`;
    ctx.fill();
  }
}

function loop(){
  frame++;
  cyOffset += (cyOffsetTarget - cyOffset) * 0.07;
  CY = H / 2 + cyOffset;
  if(!dragging){
    rotY += vY;
    rotX += vX;
    vY += (0.05 - vY) * .007;
    vX *= .93;
    rotX = Math.max(-60, Math.min(60, rotX));
  }
  draw();
  requestAnimationFrame(loop);
}
loop();

canvas.addEventListener('mousedown', e => {
  dragging = true;
  dragMoved = false;
  mx0 = e.clientX;
  my0 = e.clientY;
  vY = 0;
  vX = 0;
});

window.addEventListener('mousemove', e => {
  if(!dragging){
    const w = hitTest(e.clientX, e.clientY);
    hovered = w;
    canvas.style.cursor = w ? 'pointer' : 'grab';
    const tt = document.getElementById('tt');
    if(w && !selected){
      tt.style.left = e.clientX + 'px';
      tt.style.top = e.clientY + 'px';
      document.getElementById('ttc').textContent = w.city;
      document.getElementById('ttk').textContent = w.co;
      tt.classList.add('on');
    } else {
      tt.classList.remove('on');
    }
    return;
  }
  const dx = e.clientX - mx0;
  const dy = e.clientY - my0;
  if(Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  vY = -dx * .32;
  vX =  dy * .32;
  rotY += -dx * .32;
  rotX +=  dy * .32;
  rotX = Math.max(-60, Math.min(60, rotX));
  mx0 = e.clientX;
  my0 = e.clientY;
});

window.addEventListener('mouseup', () => { dragging = false; });

canvas.addEventListener('click', e => {
  if(!dragMoved){
    const w = hitTest(e.clientX, e.clientY);
    if(w) openPanel(w);
  }
});

let tx0, ty0;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    pinchDist0 = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
    pinchScale0 = userScale;
    dragging = false;
    return;
  }
  const t = e.touches[0];
  dragging = true;
  dragMoved = false;
  mx0 = t.clientX; my0 = t.clientY;
  tx0 = t.clientX; ty0 = t.clientY;
  vY = 0; vX = 0;
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinchDist0 !== null){
    const dist = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
    userScale = Math.max(0.5, Math.min(3.0, pinchScale0 * (dist / pinchDist0)));
    resize();
    e.preventDefault();
    return;
  }
  const t = e.touches[0];
  const dx = t.clientX - mx0;
  const dy = t.clientY - my0;
  if(Math.hypot(t.clientX - tx0, t.clientY - ty0) > 5) dragMoved = true;
  vY = -dx * .32;
  vX =  dy * .32;
  rotY += -dx * .32;
  rotX +=  dy * .32;
  rotX = Math.max(-60, Math.min(60, rotX));
  mx0 = t.clientX;
  my0 = t.clientY;
  e.preventDefault();
}, {passive:false});

canvas.addEventListener('touchend', e => {
  pinchDist0 = null;
  dragging = false;
  if(!dragMoved){
    const t = e.changedTouches[0];
    const w = hitTest(t.clientX, t.clientY);
    if(w) openPanel(w);
  }
});

function hitTest(mx, my){
  for(const w of W$){
    const p = project(w.lat, w.lon);
    if(p.z <= 0) continue;
    if(Math.hypot(mx - p.sx, my - p.sy) < 14) return w;
  }
  return null;
}

function openPanel(w){
  selected = w;
  hovered = null;
  document.getElementById('tt').classList.remove('on');
  cyOffsetTarget = window.innerWidth < 900 ? -window.innerHeight * 0.13 : 0;
  document.getElementById('ploc').textContent = `${w.co.toUpperCase()} — ${w.city.toUpperCase()}`;
  document.getElementById('ptitle').textContent = w.title;
  document.getElementById('pyr').textContent = w.meta || `Project / ${w.yr}`;
  document.getElementById('pdesc').innerHTML = w.desc.split('\n').map(p => `<p>${p}</p>`).join('');

  const pimg = document.getElementById('pimg');
  const imgs = w.imgs || (w.img ? [w.img] : []);
  if(imgs.length > 1){
    let cur = 0;
    const slides = imgs.map((src,i) => `<img src="${src}" alt="${w.title}" class="${i===0?'active':''}">`).join('');
    const dots = imgs.map((_,i) => `<span class="slider-dot${i===0?' active':''}"></span>`).join('');
    pimg.innerHTML = `<div class="slider">${slides}<button class="slider-prev">‹</button><button class="slider-next">›</button><div class="slider-dots">${dots}</div></div>`;
    const sl = pimg.querySelector('.slider');
    const allImgs = sl.querySelectorAll('img');
    const allDots = sl.querySelectorAll('.slider-dot');
    function goTo(n){ cur=(n+imgs.length)%imgs.length; allImgs.forEach((im,i)=>im.classList.toggle('active',i===cur)); allDots.forEach((d,i)=>d.classList.toggle('active',i===cur)); }
    sl.querySelector('.slider-prev').addEventListener('click', e=>{e.stopPropagation();goTo(cur-1);});
    sl.querySelector('.slider-next').addEventListener('click', e=>{e.stopPropagation();goTo(cur+1);});
    allDots.forEach((d,i)=>d.addEventListener('click',e=>{e.stopPropagation();goTo(i);}));
  } else {
    pimg.innerHTML = imgs[0] ? `<img src="${imgs[0]}" alt="${w.title}" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.02) brightness(.92);">` : '';
  }

  document.getElementById('panel').classList.add('open');
}

document.getElementById('pcls').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  selected = null;
  hovered = null;
  document.getElementById('tt').classList.remove('on');
  cyOffsetTarget = 0;
  vY = 0.05;
});
</script>
</body>
</html>
