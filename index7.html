/* ===== PANEL ===== */
#panel{
  position:fixed;
  left:50%;

  transform: translate(-50%, -50%);

  background: rgba(10,10,10,.65);

#panel.show{ opacity:1; }

#panel #title{
  font-family:'EB Garamond', serif;
  font-size: 28px;

}
#panel #submeta{

}
#panel .tabs{
  display:flex;

  flex-wrap: nowrap;

}
#panel .tabLink{
  flex: 1 1 0;

#panel .tabLink:hover, #panel .tabLink.active{

  border-color: rgba(255,255,255,0.36);

}

#dynamicDescription{ display:none; }

/* gate vs system */
body.bab3d-ready #panel{ display:none; }
body.bab3d-on #panel{ display:block; }

}

}

  opacity:.65;
  text-transform: uppercase;

  opacity:0;

}

/* Motion permission mini button (iOS) */
#motionBtn{
  position: fixed;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 12;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;

#motionBtn.active #motionDot{

}


/* Mobile adjustments */
@media (max-width: 520px){
  #panel{
    padding: 14px 14px 8px !important;
  }
}

<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "ARTIST · EXPLORER · LANDSCAPER",
    "BASED BETWEEN DISCIPLINES",
    "EXPERIMENTAL ARCHIVE"
  ],
  tabs: [
    { key: "STUDIES", ctaHref: "https://inside.jofrearchive.com/studies/" },
    { key: "GENEALOGY", ctaHref: "https://inside.jofrearchive.com/genealogy/" },
    { key: "ARTIFACTS", ctaHref: "https://jofrearchive.com/artifacts" }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  titleEl.textContent = PANEL_CONTENT.title;
  submetaEl.innerHTML = PANEL_CONTENT.submeta.map(escapeHtml).join("<br>");

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key;
    b.addEventListener("click", ()=>{
      if (t.ctaHref) window.location.href = t.ctaHref;
    });
    tabsEl.appendChild(b);
  });

  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();

<script>
(function(){

  
// iOS motion permission: Safari will show the real system prompt when required.
async function requestGyroPermission(){
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) {
    console.log("DeviceOrientationEvent not supported");
    return false;
  }
  if (typeof DOE.requestPermission === "function") {
    try {
      const res = await DOE.requestPermission();
      console.log("iOS permission result:", res);
      return res === "granted";
    } catch (e) {
      console.error("iOS permission error:", e);
      return false;
    }
  }
  console.log("No permission needed (non-iOS or old iOS)");
  return true;
}

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
  }

  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;
  let camera = null;

  // === VR / Gyro shared state (outer-scope) ===
  // (moved) const motionBtn = document.getElementById("motionBtn");
  let motionEnabled = false;
  let motionPermissionGranted = false;
  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  function setLoaderStatus(msg){
    const s = document.getElementById("status");
    if (s) s.textContent = msg;
  }
  async function importMeshWithTimeout(url, timeoutMs=20000){
    setLoaderStatus("loading geometry");
    return await Promise.race([
      BABYLON.SceneLoader.ImportMeshAsync("", "", url, scene),
      new Promise((_, rej)=>setTimeout(()=>rej(new Error("Model load timeout after "+timeoutMs+"ms: "+url)), timeoutMs))
    ]);
  }

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.35;

    const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), scene);
    keyLight.position = new BABYLON.Vector3(3, 6, 4);
    keyLight.intensity = 1.1;

    // CÁMARA: Posición física baja (Y=-10) para ver el claustro desde abajo hacia arriba// CÁMARA SMARTPHONE — alineada al eje Z, lo más atrás posible (Z negativo), mirando hacia arriba
camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, -6, -40), scene);
camera.attachControl(canvas, true);
// Keep framing consistent across desktop/mobile aspect ratios
camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
camera.fov = 0.85; // tweak: smaller = tighter, larger = wider


// Objetivo de mirada: hacia el centro elevado (mirada ascendente)
camera.setTarget(new BABYLON.Vector3(0, 15, 0));

// Sin teclado
camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

// --- VR TOGGLE BUTTON (GIROSCOPIO MANUAL CORREGIDO) ---
// (moved) const motionBtn = document.getElementById("motionBtn");

// ===== Motion state (outer-scope; declared above) =====
// motionEnabled, motionPermissionGranted
let autoEnableMotionAfterInit = false;
if (isMobile() && motionBtn) {
    motionBtn.style.display = "flex";
    

    let initialCameraQuat = new BABYLON.Quaternion();
    let sensorZeroQuat = new BABYLON.Quaternion();
    let currentDeviceQuat = new BABYLON.Quaternion();
    let smoothedDeviceQuat = new BABYLON.Quaternion();
    let firstRead = true;
    let activationPose = "upright"; // "upright" | "flatUp" | "flatDown" // "upright" | "flat" (fixed at activation)
    let eventCount = 0;
    
    // Smoothing factor (0.0 - 1.0). Lower = smoother but more lag
    const SMOOTHING_FACTOR = 0.12;
    
    // Debug info
    console.log("Mobile detected, VR button visible");
    console.log("Protocol:", window.location.protocol);
    console.log("DeviceOrientationEvent available:", 'DeviceOrientationEvent' in window);

    // Handler manual para el sensor con debugging
    const handleMotion = (event) => {
        if (!motionEnabled) {
            console.log("Event received but motion not enabled");
            return;
        }

        eventCount++;
        if (eventCount % 60 === 0) { // Log cada ~1 segundo a 60fps
            console.log("Orientation event #", eventCount, "alpha:", event.alpha, "beta:", event.beta, "gamma:", event.gamma);
        }

        // Manejar valores null (iOS sin magnetómetro)
        const alpha = (event.alpha === null) ? 0 : BABYLON.Tools.ToRadians(event.alpha);
        const beta = (event.beta === null) ? 0 : BABYLON.Tools.ToRadians(event.beta);
        const gamma = (event.gamma === null) ? 0 : BABYLON.Tools.ToRadians(event.gamma);

        // Detectar la pose en el moment d'activació (només 1 cop)
        if (firstRead) {
            const bDeg = (event.beta  ?? 0);
            const gDeg = (event.gamma ?? 0);

            // Heurística: en "flat" (pantalla plana mirant amunt), beta i gamma solen estar prop de 0.
            // En "upright" (telèfon dret), beta sol estar prop de ±90.
            const isFlat = Math.abs(bDeg) < 35 && Math.abs(gDeg) < 35;
            
  const isFlatLike = Math.abs(gDeg) < 35;
  const isFlatUp   = isFlatLike && (Math.abs(bDeg) < 35);
  const isFlatDown = isFlatLike && (Math.abs(Math.abs(bDeg) - 180) < 35);

  if (isFlatUp) activationPose = "flatUp";
  else if (isFlatDown) activationPose = "flatDown";
  else activationPose = "upright";

        }


        // Construir cuaternión del dispositivo evitando gimbal lock (orden Y * X * Z)
// y compensando la orientación de pantalla (portrait/landscape).
const orientDeg = (screen.orientation && typeof screen.orientation.angle === 'number')
    ? screen.orientation.angle
    : (typeof window.orientation === 'number' ? window.orientation : 0);
const orient = BABYLON.Tools.ToRadians(orientDeg);

// Ajustes de eixos / UX:
// - La compensació de pantalla (portrait/landscape) es manté via orientDeg/orient.
// - El mapping principal (upright vs flat) es fixa NOMÉS en activar el gyro.
const isPortrait = (Math.abs(orientDeg) % 180) === 0;

// 1) base mapping (upright)
let yaw   = alpha;
let pitch = beta;
let roll  = gamma;

// 2) correccions de signe que ja tenies en portrait (si et funcionen)
if (isPortrait) {
    yaw   = -yaw;
    pitch = -pitch;
    roll  = -roll;
}

// 3) si s'activa en "flat", fem el swap yaw<->roll (manté UX natural en pantalla plana)
if (activationPose === "flatUp" || activationPose === "flatDown") {
    const tmp = yaw;
    yaw = roll;
    roll = tmp;

    if (activationPose === "flatUp") {
      roll = -roll;
    } else if (activationPose === "flatDown") {
      // yaw direction fix (do NOT invert)
      // yaw = yaw;
      roll = -roll;
    }
}
// q = qY(yaw) * qX(pitch) * qZ(roll)  (orden YXZ)
const qYaw = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, yaw);
const qPitch = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, pitch);
const qRoll = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, roll);

qYaw.multiplyToRef(qPitch, currentDeviceQuat);   // currentDeviceQuat = qYaw * qPitch
currentDeviceQuat.multiplyInPlace(qRoll);        // currentDeviceQuat = (qYaw*qPitch) * qRoll

// Convertir de coords del dispositivo a coords del mundo/cámara (equivalente a -PI/2 en X)
if (!handleMotion._q1) {
    const s = Math.sqrt(0.5);
    handleMotion._q1 = new BABYLON.Quaternion(-s, 0, 0, s);
}
currentDeviceQuat.multiplyInPlace(handleMotion._q1);

// Compensar la rotación de la pantalla (para que portrait/landscape no cambie el mapeo)
const qScreen = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Z, -orient);
currentDeviceQuat.multiplyInPlace(qScreen);

    if (activationPose === "flatDown") {
      const qFlip = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, Math.PI);
      currentDeviceQuat.multiplyInPlace(qFlip);
    }

        // Suavizado (smoothing)
        if (firstRead) {
            smoothedDeviceQuat.copyFrom(currentDeviceQuat);
        } else {
            BABYLON.Quaternion.SlerpToRef(smoothedDeviceQuat, currentDeviceQuat, SMOOTHING_FACTOR, smoothedDeviceQuat);
        }

        if (firstRead) {
            console.log("First sensor read, establishing zero point");
            sensorZeroQuat.copyFrom(smoothedDeviceQuat);
            sensorZeroQuat.invertInPlace();
            firstRead = false;
        }

        // Calcular rotación relativa desde el punto cero
        const deviceRelative = smoothedDeviceQuat.multiply(sensorZeroQuat);

        // Aplicar sobre la rotación inicial de la cámara
// Importante: para mantener los ejes intuitivos con una cámara ya inclinada,
// aplicamos el delta del dispositivo DESPUÉS de la orientación base (post-multiply).
if (camera.rotationQuaternion) {
    initialCameraQuat.multiplyToRef(deviceRelative, camera.rotationQuaternion);
} else {
    console.warn("Camera has no rotationQuaternion");
}
    };

    motionBtn.addEventListener("click", async () => {
        console.log("VR button clicked, motionEnabled:", motionEnabled);
        
        if (!motionEnabled) {
            // Verificar HTTPS (requerido para iOS)
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                console.error("HTTPS required for gyroscope on iOS");
                alert("Se requiere HTTPS para usar el giroscopio en iOS");
                return;
            }

            const ok = await requestGyroPermission();
            motionPermissionGranted = ok;
            try { if (ok) localStorage.setItem("gyroPermissionGranted", "1"); } catch(e) {}
            console.log("Permission result:", ok);
            
            if (!ok) {
                console.log("Permission denied or failed");
                return;
            }

            // Asegurar que la cámara usa quaterniones
            if (!camera.rotationQuaternion) {
                console.log("Converting camera to quaternion mode");
                camera.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(camera.rotation.x, camera.rotation.y, camera.rotation.z);
            }
            
            // Guardar la rotación actual como base
            initialCameraQuat.copyFrom(camera.rotationQuaternion);
            console.log("Initial camera quaternion saved:", initialCameraQuat.toString());
            
            // Resetear estado del sensor
            firstRead = true;
            eventCount = 0;
            motionEnabled = true;

            // Registrar listener del sensor
            window.addEventListener("deviceorientation", handleMotion, true);
            console.log("Device orientation listener added");

            // En iOS, a veces el primer evento tarda, forzar un render
            setTimeout(() => {
                if (eventCount === 0) {
                    console.warn("No orientation events received after 2 seconds");
                    console.log("Device info:", navigator.userAgent);
                }
            }, 2000);

            motionBtn.classList.add("active");
            motionBtn.querySelector(".vrLabel").textContent = "VR ON";
            
        } else {
            console.log("Disabling VR mode");
            motionEnabled = false;
            window.removeEventListener("deviceorientation", handleMotion, true);
            
            motionBtn.classList.remove("active");
            motionBtn.querySelector(".vrLabel").textContent = "VR OFF";
        }
    });
}

    
let res;
try {
  // Try model load with timeout so the loader never gets stuck forever.
  res = await importMeshWithTimeout(modelUrl, 25000);
} catch (e) {
  console.error("GLB load failed:", e);
  setLoaderStatus("geometry failed");
  // Fallback placeholder so the experience still runs (gyro/VR can be tested).
  const fallback = BABYLON.MeshBuilder.CreateBox("fallbackBox", {size: 8}, scene);
  fallback.position = new BABYLON.Vector3(0, 6, 0);
  const mat = new BABYLON.StandardMaterial("fallbackMat", scene);
  mat.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.12);
  mat.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);
  fallback.material = mat;
  res = { meshes: [fallback] };
}
    res.meshes.forEach(mesh => {
      if (mesh && mesh.getTotalVertices() > 0) {
        mesh.isVisible = true;
        const solidMat = new BABYLON.PBRMaterial("solidMat_"+mesh.name, scene);
        solidMat.albedoColor = new BABYLON.Color3(0.02, 0.02, 0.02);
        solidMat.metallic = 0.4;
        solidMat.roughness = 0.35;
        mesh.material = solidMat;
      }
    });
// --- MODEL ROOT + SLOW CONSTANT ROTATION (like a calm museum turntable) ---
// Parent all imported top-level meshes to a single root so we can rotate the whole cloister cleanly.
const modelRoot = new BABYLON.TransformNode("modelRoot", scene);
res.meshes.forEach(m => {
  if (m && m !== modelRoot && !m.parent) m.parent = modelRoot;
});

// Slow constant rotation speed (radians per second). Tweak to taste:
const ROT_SPEED = 0.06; // ~3.4 degrees/sec. Try 0.02 for ultra-slow.
let _lastT = performance.now();

scene.onBeforeRenderObservable.add(() => {
  const now = performance.now();
  const dt = Math.min(0.05, (now - _lastT) / 1000); // clamp for tab-switch jumps
  _lastT = now;
  modelRoot.rotation.y += ROT_SPEED * dt;
});


    




// --- CAMERA IN CLOISTER VOID CENTER (DISTANCE-FIELD) — finds the largest empty space on XZ near the floor ---
// Full/trimmed bounding boxes can still be biased. This approach:
// 1) Samples world vertices (mostly walls/columns) near the floor band.
// 2) Builds a coarse grid on XZ.
// 3) Chooses the grid point that maximizes distance to the nearest sampled vertex => center of the largest void.
//
// Tweak knobs:
const FLOOR_BAND = 0.22;        // fraction of total height above minY to consider as "near floor"
const MAX_SAMPLES = 9000;       // cap of sampled points for speed
const GRID_N = 45;              // grid resolution per axis (odd is nice)
const CENTER_DX = 0.0;          // manual micro-offsets
const CENTER_DZ = 0.0;
const EYE_MIN = 1.6;            // minimum eye height
const LOOK_UP = 0.28;           // fraction of height above center to look at
const FACE_Z_BIAS = 0.0;        // keep 0 for perfectly centered roof

try {
  // 1) global bounds
  let min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
  let max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);

  res.meshes.forEach(m => {
    if (!m || !m.getBoundingInfo) return;
    const bi = m.getBoundingInfo();
    if (!bi || !bi.boundingBox) return;
    const bmin = bi.boundingBox.minimumWorld;
    const bmax = bi.boundingBox.maximumWorld;

    min.x = Math.min(min.x, bmin.x); min.y = Math.min(min.y, bmin.y); min.z = Math.min(min.z, bmin.z);
    max.x = Math.max(max.x, bmax.x); max.y = Math.max(max.y, bmax.y); max.z = Math.max(max.z, bmax.z);
  });

  const size = max.subtract(min);
  const floorY = min.y;
  const bandY = floorY + size.y * FLOOR_BAND;

  // 2) sample points near the floor band (mostly walls/columns edges)
  const samples = [];
  let stride = 3; // start stride
  const pushSample = (x,z) => { samples.push(x, z); };

  const collect = () => {
    samples.length = 0;

    res.meshes.forEach(m => {
      if (!m || !m.isVerticesDataPresent || !m.isVerticesDataPresent(BABYLON.VertexBuffer.PositionKind)) return;

      const pos = m.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      if (!pos || pos.length < 3) return;

      const wm = m.computeWorldMatrix(true);
      const tmp = new BABYLON.Vector3();

      for (let i = 0; i < pos.length; i += 3 * stride) {
        tmp.set(pos[i], pos[i+1], pos[i+2]);
        BABYLON.Vector3.TransformCoordinatesToRef(tmp, wm, tmp);

        if (tmp.y <= bandY) {
          pushSample(tmp.x, tmp.z);
          if (samples.length/2 >= MAX_SAMPLES) return;
        }
      }
    });
  };

  // adaptive stride if too many points
  for (let attempts = 0; attempts < 4; attempts++) {
    collect();
    if ((samples.length/2) <= MAX_SAMPLES) break;
    stride = Math.min(24, stride * 2);
  }

  // Fallback: if we got almost nothing, use full bbox center
  let bestX = (min.x + max.x) * 0.5;
  let bestZ = (min.z + max.z) * 0.5;

  if (samples.length >= 20) {
    // 3) grid search for point farthest from nearest sample
    const pad = 0.06; // keep away from extreme outer bounds
    const x0 = min.x + size.x * pad, x1 = max.x - size.x * pad;
    const z0 = min.z + size.z * pad, z1 = max.z - size.z * pad;

    let bestD2 = -1;

    for (let ix = 0; ix < GRID_N; ix++) {
      const x = x0 + (x1 - x0) * (ix / (GRID_N - 1));
      for (let iz = 0; iz < GRID_N; iz++) {
        const z = z0 + (z1 - z0) * (iz / (GRID_N - 1));

        // distance to nearest sample
        let d2min = Number.POSITIVE_INFINITY;
        for (let s = 0; s < samples.length; s += 2) {
          const dx = x - samples[s];
          const dz = z - samples[s+1];
          const d2 = dx*dx + dz*dz;
          if (d2 < d2min) d2min = d2;
          // early exit if already worse than best
          if (d2min <= bestD2) break;
        }

        if (d2min > bestD2) {
          bestD2 = d2min;
          bestX = x;
          bestZ = z;
        }
      }
    }
  }

  // 4) place camera at void center, face +Z, look upward
  const eyeH = Math.max(size.y * 0.10, EYE_MIN);
  const camX = bestX + CENTER_DX;
  const camZ = bestZ + CENTER_DZ;
  const camY = floorY + eyeH;

  camera.position.set(camX, camY, camZ);

  const targetY = (min.y + max.y) * 0.5 + size.y * 0.42; // stronger upward target
  camera.setTarget(new BABYLON.Vector3(camX, targetY, camZ + FACE_Z_BIAS));

  // Center the model rotation axis in the cloister void (XZ void center + vertical midpoint)
  const voidAxis = new BABYLON.Vector3(camX, (min.y + max.y) * 0.5, camZ);
  if (typeof modelRoot !== 'undefined' && modelRoot && modelRoot.setPivotPoint) {
    modelRoot.setPivotPoint(voidAxis, BABYLON.Space.WORLD);
  }

  // near/far planes
  const radius = Math.max(size.x, size.z) * 0.5;
  camera.minZ = Math.max(0.01, radius / 1500);
  camera.maxZ = Math.max(1000, radius * 60);

} catch (e) {
  console.warn("Void-center camera failed:", e);
}

    // XR disabled to prevent black screen issues

    return scene;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));

      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";

      loader.classList.add("fadeOut");
      setTimeout(()=>{
        loader.setAttribute("aria-hidden","true");
      }, 1100);
    }

    function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
    }

    return {done, fail};
  }

  let loopStarted = false;
  let initializedOnce = false;

  async function initSystem(opts){
    const { withLoader } = opts || {};
    const L = withLoader ? startLoader(2600) : null;

    document.body.classList.remove("bab3d-ready");
    document.body.classList.add("bab3d-on");

    try{
      if (!initializedOnce){
        initializedOnce = true;
        await createScene();
      }

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => { if (scene) scene.render(); });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      if (L) await L.done();
    }
    catch(err){
      console.error(err);
      if (L) {
        try { L.fail(String(err && err.message ? err.message : err)); } catch(e) {}
        // Ensure loader disappears even on error
        setTimeout(()=>{
          const loader = document.getElementById("loader");
          if (loader) loader.setAttribute("aria-hidden","true");
        }, 900);
      }
    }
  }

  // === AUTO INIT (no gate) ===
  // We always initialize the scene on load.
  // For gyro auto-enable:
  // - We probe deviceorientation briefly; if events arrive, we assume permission is available this session.
  // - If so, we set motionPermissionGranted=true and auto-click the VR button AFTER init (so camera direction is preserved).

  async function probeGyroPermission(timeoutMs=900){
    return await new Promise((resolve)=>{
      let gotEvent = false;
      const handler = (e)=>{
        // We consider it "working" if we get any numeric beta/gamma (alpha may be null on some devices)
        const ok = (typeof e.beta === "number") || (typeof e.gamma === "number") || (typeof e.alpha === "number");
        if(ok){
          gotEvent = true;
          cleanup();
          resolve(true);
        }
      };
      const cleanup = ()=>{
        window.removeEventListener("deviceorientation", handler, true);
        clearTimeout(t);
      };
      window.addEventListener("deviceorientation", handler, true);
      const t = setTimeout(()=>{
        cleanup();
        resolve(false);
      }, timeoutMs);
    });
  }

  (async ()=> {
  // Start system immediately
  await initSystem({ withLoader: true });

  if (!isMobile() || !motionBtn) return;

  // If a previous page already granted permission, we want VR to start automatically.
  // Android/Chrome can start immediately. iOS requires a user-activation context.
  let storedGranted = false;
  try { storedGranted = localStorage.getItem("gyroPermissionGranted") === "1"; } catch(e) {}

  if (!storedGranted) return;

  const DOE = window.DeviceOrientationEvent;
  const needsGesture = !!(DOE && typeof DOE.requestPermission === "function");

  const enableViaButton = () => {
    if (!motionEnabled) {
      try { motionBtn.click(); } catch(e) {}
    }
  };

  if (!needsGesture) {
    // Android / browsers without requestPermission gate
    requestAnimationFrame(enableViaButton);
    return;
  }

  // iOS: try immediately if we still have transient activation (e.g., arriving via a click-navigation)
  // Otherwise arm the first touch on THIS page.
  try {
    if (navigator.userActivation && navigator.userActivation.isActive) {
      requestAnimationFrame(enableViaButton);
      return;
    }
  } catch(e) {}

  const once = () => {
    document.removeEventListener("pointerdown", once, true);
    document.removeEventListener("touchstart", once, true);
    requestAnimationFrame(enableViaButton);
  };
  document.addEventListener("pointerdown", once, true);
  document.addEventListener("touchstart", once, true);
})();})();window.addEventListener("resize", () => engine.resize());
})();
</script>
