<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>JOFRE ARCHIVE — Cloister Point Cloud</title>
  <script src="https://cdn.babylonjs.com/babylon.js">


// --- SOLUCIÓN ESTRUCTURAL: CÁMARA PADRE (TransformNode) + GIROSCOPIO RELATIVO ---
const motionBtn = document.getElementById("motionBtn");
if (isMobile() && motionBtn) {
    motionBtn.style.display = "flex";

    let motionEnabled = false;
    let firstRead = true;

    let cameraParent = null;
    const sensorZeroQuat = new BABYLON.Quaternion();
    const qTmp = new BABYLON.Quaternion();
    const qScreen = new BABYLON.Quaternion();
    const qWorldAlign = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X, -Math.PI / 2);

    function getScreenAngleDeg(){
        // Prefer iOS window.orientation; fallback to Screen Orientation API
        let deg = (typeof window.orientation === "number")
            ? window.orientation
            : (screen.orientation && typeof screen.orientation.angle === "number" ? screen.orientation.angle : 0);

        // normalize to -180..180
        deg = ((deg % 360) + 360) % 360;
        if (deg > 180) deg -= 360;

        // if deg==0 but landscape, force 90
        const isLandscape =
            (window.matchMedia && window.matchMedia("(orientation: landscape)").matches) ||
            (window.innerWidth > window.innerHeight);

        if (deg === 0 && isLandscape) {
            const typ = (screen.orientation && screen.orientation.type) ? screen.orientation.type : "";
            deg = (typ.indexOf("secondary") !== -1) ? -90 : 90;
        }
        return deg;
    }

    const setupCameraHierarchy = () => {
        if (cameraParent) return;

        cameraParent = new BABYLON.TransformNode("cameraParent", scene);
        cameraParent.position.copyFrom(camera.position);

        // Use your current target if available; otherwise look slightly forward.
        let target = null;
        if (typeof camera.getTarget === "function") {
            try { target = camera.getTarget(); } catch(e) {}
        }
        if (!target) {
            // forward vector from current rotation
            const fwd = camera.getDirection(BABYLON.Axis.Z);
            target = camera.position.add(fwd);
        }

        camera.parent = cameraParent;
        cameraParent.lookAt(target);

        // Reset local rotation so gyro is purely relative to the parent (the claustro baseline)
        camera.rotation.set(0, 0, 0);
        if (!camera.rotationQuaternion) camera.rotationQuaternion = BABYLON.Quaternion.Identity();
        camera.rotationQuaternion.copyFrom(BABYLON.Quaternion.Identity());
    };

    const handleMotion = (event) => {
        if (!motionEnabled) return;

        const alpha = event.alpha ? BABYLON.Tools.ToRadians(event.alpha) : 0;
        const beta  = event.beta  ? BABYLON.Tools.ToRadians(event.beta)  : 0;
        const gamma = event.gamma ? BABYLON.Tools.ToRadians(event.gamma) : 0;

        // Device quaternion from sensor
        BABYLON.Quaternion.RotationYawPitchRollToRef(alpha, beta, -gamma, qTmp);

        // Screen compensation
        const screenDeg = getScreenAngleDeg();
        BABYLON.Quaternion.RotationAxisToRef(BABYLON.Axis.Z, BABYLON.Tools.ToRadians(-screenDeg), qScreen);
        qTmp.multiplyInPlace(qScreen);

        // Align device coords to Babylon world
        const finalQuat = qWorldAlign.multiply(qTmp);

        if (firstRead) {
            sensorZeroQuat.copyFrom(finalQuat);
            sensorZeroQuat.invertInPlace(); // store inverse(initial)
            firstRead = false;
            return;
        }

        if (!camera.rotationQuaternion) camera.rotationQuaternion = new BABYLON.Quaternion();
        // relative = current * inverse(initial)
        finalQuat.multiplyToRef(sensorZeroQuat, camera.rotationQuaternion);
        camera.rotation.set(0,0,0);
    };

    motionBtn.addEventListener("click", async () => {
        if (!motionEnabled) {
            const ok = await requestGyroPermission();
            if (!ok) return;

            setupCameraHierarchy();

            firstRead = true;
            motionEnabled = true;
            window.addEventListener("deviceorientation", handleMotion, true);

            motionBtn.classList.add("active");
            const lbl = motionBtn.querySelector(".vrLabel");
            if (lbl) lbl.textContent = "VR ON";
        } else {
            motionEnabled = false;
            window.removeEventListener("deviceorientation", handleMotion, true);

            motionBtn.classList.remove("active");
            const lbl = motionBtn.querySelector(".vrLabel");
            if (lbl) lbl.textContent = "VR OFF";

            // Keep current view when turning off: bake quaternion into parent, reset local
            if (camera.rotationQuaternion && cameraParent) {
                // parent = parent * local; local -> identity
                cameraParent.rotationQuaternion = (cameraParent.rotationQuaternion || BABYLON.Quaternion.Identity()).multiply(camera.rotationQuaternion);
                camera.rotationQuaternion.copyFrom(BABYLON.Quaternion.Identity());
            }
        }
    });
}

</script>

<script>
const PANEL_CONTENT = {
  title: "JOFRE OLIVERAS",
  submeta: [
    "ARTIST · EXPLORER · LANDSCAPER",
    "BASED BETWEEN DISCIPLINES",
    "EXPERIMENTAL ARCHIVE"
  ],
  tabs: [
    { key: "STUDIES", ctaHref: "https://inside.jofrearchive.com/studies/" },
    { key: "GENEALOGY", ctaHref: "https://inside.jofrearchive.com/genealogy/" },
    { key: "ARTIFACTS", ctaHref: "https://jofrearchive.com/artifacts" }
  ]
};

(function initPanel(){
  const panel = document.getElementById("panel");
  const titleEl = document.getElementById("title");
  const submetaEl = document.getElementById("submeta");
  const tabsEl = document.getElementById("tabs");

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  titleEl.textContent = PANEL_CONTENT.title;
  submetaEl.innerHTML = PANEL_CONTENT.submeta.map(escapeHtml).join("<br>");

  tabsEl.innerHTML = "";
  PANEL_CONTENT.tabs.forEach((t)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tabLink";
    b.textContent = t.key;
    b.addEventListener("click", ()=>{
      if (t.ctaHref) window.location.href = t.ctaHref;
    });
    tabsEl.appendChild(b);
  });

  const obs = new MutationObserver(() => {
    if (document.body.classList.contains("bab3d-on")) {
      panel.classList.add("show");
      obs.disconnect();
    }
  });
  obs.observe(document.body, { attributes:true, attributeFilter:["class"] });
})();
</script>

<script>
(function(){

async function requestGyroPermission(){
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) {
    console.log("DeviceOrientationEvent not supported");
    return false;
  }
  if (typeof DOE.requestPermission === "function") {
    try {
      const res = await DOE.requestPermission();
      console.log("iOS permission result:", res);
      return res === "granted";
    } catch (e) {
      console.error("iOS permission error:", e);
      return false;
    }
  }
  console.log("No permission needed (non-iOS or old iOS)");
  return true;
}

  function isMobile(){
    const ua = navigator.userAgent || "";
    const tp = navigator.maxTouchPoints || 0;
    return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/(Macintosh)/i.test(ua) && tp > 1);
  }

  const canvas = document.getElementById("renderCanvas");
  const engine = new BABYLON.Engine(canvas, true);
  let scene;

  const modelUrl = "https://inside.jofrearchive.com/assets/3D/c.glb";

  async function createScene(){
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.043, 0.043, 0.043, 1);

    const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.35;

    const keyLight = new BABYLON.DirectionalLight("key", new BABYLON.Vector3(-0.4, -1, -0.6), scene);
    keyLight.position = new BABYLON.Vector3(3, 6, 4);
    keyLight.intensity = 1.1;

    // CÁMARA: FreeCamera (exactamente como en el original)
    const camera = new BABYLON.FreeCamera("camera360", new BABYLON.Vector3(0, -6, -40), scene);
    camera.attachControl(canvas, true);
    camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
    camera.fov = 0.85;
    camera.setTarget(new BABYLON.Vector3(0, 15, 0));
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

    // --- BOTÓN VR CON GIROSCOPIO CORREGIDO ---
    const motionBtn = document.getElementById("motionBtn");
    if (isMobile() && motionBtn) {
        motionBtn.style.display = "flex";

        let isVREnabled = false;
        let deviceOrientationCamera = null;

        motionBtn.addEventListener("click", async () => {
            if (!isVREnabled) {
                // Verificar HTTPS
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                    alert("Se requiere HTTPS para usar el giroscopio");
                    return;
                }

                const ok = await requestGyroPermission();
                if (!ok) return;

                // Crear DeviceOrientationCamera en la misma posición
                deviceOrientationCamera = new BABYLON.DeviceOrientationCamera("VR_Camera", camera.position.clone(), scene);

                // Copiar configuración de la cámara original
                deviceOrientationCamera.fovMode = camera.fovMode;
                deviceOrientationCamera.fov = camera.fov;
                deviceOrientationCamera.minZ = camera.minZ;
                deviceOrientationCamera.maxZ = camera.maxZ;

                // Establecer el target manualmente (DeviceOrientationCamera lo ignora pero lo intentamos)
                deviceOrientationCamera.setTarget(new BABYLON.Vector3(0, 15, 0));

                // Desactivar el comportamiento automático de rotación para mantener control
                // y aplicar offset de 180 grados para corregir dirección
                setTimeout(() => {
                    if (deviceOrientationCamera) {
                        // Aplicar rotación de 180 grados para que mire en la dirección correcta
                        deviceOrientationCamera.rotation.y += Math.PI;
                    }
                }, 100);

                // Cambiar a la nueva cámara
                scene.activeCamera = deviceOrientationCamera;
                deviceOrientationCamera.attachControl(canvas, true);

                isVREnabled = true;
                motionBtn.classList.add("active");
                motionBtn.querySelector(".vrLabel").textContent = "VR ON";

                console.log("VR enabled - DeviceOrientationCamera active");
            } else {
                // Volver a FreeCamera
                if (deviceOrientationCamera) {
                    deviceOrientationCamera.detachControl(canvas);
                    deviceOrientationCamera.dispose();
                    deviceOrientationCamera = null;
                }

                scene.activeCamera = camera;
                camera.attachControl(canvas, true);

                isVREnabled = false;
                motionBtn.classList.remove("active");
                motionBtn.querySelector(".vrLabel").textContent = "VR OFF";

                console.log("VR disabled - FreeCamera restored");
            }
        });
    }

    const res = await BABYLON.SceneLoader.ImportMeshAsync("", "", modelUrl, scene);
    res.meshes.forEach(mesh => {
      if (mesh && mesh.getTotalVertices() > 0) {
        mesh.isVisible = true;
        const solidMat = new BABYLON.PBRMaterial("solidMat_"+mesh.name, scene);
        solidMat.albedoColor = new BABYLON.Color3(0.02, 0.02, 0.02);
        solidMat.metallic = 0.4;
        solidMat.roughness = 0.35;
        mesh.material = solidMat;
      }
    });

    const modelRoot = new BABYLON.TransformNode("modelRoot", scene);
    res.meshes.forEach(m => {
      if (m && m !== modelRoot && !m.parent) m.parent = modelRoot;
    });

    const ROT_SPEED = 0.06;
    let _lastT = performance.now();

    scene.onBeforeRenderObservable.add(() => {
      const now = performance.now();
      const dt = Math.min(0.05, (now - _lastT) / 1000);
      _lastT = now;
      modelRoot.rotation.y += ROT_SPEED * dt;
    });

    const FLOOR_BAND = 0.22;
    const MAX_SAMPLES = 9000;
    const GRID_N = 45;
    const CENTER_DX = 0.0;
    const CENTER_DZ = 0.0;
    const EYE_MIN = 1.6;

    try {
      let min = new BABYLON.Vector3(Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY, Number.POSITIVE_INFINITY);
      let max = new BABYLON.Vector3(Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY, Number.NEGATIVE_INFINITY);

      res.meshes.forEach(m => {
        if (!m || !m.getBoundingInfo) return;
        const bi = m.getBoundingInfo();
        if (!bi || !bi.boundingBox) return;
        const bmin = bi.boundingBox.minimumWorld;
        const bmax = bi.boundingBox.maximumWorld;

        min.x = Math.min(min.x, bmin.x); min.y = Math.min(min.y, bmin.y); min.z = Math.min(min.z, bmin.z);
        max.x = Math.max(max.x, bmax.x); max.y = Math.max(max.y, bmax.y); max.z = Math.max(max.z, bmax.z);
      });

      const size = max.subtract(min);
      const floorY = min.y;
      const bandY = floorY + size.y * FLOOR_BAND;

      const samples = [];
      let stride = 3;
      const pushSample = (x,z) => { samples.push(x, z); };

      const collect = () => {
        samples.length = 0;
        res.meshes.forEach(m => {
          if (!m || !m.isVerticesDataPresent || !m.isVerticesDataPresent(BABYLON.VertexBuffer.PositionKind)) return;
          const pos = m.getVerticesData(BABYLON.VertexBuffer.PositionKind);
          if (!pos || pos.length < 3) return;
          const wm = m.computeWorldMatrix(true);
          const tmp = new BABYLON.Vector3();
          for (let i = 0; i < pos.length; i += 3 * stride) {
            tmp.set(pos[i], pos[i+1], pos[i+2]);
            BABYLON.Vector3.TransformCoordinatesToRef(tmp, wm, tmp);
            if (tmp.y <= bandY) {
              pushSample(tmp.x, tmp.z);
              if (samples.length/2 >= MAX_SAMPLES) return;
            }
          }
        });
      };

      for (let attempts = 0; attempts < 4; attempts++) {
        collect();
        if ((samples.length/2) <= MAX_SAMPLES) break;
        stride = Math.min(24, stride * 2);
      }

      let bestX = (min.x + max.x) * 0.5;
      let bestZ = (min.z + max.z) * 0.5;

      if (samples.length >= 20) {
        const pad = 0.06;
        const x0 = min.x + size.x * pad, x1 = max.x - size.x * pad;
        const z0 = min.z + size.z * pad, z1 = max.z - size.z * pad;
        let bestD2 = -1;

        for (let ix = 0; ix < GRID_N; ix++) {
          const x = x0 + (x1 - x0) * (ix / (GRID_N - 1));
          for (let iz = 0; iz < GRID_N; iz++) {
            const z = z0 + (z1 - z0) * (iz / (GRID_N - 1));
            let d2min = Number.POSITIVE_INFINITY;
            for (let s = 0; s < samples.length; s += 2) {
              const dx = x - samples[s];
              const dz = z - samples[s+1];
              const d2 = dx*dx + dz*dz;
              if (d2 < d2min) d2min = d2;
              if (d2min <= bestD2) break;
            }
            if (d2min > bestD2) {
              bestD2 = d2min;
              bestX = x;
              bestZ = z;
            }
          }
        }
      }

      const eyeH = Math.max(size.y * 0.10, EYE_MIN);
      const camX = bestX + CENTER_DX;
      const camZ = bestZ + CENTER_DZ;
      const camY = floorY + eyeH;

      camera.position.set(camX, camY, camZ);
      const targetY = (min.y + max.y) * 0.5 + size.y * 0.42;
      camera.setTarget(new BABYLON.Vector3(camX, targetY, camZ));

      const voidAxis = new BABYLON.Vector3(camX, (min.y + max.y) * 0.5, camZ);
      if (typeof modelRoot !== 'undefined' && modelRoot && modelRoot.setPivotPoint) {
        modelRoot.setPivotPoint(voidAxis, BABYLON.Space.WORLD);
      }

      const radius = Math.max(size.x, size.z) * 0.5;
      camera.minZ = Math.max(0.01, radius / 1500);
      camera.maxZ = Math.max(1000, radius * 60);

    } catch (e) {
      console.warn("Void-center camera failed:", e);
    }

    return scene;
  }

  function startLoader(minMs=2600){
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const pct = document.getElementById("pct");
    const typeLine = document.getElementById("typeLine");
    const status = document.getElementById("status");

    loader.classList.remove("fadeOut");
    loader.setAttribute("aria-hidden","false");

    const steps = ["Allocating scene…","Preparing materials…","Building point cloud…","Finalizing render loop…"];
    let stepIdx = 0;
    const t0 = performance.now();
    let v = 0;
    let raf = 0;

    function tick(){
      v = Math.min(92, v + (92 - v)*0.035 + 0.25);
      if (bar) bar.style.width = v.toFixed(1) + "%";
      if (pct) pct.textContent = Math.floor(v) + "%";
      if (typeLine && (performance.now()-t0) > (stepIdx+1)*620){
        typeLine.textContent = steps[Math.min(stepIdx, steps.length-1)];
        stepIdx = Math.min(stepIdx+1, steps.length-1);
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    async function done(){
      const elapsed = performance.now() - t0;
      const wait = Math.max(0, minMs - elapsed);
      if(wait) await new Promise(r=>setTimeout(r, wait));
      cancelAnimationFrame(raf);
      if (bar) bar.style.width = "100%";
      if (pct) pct.textContent = "100%";
      if (status) status.textContent = "ready";
      loader.classList.add("fadeOut");
      setTimeout(()=>{
        loader.setAttribute("aria-hidden","true");
      }, 1100);
    }

    function fail(msg){
      cancelAnimationFrame(raf);
      if (status) status.textContent = "error";
    }

    return {done, fail};
  }

  let loopStarted = false;
  let initializedOnce = false;

  async function initSystem(opts){
    const { withLoader } = opts || {};
    const L = withLoader ? startLoader(2600) : null;

    document.body.classList.remove("bab3d-ready");
    document.body.classList.add("bab3d-on");

    try{
      if (!initializedOnce){
        initializedOnce = true;
        await createScene();
      }

      if (!loopStarted){
        loopStarted = true;
        engine.runRenderLoop(() => { if (scene) scene.render(); });
      }

      if (scene && scene.executeWhenReady){
        await new Promise(res => scene.executeWhenReady(res));
      }

      if (L) await L.done();
    }catch(err){
      console.error(err);
    }
  }

  document.getElementById("startVR").addEventListener("click", async () => {
    await initSystem({ withLoader: true });
  });

  if (localStorage.getItem("JA_INIT_DONE_v1") === "1") {
    requestAnimationFrame(() => { initSystem({ withLoader: false }); });
  }

  window.addEventListener("resize", () => engine.resize());
})();
</script>
