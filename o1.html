<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>BabylonJS – DeviceOrientation Offset Fix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b}
#renderCanvas{width:100%;height:100%;touch-action:none}
#btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
padding:12px 18px;background:#111;color:#e8e2d6;
border:1px solid rgba(255,255,255,.3);cursor:pointer}
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>
<button id="btn">VR OFF</button>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas,true);
const scene = new BABYLON.Scene(engine);

const camera = new BABYLON.FreeCamera(
  "cam",
  new BABYLON.Vector3(0,2,-6),
  scene
);
camera.setTarget(new BABYLON.Vector3(0,2,0));
camera.attachControl(canvas,true);
camera.inputs.removeByType("FreeCameraKeyboardMoveInput");

new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0,1,0), scene);

const box = BABYLON.MeshBuilder.CreateBox("b",{size:2},scene);

let orientationInput = null;
let vrOn = false;

async function requestGyro(){
  if (typeof DeviceOrientationEvent?.requestPermission === "function"){
    const r = await DeviceOrientationEvent.requestPermission();
    return r === "granted";
  }
  return true;
}

document.getElementById("btn").onclick = async ()=>{
  if (!vrOn){
    const ok = await requestGyro();
    if (!ok) return;

    if (!camera.rotationQuaternion){
      camera.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(
        camera.rotation.x,
        camera.rotation.y,
        camera.rotation.z
      );
      camera.rotation.set(0,0,0);
    }

    orientationInput = new BABYLON.FreeCameraDeviceOrientationInput();

    // 🔑 CORRECCIÓN MÍNIMA REAL
    orientationInput._initialQuaternion = camera.rotationQuaternion.clone();

    camera.inputs.add(orientationInput);

    vrOn = true;
    btn.textContent = "VR ON";
  } else {
    camera.inputs.remove(orientationInput);
    orientationInput = null;
    vrOn = false;
    btn.textContent = "VR OFF";
  }
};

engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>

</body>
</html>
